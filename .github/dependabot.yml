# Dependabot version updates — WARP-243.
#
# npm: the root lockfile covers all workspaces (apps/*, services/*,
# packages/*); tests/ has its own lockfile. pip: every requirements*.txt
# directory (13). github-actions keeps workflow pins fresh. The docker
# ecosystem is intentionally OMITTED: base-image CVEs are gated by the
# Trivy step in docker-build.yml, and 20 Dockerfile update PRs/week is
# noise without that signal.
#
# NOTE: Dependabot ALERTS + SECURITY updates are separate one-time repo
# settings — see docs/SECURITY.md#dependabot for the enable commands.
#
# TRIAGE RULES (2026-07-27). Two problems were costing a re-review every
# cycle; both are fixed declaratively here rather than by re-closing PRs.
#
#   1. `ignore` entries below suppress MAJOR bumps that were reviewed and
#      rejected (#1164 @prisma/client 5→7, #1165 express, #1167 zod 3→4,
#      #1171 huggingface-hub, #1172 transformers). None of these is a
#      dependency refresh — each is a migration that needs to be scheduled.
#      Suppressing only the major keeps minor/patch and, importantly, keeps
#      SECURITY updates flowing: `ignore` does not apply to Dependabot
#      security PRs. When a migration is scheduled, delete its entry and
#      Dependabot re-raises on the next run.
#
#   2. EVERY external 0.x dependency is excluded from the npm minor/patch
#      GROUP. Below 1.0, semver gives `minor` no compatibility promise, so
#      Dependabot's "minor" is routinely a breaking change — and because a
#      group PR is all-or-nothing, ONE of them takes the whole batch down.
#
#      This rule was learned twice. First #1261: `@matter/*` 0.16 → 0.17 broke
#      `build orchestrator`, `build matter-controller`, `build mcp-server` and
#      both node legs, holding seven innocent bumps hostage (including a
#      `sanitize-html` patch). The first version of this config excluded only
#      the matter family — treating it as one bad package rather than as an
#      instance of a class. The very next regenerated group PR, #1310, failed
#      the same way on `argon2` 0.41 → 0.45 (`Options` no longer exported;
#      `hash()` returns Buffer, not string), taking nine bumps down with it.
#
#      Hence the general rule. This is NOT an ignore: every one of these still
#      gets update PRs, just individually, where a break is attributable and
#      can be rejected or scheduled as the migration it is.
#
#      Keep the list in sync with the 0.x direct deps in the workspace
#      package.json files. As of 2026-07-29 that is: @matter/*,
#      @project-chip/matter.js, argon2, @zxing/*, @grpc/proto-loader.
#      (@droplet/* are workspace-internal and never bumped by Dependabot.)
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]
        # EVERY external 0.x dependency, not a hand-picked few. Below 1.0
        # semver gives minor no compatibility promise, so Dependabot's "minor"
        # is routinely a breaking change — and a group PR is all-or-nothing,
        # so one of them takes the whole batch down with it. Keep this list in
        # sync with the 0.x direct deps in the workspace package.json files.
        exclude-patterns:
          - "@matter/*"
          - "@project-chip/matter.js"   # 0.16 → 0.17 broke 5 checks in #1261
          - "argon2"                    # 0.41 → 0.45 broke 5 checks in #1310
          - "@zxing/*"                  # 0.1.x / 0.21.x
          - "@grpc/proto-loader"         # 0.8.x
    ignore:
      # Reviewed and rejected as migrations, not refreshes. Majors only —
      # minor/patch and security updates still flow.
      - dependency-name: "@prisma/client"          # #1164 (5.22 → 7.x)
        update-types: ["version-update:semver-major"]
      - dependency-name: "prisma"                  # keep the pair in lockstep
        update-types: ["version-update:semver-major"]
      - dependency-name: "express"                 # #1165
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/express"          # ships with express
        update-types: ["version-update:semver-major"]
      - dependency-name: "zod"                     # #1167 (3.25 → 4.x)
        update-types: ["version-update:semver-major"]
    labels: ["dependencies"]

  - package-ecosystem: npm
    directory: "/tests"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 2
    groups:
      npm-tests-minor-and-patch:
        update-types: ["minor", "patch"]
    labels: ["dependencies"]

  - package-ecosystem: pip
    directories:
      - "/services/ai-gateway"
      - "/services/camera-discovery"
      - "/services/device-identity-svc"
      - "/services/email-indexer"
      - "/services/file-indexer"
      - "/services/fleet-agent"
      - "/services/oled-display"
      - "/services/ops-console"
      - "/services/rag-eval"
      - "/services/routing"
      - "/services/switch"
      - "/services/voice-io"
      - "/tests/retrieval-eval/ragas"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 10
    groups:
      pip-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Reviewed and rejected as migrations, not refreshes (ai-gateway).
      # Majors only — minor/patch and security updates still flow.
      - dependency-name: "huggingface-hub"         # #1171 (<1.0 → >=1.24)
        update-types: ["version-update:semver-major"]
      - dependency-name: "transformers"            # #1172 (<5 → >=5.14)
        update-types: ["version-update:semver-major"]
    labels: ["dependencies"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 3
    labels: ["dependencies"]
