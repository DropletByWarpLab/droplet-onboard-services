name: ai-gateway-tests

# Pytest for services/ai-gateway. Path-filtered.

on:
  # Temporarily disabled: manual-only until GitHub Actions testing minutes
  # are restored. Restore the pull_request/push triggers from git history.
  workflow_dispatch:

concurrency:
  group: ai-gateway-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai-gateway
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/ai-gateway/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest -v
