name: ai-gateway-tests

# Pytest for services/ai-gateway. Path-filtered.

on:
  pull_request:
    paths:
      - "services/ai-gateway/**"
      - "proto/**"
      - ".github/workflows/ai-gateway-tests.yml"
  push:
    branches: [main]
    paths:
      - "services/ai-gateway/**"
      - "proto/**"
      - ".github/workflows/ai-gateway-tests.yml"

concurrency:
  group: ai-gateway-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai-gateway
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/ai-gateway/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # --ignore tests/test_grpc.py: quarantined until the async mock
      # fixtures there are rebuilt. All 6 failures are in the test harness
      # itself (MagicMock.await + servicer patching), not in production
      # code. Tracking: https://warp-lab.atlassian.net/browse/WARP-79
      - name: Run pytest
        run: pytest -v --ignore=tests/test_grpc.py
