name: ai-gateway-tests

# Pytest for services/ai-gateway. Path-filtered.

on:
  # PR-time coverage for this suite is owned by ci.yml's path-aware
  # `ai-gateway` leg (CI budget optimization, 2026-07): the pull_request
  # trigger here was retired as an exact duplicate of that leg.
  # Push-to-main stays as an independent post-merge canary and to
  # satisfy scripts/check-ci-coverage.sh.
  push:
    branches: [main]
    paths:
      - "services/ai-gateway/**"
      - "proto/**"
      - ".github/workflows/ai-gateway-tests.yml"
  workflow_dispatch:

concurrency:
  group: ai-gateway-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    # Safety net: a hung test (e.g. a cross-event-loop await that never resolves)
    # must fail the job fast, not burn a 6h default runner allocation.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/ai-gateway
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/ai-gateway/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest -v
