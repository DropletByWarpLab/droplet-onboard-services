name: ai-gateway-tests

# Pytest for services/ai-gateway. Path-filtered.

on:
  pull_request:
    paths:
      - "services/ai-gateway/**"
      - "proto/**"
      - ".github/workflows/ai-gateway-tests.yml"
  push:
    branches: [main]
    paths:
      - "services/ai-gateway/**"
      - "proto/**"
      - ".github/workflows/ai-gateway-tests.yml"
  workflow_dispatch:

concurrency:
  group: ai-gateway-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    # Safety net: a hung test (e.g. a cross-event-loop await that never resolves)
    # must fail the job fast, not burn a 6h default runner allocation.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/ai-gateway
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/ai-gateway/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest -v
