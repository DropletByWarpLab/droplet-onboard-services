name: branch-flow-guard

# WARP-1670 — enforce the two-branch release flow:
#
#   feature branch ──PR──▶ stage ──PR──▶ main
#
# `main` publishes the `stable` OTA channel, which every box eventually
# installs. A feature branch merged straight into `main` ships to the whole
# fleet without ever having run on a box on `stage` — so this refuses any
# pull request into `main` whose head is not `stage`.
#
# Documentation alone doesn't hold: CLAUDE.md and CONTRIBUTING.md both say
# to target `stage`, and the default base branch GitHub offers is `main`.
#
# Break-glass is the existing admin bypass on the branch ruleset — a
# deliberate human decision with an audit trail — not a label an agent can
# add to its own PR.
#
# Cost: one ~5-second ubuntu job per PR into main. It is `pull_request`-
# triggered on a `branches:` filter, so it never runs for the PRs into
# `stage` that make up the normal flow (CI cost budget, CLAUDE.md).

on:
  pull_request:
    # `edited` matters: it fires when a PR's BASE branch changes, so
    # retargeting a stale feature PR onto main re-runs this guard instead
    # of keeping the green result from when it pointed at stage.
    types: [opened, reopened, synchronize, edited]
    branches: [main]

permissions:
  contents: read

jobs:
  only-stage-into-main:
    name: only stage may merge into main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the head branch
        env:
          # Via env, never inline interpolation: a branch name is
          # attacker-controlled text on a fork PR.
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if [ "$HEAD_REF" = "stage" ]; then
            echo "head is stage — this is the promotion PR" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::error::PRs into main may only come from 'stage' (this one is from '${HEAD_REF}'). Retarget it at stage — see the 'Branching and releases' section of CLAUDE.md. Merging here would ship to every box on the stable channel without a stage soak."
          exit 1
