name: ci-coverage

# Enforces that every service and app has a matching CI test workflow and a
# test suite. Fires on every PR and main push — intentionally NOT path-filtered
# so nobody can add a new service without tests by dodging the filter.
#
# ENFORCED since 2026-07-11 (WARP-970). Baseline at enforcement time:
# `bash scripts/check-ci-coverage.sh` green over 14 services/* with a
# Dockerfile + 2 apps/* with a package.json, with exactly one exemption
# (services/oled-display — hardware-only, see .github/ci-coverage-exempt).
# The threshold is structural 100%: every audited directory needs a
# `<name>-tests.yml` workflow whose `paths:` filter covers it, a recognised
# test command, and a real test suite. The audit job below ("ci-coverage")
# is meant to be a required status check on main — if it is red, the PR
# does not merge.
#
# To add a new service:
#   1. Ship a `services/<name>/tests/` directory with at least one test.
#   2. Add `.github/workflows/<name>-tests.yml` that runs pytest (or vitest /
#      jest / npm test).
#   3. Point its `paths:` filter at `services/<name>/**`.
#
# Exemptions (rare): add the path one per line to `.github/ci-coverage-exempt`.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    # The job name is the status-check context branch protection matches on —
    # keep "ci-coverage" in sync with the ruleset's required checks if renamed.
    name: ci-coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Run CI coverage audit
        run: bash scripts/check-ci-coverage.sh
