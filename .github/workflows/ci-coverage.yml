name: ci-coverage

# Enforces that every service and app has a matching CI test workflow and a
# test suite. Fires on every PR and main push — intentionally NOT path-filtered
# so nobody can add a new service without tests by dodging the filter.
#
# To add a new service:
#   1. Ship a `services/<name>/tests/` directory with at least one test.
#   2. Add `.github/workflows/<name>-tests.yml` that runs pytest (or vitest /
#      jest / npm test).
#   3. Point its `paths:` filter at `services/<name>/**`.
#
# Exemptions (rare): add the path one per line to `.github/ci-coverage-exempt`.

on:
  # Still manual-only — but no longer for minutes (those are flowing again
  # as of 2026-06: docker-build's ~18-min job runs green on every PR).
  # Re-enabling this audit today would fail every PR because:
  #   1. The 12 test workflows still disabled by #220 lost their `paths:`
  #      filters along with their triggers — restore each `on:` block from
  #      110efe7c^ (the #220 parent).
  #   2. services/email-indexer, services/ops-console and services/pm have
  #      no test workflow at all — add one each, or exempt them in
  #      .github/ci-coverage-exempt with a reason.
  # Once `bash scripts/check-ci-coverage.sh` exits 0 on main, restore:
  #   pull_request:
  #   push:
  #     branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Every service and app has a test workflow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run CI coverage audit
        run: bash scripts/check-ci-coverage.sh
