name: ci

# WARP-1007 — consolidated push-to-main / PR check with a single
# always-reporting summary job.
#
# WHY: the ~15 path-filtered per-service workflows cannot be branch-protection
# required checks — on a PR that doesn't touch their paths they never report
# and the PR hangs on "Expected". The merge policy (WARP-968/969) needs ONE
# check that reports on EVERY PR and EVERY main push. That check is the
# `ci-summary` job below: it runs `if: always()`, needs every leg, and fails
# unless every leg succeeded.
#
# The legs mirror the must-pass surface that the per-service workflows and
# publish-release.yml's inline gate (gate-node + gate-python, WARP-536 / #786,
# now on main) actually run:
#   - node matrix: tools-core + mcp-server, orchestrator (incl. Prisma
#     db:generate + cosign for WARP-537's update-agent verify suite, #787,
#     now on main and in orchestrator-tests.yml), web-dashboard (incl. the
#     WARP-288 class lint + WARP-1296 tsc --noEmit / next build), matter-controller.
#   - python 3.12 matrix: the gate-python service list from #786
#     (ai-gateway, routing, switch, camera-discovery, file-indexer,
#     voice-io, device-identity-svc), sysdeps and all, plus the WARP-970
#     coverage-gate additions (email-indexer, ops-console, fleet-agent) —
#     their path-filtered workflows can't catch cross-cutting breakage, so
#     they must also be legs of the one always-reporting check, and
#     WARP-1106's erp-sql-bridge. Its leg runs the PURE half only
#     (connection-string assembly, redaction, route guards); the live-database
#     half needs Postgres + psqlODBC and lives in erp-sql-bridge-tests.yml,
#     the same "coverage no ci.yml leg has" split orchestrator-tests.yml uses.
#     Deliberately NOT a leg: services/rag-eval — eval tooling, not an
#     appliance service; its two lanes run from the repo root with an
#     ad-hoc dep set (see rag-eval-tests.yml) and stay path-filtered +
#     main-push gated there.
#   - storage: the WARP-1988 factory-reset bulk-storage wipe + the
#     storage-pool host script's shell unit suites — default-ON destructive
#     paths that previously had NO PR-time check (storage-pool-tests.yml is
#     manual-dispatch-only while Actions minutes are constrained).
#
# ── CI budget optimization (2026-07, $100/month Actions limit) ──
# Canonical rationale + rules for future CI changes: docs/ci-cost-budget.md
# (read it BEFORE adding triggers, legs, or paths — CI spend is capped).
# PR runs are PATH-AWARE: the `detect` job maps changed files to affected
# legs (same dorny/paths-filter + dynamic-matrix pattern as docker-build.yml)
# and only those legs run. ci-summary still reports on EVERY PR — a leg
# skipped because its paths didn't change counts as success; a leg skipped
# for any other reason fails the summary (fail-closed, see ci-summary).
# Main pushes are NOT filtered: every merge still gets the full-matrix
# canary, so the always-green-main record stays honest.
# The per-service workflows' PR triggers are retired (they were exact
# duplicates of these legs — the old "cost roughly doubles" follow-up);
# their push-to-main triggers remain as an independent post-merge canary
# and to satisfy scripts/check-ci-coverage.sh. orchestrator-tests.yml
# still runs on PRs for its pg-integration job only (no ci.yml leg runs
# against a real Postgres).
# Do not silently expand or shrink the leg list — the summary is only as
# honest as the surface it aggregates. A new leg needs BOTH a matrix entry
# in the plan step below AND a filter entry in detect.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# PR runs superseded by a new push are stale — cancel them. Main-push runs
# are never cancelled: every main sha must get an honest ci-summary verdict
# (same posture as publish-release.yml's gate).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Maps changed paths to affected legs on PRs. On push/dispatch it always
  # emits the full leg lists (post-merge full canary). Filters mirror the
  # per-service workflows' `paths:` lists plus the workspace glue each leg
  # actually consumes.
  detect:
    name: detect affected legs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # dorny/paths-filter lists PR files via the API
    outputs:
      node-suites: ${{ steps.plan.outputs.node-suites }}
      python-services: ${{ steps.plan.outputs.python-services }}
      python-matrix: ${{ steps.plan.outputs.python-matrix }}
      storage-suites: ${{ steps.plan.outputs.storage-suites }}
      fips-suites: ${{ steps.plan.outputs.fips-suites }}
      hadolint-suites: ${{ steps.plan.outputs.hadolint-suites }}
      ship-check-suites: ${{ steps.plan.outputs.ship-check-suites }}
      mcp-bridge-suites: ${{ steps.plan.outputs.mcp-bridge-suites }}
    steps:
      - uses: actions/checkout@v7

      # WARP-2351 — customer setup-guide drift gate. Deliberately a STEP of
      # this job rather than a leg of its own: `detect` is the only job that
      # runs on every PR and every main push, and ci-summary already requires
      # it to succeed, so this reports under the required check with no new
      # leg, no matrix entry, no `paths:` widening and no new `pull_request:`
      # trigger (docs/ci-cost-budget.md — CI spend is capped). It also has to
      # be here for correctness, not only for cost: a docs-only PR triggers NO
      # other leg at all, and a docs-only PR is exactly what this gate exists
      # to catch. It runs in ~1s of an already-running job.
      #
      # What it closes: a cloud provider shipping with no customer setup
      # guide, a guide losing one of its six required sections or a
      # commercially load-bearing fact (Shopify's Grow-plan price, Xero's
      # per-organisation charge and country list, Stripe's rk_ prefix
      # contract, HubSpot's super-admin requirement) to a well-meaning copy
      # pass, and a rotted intra-docs link. See the script's own header.
      - name: Customer setup guides — coverage, fact pins, link integrity
        run: bash scripts/check-setup-guides.sh

      - name: Map changed paths to affected legs
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            # ci.yml itself changed — re-prove every leg.
            workflow:
              - ".github/workflows/ci.yml"
            # Root npm workspace manifests feed every node leg's `npm ci`.
            node-global:
              - "package.json"
              - "package-lock.json"
            # Shared python code (services/_shared/** — serve.py, internal_tls,
            # healthcheck, fips_selftest) is imported by every python service,
            # so a change there re-proves ALL_PYTHON: the python-side analog of
            # node-global. Closes the #1204 gap where a services/_shared-only PR
            # ran no python leg at all.
            python-global:
              - "services/_shared/**"
            tools-core-mcp-server:
              - "packages/tools-core/**"
              - "packages/fips-selftest/**"
              - "services/mcp-server/**"
              - "apps/orchestrator/prisma/**"
            orchestrator:
              - "apps/orchestrator/**"
              - "packages/tools-core/**"
              - "packages/fips-selftest/**"
              # The orchestrator imports @droplet/shared-types and
              # @droplet/auth-policy from source (like the dashboard), so a
              # type/contract break in these packages surfaces in this leg's
              # tsc. Closes the #1204 gap where an auth-policy-only PR skipped
              # the orchestrator leg (auth-policy has no dedicated workflow).
              - "packages/shared-types/**"
              - "packages/auth-policy/**"
              - "services/mcp-server/**"
              - "services/erp-connector/**"
              # WARP-1984: the SSH toggle's privileged half. The orchestrator
              # writes the intent file these consume, so its leg is the right
              # owner — and the shell suite must run PRE-merge, not just as the
              # push-to-main canary, since it is the only thing that proves the
              # root script's parser refuses hostile input under real dash.
              - "scripts/host/usr-local-sbin/droplet-ssh-access"
              - "scripts/host/usr-local-sbin/droplet-ssh-access-boot-reset"
              - "scripts/host/etc-systemd-system/droplet-ssh-access.service"
              - "scripts/host/etc-systemd-system/droplet-ssh-access.path"
              - "scripts/host/etc-systemd-system/droplet-ssh-access-boot-reset.service"
              - "tests/droplet-ssh-access.test.sh"
              # WARP-2142: the install-mode SSH window is planted by the
              # autoinstall seed, and the vitest guard now reads user-data to
              # pin the marker-path agreement with the boot reset — so a
              # user-data edit must re-run this leg pre-merge, or a path typo
              # ships as a window that silently never opens.
              - "scripts/image/autoinstall/user-data"
              # The /downloads staging tools. The orchestrator re-hashes these
              # artifacts against catalog.json before serving a byte, so the
              # generator and the stager are part of this service's contract
              # even though they run on the host — a stager that picks the
              # wrong `primary` is served faithfully and is still wrong.
              - "scripts/app-downloads/**"
              - "tests/app-downloads-stage.test.sh"
              - "tests/app-downloads-audit.test.sh"
              # The declaration half. data/app-downloads/EXPECTED states what a
              # release must carry; without this line, a change to EXPECTED or
              # to the tracked contract files merges with ZERO test signal —
              # which is how the original gap survived.
              - "data/app-downloads/**"
            web-dashboard:
              - "apps/web-dashboard/**"
              # The dashboard's @droplet/* deps resolve from source (see the
              # typecheck step comment below), so type breaks in these
              # packages surface in this leg.
              - "packages/shared-types/**"
              - "packages/auth-policy/**"
              - "scripts/check-dashboard-classes.sh"
              - "scripts/dashboard-token-allowlist.txt"
            matter-controller:
              - "services/matter-controller/**"
              - "packages/fips-selftest/**"
            erp-connector:
              - "services/erp-connector/**"
            ai-gateway:
              - "services/ai-gateway/**"
              - "proto/**"
            # WARP-2131: the vendored model-catalog sidecar.
            inference-manager:
              - "services/inference-manager/**"
            routing:
              - "services/routing/**"
            switch:
              - "services/switch/**"
            camera-discovery:
              - "services/camera-discovery/**"
              # WARP-1918: this leg's pytest guards the baseline birdseye
              # section in docker/frigate/config.yml, so a config-only PR
              # must run it pre-merge (not just the push-to-main canary).
              - "docker/frigate/**"
            erp-sql-bridge:
              - "services/erp-sql-bridge/**"
            email-indexer:
              - "services/email-indexer/**"
            ops-console:
              - "services/ops-console/**"
            fleet-agent:
              - "services/fleet-agent/**"
              # WARP-1025: release_verify runs over the WARP-537 golden
              # fixtures shared with the orchestrator's update-agent.
              - "apps/orchestrator/src/services/update-agent/__fixtures__/**"
            file-indexer:
              - "services/file-indexer/**"
            voice-io:
              - "services/voice-io/**"
            device-identity-svc:
              - "services/device-identity-svc/**"
              - "proto/**"
            # WARP-2211: the document renderer. Its suite round-trips every
            # produced file through the reader a user's own application would
            # use, which is the only thing that distinguishes a valid OOXML
            # package from a broken one that still starts with "PK" — so it
            # has to be a leg, not just a local run.
            doc-render:
              - "services/doc-render/**"
            # WARP-1988: the factory-reset bulk-storage wipe and the
            # storage-pool host script are default-ON data-destroying paths;
            # their shell unit suites (<10s, no root/disks/Docker) must run at
            # PR time, not only via storage-pool-tests.yml's manual dispatch.
            storage:
              - "scripts/lib/storage-wipe.sh"
              - "scripts/factory-reset.sh"
              - "scripts/host/droplet-storage-pool.sh"
              - "tests/factory-reset-storage-wipe.test.sh"
              - "tests/storage-pool-destroy-superblock.test.sh"
              # WARP-2647: the other two factory-reset guards. Both are static
              # greps of scripts/factory-reset.sh — already in this filter — so
              # the only PRs these two lines newly catch are the rare ones that
              # touch a guard and nothing else. Listed so a guard edit fires
              # the leg that runs it; the leg itself is unchanged in cost.
              - "tests/factory-reset-volume-wipe.test.sh"
              - "tests/factory-reset-purge-scope.test.sh"
            # WARP-2481: the WARP-229 FIPS static source lint, moved here from
            # test-fips.yml so its result reaches branch protection through
            # ci-summary. This list is the EXACT `paths:` test-fips.yml used
            # for the fips-lint job, so the leg fires on precisely the PRs it
            # fired on before — no widening, no narrowing, delta ~0
            # (docs/ci-cost-budget.md).
            # `.github/workflows/test-fips.yml` stays in the list and is
            # load-bearing, not vestigial: two of this leg's own suites GREP
            # that file (fips-stack-logic.test.sh asserts the Docker-gated
            # fips-stack job still wires tests/integration/fips-stack.test.sh),
            # so gutting test-fips.yml has to turn this leg red.
            fips:
              - "apps/**"
              - "services/**"
              - "packages/**"
              - "scripts/**"
              - "docker/**"
              - "docs/security/fips-exceptions.md"
              - "docs/security/fips-allowed-algorithms.md"
              - "tests/fips-sabotage.test.sh"
              - "tests/fips-sabotage-logic.test.sh"
              # WARP-2480/WARP-2481: the ONE addition to the inherited list.
              # This leg's first step runs tests/test-fips-script/run.sh — the
              # harness that gates the lint itself — but test-fips.yml never
              # listed it, so a PR editing only that harness got no run at all.
              # A few commits a year, so the spend is ~0.
              - "tests/test-fips-script/**"
              - "tests/nginx-fips.test.sh"
              - "tests/fips-stack-logic.test.sh"
              - "tests/integration/fips-stack.test.sh"
              - ".github/workflows/test-fips.yml"
            # WARP-2493: hadolint, moved here from hadolint.yml so its result
            # reaches branch protection through ci-summary.
            # hadolint.yml had NO trigger path filter — it ran on every PR and
            # linted `git ls-files '*Dockerfile*'`. A `detect` filter is sound
            # here (and it is not one in name only): the job's verdict is a
            # pure function of the tracked Dockerfiles plus .hadolint.yaml, so
            # a PR touching neither cannot change the result — it can only
            # re-report the base branch's verdict. Scoping it is therefore a
            # cost saving with no loss of signal, unlike path-filtering a
            # diff-aware scanner. `Dockerfile*` is listed alongside
            # `**/Dockerfile*` because picomatch's `**/` does not match a
            # repo-root file (there is none today; this keeps a future one
            # gated).
            hadolint:
              - "**/Dockerfile*"
              - "Dockerfile*"
              - ".hadolint.yaml"
            # WARP-2455: the pre-PR gate's own sources. ship-check.sh is
            # mandated by the preflight skill but was executed by NO
            # workflow — all eight `ship-check` mentions under .github/ were
            # comments — so its bash-3.2 parse breakage reached stage with
            # nobody noticing. Scoped to the gate itself: deliberately NOT
            # widened to scripts/** or tests/**, which would put this leg on
            # a large share of PRs for no added signal
            # (docs/ci-cost-budget.md — widening a filter is a spend
            # decision, not a style decision).
            ship-check:
              - "scripts/test/**"
              - ".claude/skills/preflight/**"
            # WARP-2398 — the OUTBOUND MCP session component (ADR-043 §5),
            # the one workspace allowed to construct an MCP client transport.
            # Its own leg rather than a step on the node matrix because it is
            # the only node workspace with no Prisma, no dashboard and no
            # `@droplet/*` dependency: it needs a bare `npm ci` and nothing
            # else, so folding it into the node leg would make it wait on
            # build steps it does not use. Scoped to its own directory — a PR
            # that does not touch it runs no extra job, so this adds ~0 to PR
            # spend and one ~2-minute job per main push (docs/ci-cost-budget.md).
            mcp-bridge:
              - "services/mcp-bridge/**"

      - name: Decide which legs run
        id: plan
        env:
          CHANGED: ${{ steps.filter.outputs.changes || '[]' }}
          ALL_NODE: >-
            ["tools-core-mcp-server","orchestrator","web-dashboard",
            "matter-controller","erp-connector"]
          ALL_PYTHON: >-
            ["ai-gateway","routing","switch","camera-discovery",
            "email-indexer","ops-console","fleet-agent","file-indexer",
            "voice-io","device-identity-svc","erp-sql-bridge",
            "inference-manager","doc-render"]
          ALL_STORAGE: '["storage"]'
          ALL_FIPS: '["fips"]'
          ALL_HADOLINT: '["hadolint"]'
          ALL_SHIP_CHECK: '["ship-check"]'
          ALL_MCP_BRIDGE: '["mcp-bridge"]'
        run: |
          set -eu
          if [ "${{ github.event_name }}" != "pull_request" ] \
             || jq -e 'index("workflow")' <<<"$CHANGED" >/dev/null; then
            node=$(jq -c . <<<"$ALL_NODE")
            python=$(jq -c . <<<"$ALL_PYTHON")
            storage=$(jq -c . <<<"$ALL_STORAGE")
            fips=$(jq -c . <<<"$ALL_FIPS")
            hadolint=$(jq -c . <<<"$ALL_HADOLINT")
            ship_check=$(jq -c . <<<"$ALL_SHIP_CHECK")
            mcp_bridge=$(jq -c . <<<"$ALL_MCP_BRIDGE")
          else
            if jq -e 'index("node-global")' <<<"$CHANGED" >/dev/null; then
              node=$(jq -c . <<<"$ALL_NODE")
            else
              node=$(jq -c --argjson all "$ALL_NODE" \
                '[.[] | select(. as $s | $all | index($s))] | sort' <<<"$CHANGED")
            fi
            if jq -e 'index("python-global")' <<<"$CHANGED" >/dev/null; then
              python=$(jq -c . <<<"$ALL_PYTHON")
            else
              python=$(jq -c --argjson all "$ALL_PYTHON" \
                '[.[] | select(. as $s | $all | index($s))] | sort' <<<"$CHANGED")
            fi
            if jq -e 'index("storage")' <<<"$CHANGED" >/dev/null; then
              storage=$(jq -c . <<<"$ALL_STORAGE")
            else
              storage="[]"
            fi
            if jq -e 'index("fips")' <<<"$CHANGED" >/dev/null; then
              fips=$(jq -c . <<<"$ALL_FIPS")
            else
              fips="[]"
            fi
            if jq -e 'index("hadolint")' <<<"$CHANGED" >/dev/null; then
              hadolint=$(jq -c . <<<"$ALL_HADOLINT")
            else
              hadolint="[]"
            fi
            if jq -e 'index("ship-check")' <<<"$CHANGED" >/dev/null; then
              ship_check=$(jq -c . <<<"$ALL_SHIP_CHECK")
            else
              ship_check="[]"
            fi
            if jq -e 'index("mcp-bridge")' <<<"$CHANGED" >/dev/null; then
              mcp_bridge=$(jq -c . <<<"$ALL_MCP_BRIDGE")
            else
              mcp_bridge="[]"
            fi
          fi
          # Attach the per-service matrix extras (sysdeps / reqs / extra_pip /
          # needs_pythonpath) so the python job's include matrix keeps the
          # exact shape of publish-release.yml's gate-python (WARP-970 mirror).
          python_matrix=$(jq -c '[.[] | {service: .}
            + (if . == "file-indexer"
               then {sysdeps: "libpq-dev ffmpeg libmagic1"} else {} end)
            + (if . == "voice-io"
               then {sysdeps: "libportaudio2 alsa-utils"} else {} end)
            + (if . == "device-identity-svc"
               then {sysdeps: "libtss2-dev pkg-config", reqs: "requirements.txt",
                     extra_pip: "pytest", needs_pythonpath: "1"} else {} end)
            + (if . == "erp-sql-bridge"
               then {sysdeps: "unixodbc"} else {} end)
            + (if . == "inference-manager"
               then {reqs: "requirements-dev.lock"} else {} end)]' \
            <<<"$python")
          {
            echo "node-suites=$node"
            echo "python-services=$python"
            echo "python-matrix=$python_matrix"
            echo "storage-suites=$storage"
            echo "fips-suites=$fips"
            echo "hadolint-suites=$hadolint"
            echo "ship-check-suites=$ship_check"
            echo "mcp-bridge-suites=$mcp_bridge"
          } >> "$GITHUB_OUTPUT"
          echo "node legs: $node"
          echo "python legs: $python"
          echo "storage legs: $storage"
          echo "fips legs: $fips"
          echo "hadolint legs: $hadolint"
          echo "ship-check legs: $ship_check"
          echo "mcp-bridge legs: $mcp_bridge"

  node:
    name: node / ${{ matrix.suite }}
    needs: detect
    # An empty dynamic matrix is a workflow error, not a skip — guard here.
    # ci-summary treats this skip as success iff the suite list is empty.
    if: needs.detect.outputs.node-suites != '[]'
    runs-on: ubuntu-latest
    # Mirrors the per-suite workflows' hung-test ceiling (15 min there for a
    # warm-cache single suite); 20 gives cold-cache headroom per leg.
    timeout-minutes: 20
    strategy:
      # One red leg must not cancel the others — the summary (and a human
      # reading it) needs the full picture, not the first failure.
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.detect.outputs.node-suites) }}
    steps:
      - uses: actions/checkout@v7

      # Reused from docker-build.yml: strip preinstalled toolchains we don't
      # use so the ~14GB runner keeps headroom for npm ci + workspace builds.
      - name: Free disk space
        run: |
          set -eux
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/powershell \
            /usr/local/share/chromium \
            /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY/Ruby" \
            "$AGENT_TOOLSDIRECTORY/PyPy" \
            || true
          sudo apt-get clean
          df -h /

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies (npm workspaces, root install)
        run: npm ci

      # Vitest imports from @prisma/client; without `prisma generate` the
      # orchestrator suite crashes with "Cannot find module .prisma/client".
      # The same generated client is reused by services/mcp-server (shared
      # node_modules/.prisma/client) — mirrors orchestrator-tests.yml /
      # mcp-server-tests.yml.
      - name: Generate Prisma client
        if: matrix.suite == 'orchestrator' || matrix.suite == 'tools-core-mcp-server'
        run: npm run -w @droplet/orchestrator db:generate

      # Every suite except the dashboard imports @droplet/fips-selftest.
      - name: Build @droplet/fips-selftest
        if: matrix.suite != 'web-dashboard'
        run: npm run -w @droplet/fips-selftest build

      # WARP-1874: tools-core imports @droplet/shared-types (the meeting-link
      # parser). shared-types' package.json points `types` at ./src/index.ts,
      # so a typecheck resolves from source — but tools-core's EMITTED JS
      # resolves `exports["."].require` at ./dist/index.js, so the built
      # output needs shared-types' dist to exist. Same reason as the
      # erp-connector step below. Must run before the tools-core build.
      - name: Build @droplet/shared-types
        if: matrix.suite == 'orchestrator' || matrix.suite == 'tools-core-mcp-server'
        run: npm run -w @droplet/shared-types build

      # mcp-client / stdio-roundtrip tests spawn the built
      # services/mcp-server/dist/index.js as a child process.
      - name: Build @droplet/tools-core
        if: matrix.suite == 'orchestrator' || matrix.suite == 'tools-core-mcp-server'
        run: npm run -w @droplet/tools-core build

      - name: Build @droplet/mcp-server
        if: matrix.suite == 'orchestrator' || matrix.suite == 'tools-core-mcp-server'
        run: npm run -w @droplet/mcp-server build

      # WARP-1137: the orchestrator's erp.service imports @droplet/erp-connector,
      # whose types resolve from dist/ — build it before the orchestrator
      # typecheck or tsc fails with TS2307.
      - name: Build @droplet/erp-connector
        if: matrix.suite == 'orchestrator'
        run: npm run -w @droplet/erp-connector build

      # WARP-2606: ship-check's `tsc-full` phase 4 — the pass that type-checks
      # each workspace's `tsconfig.test.json` — has no CI runner (the
      # `shipcheck` job runs the script's parse + self-test only, never
      # `tsc-full`). `packages/tools-core` was the only workspace that shipped
      # one when this step was written, and `stage` carried 8 errors in it (a
      # TS1470 `import.meta` under CommonJS, plus 7 TS2339 reads of `.data`
      # through the unnarrowed `ToolResult` union) while every other check was
      # green: `vitest` strips types with esbuild and the package's own
      # `tsconfig.json` excludes `__tests__/`, so nothing in CI looked.
      #
      # WARP-2515 (#1943) then added a `tsconfig.test.json` + `typecheck:tests`
      # to four more workspaces and wired a runner for NONE of them, so phase 4
      # is no longer this one command. WARP-2644 gives each of them a runner on
      # a leg the `detect` filters ALREADY fire for when that workspace changes,
      # placed after that leg's existing leaf builds. The mapping, which is the
      # thing to keep true when a workspace joins or a filter moves:
      #
      #   workspace              | leg                   | detect filter that fires it
      #   -----------------------|-----------------------|----------------------------
      #   packages/tools-core    | tools-core-mcp-server | packages/tools-core/**
      #   packages/fips-selftest | tools-core-mcp-server | packages/fips-selftest/**
      #   services/mcp-server    | tools-core-mcp-server | services/mcp-server/**
      #   packages/shared-types  | orchestrator          | packages/shared-types/**
      #   services/erp-connector | erp-connector         | services/erp-connector/**
      #
      # No workspace ships a `tsconfig.test.json` that is absent from that
      # table; `apps/orchestrator` and `apps/web-dashboard` have none (their
      # tests are already inside the `tsc --noEmit` those legs run). The root
      # `tests/` and `schemas/__tests__/` trees have no tsconfig at all and are
      # therefore out of phase 4 entirely — that is WARP-2618, not this.
      #
      # Steps on EXISTING legs rather than a new `tsc-full` job or a new
      # `ci-summary` leg, deliberately, per docs/ci-cost-budget.md: each leg is
      # already gated on the right detect filter, already reported through
      # `check_leg node`, and has already installed, generated Prisma and built
      # the workspace dists these commands need. Marginal cost, measured
      # locally: tools-core 1.7 s, fips-selftest 0.6 s, mcp-server 1.4 s
      # (tools-core-mcp-server leg, +3.7 s); shared-types 0.7 s (orchestrator
      # leg); erp-connector 1.0 s (erp-connector leg). Budget ~2.5x on a runner.
      # Of the last 100 commits on `stage`, 25 touch a path in the
      # tools-core-mcp-server filter and 11 touch `services/erp-connector/**`;
      # at the current ~590 PRs/month that is ~148 + ~65 runs, so worst case
      # ~25 + ~6 runner-min/month — inside the docs/ci-cost-budget.md noise
      # floor (and in practice ~0 billed, since Actions rounds a JOB to the
      # minute and these seconds rarely cross a boundary). No callout threshold
      # is approached: the >2k min/mo callout is ~60x this.
      #
      # The alternative shapes, and why not: a `scripts/test/ship-check.sh
      # tsc-full` step would re-run phases 1-3 (prisma generate + four builds +
      # seven whole-workspace `tsc`) to reach phase 4, ~4 min/run — and the
      # script has no phase selector, so it would also need one. A separate
      # `tsc-full` job would repeat checkout + `npm ci` + `prisma generate` +
      # the workspace builds for the same seconds of signal (~4 min/run, ~120
      # min/month) AND would need a new required-check name added to branch
      # protection by hand. No new job names, no new `pull_request:` workflow.
      #
      # Runs BEFORE the vitest run: a type error should be reported as itself,
      # not as whatever the suite happens to do with it.
      - name: Typecheck @droplet/tools-core tests (tsconfig.test.json)
        if: matrix.suite == 'tools-core-mcp-server'
        run: npm run -w @droplet/tools-core typecheck:tests

      # WARP-2644: the other two workspaces the tools-core-mcp-server filter
      # already fires for. Same leg, same reason, same ordering rule (before
      # the vitest runs below). fips-selftest is built by the step above for
      # every suite but web-dashboard, and mcp-server by the tools-core /
      # mcp-server build steps, so both resolve their `@droplet/*` imports.
      - name: Typecheck @droplet/fips-selftest tests (tsconfig.test.json)
        if: matrix.suite == 'tools-core-mcp-server'
        run: npm run -w @droplet/fips-selftest typecheck:tests

      - name: Typecheck @droplet/mcp-server tests (tsconfig.test.json)
        if: matrix.suite == 'tools-core-mcp-server'
        run: npm run -w @droplet/mcp-server typecheck:tests

      # WARP-2644 / WARP-2639: shared-types is reached by the ORCHESTRATOR
      # filter, not the one above — `packages/shared-types/**` is listed under
      # `orchestrator:` and `web-dashboard:`, never under
      # `tools-core-mcp-server:` — so a shared-types-only PR runs this leg and
      # not that one. Its tests live INSIDE `src/` and its own `tsconfig.json`
      # excludes `src/**/*.test.ts`, so every type-level assertion in them
      # asserted nothing in a green suite.
      #
      # PR #1968 (WARP-2639) adds this identical step; whichever of the two
      # lands second should drop its copy rather than keep both.
      - name: Typecheck @droplet/shared-types tests (tsconfig.test.json)
        if: matrix.suite == 'orchestrator'
        run: npm run -w @droplet/shared-types typecheck:tests

      - name: Test @droplet/tools-core
        if: matrix.suite == 'tools-core-mcp-server'
        run: npm run -w @droplet/tools-core test

      - name: Test @droplet/mcp-server
        if: matrix.suite == 'tools-core-mcp-server'
        run: npm run -w @droplet/mcp-server test

      # WARP-537's update-agent verify suite (#787, on main) execs the real
      # cosign binary over golden fixtures — mirrors orchestrator-tests.yml /
      # #786's gate-node. Resolution is `cosign` on PATH (or DROPLET_COSIGN_BIN).
      - name: Install cosign (update-agent verify suite)
        if: matrix.suite == 'orchestrator'
        uses: sigstore/cosign-installer@v3

      # WARP-1011: vitest transforms via esbuild and never typechecks, so
      # compile-time contracts (e.g. the activity log's required
      # RecordParams.actor) were unenforced in CI. Runs after Prisma generate
      # + workspace builds so tsc resolves the generated client. Mirrors
      # orchestrator-tests.yml. (WARP-1296 later added the equivalent tsc
      # --noEmit + next build gate to the web-dashboard leg below, once
      # WARP-1005's pre-existing dashboard tsc error was fixed.)
      - name: Typecheck @droplet/orchestrator (tsc --noEmit)
        if: matrix.suite == 'orchestrator'
        run: npm run -w @droplet/orchestrator typecheck

      - name: Test @droplet/orchestrator
        if: matrix.suite == 'orchestrator'
        run: npm run -w @droplet/orchestrator test

      # WARP-2647: the guarded migration entrypoint's own suite (WARP-573) —
      # 33 assertions over apps/orchestrator/scripts/migrate-and-start.sh, and
      # it ran in NO workflow. vitest never sees it (it is bash, driven with
      # mock psql/pg_dump/pg_restore/npx on PATH), and neither does
      # orchestrator-tests.yml's pg-integration job, which runs the REAL
      # `prisma migrate deploy` rather than the entrypoint that wraps it — so
      # the backup-before-migrate and abort-on-failure branches this pins were
      # unguarded end to end. Pure bash, no Docker, no Postgres: ~5 s on a leg
      # that already paid for checkout + npm ci. Its trigger is
      # `apps/orchestrator/**`, already in this leg's detect filter.
      - name: Guarded migration entrypoint (migrate-and-start.sh)
        if: matrix.suite == 'orchestrator'
        run: bash apps/orchestrator/scripts/migrate-and-start.test.sh

      # The staging half of /downloads. The orchestrator's own suite covers the
      # serving half (parse, digest, refuse); this covers the script that puts
      # an installer there in the first place — including the silent failure
      # neither half would catch on its own, where a leftover installer from
      # last release stays `primary` and the download button keeps handing out
      # the older build with a catalog that parses and a digest that verifies.
      # Runs on the orchestrator leg because that service owns the surface.
      - name: App-download staging script
        if: matrix.suite == 'orchestrator'
        run: bash tests/app-downloads-stage.test.sh

      # WARP-2666: the declaration half. `/downloads` being empty answers
      # HTTP 200, so it is green to /api/health and to every other gate — the
      # page a customer opens to install the app has been blank on every box
      # that has ever shipped and nothing said so. This suite pins the
      # auditor's exit contract (notably that "could not look" never collapses
      # into "fine"), reconciles data/app-downloads/EXPECTED against the
      # generator's platform list in BOTH directions, and mutation-tests each
      # of those assertions. A platform added without an EXPECTED row fails
      # here rather than going silently unaudited.
      - name: App-download release declaration (EXPECTED + audit)
        if: matrix.suite == 'orchestrator'
        run: bash tests/app-downloads-audit.test.sh

      # WARP-1984: the SSH toggle's host half. The orchestrator's vitest guard
      # reads these artefacts as TEXT (it can prove `iptables` never appears);
      # this RUNS them, which is the only way to prove the parser actually
      # refuses `DROPLET_SSH_ACCESS=$(id)` rather than merely looking like it
      # would. Lives here rather than in a `pull_request:` trigger on
      # ssh-access-tests.yml, per the CI cost budget: PR-time coverage belongs
      # in a detect-filtered ci.yml leg, and the per-service workflow stays a
      # push-to-main canary. Seconds on an already-running leg.
      #
      # ubuntu-latest matters: /bin/sh is dash here, exactly as on the
      # appliance. A shell that provides bash-as-sh accepts constructs dash
      # rejects, so a script that only ever ran locally can still die on a box.
      - name: SSH-access host script — shellcheck, units, dash suite
        if: matrix.suite == 'orchestrator'
        run: |
          set -eu
          shellcheck --severity=warning \
            scripts/host/usr-local-sbin/droplet-ssh-access \
            scripts/host/usr-local-sbin/droplet-ssh-access-boot-reset
          # One invocation for all three units, so the boot-reset's
          # Wants=/After= reference to the path unit resolves against the
          # file under test rather than whatever the runner has installed.
          out="$(systemd-analyze verify \
            scripts/host/etc-systemd-system/droplet-ssh-access.service \
            scripts/host/etc-systemd-system/droplet-ssh-access.path \
            scripts/host/etc-systemd-system/droplet-ssh-access-boot-reset.service 2>&1 || true)"
          printf '%s\n' "$out"
          # Exactly two outputs are expected and only those two: ExecStart is
          # installed by setup.sh and never exists on a runner, and the
          # permission advisories fire on filesystems without POSIX modes. ANY
          # other line fails — a filter wide enough to hide a real error would
          # make this step decorative.
          unexpected="$(printf '%s\n' "$out" \
            | grep -v 'is not executable: No such file or directory' \
            | grep -v 'Proceeding anyway' \
            | grep -v '^$' || true)"
          if [ -n "$unexpected" ]; then
            echo "::error::systemd-analyze verify reported a unit-file problem:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
          target="$(readlink -f /bin/sh)"
          echo "/bin/sh -> $target"
          case "$target" in
            *dash) ;;
            *) echo "::error::/bin/sh is $target, not dash — this step no longer reproduces the appliance" >&2; exit 1 ;;
          esac
          bash tests/droplet-ssh-access.test.sh

      # build IS the type-check for the matter sidecar — mirrors
      # matter-controller-tests.yml.
      - name: Type-check @droplet/matter-controller
        if: matrix.suite == 'matter-controller'
        run: npm run -w @droplet/matter-controller build

      - name: Test @droplet/matter-controller
        if: matrix.suite == 'matter-controller'
        run: npm run -w @droplet/matter-controller test

      # WARP-288: catch silently-dropped Tailwind utility classes before
      # they reach the unit suite — mirrors web-dashboard-tests.yml.
      - name: Lint dashboard class names
        if: matrix.suite == 'web-dashboard'
        run: bash scripts/check-dashboard-classes.sh

      # WARP-1296: same esbuild-strips-types gap WARP-1011 closed for the
      # orchestrator — vitest never typechecks, so dashboard type regressions
      # shipped green (WARP-1261/#1007 dropped `available` from FileSpace and
      # broke SpaceSwitcher.tsx). tsc --noEmit enforces the compile-time
      # contract. No Prisma/workspace pre-build needed: the dashboard's
      # @droplet/* deps resolve from source. Mirrors web-dashboard-tests.yml.
      - name: Typecheck @droplet/web-dashboard (tsc --noEmit)
        if: matrix.suite == 'web-dashboard'
        working-directory: apps/web-dashboard
        run: npx tsc --noEmit

      - name: Test @droplet/web-dashboard
        if: matrix.suite == 'web-dashboard'
        run: npm run -w @droplet/web-dashboard test

      # WARP-1296: `next build` catches breakage tsc/vitest alone miss — Next
      # route/page contract violations and production bundling / module
      # resolution (e.g. the auth-policy .js->.ts webpack alias in
      # next.config.js). Heaviest dashboard step, runs last. Mirrors
      # web-dashboard-tests.yml.
      - name: Build @droplet/web-dashboard (next build)
        if: matrix.suite == 'web-dashboard'
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run -w @droplet/web-dashboard build

      # WARP-1294: the erp-connector package's own vitest suite (schema-map,
      # read/write registries, and the dual-track EaglesoftApiConnector) ran in
      # NO workflow before this — every prior job built it (tsc) but never ran
      # `test`, so its unit coverage was invisible to CI. Give it a real leg.
      - name: Build @droplet/erp-connector
        if: matrix.suite == 'erp-connector'
        run: npm run -w @droplet/erp-connector build

      # WARP-2644: this leg is the one the `services/erp-connector/**` detect
      # filter fires, and the build above is what its 23 test files need — they
      # import the package by its own name (`@droplet/erp-connector`), which
      # resolves through `types: dist/index.d.ts`. Verified standalone: with
      # every OTHER workspace's dist removed, this command still passes here,
      # so the step does not smuggle in a dependency the leg does not build.
      # See the mapping table on the tools-core typecheck step above.
      - name: Typecheck @droplet/erp-connector tests (tsconfig.test.json)
        if: matrix.suite == 'erp-connector'
        run: npm run -w @droplet/erp-connector typecheck:tests

      - name: Test @droplet/erp-connector
        if: matrix.suite == 'erp-connector'
        run: npm run -w @droplet/erp-connector test

  python:
    name: python / ${{ matrix.service }} pytest
    needs: detect
    # Same empty-matrix guard as the node job above.
    if: needs.detect.outputs.python-services != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # The full list (emitted by detect on push/dispatch) is the exact
      # mirror of gate-python in publish-release.yml (#786; both lists
      # expanded together by WARP-970) — the python services with
      # per-service test workflows. The include objects (incl. sysdeps /
      # reqs / extra_pip / needs_pythonpath for file-indexer, voice-io and
      # device-identity-svc) are built in detect's plan step.
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.python-matrix) }}
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7

      - name: Install system deps
        if: matrix.sysdeps != ''
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ matrix.sysdeps }}

      # WARP-1025: fleet-agent's release_verify/update_poll suites exec the
      # REAL cosign binary over the WARP-537 golden fixtures (mirrors the
      # orchestrator leg above and fleet-agent-tests.yml).
      - name: Install cosign (fleet-agent release_verify suite)
        if: matrix.service == 'fleet-agent'
        uses: sigstore/cosign-installer@v3

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ${{ matrix.reqs || 'requirements-dev.txt' }}
          if [ -n "${{ matrix.extra_pip }}" ]; then pip install ${{ matrix.extra_pip }}; fi

      - name: Run pytest
        env:
          PYTHONPATH: ${{ matrix.needs_pythonpath == '1' && format('{0}/services/{1}', github.workspace, matrix.service) || '' }}
        run: pytest -v

  # WARP-1988: the storage shell suites — the factory-reset bulk-storage wipe
  # (default-ON, data-destroying) and the storage-pool host script's
  # pool_destroy invariants. Same suites storage-pool-tests.yml runs on
  # manual dispatch; this leg makes them PR-blocking through ci-summary.
  # Stub-based bash unit tests: <10s total, no root, no disks, no Docker —
  # ~1 billable min/run, and it triggers only on the five storage paths.
  storage:
    name: storage / shell unit tests
    needs: detect
    # Same empty-list guard as the node/python jobs above.
    if: needs.detect.outputs.storage-suites != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Run storage-pool unit tests
        run: bash tests/storage-pool-destroy-superblock.test.sh

      - name: Run factory-reset storage-wipe unit tests
        run: bash tests/factory-reset-storage-wipe.test.sh

      # WARP-2647: the two factory-reset guards that ran in NO workflow at all.
      # Both were written after a real incident — the WARP-605 project-name bug
      # that left droplet_pgdata alive behind a "successful" reset, and the
      # `docker system prune -af` that would have deleted the sibling
      # droplet-local-LLM images — and both then sat green on developers'
      # machines for months without ever running at PR time. They are static
      # greps of scripts/factory-reset.sh, which is already this leg's trigger:
      # no Docker, no root, <0.1 s each.
      #
      # KEEP IN LOCKSTEP with storage-pool-tests.yml's storage-pool-unit job —
      # scripts/check-test-wiring.sh fails if the two lists diverge.
      - name: Run factory-reset volume-wipe unit tests
        run: bash tests/factory-reset-volume-wipe.test.sh

      - name: Run factory-reset purge-scope unit tests
        run: bash tests/factory-reset-purge-scope.test.sh

  # WARP-2398 / ADR-043 §5 — the OUTBOUND MCP session component.
  #
  # `services/mcp-bridge` is the ONLY workspace permitted to construct an MCP
  # client transport: ADR-043 §5 states that seeing `StreamableHTTPClientTransport`
  # or `SSEClientTransport` in orchestrator product code is a breach. Its own
  # leg rather than a step on the node matrix because it is the only node
  # workspace needing neither Prisma nor any `@droplet/*` dist — a bare
  # `npm ci` is the whole setup, so folding it in would make it wait on build
  # steps it does not use.
  #
  # `build` runs alongside `test` deliberately: vitest transforms via esbuild
  # and never typechecks, so a signature break against the pinned SDK
  # (`^1.30.0`, docs/mcp-client-sdk-version.md) would otherwise reach `stage`
  # under a green suite. That is the WARP-1011 class, in the one workspace
  # where the counterparty is a vendor's server rather than our own code.
  #
  # COST (docs/ci-cost-budget.md): scoped to `services/mcp-bridge/**`, a path
  # that did not exist before this PR, so no PR that previously ran zero legs
  # now runs one — PR-side delta is 0. Main pushes run the full leg list, so
  # this adds ONE ~2-minute ubuntu job per merge: at ~60 merges/month that is
  # ~120 minutes/month, well under the 2,000-minute callout threshold. It runs
  # no Docker build and no matrix.
  mcp-bridge:
    name: mcp-bridge / outbound MCP session
    needs: detect
    # Same empty-list guard as the node/python/storage jobs above.
    if: needs.detect.outputs.mcp-bridge-suites != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies (npm workspaces, root install)
        run: npm ci

      # Typecheck (vitest does not) — see the leg comment above.
      - name: Build @droplet/mcp-bridge
        run: npm run -w @droplet/mcp-bridge build

      - name: Test @droplet/mcp-bridge
        run: npm run -w @droplet/mcp-bridge test

  # WARP-229 FIPS 140-3 static SOURCE lint (scripts/test-fips.sh), moved here
  # from test-fips.yml under WARP-2481. It lived in its own path-filtered
  # workflow, which meant the job went red and the merge went through anyway:
  # `fips-lint` was never a required context, and a path-filtered workflow
  # cannot become one (docs/ci-required-checks.md — the WARP-2172 "Expected"
  # trap). As a leg of ci.yml its verdict lands in `ci-summary`, which IS
  # required on both rulesets. That is what makes the PR-BLOCKING claim in
  # scripts/test-fips.sh true rather than aspirational.
  #
  # Distinct from the BUILD-TIME provider gate in docker-build.yml
  # (install-fips-provider.sh KATs + positive/negative probes, fanned in via
  # `docker-build ok`). This greps source for non-FIPS algorithms; it does NOT
  # build images or check runtime enforcement. See scripts/test-fips.sh's
  # header for the lint-vs-gate split.
  #
  # To register a new exception: add an entry under `exceptions:` in
  # docs/security/fips-exceptions.md and reference it from source with a
  # `fips:allowed: <id>` comment within +/-2 lines. Code review is the
  # enforcement gate for new entries; the rationale and annual-review owner
  # must be documented.
  fips:
    name: fips / static lint
    needs: detect
    # Same empty-list guard as the node/python/storage jobs above.
    if: needs.detect.outputs.fips-suites != '[]'
    runs-on: ubuntu-latest
    # A hung test must fail the job fast, not burn the 6h default runner
    # allocation. Pure static lint (no Docker, no pip/apt builds) — 15 min is
    # a wide ceiling for a ~2 min suite.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Run lint script's own unit tests
        run: ./tests/test-fips-script/run.sh

      - name: Run FIPS static lint (PR-blocking via ci-summary)
        run: ./scripts/test-fips.sh

      - name: Validate the FIPS-capable nginx gateway artifacts (WARP-1021)
        # Docker-free: cipher-profile posture, entrypoint profile selection,
        # compose + CI wiring. The image's own build-time self-test (provider
        # KATs + nginx -t on both profiles) runs in docker-build.yml's
        # gateway matrix leg.
        run: bash tests/nginx-fips.test.sh

      - name: Validate the sabotage-proof harness (Docker-free logic checks)
        # WARP-316: asserts tests/fips-sabotage.test.sh encodes a real sabotage
        # (build -> install -> rm fips.so -> assert provider gone) and skips
        # cleanly without Docker. The Docker build itself runs in the
        # fips-sabotage job, still in test-fips.yml.
        run: bash tests/fips-sabotage-logic.test.sh

      - name: Validate the FIPS stack harness (Docker-free logic checks)
        # WARP-317: asserts tests/integration/fips-stack.test.sh encodes the
        # real activation flow + assertions, that the compose file pins the
        # FIPS boot gate OFF for non-provider images, and that the operator
        # docs exist. The stack boot itself runs in the fips-stack job, still
        # in test-fips.yml.
        run: bash tests/fips-stack-logic.test.sh

  # WARP-243 diff-aware SAST, moved here from semgrep.yml under WARP-2481 for
  # the same reason as the fips leg: semgrep.yml's own header said it "runs
  # unfiltered on every PR so it can be a required check", but it never became
  # one — on PR #1815 semgrep was red, ci-summary was green, and the PR was
  # mergeable. Folding it in is what closes that gap.
  #
  # DELIBERATELY NOT `detect`-GATED. Its value is scanning everything, and it
  # was unfiltered before; a path filter here would be a coverage cut dressed
  # up as a cost saving. `ci-summary` is passed a hard-coded non-empty suite
  # list for this leg, so a skip can never be read as "nothing to do" —
  # fail-closed, same contract as the filtered legs.
  #
  # BASELINE STRATEGY: diff-aware. `--baseline-commit <merge-base>` means only
  # findings introduced by the PR block it; the 40 audited pre-existing
  # findings on main (2026-07-04, 25 in prod code — burn-down tracked
  # separately, see docs/SECURITY.md#semgrep) never fail anyone's PR.
  # On main pushes the baseline is the parent sha (github.event.before) so a
  # regression that somehow lands still turns main red without the whole
  # backlog doing so.
  semgrep:
    name: semgrep / diff-aware SAST
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # merge-base for --baseline-commit

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install semgrep 1.136.0 (pinned)
        # semgrep 1.136.0 pulls a transitive opentelemetry-instrumentation
        # that imports pkg_resources at load time. Python 3.12.13 runners no
        # longer ship setuptools by default, and setuptools >= 81 removed
        # pkg_resources entirely — so we pin setuptools < 81, which still
        # bundles it (otherwise: ModuleNotFoundError: No module named
        # 'pkg_resources' before semgrep scans anything).
        run: pip install "setuptools<81" semgrep==1.136.0

      - name: Resolve baseline commit
        id: base
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "sha=$(git merge-base origin/${{ github.base_ref }} HEAD)" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "sha=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=" >> "$GITHUB_OUTPUT"
          fi

      - name: Semgrep scan (blocks findings introduced by this change)
        run: |
          set -eu
          BASELINE="${{ steps.base.outputs.sha }}"
          ARGS=(--config p/owasp-top-ten --config .semgrep/ --metrics=off --error)
          if [ -n "$BASELINE" ] && git cat-file -e "$BASELINE" 2>/dev/null; then
            ARGS+=(--baseline-commit "$BASELINE")
          fi
          semgrep scan "${ARGS[@]}"

  # WARP-243 secret scan, moved here from gitleaks.yml under WARP-2493 for the
  # same reason as the fips/semgrep legs (WARP-2481): gitleaks.yml's header
  # said it ran "unfiltered on every PR so it can be a required check", but it
  # never became one. docs/SECURITY.md listed it as "Blocks PRs? yes"; it did
  # not. Only ci-summary, egress-gate and the title lint are required.
  #
  # DELIBERATELY NOT `detect`-GATED: a secret can be added in any file, so
  # there is no honest path filter. ci-summary is passed a hard-coded
  # non-empty suite list for this leg, so a skip is never read as "nothing to
  # do" — fail-closed, same contract as the filtered legs.
  #
  # Two passes:
  #   1. Working-tree scan: any secret present in the files as they would
  #      merge (config-allowlisted test fixtures excluded — .gitleaks.toml).
  #   2. PR-commit-range scan: catches a secret committed then "removed" in
  #      a later commit of the same PR (it would still live in history).
  # Full-history scans are deliberately NOT run here: main's history has 112
  # known fixture findings (audited 2026-07-04) and rewriting history is not
  # on the table. History is gated from this point forward by pass 2.
  #
  # Uses the pinned gitleaks binary, NOT gitleaks/gitleaks-action: the action
  # requires a paid GITLEAKS_LICENSE for organization repos; the MIT binary
  # does not.
  #
  # NOTE: this is the SECOND of two independent secret gates. GitHub's push
  # protection rejects known vendor token shapes at `git push`, before CI runs
  # at all, and no .gitleaks.toml entry affects it. A fixture shaped like a
  # real vendor key must be composed from parts at runtime (WARP-2379).
  gitleaks:
    name: gitleaks / secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # pass 2 scans the full PR commit range

      - name: Install gitleaks v8.30.1 (pinned, checksummed)
        run: |
          set -eu
          curl -fsSL -o /tmp/gitleaks.tgz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks

      - name: Scan working tree
        run: /tmp/gitleaks dir . --config .gitleaks.toml --no-banner --redact --exit-code 1

      - name: Scan PR commit range (added-then-removed secrets)
        if: github.event_name == 'pull_request'
        run: |
          set -eu
          /tmp/gitleaks git . --config .gitleaks.toml --no-banner --redact --exit-code 1 \
            --log-opts "origin/${{ github.base_ref }}..HEAD"

  # WARP-243 Dockerfile lint over every tracked Dockerfile (27 at time of
  # writing — the git ls-files glob keeps the list live, so a new service's
  # Dockerfile is gated automatically). Moved here from hadolint.yml under
  # WARP-2493; docs/SECURITY.md claimed it blocked PRs and it did not.
  # Baseline rationale lives in .hadolint.yaml.
  #
  # Unlike gitleaks this leg IS `detect`-gated — see the filter comment above
  # for why that is sound rather than a coverage cut.
  hadolint:
    name: hadolint / Dockerfile lint
    needs: detect
    # Same empty-list guard as the node/python/storage/fips jobs above.
    if: needs.detect.outputs.hadolint-suites != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install hadolint v2.14.0 (pinned, checksummed)
        run: |
          set -eu
          curl -fsSL -o /tmp/hadolint \
            https://github.com/hadolint/hadolint/releases/download/v2.14.0/hadolint-linux-x86_64
          echo "6bf226944684f56c84dd014e8b979d27425c0148f61b3bd99bcc6f39e9dc5a47  /tmp/hadolint" | sha256sum -c -
          chmod +x /tmp/hadolint

      - name: Lint all tracked Dockerfiles
        run: |
          set -eu
          mapfile -t files < <(git ls-files '*Dockerfile*')
          echo "Linting ${#files[@]} Dockerfiles"
          /tmp/hadolint --config .hadolint.yaml --failure-threshold warning "${files[@]}"
  # WARP-2455: the pre-PR gate's own gate. scripts/test/ship-check.sh is
  # mandated by the preflight skill, but until this leg NO workflow executed
  # it — all eight `ship-check` mentions under .github/ were comments of the
  # form "warning severity to match ship-check's bar". That is how three
  # bash-3.2 parse blockers (`declare -A`, an apostrophe in a `#` comment
  # inside `$( )`, a `case` inside `$( )`) reached stage: every reviewer
  # assumed the gate had run, and no machine ever ran it. `lifecycle-naming`
  # in particular still has no other runner.
  # This is the parse + self-test half ONLY. Running the full ship-check
  # (tsc-full etc.) here would duplicate the node/python legs and cost real
  # minutes — see docs/ci-cost-budget.md and WARP-2455's out-of-scope list.
  shipcheck:
    name: ship-check / parse + self-test
    needs: detect
    # Same empty-list guard as the node/python/storage jobs above.
    if: needs.detect.outputs.ship-check-suites != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # The runner's own bash (5.x) — the floor ship-check is written for.
      - name: Parse under the runner's bash 5
        run: |
          set -eu
          bash --version | head -1
          bash -n scripts/test/ship-check.sh
          bash -n scripts/test/ship-check.test.sh

      # The dev-Mac floor: macOS ships bash 3.2.57 and Homebrew bash is NOT
      # assumed (WARP-2449). A construct that parses under 5.x but not 3.2 is
      # invisible to every other check in this repo, and the parse check is
      # what would have caught all three WARP-2449 blockers. The official
      # `bash:3.2` image is ~15 MB, so this costs seconds, not minutes.
      # A Docker Hub pull failure is infrastructure, not a code defect — it
      # warns and skips; a real parse failure below is fatal.
      - name: Parse under bash 3.2 (the dev-Mac floor)
        run: |
          set -eu
          if ! docker pull bash:3.2 >/dev/null 2>&1; then
            echo "::warning::could not pull bash:3.2 (Docker Hub rate limit?) - 3.2 parse check skipped"
            exit 0
          fi
          docker run --rm -v "$PWD/scripts/test:/w:ro" bash:3.2 bash -c '
            set -eu
            bash --version | head -1
            bash -n /w/ship-check.sh
            bash -n /w/ship-check.test.sh
          '

      # --help must work on a machine that has run no setup — it is the first
      # thing an operator (or an agent) types.
      - name: ship-check --help
        run: bash scripts/test/ship-check.sh --help

      # The self-test's compose-config case shells out to `docker compose
      # config`, which resolves the merged tree's `env_file: ../.env`
      # directives and fails if that file is absent. .env is .gitignored, so
      # a fresh checkout never has one. Seed it from the tracked example, or
      # the self-test goes red on the runner for a reason that has nothing to
      # do with the change under test. (compose-config itself still reads
      # .env.example for values — see run_check_compose_config.)
      - name: Seed .env for the compose-config case
        run: cp .env.example .env

      # WARP-2637 — a SKIP is no longer folded into the pass count, and the
      # suite refuses to exit 0 on a skip the caller has not named.
      #
      # This job deliberately does NOT `npm ci`. Installing the monorepo plus
      # `npm run bootstrap` plus the FOUR `tsc-full` sweeps the two
      # node_modules-gated cases perform (each runs the check twice: clean
      # baseline, then mutated) is minutes of metered time per run, on a job
      # whose remit is parse + self-test — see docs/ci-cost-budget.md and
      # WARP-2455's out-of-scope list. So those two cases cannot run here, and
      # they are named explicitly rather than blanket-allowed: any OTHER case
      # that starts skipping on the runner now fails this job instead of
      # quietly inflating "N/N passed", which is exactly how the WARP-329
      # fixture guard stayed vacuous. The names are also written to the job
      # summary by the script, so the hole is visible without reading the log.
      #
      # The trade this leaves standing: the WARP-329 and WARP-492 cases are
      # developer-machine gates only. Running them in CI is a spend decision,
      # not an oversight.
      #
      # WARP-2620 — the bar for adding an id here is "this job structurally
      # cannot run that case", not "that case sometimes flakes". Both ids below
      # clear it: no `npm ci`, so no node_modules, so neither tsc-full case can
      # execute, ever, on this job. `docker-build-smoke-shim-allowlist` does NOT
      # clear it and is deliberately absent — it runs fine here, and its SKIP
      # (the smoke container died before reaching the planted `docker buildx`) is
      # news worth a red and a re-run, not a standing exemption. Allow-listing
      # it would leave a guard that can no longer fail.
      #
      # WARP-2645 — the value is a list of SKIP IDS, not display names. The
      # ids are declared beside each `_run_test` registration in
      # scripts/test/ship-check.test.sh. Keying this on the display name made
      # it a prose-shaped wire contract: rewording a case's name — which
      # happens whenever its rationale sharpens — silently stopped allowing
      # that case's skip and reddened this job for a case nobody had touched.
      # Changing an id now takes a deliberate edit in both files.
      - name: Run the ship-check self-test
        env:
          SHIPCHECK_ALLOW_SKIP: "tsc-full-warp329-fixture,tsc-full-prisma-pin"
        run: bash scripts/test/ship-check.test.sh


  # THE required check (WARP-968/969 merge policy). Runs even when legs fail
  # (`if: always()`) so it ALWAYS reports — no more PRs hung on "Expected".
  # Fails closed: a leg job may be skipped ONLY because detect proved its
  # suite list empty (path-aware PR runs); any failure, cancellation, or
  # skip with a non-empty suite list fails the summary. detect itself must
  # have succeeded — otherwise the "nothing affected" claim is untrusted.
  ci-summary:
    name: ci-summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [detect, node, python, storage, fips, semgrep, gitleaks, hadolint, shipcheck, mcp-bridge]
    if: always()
    steps:
      - name: Report leg results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: echo "${NEEDS_JSON}"

      - name: Verdict
        env:
          DETECT_RESULT: ${{ needs.detect.result }}
          NODE_RESULT: ${{ needs.node.result }}
          PYTHON_RESULT: ${{ needs.python.result }}
          STORAGE_RESULT: ${{ needs.storage.result }}
          NODE_SUITES: ${{ needs.detect.outputs.node-suites }}
          PYTHON_SERVICES: ${{ needs.detect.outputs.python-services }}
          STORAGE_SUITES: ${{ needs.detect.outputs.storage-suites }}
          FIPS_RESULT: ${{ needs.fips.result }}
          FIPS_SUITES: ${{ needs.detect.outputs.fips-suites }}
          SEMGREP_RESULT: ${{ needs.semgrep.result }}
          GITLEAKS_RESULT: ${{ needs.gitleaks.result }}
          HADOLINT_RESULT: ${{ needs.hadolint.result }}
          HADOLINT_SUITES: ${{ needs.detect.outputs.hadolint-suites }}
          SHIPCHECK_RESULT: ${{ needs.shipcheck.result }}
          SHIPCHECK_SUITES: ${{ needs.detect.outputs.ship-check-suites }}
          MCP_BRIDGE_RESULT: ${{ needs['mcp-bridge'].result }}
          MCP_BRIDGE_SUITES: ${{ needs.detect.outputs.mcp-bridge-suites }}
        run: |
          set -eu
          fail=0
          if [ "$DETECT_RESULT" != "success" ]; then
            echo "::error::ci-summary — detect did not succeed ($DETECT_RESULT)"
            fail=1
          fi
          check_leg() { # $1=name $2=result $3=suite-list
            case "$2" in
              success) echo "$1: success ($3)" ;;
              skipped)
                if [ "$3" = "[]" ]; then
                  echo "$1: skipped — no affected suites"
                else
                  echo "::error::ci-summary — $1 was skipped but its suite list is $3"
                  fail=1
                fi ;;
              *)
                echo "::error::ci-summary — $1 did not succeed ($2)"
                fail=1 ;;
            esac
          }
          check_leg node "$NODE_RESULT" "$NODE_SUITES"
          check_leg python "$PYTHON_RESULT" "$PYTHON_SERVICES"
          check_leg storage "$STORAGE_RESULT" "$STORAGE_SUITES"
          check_leg fips "$FIPS_RESULT" "$FIPS_SUITES"
          # semgrep is unfiltered by design, so its suite list is a literal
          # non-empty constant: there is no path change that makes "skipped"
          # a legitimate outcome for it.
          check_leg semgrep "$SEMGREP_RESULT" '["semgrep"]'
          # gitleaks is unfiltered by design — same literal-suite-list
          # treatment as semgrep. A secret can land in any file.
          check_leg gitleaks "$GITLEAKS_RESULT" '["gitleaks"]'
          check_leg hadolint "$HADOLINT_RESULT" "$HADOLINT_SUITES"
          check_leg ship-check "$SHIPCHECK_RESULT" "$SHIPCHECK_SUITES"
          check_leg mcp-bridge "$MCP_BRIDGE_RESULT" "$MCP_BRIDGE_SUITES"
          [ "$fail" -eq 0 ] || exit 1
          echo "ci-summary — every triggered leg succeeded"
