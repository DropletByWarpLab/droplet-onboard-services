name: codeql

# WARP-243 — CodeQL SAST for JS/TS + Python + Actions (advanced setup: we
# need the config file's test excludes and explicit per-language jobs;
# default setup offers neither, and cannot scan PRs at all here — see the
# SINGLE OWNER note below).
#
# ─── SINGLE OWNER (WARP-2167) ────────────────────────────────────────────
# This workflow is the ONLY producer of code-scanning results for this repo.
# GitHub's CodeQL **default setup** must stay OFF:
#
#     gh api repos/DropletByWarpLab/droplet-onboard-services/code-scanning/default-setup
#     # -> {"state":"not-configured", ...}
#
# If default setup is ever re-enabled, every upload here is rejected with
#   "CodeQL analyses from advanced configurations cannot be processed when
#    the default setup is enabled"
# and this lane goes permanently red while its results are silently
# discarded. That is exactly what happened on 2026-08-24.
#
# THE TRAP: this repo is attached to the org-level "GitHub recommended"
# code security configuration, which sets code_scanning_default_setup=enabled.
# Applying/re-applying that configuration to this repo turns default setup
# back on and re-breaks this lane. Enforcement is `unenforced`, so the
# repo-level override above wins until someone re-applies the config.
# Re-disable with:
#
#     gh api -X PATCH \
#       repos/DropletByWarpLab/droplet-onboard-services/code-scanning/default-setup \
#       -f state=not-configured
#
# Doing so does NOT touch secret scanning, push protection, Dependabot
# alerts, dependency graph, or private vulnerability reporting — all verified
# still enabled after the 2026-08-24 flip.
#
# WHY NOT default setup: every PR here targets `stage` (main moves only via
# a promotion PR). Default setup runs on the default branch, PRs targeting
# it, and a weekly cron — it never scans a `stage` PR. Handing it ownership
# means zero code scanning at review time.
#
# NOT MERGE-BLOCKING: these checks are not in the required_status_checks of
# either ruleset ("Main Protection" 14884851 / "Stage Protection" 20877684),
# and no `code_scanning` ruleset rule exists on either — verified 2026-08-24
# under WARP-2167, correcting an earlier claim in this header and in
# docs/SECURITY.md. They are advisory signal plus the Security tab. Wiring
# real enforcement is a separate decision, not a side effect of this file.
#
# BASELINE: none needed — GitHub's code-scanning PR check only surfaces
# alerts introduced by the PR diff, so pre-existing alerts on the base
# branch never block.
#
# COST: ~10 min/language, so this is the one expensive lane and it stays
# path-filtered. `.github/workflows/**` is in the filter because the
# `actions` language analyzes workflow files themselves; the trade-off is
# that a workflow-only edit also re-runs the JS/TS and Python jobs (path
# filters are workflow-scoped, not job-scoped).

on:
  pull_request:
    paths:
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.js"
      - "**/*.jsx"
      - "**/*.mjs"
      - "**/*.py"
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/codeql/codeql-config.yml"
  push:
    branches: [main]
    paths:
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.js"
      - "**/*.jsx"
      - "**/*.mjs"
      - "**/*.py"
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/codeql/codeql-config.yml"
  schedule:
    - cron: "41 4 * * 1" # weekly full pass so new queries hit unchanged code

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

# Three explicit jobs instead of a matrix: a matrix skipped at job level
# reports one check literally named "codeql / ${{ matrix.language }}"
# (GitHub never expands a matrix it skips), which would break the stable
# per-language check names.
jobs:
  analyze-js:
    name: codeql / javascript-typescript
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4.37.9
        with:
          languages: javascript-typescript
          config-file: ./.github/codeql/codeql-config.yml
          build-mode: none

      - uses: github/codeql-action/analyze@v4.37.9
        with:
          category: "/language:javascript-typescript"

  analyze-py:
    name: codeql / python
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4.37.9
        with:
          languages: python
          config-file: ./.github/codeql/codeql-config.yml
          build-mode: none

      - uses: github/codeql-action/analyze@v4.37.9
        with:
          category: "/language:python"

  # Added under WARP-2167: default setup was covering `actions` (workflow
  # injection, unpinned third-party actions, secrets exfil in run steps).
  # Turning it off without this job would have silently dropped that
  # coverage — the exact "gate that looks configured but is switched off"
  # shape this ticket was filed to remove.
  analyze-actions:
    name: codeql / actions
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4.37.9
        with:
          languages: actions
          config-file: ./.github/codeql/codeql-config.yml
          build-mode: none

      - uses: github/codeql-action/analyze@v4.37.9
        with:
          category: "/language:actions"
