name: codeql

# WARP-243 — CodeQL SAST for JS/TS + Python (advanced setup: we need the
# config file's test excludes and an explicit matrix; default setup offers
# neither). BASELINE: none needed — GitHub's code-scanning PR check only
# fails on alerts introduced by the PR diff, so pre-existing alerts on main
# never block. Merge-blocking is wired as a ruleset `code_scanning` rule
# (NOT a status check) so path-filtered runs don't leave PRs hanging on
# "Expected" — see docs/SECURITY.md#codeql and WARP-968/969.
# Path-filtered: at ~10 min/language this is the one expensive lane.
#
# GATED ON D1 (GitHub Code Security / GHAS): on this private repo the SARIF
# upload is rejected with "Code Security must be enabled for this
# repository" until an org admin enables the feature (billing decision —
# docs/SECURITY.md#codeql). The preflight job probes the code-scanning API
# and SKIPS the analyze matrix while the feature is off, so this lane merges
# green today and arms itself the moment Code Security is enabled — no
# workflow edit needed afterwards.

on:
  pull_request:
    paths:
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.js"
      - "**/*.jsx"
      - "**/*.mjs"
      - "**/*.py"
      - ".github/workflows/codeql.yml"
      - ".github/codeql/codeql-config.yml"
  push:
    branches: [main]
    paths:
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.js"
      - "**/*.jsx"
      - "**/*.mjs"
      - "**/*.py"
      - ".github/workflows/codeql.yml"
      - ".github/codeql/codeql-config.yml"
  schedule:
    - cron: "41 4 * * 1" # weekly full pass so new queries hit unchanged code

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  # D1 gate: only the exact "must be enabled" 403 means Code Security is
  # off; any other response (200 alerts, 404 no-analyses-yet) means the
  # upload will be accepted, so we analyze. Fails open on purpose — if the
  # probe breaks we'd rather run CodeQL and see the real error than
  # silently skip a security gate forever.
  preflight:
    name: code-security enabled (D1 gate)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      enabled: ${{ steps.probe.outputs.enabled }}
    steps:
      - name: Probe code-scanning API availability
        id: probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          resp=$(gh api "repos/$GITHUB_REPOSITORY/code-scanning/alerts?per_page=1" 2>&1) || true
          if printf '%s' "$resp" | grep -qi "must be enabled for this repository"; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            {
              echo "## CodeQL skipped — GitHub Code Security not enabled (decision D1)"
              echo "The code-scanning API answered: \`$(printf '%s' "$resp" | head -c 300)\`"
              echo "Enable it (org admin, billing) and this workflow arms itself on the next run:"
              echo '```'
              echo "gh api -X PATCH repos/$GITHUB_REPOSITORY -f 'security_and_analysis[advanced_security][status]=enabled'"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

  # Two explicit jobs instead of a matrix: a matrix skipped at job level
  # reports one check literally named "codeql / ${{ matrix.language }}"
  # (GitHub never expands a matrix it skips), which would break the stable
  # per-language check names the ruleset wiring expects.
  analyze-js:
    name: codeql / javascript-typescript
    needs: preflight
    if: needs.preflight.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4.37.7
        with:
          languages: javascript-typescript
          config-file: ./.github/codeql/codeql-config.yml
          build-mode: none

      - uses: github/codeql-action/analyze@v4.37.7
        with:
          category: "/language:javascript-typescript"

  analyze-py:
    name: codeql / python
    needs: preflight
    if: needs.preflight.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4.37.7
        with:
          languages: python
          config-file: ./.github/codeql/codeql-config.yml
          build-mode: none

      - uses: github/codeql-action/analyze@v4.37.7
        with:
          category: "/language:python"
