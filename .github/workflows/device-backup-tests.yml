name: device-backup-tests

# WARP-570 — full-device backup + restore drill. Static checks gate the
# scripts' structure + the factory-reset safeguard; with Docker present the
# job also runs the backup→mutate→restore round-trip against a disposable
# compose project. Docker is available on ubuntu-latest runners.

on:
  pull_request:
    paths:
      - "scripts/**"
      - "docker/**"
      - "tests/device-backup.test.sh"
      - ".github/workflows/device-backup-tests.yml"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "docker/**"
      - "tests/device-backup.test.sh"
      - ".github/workflows/device-backup-tests.yml"
  workflow_dispatch:

concurrency:
  group: device-backup-tests-${{ github.ref }}
  cancel-in-progress: true

# WARP-3677: least privilege. Every job here only checks out the repo and
# runs tests (no step uses the token for anything else), so read is all the
# GITHUB_TOKEN needs. Stated explicitly so a new job cannot inherit a wider
# repository default by omission.
permissions:
  contents: read

jobs:
  device-backup:
    runs-on: ubuntu-latest
    # A hung test must fail the job fast, not burn the 6h default runner
    # allocation. Runs a backup→mutate→restore Docker round-trip against a
    # disposable compose project (pulls only postgres:16-alpine, no image
    # build) — 20 min covers the pull + round-trip with headroom.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run full-device backup + restore drill
        run: bash tests/device-backup.test.sh
