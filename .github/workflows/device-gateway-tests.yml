name: device-gateway-tests

# Pytest for services/device-gateway.

on:
  # PR-time coverage is ci.yml's path-aware `device-gateway` leg; this
  # workflow is the push-to-main post-merge canary (docs/ci-cost-budget.md)
  # and satisfies scripts/check-ci-coverage.sh. No pull_request trigger.
  push:
    branches: [main]
    paths:
      - "services/device-gateway/**"
      - ".github/workflows/device-gateway-tests.yml"
  workflow_dispatch:

concurrency:
  group: device-gateway-tests-${{ github.ref }}
  cancel-in-progress: true

# The job only checks out and runs pytest, so read is all the GITHUB_TOKEN
# needs. Stated explicitly because CodeQL's actions/missing-workflow-permissions
# flags an unset block — the default is write-heavy, and a new workflow should
# not inherit that by omission.
permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    # A hung test must fail the job fast, not burn the 6h default runner
    # allocation. Plain pytest suite — 15 min ceiling.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/device-gateway
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/device-gateway/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest -v
