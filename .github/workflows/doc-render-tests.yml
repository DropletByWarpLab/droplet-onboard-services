name: doc-render-tests

# Pytest for services/doc-render (WARP-2211). Path-filtered. The suite needs
# nothing but the service's own deps: the renderers are pure functions over a
# validated spec — no network, no filesystem, no credentials — and every
# produced file is round-tripped back through the reader a user's own
# application would use.

on:
  # PR-time coverage for this suite is owned by ci.yml's path-aware
  # `doc-render` leg, same split as ops-console / email-indexer. Push-to-main
  # stays as an independent post-merge canary and to satisfy
  # scripts/check-ci-coverage.sh.
  push:
    branches: [main]
    paths:
      - "services/doc-render/**"
      - ".github/workflows/doc-render-tests.yml"
  workflow_dispatch:

concurrency:
  group: doc-render-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    # A hung test must fail the job fast, not burn the 6h default runner
    # allocation. Plain pytest suite — 15 min is a generous ceiling.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/doc-render
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/doc-render/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest -v
