name: docker-build

# Build only the compose images a change actually touches (default + full +
# eval profiles of docker/docker-compose.yml), one runner per image, with a
# BuildKit layer cache in GHCR — instead of every image serially on one
# runner (~23 min). Still fails the PR if any affected Dockerfile is broken,
# without spending time on the full scripts/setup.sh flow.
#
#   detect          — validates the compose file, maps changed paths to
#                     affected images (each image's filter lists what its
#                     Dockerfile COPYs), and fails if the compose file's
#                     buildable services drift from the filter list below.
#   build           — matrix, one image per runner. Layer cache lives at
#                     ghcr.io/<repo>/buildcache:<image>; PRs read it, pushes
#                     to main rebuild the AFFECTED images and refresh their
#                     cache (post-merge, so their wall-clock blocks nobody),
#                     and a weekly schedule rebuilds the full fleet. The orchestrator
#                     image is additionally smoke-booted (WARP-1246): a
#                     require() of dist/index.js inside the image proves the
#                     runtime stage's COPY set actually resolves at boot.
#                     Each built image is
#                     Trivy-scanned (WARP-243): HIGH/CRITICAL vulns with a fix
#                     available fail the job unless triaged in .trivyignore.
#                     The Trivy lane needs the image loaded into the daemon
#                     (`load: true`) AND exported once more by Trivy's layer
#                     analysis — three uncompressed copies of the biggest
#                     images blow the stock ~14 GB disk, so the "free disk
#                     space" step (dropped in #815 when one bare build fit)
#                     is back.
#   docker-build-ok — stable fan-in check name for branch protection.
#
# WARP-316 — arch scope of the build-time FIPS gate: this workflow builds
# **linux/amd64 only** (the ubuntu-latest runner arch; no `platforms:` on
# build-push-action). The FIPS module + install scripts are arch-neutral
# (`build-openssl-fips.sh` auto-detects via ./Configure; install-fips-provider.sh
# resolves MODULESDIR per-arch), so the build-time self-test passes identically
# on arm64 — that leg is verified on the appliance image pipeline (ADR-020) or
# an arm64 self-hosted runner when one is provisioned. amd64 is the shipped
# multi-box inference-host arch; arm64 is single-box/dev. Adding
# `platforms: linux/amd64,linux/arm64` (QEMU) is a deliberate follow-up, NOT an
# omission — emulated arm64 builds of the compile-heavy FIPS stage are slow +
# flaky, and arm64 is not yet a shipped FIPS target.

on:
  pull_request:
    paths:
      - "apps/**/Dockerfile"
      - "services/**/Dockerfile"
      - "apps/**/package.json"
      - "apps/**/package-lock.json"
      - "services/**/requirements*.txt"
      - "docker/docker-compose.yml"
      # WARP-967: every shipped image COPYs + RUNs these at build time
      # (FIPS provider compile/install + the shared activation config) —
      # an edit to them must rebuild all images.
      - "docker/fips/**"
      - "docker/openssl-fips.cnf"
      # WARP-1021: the gateway image bakes docker/nginx/** (Dockerfile,
      # nginx.conf, cipher profiles, entrypoint hook) — edits must rebuild it.
      - "docker/nginx/**"
      - ".dockerignore"
      - "proto/**"
      - ".github/workflows/docker-build.yml"
      # WARP-243: the Trivy baseline changes the scan verdict for every
      # image - a .trivyignore-only PR must rebuild + rescan to be validated.
      - ".trivyignore"
      # Build inputs the old trigger list missed — each is COPY'd into at
      # least one image (see the per-image filters in the detect job):
      - "package.json"
      - "package-lock.json"
      - "packages/**"
      - "services/**/package.json"
      - "services/_shared/**"
      - "tests/retrieval-eval/**"
      - "apps/orchestrator/prisma/**"
  push:
    branches: [main]
    paths:
      - "apps/**/Dockerfile"
      - "services/**/Dockerfile"
      - "apps/**/package.json"
      - "apps/**/package-lock.json"
      - "services/**/requirements*.txt"
      - "docker/docker-compose.yml"
      - "docker/fips/**"
      - "docker/openssl-fips.cnf"
      - "docker/nginx/**"
      - ".dockerignore"
      - "proto/**"
      - ".github/workflows/docker-build.yml"
      # WARP-243: the Trivy baseline changes the scan verdict for every
      # image - a .trivyignore-only PR must rebuild + rescan to be validated.
      - ".trivyignore"
      - "package.json"
      - "package-lock.json"
      - "packages/**"
      - "services/**/package.json"
      - "services/_shared/**"
      - "tests/retrieval-eval/**"
      - "apps/orchestrator/prisma/**"
      # setup-e2e disk regression (2026-07-11): every image COPYs its app's
      # full source tree, so a source-only merge invalidates the GHCR layer
      # cache from the COPY step down — but the old push filter skipped
      # exactly those merges, so buildcache:<image> silently went stale.
      # setup-e2e.yml builds ALL images on one disk-constrained runner and
      # only fits when the cache mostly hits: five source-only merges of
      # drift (#961/#962/#963/#964/#933) made orchestrator, web-dashboard
      # and ai-gateway rebuild cold and blew the disk ("no space left on
      # device" importing ai-gateway). Refresh the cache on every merge
      # that changes any image's build inputs — these three globs close the
      # gap to the per-image filters the detect job already declares.
      # (Post-merge rebuilds block nobody; PR paths deliberately unchanged.)
      - "apps/orchestrator/**"
      - "apps/web-dashboard/**"
      - "services/**"
  # Weekly full rebuild of every image's GHCR layer cache. Push runs now
  # rebuild only AFFECTED images (CI budget optimization, 2026-07 — see the
  # plan step), which keeps each cache exactly as fresh as its build inputs;
  # this scheduled pass is the belt-and-braces heal for anything the
  # per-image filters miss, and doubles as a weekly full-fleet Trivy scan.
  schedule:
    - cron: "23 2 * * 6" # Saturday 02:23 UTC

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSE: docker compose -f docker/docker-compose.yml --profile full --profile eval

jobs:
  detect:
    name: detect affected images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # dorny/paths-filter lists PR files via the API
    outputs:
      images: ${{ steps.plan.outputs.images }}
    steps:
      - uses: actions/checkout@v7

      # Validate compose YAML before eating any build cost. Ignore the
      # "variable not set" warnings from unbaked secrets — those are only
      # used at runtime, not at build time. `--profile eval` keeps
      # services/rag-eval/ gated by CI even though it never auto-starts
      # at runtime.
      - name: Validate compose file and enumerate buildable images
        id: compose
        run: |
          set -eu
          $COMPOSE config --quiet
          buildable=$($COMPOSE config --format json | jq -c '[.services | to_entries[] | select(.value.build) | .key] | sort')
          echo "buildable=$buildable" >> "$GITHUB_OUTPUT"
          echo "Buildable images: $buildable"

      # A new buildable service in the compose file MUST get a path filter
      # below (and a KNOWN entry here) — otherwise its image would only ever
      # be built by global changes, silently skipping service-scoped PRs.
      - name: Fail if compose file and per-image filters drifted
        env:
          BUILDABLE: ${{ steps.compose.outputs.buildable }}
          KNOWN: >-
            ["ai-gateway","camera-discovery","device-identity-svc",
            "email-indexer","file-indexer","gateway","matter-controller",
            "mcp-server","orchestrator","rag-eval","routing","switch",
            "web-dashboard"]
        run: |
          set -eu
          if [ "$(jq -cS . <<<"$BUILDABLE")" != "$(jq -cS . <<<"$KNOWN")" ]; then
            echo "::error file=.github/workflows/docker-build.yml::buildable services in docker-compose.yml ($BUILDABLE) no longer match this workflow's KNOWN list ($KNOWN). Update KNOWN and the per-image filters in the detect job."
            exit 1
          fi

      # Each image's filter lists its actual build inputs — everything its
      # Dockerfile COPYs (own dir, workspace manifests, shared _shared/
      # helpers, proto). FIPS assets (docker/fips/**, openssl-fips.cnf) sit
      # in `global` because nearly every image copies them. Helper keys
      # (py-shared, node-workspace) exist only as YAML anchors; the plan
      # step intersects matches with buildable images, so helpers never
      # reach the matrix.
      # Runs on pull_request AND push: PRs diff against the base branch,
      # push events diff against the previous main commit (dorny default).
      # Scheduled/dispatch runs skip it and rebuild everything.
      - name: Map changed paths to affected images
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            # Shared FIPS self-test helper COPY'd into every Python image.
            py-shared: &py-shared
              - "services/_shared/**"
            # Workspace manifests COPY'd into every Node builder stage so
            # `npm ci` can resolve the workspace graph.
            node-workspace: &node-workspace
              - "package.json"
              - "package-lock.json"
              - "apps/orchestrator/package.json"
              - "apps/web-dashboard/package.json"
              - "services/ai-gateway/package.json"
              - "services/matter-controller/package.json"
              - "services/mcp-server/package.json"
              - "packages/tools-core/package.json"
              - "packages/fips-selftest/package.json"
              - "packages/shared-types/package.json"
              - "packages/auth-policy/package.json"
            global:
              - "docker/docker-compose.yml"
              - "docker/fips/**"
              - "docker/openssl-fips.cnf"
              - ".dockerignore"
              - ".github/workflows/docker-build.yml"
              - ".trivyignore" # Trivy baseline applies to every image
            # WARP-1021: the FIPS-capable nginx edge. Everything it COPYs
            # beyond docker/nginx/** (docker/fips/**, docker/openssl-fips.cnf)
            # lives in `global` above, which rebuilds ALL images anyway.
            gateway:
              - "docker/nginx/**"
            orchestrator:
              - *node-workspace
              - "apps/orchestrator/**"
              - "services/mcp-server/**"
              - "packages/tools-core/**"
              - "packages/fips-selftest/**"
              - "packages/shared-types/**"
              - "packages/auth-policy/**"
              - "proto/**"
            web-dashboard:
              # WARP-316: the dashboard's Dockerfile COPYs the shared FIPS
              # assets (docker/openssl-fips.cnf + docker/fips/**), but those
              # live in the `global` filter (they rebuild ALL images), so the
              # dashboard IS retriggered on any FIPS-asset change — no
              # dashboard-scoped docker/fips/** entry is needed here (that would
              # duplicate `global`). Its Dockerfile change is caught by the
              # `apps/**/Dockerfile` PR trigger above.
              - "package.json"
              - "package-lock.json"
              - "apps/web-dashboard/**"
              - "packages/shared-types/**"
              - "packages/auth-policy/**"
            mcp-server:
              - *node-workspace
              - "services/mcp-server/**"
              - "packages/tools-core/**"
              - "packages/fips-selftest/**"
              - "apps/orchestrator/prisma/**"
              - "proto/**"
            matter-controller:
              - *node-workspace
              - "services/matter-controller/**"
              - "packages/fips-selftest/**"
            ai-gateway:
              - *py-shared
              - "services/ai-gateway/**"
            camera-discovery:
              - *py-shared
              - "services/camera-discovery/**"
            device-identity-svc:
              - *py-shared
              - "services/device-identity-svc/**"
              - "proto/**"
            email-indexer:
              - *py-shared
              - "services/email-indexer/**"
            file-indexer:
              - *py-shared
              - "services/file-indexer/**"
              - "proto/**"
            routing:
              - *py-shared
              - "services/routing/**"
            switch:
              - *py-shared
              - "services/switch/**"
            rag-eval:
              - "services/rag-eval/**"
              - "tests/retrieval-eval/**"

      - name: Decide which images to build
        id: plan
        env:
          BUILDABLE: ${{ steps.compose.outputs.buildable }}
          CHANGED: ${{ steps.filter.outputs.changes }}
        run: |
          set -eu
          if [ "${{ github.event_name }}" != "pull_request" ] \
             && [ "${{ github.event_name }}" != "push" ]; then
            # schedule / workflow_dispatch: full-fleet cache refresh + scan.
            images="$BUILDABLE"
          elif jq -e 'index("global")' <<<"$CHANGED" >/dev/null; then
            images="$BUILDABLE"
          else
            # Intersect matched filters with buildable images (drops the
            # anchor-only helper filters). Push runs used to rebuild
            # everything for cache freshness; since a cache only goes stale
            # when its own build inputs change, affected-only refresh keeps
            # every cache fresh at a fraction of the cost (CI budget
            # optimization, 2026-07). The weekly schedule heals any gap.
            images=$(jq -c --argjson b "$BUILDABLE" '[.[] | select(. as $s | $b | index($s))] | sort' <<<"$CHANGED")
          fi
          echo "images=$images" >> "$GITHUB_OUTPUT"
          echo "Images to build: $images"

  build:
    name: build ${{ matrix.image }}
    needs: detect
    if: needs.detect.outputs.images != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # GHCR layer cache; PR tokens degrade to read
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.detect.outputs.images) }}
    steps:
      - uses: actions/checkout@v7

      # WARP-243: the Trivy image scan needs the built image loaded into the
      # docker daemon plus a full uncompressed export during layer analysis —
      # on top of the BuildKit cache that's ~3 copies of the image, which
      # overflows the stock ~14 GB runner disk for the biggest images
      # ("no space left on device" in Trivy's docker-export). Strip the
      # preinstalled toolchains we don't use to reclaim ~25 GB (same step
      # setup-e2e.yml uses; docker-build had it too before #815).
      - name: Free disk space (Trivy needs headroom for image export)
        run: |
          set -eux
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/powershell \
            /usr/local/share/chromium \
            /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY/Ruby" \
            "$AGENT_TOOLSDIRECTORY/PyPy" \
            || true
          sudo apt-get clean
          df -h /

      # Derive build context + Dockerfile from the compose file itself so
      # the matrix never drifts from what `docker compose build` would do.
      # `config` normalizes context to an absolute path; dockerfile stays
      # context-relative.
      - name: Resolve build context and cache ref
        id: meta
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -eu
          $COMPOSE config --format json > /tmp/compose-config.json
          context=$(jq -re --arg s "$IMAGE" '.services[$s].build.context' /tmp/compose-config.json)
          dockerfile=$(jq -re --arg s "$IMAGE" '.services[$s].build.dockerfile // "Dockerfile"' /tmp/compose-config.json)
          case "$dockerfile" in
            /*) file="$dockerfile" ;;
            *) file="$context/$dockerfile" ;;
          esac
          {
            echo "context=$context"
            echo "file=$file"
            echo "cache-ref=ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')/buildcache:$IMAGE"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR (layer cache)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # push:false — this workflow only validates that images build; nothing
      # ships from here (publish-release.yml owns that). Only pushes to main
      # write the cache: PR runs stay read-only, and GHCR sees no per-PR
      # cache churn.
      - name: Build ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.meta.outputs.context }}
          file: ${{ steps.meta.outputs.file }}
          pull: true
          push: false
          load: true
          tags: droplet-ci/${{ matrix.image }}:scan
          cache-from: type=registry,ref=${{ steps.meta.outputs.cache-ref }}
          # Push AND scheduled/dispatch runs refresh the cache; PR runs stay
          # read-only so GHCR sees no per-PR cache churn.
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0},mode=max,image-manifest=true', steps.meta.outputs.cache-ref) || '' }}

      # WARP-1246: smoke-boot the orchestrator image. Build + Trivy never
      # EXECUTE the runtime stage, so a broken run-stage COPY set ships green:
      # PR #965's image built fine while node_modules/@droplet/erp-connector
      # dangled (its dist/ was never COPY'd into the run stage) and the
      # container crash-looped at boot. dist/index.js guards main() behind
      # `require.main === module` (it emits CommonJS — see the comment at the
      # bottom of apps/orchestrator/src/index.ts), so require()ing it resolves
      # the FULL top-level import graph — generated Prisma client, every
      # @droplet/* workspace symlink, every service module — without starting
      # the server or needing Postgres/Redis/MQTT. That is exactly the
      # missing-runtime-file / unresolvable-top-level-import class, in
      # seconds. The real entrypoint (scripts/migrate-and-start.sh) is not
      # bootable here: it hard-exits without a reachable DATABASE_URL before
      # ever loading node code, so it can't see this bug class without infra.
      #   - runs from the image's WORKDIR (/app/apps/orchestrator) with the
      #     image's own env, `node` overriding the CMD;
      #   - --network=none: module resolution needs no network, so the check
      #     stays hermetic and can't hang on a stray connect;
      #   - explicit process.exit(0) so a module-scope timer can never hold
      #     the process open; `timeout 120` bounds the step regardless
      #     (measured: the require walk is seconds-fast on Linux).
      # Verified failure mode: hiding services/erp-connector/dist reproduces
      # #965 — MODULE_NOT_FOUND, exit 1, step fails.
      - name: Smoke-boot orchestrator (resolve top-level import graph)
        if: matrix.image == 'orchestrator'
        run: |
          set -eu
          timeout 120 docker run --rm --network=none \
            droplet-ci/orchestrator:scan \
            node -e "require('./dist/index.js'); console.log('smoke-boot OK: top-level import graph resolved'); process.exit(0)"

      # WARP-243: image vulnerability gate — DETERMINISTIC by construction.
      #
      # Blocking on "any fixable HIGH/CRITICAL" against a *rolling* Trivy DB
      # is non-deterministic over time: the same image + same code goes red
      # the day the DB adds a CVE for an already-installed package (Debian
      # point-release lag on libcap2/libgnutls30, new npm/Go-module advisories
      # for pinned deps). That is the exact "flake-block on pre-existing
      # findings" the cluster-E spec forbids. Two mechanisms make this gate
      # reproducible AND still catch genuinely NEW fixable vulns:
      #
      #   1. PINNED vuln DB (TRIVY_DB_REPOSITORY at a dated OCI tag). A given
      #      commit always scans against the same DB snapshot, so "green on
      #      Monday" stays green on Friday with no code change. Bumping the
      #      pin is a deliberate, reviewable PR (`.github/trivy-db-version`),
      #      turning silent drift into an intentional event.
      #   2. .trivyignore BASELINE — the complete set of fixable HIGH/CRITICAL
      #      findings present at the pinned-DB snapshot, each with a burn-down
      #      note. A fixable vuln NOT in the baseline (i.e. one this PR
      #      introduces, or one the DB bump newly surfaces) still fails the
      #      build. ignore-unfixed drops un-patchable base CVEs on top.
      #
      # scanners: vuln only — secrets are gitleaks' domain, misconfig is
      # hadolint's (no double-reporting). Probe: tests/probe/trivy-newcve.md
      # documents adding an un-baselined fixable HIGH and watching this fail.
      - name: Read pinned Trivy DB digest
        id: trivydb
        run: echo "ref=$(grep -v '^#' .github/trivy-db-version | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Trivy scan ${{ matrix.image }} (block new HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          # Pin the vuln DB by immutable digest so the scan is reproducible
          # run-to-run — the sole knob is .github/trivy-db-version. (The Java
          # DB is unused here: no JVM images, scanners:vuln only. Left at the
          # rolling tag; it never contributes findings to these images.)
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db@${{ steps.trivydb.outputs.ref }}
          TRIVY_SKIP_VERSION_CHECK: "true"
        with:
          image-ref: droplet-ci/${{ matrix.image }}:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          scanners: vuln
          trivyignores: .trivyignore
          # WARP-243: the trivy-action default is 5m0s, which the ai-gateway
          # image (ONNX/reranker ML deps → large layers) intermittently blows
          # during Trivy's layer analysis → "context deadline exceeded", a flaky
          # red on both main and any PR that rebuilds ai-gateway. Give the scan
          # headroom so the gate reflects vulns, not runner timing.
          timeout: "20m0s"

  # Single stable check name for branch protection, whatever the matrix did.
  docker-build-ok:
    name: docker-build ok
    needs: [detect, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Assert detect and all builds succeeded
        env:
          DETECT: ${{ needs.detect.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          set -eu
          [ "$DETECT" = "success" ] || { echo "detect: $DETECT"; exit 1; }
          case "$BUILD" in
            success|skipped) echo "build: $BUILD" ;;
            *) echo "build: $BUILD"; exit 1 ;;
          esac
