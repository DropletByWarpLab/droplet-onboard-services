name: docker-build

# Build every image in docker/docker-compose.yml (including services gated
# behind `profiles: ["full"]`). Fails the PR if any Dockerfile is broken,
# without spending time on the full scripts/setup.sh flow.

on:
  pull_request:
    paths:
      - "apps/**/Dockerfile"
      - "services/**/Dockerfile"
      - "apps/**/package.json"
      - "apps/**/package-lock.json"
      - "services/**/requirements*.txt"
      - "docker/docker-compose.yml"
      # WARP-967: every shipped image COPYs + RUNs these at build time
      # (FIPS provider compile/install + the shared activation config) —
      # an edit to them must rebuild all images.
      - "docker/fips/**"
      - "docker/openssl-fips.cnf"
      - ".dockerignore"
      - "proto/**"
      - ".github/workflows/docker-build.yml"
  push:
    branches: [main]
    paths:
      - "apps/**/Dockerfile"
      - "services/**/Dockerfile"
      - "apps/**/package.json"
      - "apps/**/package-lock.json"
      - "services/**/requirements*.txt"
      - "docker/docker-compose.yml"
      - "docker/fips/**"
      - "docker/openssl-fips.cnf"
      - ".dockerignore"
      - "proto/**"
      - ".github/workflows/docker-build.yml"

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-all:
    name: build all images (default + full profile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ubuntu-latest has ~14GB free. `docker compose --profile full build`
      # fills that before BuildKit finishes (see setup-e2e.yml for the same
      # fix). Strip the preinstalled toolchains we don't use to reclaim ~25GB.
      - name: Free disk space
        run: |
          set -eux
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/powershell \
            /usr/local/share/chromium \
            /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY/Ruby" \
            "$AGENT_TOOLSDIRECTORY/PyPy" \
            || true
          sudo apt-get clean
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Validate compose YAML before eating the full build cost.
      # Ignore the "variable not set" warnings from unbaked secrets —
      # those are only used at runtime, not at build time.
      # `--profile eval` covers services/rag-eval/ even though it doesn't
      # auto-start at runtime — image build is still gated by CI so a
      # Dockerfile typo in the eval lane fails the PR.
      - name: Validate compose file
        run: docker compose -f docker/docker-compose.yml --profile full --profile eval config --quiet

      - name: Build all images
        run: docker compose -f docker/docker-compose.yml --profile full --profile eval build --pull
