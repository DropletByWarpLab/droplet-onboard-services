name: Droplet Mobile (Android) build

on:
  push:
    branches: [main]
    paths:
      - 'clients/droplet-mobile/**'
      - '.github/workflows/droplet-mobile.yml'
  pull_request:
    paths:
      - 'clients/droplet-mobile/**'
      - '.github/workflows/droplet-mobile.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: clients/droplet-mobile

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Gradle wrapper if missing
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.11.1
          fi

      - name: Run shared unit tests
        run: ./gradlew :shared:testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :androidApp:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: droplet-android-debug
          path: clients/droplet-mobile/androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
