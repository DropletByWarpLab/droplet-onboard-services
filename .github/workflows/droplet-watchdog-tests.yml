name: droplet-watchdog-tests

# WARP-1002 — unified on-box self-heal supervisor. Pure shell tests drive the
# watchdog against fake sysfs trees, a fake kernel log, and stub docker /
# xvf_host binaries (no root, hardware, or docker daemon needed), plus a
# shellcheck pass over the supervisor itself.

on:
  pull_request:
    paths:
      - "scripts/host/droplet-watchdog.sh"
      - "scripts/host/etc-systemd-system/droplet-watchdog.*"
      - "scripts/host/etc-default/droplet-watchdog"
      - "scripts/host/usr-local-sbin/droplet-wifi-watchdog"
      # WARP-1829 / WARP-2574: host_unit_staleness delegates to this
      # detector's `check`, host_artefacts to its `audit`, and the audit
      # reads the manifest.
      - "scripts/host/droplet-host-units.sh"
      - "scripts/host/MANIFEST"
      # WARP-2189: the relay_dns check delegates to this helper, and
      # local-dns.sh is the setup-time caller that must keep it applied.
      - "scripts/host/droplet-relay-dns.sh"
      - "scripts/lib/local-dns.sh"
      - "scripts/lib/single-box.sh"
      - "scripts/install-device-bridge.sh"
      - "tests/droplet-watchdog.test.sh"
      - "tests/droplet-relay-dns.test.sh"
      # WARP-2647: the boot-time network backstop and its suite, neither of
      # which any workflow named. Same harness family as droplet-watchdog.
      - "scripts/host/usr-local-sbin/droplet-net-selfheal"
      - "tests/droplet-net-selfheal.test.sh"
      - ".github/workflows/droplet-watchdog-tests.yml"
  push:
    branches: [main]
    paths:
      - "scripts/host/droplet-watchdog.sh"
      - "scripts/host/etc-systemd-system/droplet-watchdog.*"
      - "scripts/host/etc-default/droplet-watchdog"
      - "scripts/host/usr-local-sbin/droplet-wifi-watchdog"
      - "scripts/host/droplet-host-units.sh"
      - "scripts/host/MANIFEST"
      - "scripts/host/droplet-relay-dns.sh"
      - "scripts/lib/local-dns.sh"
      - "scripts/lib/single-box.sh"
      - "scripts/install-device-bridge.sh"
      - "tests/droplet-watchdog.test.sh"
      - "tests/droplet-relay-dns.test.sh"
      # WARP-2647: the boot-time network backstop and its suite, neither of
      # which any workflow named. Same harness family as droplet-watchdog.
      - "scripts/host/usr-local-sbin/droplet-net-selfheal"
      - "tests/droplet-net-selfheal.test.sh"
      - ".github/workflows/droplet-watchdog-tests.yml"
  workflow_dispatch:

concurrency:
  group: droplet-watchdog-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  droplet-watchdog:
    runs-on: ubuntu-latest
    # Everything is local stubs + tmpdirs; a hung test must fail fast.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck the supervisor
        # warning severity to match ship-check's bar; no global excludes —
        # waivers live inline per scripts/test/ship-check.sh convention.
        run: shellcheck --severity=warning scripts/host/droplet-watchdog.sh
      - name: shellcheck the relay-DNS helper
        run: shellcheck --severity=warning scripts/host/droplet-relay-dns.sh
      - name: Run droplet-watchdog shell tests
        run: bash tests/droplet-watchdog.test.sh
      - name: Run droplet-relay-dns shell tests
        run: bash tests/droplet-relay-dns.test.sh

      # WARP-2647: WARP-1680's boot-time backstop ran in NO workflow. It is
      # what recovers a box whose NIC rename left netplan configuring a device
      # that does not exist and the appliance with no IPv4 on any interface —
      # the failure that twice required a physical console trip. Its harness is
      # this suite's own: a fake /sys/class/net tree plus `ip`/`logger`/`dhcpcd`
      # stubs on PATH, so no root, no hardware, no real interface is touched.
      # ~22 s (it exercises the retry backoff), on a job that already exists.
      - name: shellcheck the network self-heal backstop
        run: shellcheck --severity=warning scripts/host/usr-local-sbin/droplet-net-selfheal
      - name: Run droplet-net-selfheal shell tests
        run: bash tests/droplet-net-selfheal.test.sh
