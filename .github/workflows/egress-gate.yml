name: egress-gate

# WARP-269 — telemetry-free invariant. Statically inventories every
# outbound destination in the repo (URL literals, config hostnames, public
# IPs) and fails if any is missing from docs/security/allowed-egress.yaml.
# The allowlist schema is shared with the WARP-268 runtime egress audit.
# Runs unfiltered on every PR (job is ~15 s) so it can be a required check
# (WARP-968/969). Scanner unit tests run first — same pattern as
# test-fips.yml.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: egress-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  egress-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install PyYAML (pinned)
        run: pip install pyyaml==6.0.2

      - name: Run scanner's own unit tests
        run: ./tests/test-egress-scan/run.sh

      - name: Enforce the egress allowlist (PR-blocking)
        run: python3 scripts/check-egress-allowlist.py
