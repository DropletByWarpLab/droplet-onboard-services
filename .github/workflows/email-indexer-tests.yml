name: email-indexer-tests

# Pytest for services/email-indexer. Path-filtered.

on:
  pull_request:
    paths:
      - "services/email-indexer/**"
      - ".github/workflows/email-indexer-tests.yml"
  push:
    branches: [main]
    paths:
      - "services/email-indexer/**"
      - ".github/workflows/email-indexer-tests.yml"
  workflow_dispatch:

concurrency:
  group: email-indexer-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    # A hung test must fail the job fast, not burn the 6h default runner
    # allocation. Plain pytest suite — 15 min is a generous ceiling.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/email-indexer
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/email-indexer/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest -v
