name: file-indexer-tests

# Pytest for services/file-indexer. Path-filtered.

on:
  pull_request:
    paths:
      - "services/file-indexer/**"
      - ".github/workflows/file-indexer-tests.yml"
  push:
    branches: [main]
    paths:
      - "services/file-indexer/**"
      - ".github/workflows/file-indexer-tests.yml"

concurrency:
  group: file-indexer-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/file-indexer
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/file-indexer/requirements-dev.txt

      - name: Install system deps for psycopg2-binary
        run: sudo apt-get update && sudo apt-get install -y libpq-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest -v
