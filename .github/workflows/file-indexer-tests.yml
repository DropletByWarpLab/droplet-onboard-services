name: file-indexer-tests

# Pytest for services/file-indexer. Path-filtered.

on:
  # PR-time coverage for this suite is owned by ci.yml's path-aware
  # `file-indexer` leg (CI budget optimization, 2026-07): the pull_request
  # trigger here was retired as an exact duplicate of that leg.
  # Push-to-main stays as an independent post-merge canary and to
  # satisfy scripts/check-ci-coverage.sh.
  push:
    branches: [main]
    paths:
      - "services/file-indexer/**"
      - ".github/workflows/file-indexer-tests.yml"
  workflow_dispatch:

concurrency:
  group: file-indexer-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    # A hung test must fail the job fast, not burn the 6h default runner
    # allocation. Plain pytest suite (apt binary deps only) — 15 min ceiling.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/file-indexer
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/file-indexer/requirements-dev.txt

      - name: Install system deps
        # libpq-dev: psycopg2-binary build fallback
        # ffmpeg: required by WARP-198 video extractor (subprocess: ffprobe / ffmpeg).
        #   GitHub's ubuntu-latest currently ships ffmpeg pre-installed, but pin
        #   it explicitly so a future runner-image change doesn't silently break
        #   the video tests with a confusing FileNotFoundError on 'ffprobe'.
        # libmagic1: WARP-199 email + WARP-200 archive extractors use python-magic
        #   for content sniffing.
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev ffmpeg libmagic1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest -v
