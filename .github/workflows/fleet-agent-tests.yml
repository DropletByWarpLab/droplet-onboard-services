name: fleet-agent-tests

# Pytest for services/fleet-agent. Path-filtered. The suite is fully mocked
# (respx portal, injected fake collectors — no real network or /proc).

on:
  # PR-time coverage for this suite is owned by ci.yml's path-aware
  # `fleet-agent` leg (CI budget optimization, 2026-07): the pull_request
  # trigger here was retired as an exact duplicate of that leg.
  # Push-to-main stays as an independent post-merge canary and to
  # satisfy scripts/check-ci-coverage.sh.
  push:
    branches: [main]
    paths:
      - "services/fleet-agent/**"
      - "apps/orchestrator/src/services/update-agent/__fixtures__/**"
      - ".github/workflows/fleet-agent-tests.yml"
  workflow_dispatch:

concurrency:
  group: fleet-agent-tests-${{ github.ref }}
  cancel-in-progress: true

# WARP-3677: least privilege. Every job here only checks out the repo and
# runs tests (no step uses the token for anything else), so read is all the
# GITHUB_TOKEN needs. Stated explicitly so a new job cannot inherit a wider
# repository default by omission.
permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    # A hung test must fail the job fast, not burn the 6h default runner
    # allocation. Plain pytest suite (pytest-timeout caps each test at 60s
    # via pytest.ini) — 15 min is a generous ceiling.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/fleet-agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # WARP-1025: the release_verify/update_poll suites exec the REAL
      # cosign binary over the WARP-537 golden fixtures — genuine
      # cryptographic accept/reject, mirroring orchestrator-tests.yml. A
      # missing binary FAILS those tests loudly, never skips.
      - name: Install cosign (release_verify suite)
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/fleet-agent/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest -v
