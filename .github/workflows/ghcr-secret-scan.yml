name: ghcr-secret-scan

# WARP-3423 — secret-scan every published version of every first-party GHCR
# package (scripts/release/services.json), layer by layer.
#
# Why it exists: OTA images must be anonymously pullable (ADR-045 forbids a
# GitHub token on an appliance, and GHCR accepts no short-lived token), so the
# packages go public. Public is irreversible per package and exposes EVERY
# version it holds, so before the flip — and on demand afterwards — every
# version's config, layers, signatures and attestations are scanned, not just
# the newest. Escape class it closes: a credential baked into any historical
# layer becoming world-readable the moment a package goes public.
#
# Dispatch-only, never on PRs or pushes. Inputs let a big package be split and
# a failed slice be retried without redoing the rest (ai-gateway's ~150
# versions each carry baked models and outlived one 240-minute job):
#   package  scan just this one (a name from services.json, with or without the
#            `droplet-` prefix); empty = every package
#   shards   fan each selected package out over this many jobs; job K of N scans
#            versions[K::N]. Default 1 (no split). Capped so legs stay under
#            GitHub's 256-per-matrix limit
#   digests  comma-separated digest prefixes: rescan only those versions (e.g.
#            the ones a connection reset skipped; the scan prints them as
#            warnings). A prefix that matches no version fails the leg
#
# Cost: one job per package per shard, a few minutes each for most packages.
#
# Findings are scanned with scripts/release/gitleaks-images.toml (default rules
# plus the python base images' public GPG_KEY fingerprint, nothing else). Logs
# and artifacts of a public repo are public: findings are --redact'ed.

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Scan just this package (e.g. ai-gateway). Empty = every package"
        required: false
        default: ""
        type: string
      shards:
        description: "Jobs per package; job K of N scans versions[K::N]"
        required: false
        default: "1"
        type: string
      digests:
        description: "Rescan only versions whose digest starts with one of these (comma-separated, sha256:ab12,...)"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: ghcr-secret-scan
  cancel-in-progress: false

jobs:
  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Expands the dispatch inputs into one matrix leg per (package, shard).
      # The inputs reach the script through env, never interpolated into it,
      # and are validated here so a bad value fails in seconds, not after the
      # matrix has fanned out.
      - id: list
        env:
          INPUT_PACKAGE: ${{ inputs.package }}
          INPUT_SHARDS: ${{ inputs.shards }}
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee -a "$GITHUB_OUTPUT"
          import json, os, sys
          names = ["droplet-" + s["name"] for s in json.load(open("scripts/release/services.json"))["services"]]
          want = os.environ["INPUT_PACKAGE"].strip()
          if want:
              want = want if want.startswith("droplet-") else "droplet-" + want
              if want not in names:
                  sys.exit(f"unknown package {want!r}; one of {', '.join(names)}")
              names = [want]
          shards = os.environ["INPUT_SHARDS"].strip() or "1"
          if not shards.isdecimal() or not 1 <= int(shards) <= 10:
              sys.exit(f"shards must be a whole number from 1 to 10, got {shards!r}")
          legs = [{"package": n, "index": i, "shards": int(shards)} for n in names for i in range(int(shards))]
          if len(legs) > 256:
              sys.exit(f"{len(legs)} legs exceed GitHub's 256-per-matrix limit; lower shards or pick a package")
          print("matrix=" + json.dumps({"include": legs}))
          PY

  scan:
    name: scan ${{ matrix.package }} (${{ matrix.index }}/${{ matrix.shards }})
    needs: packages
    runs-on: ubuntu-latest
    # ai-gateway's ~150 versions each carry baked models; 60 min was not
    # enough on the first full run (2026-10-01).
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJson(needs.packages.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install gitleaks v8.30.1 (pinned, checksummed — same as ci.yml)
        run: |
          set -eu
          curl -fsSL -o /tmp/gitleaks.tgz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks

      - name: Scan ${{ matrix.package }} (shard ${{ matrix.index }}/${{ matrix.shards }})
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE: ${{ matrix.package }}
          SHARD: ${{ matrix.index }}/${{ matrix.shards }}
          LEG: ${{ matrix.package }}-${{ matrix.index }}of${{ matrix.shards }}
          DIGESTS: ${{ inputs.digests }}
        run: |
          # pipefail: a leg whose scan raised (a --digests prefix that matches
          # no version, a failed version listing) must be red, not a silent
          # "tee succeeded".
          set -euo pipefail
          python3 scripts/release/scan-ghcr-secrets.py \
            --package "${PACKAGE}" --gitleaks /tmp/gitleaks \
            --shard "${SHARD}" ${DIGESTS:+--digests "${DIGESTS}"} \
            --out "findings-${LEG}.jsonl" | tee "stats-${LEG}.txt"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: findings-${{ matrix.package }}-${{ matrix.index }}of${{ matrix.shards }}
          path: |
            findings-${{ matrix.package }}-${{ matrix.index }}of${{ matrix.shards }}.jsonl
            stats-${{ matrix.package }}-${{ matrix.index }}of${{ matrix.shards }}.txt
          retention-days: 14

  summary:
    needs: scan
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: findings-*
          merge-multiple: true
      - name: Summarize (redacted)
        run: |
          set -eu
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import collections, glob, json
          rows = [json.loads(l) for f in glob.glob("findings-*.jsonl") for l in open(f) if l.strip()]
          stats = [json.loads(l) for f in glob.glob("stats-*.txt") for l in open(f) if l.startswith("{")]
          print("## GHCR secret scan (WARP-3423)\n")
          print(f"packages scanned: {len({s['package'] for s in stats})}; shard jobs: {len(stats)}; "
                f"versions: {sum(s['versions'] for s in stats)}; "
                f"images: {sum(s['images'] for s in stats)}; layers: {sum(s['layers'] for s in stats)}; "
                f"scan errors: {sum(s['errors'] for s in stats)}; findings: {len(rows)}\n")
          by = collections.Counter((r["class"], r["rule"]) for r in rows)
          print("| class | rule | count |\n|---|---|---|")
          for (c, rule), n in sorted(by.items(), key=lambda x: (-x[1], x[0])):
              print(f"| {c} | {rule} | {n} |")
          app = [r for r in rows if r["class"] != "vendor"]
          print(f"\n### Non-vendor findings ({len(app)})\n")
          seen = set()
          for r in sorted(app, key=lambda r: (r["package"], r["file"], r["rule"])):
              k = (r["package"], r["where"].split(':')[0], r["file"], r["rule"], r["line"])
              if k in seen:
                  continue
              seen.add(k)
              print(f"- `{r['package']}` {r['where']} `{r['file']}`:{r['line']} {r['rule']} ({r['match']})")
          PY
