name: ghcr-secret-scan

# WARP-3423 — secret-scan every published version of every first-party GHCR
# package (scripts/release/services.json), layer by layer.
#
# Why it exists: OTA images must be anonymously pullable (ADR-045 forbids a
# GitHub token on an appliance, and GHCR accepts no short-lived token), so the
# packages go public. Public is irreversible per package and exposes EVERY
# version it holds, so before the flip — and on demand afterwards — every
# version's config, layers, signatures and attestations are scanned, not just
# the newest. Escape class it closes: a credential baked into any historical
# layer becoming world-readable the moment a package goes public.
#
# Cost: one job per package (25), a few minutes each; dispatch-only, never on
# PRs. The push trigger is the bootstrap path (workflow_dispatch needs the
# file on the default branch) and fires only for this branch.
#
# Logs and artifacts of a public repo are public: findings are --redact'ed.

on:
  workflow_dispatch:
  push:
    branches: [ci/warp-3423-ghcr-secret-scan]

permissions:
  contents: read
  packages: read

concurrency:
  group: ghcr-secret-scan
  cancel-in-progress: false

jobs:
  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      names: ${{ steps.list.outputs.names }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: list
        run: |
          set -eu
          names=$(python3 -c 'import json; print(json.dumps(["droplet-"+s["name"] for s in json.load(open("scripts/release/services.json"))["services"]]))')
          echo "names=${names}" >> "$GITHUB_OUTPUT"
          echo "${names}"

  scan:
    needs: packages
    runs-on: ubuntu-latest
    # ai-gateway's ~150 versions each carry baked models; 60 min was not
    # enough on the first full run (2026-10-01).
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        package: ${{ fromJson(needs.packages.outputs.names) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install gitleaks v8.30.1 (pinned, checksummed — same as ci.yml)
        run: |
          set -eu
          curl -fsSL -o /tmp/gitleaks.tgz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks

      - name: Scan every version of ${{ matrix.package }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          python3 scripts/release/scan-ghcr-secrets.py \
            --package "${{ matrix.package }}" --gitleaks /tmp/gitleaks \
            --out "findings-${{ matrix.package }}.jsonl" | tee "stats-${{ matrix.package }}.txt"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: findings-${{ matrix.package }}
          path: |
            findings-${{ matrix.package }}.jsonl
            stats-${{ matrix.package }}.txt
          retention-days: 14

  summary:
    needs: scan
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: findings-*
          merge-multiple: true
      - name: Summarize (redacted)
        run: |
          set -eu
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import collections, glob, json
          rows = [json.loads(l) for f in glob.glob("findings-*.jsonl") for l in open(f) if l.strip()]
          stats = [json.loads(l) for f in glob.glob("stats-*.txt") for l in open(f) if l.startswith("{")]
          print("## GHCR secret scan (WARP-3423)\n")
          print(f"packages scanned: {len(stats)}; versions: {sum(s['versions'] for s in stats)}; "
                f"images: {sum(s['images'] for s in stats)}; layers: {sum(s['layers'] for s in stats)}; "
                f"scan errors: {sum(s['errors'] for s in stats)}; findings: {len(rows)}\n")
          by = collections.Counter((r["class"], r["rule"]) for r in rows)
          print("| class | rule | count |\n|---|---|---|")
          for (c, rule), n in sorted(by.items(), key=lambda x: (-x[1], x[0])):
              print(f"| {c} | {rule} | {n} |")
          app = [r for r in rows if r["class"] != "vendor"]
          print(f"\n### Non-vendor findings ({len(app)})\n")
          seen = set()
          for r in sorted(app, key=lambda r: (r["package"], r["file"], r["rule"])):
              k = (r["package"], r["where"].split(':')[0], r["file"], r["rule"], r["line"])
              if k in seen:
                  continue
              seen.add(k)
              print(f"- `{r['package']}` {r['where']} `{r['file']}`:{r['line']} {r['rule']} ({r['match']})")
          PY
