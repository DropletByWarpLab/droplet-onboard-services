name: hadolint

# WARP-243 — PR-blocking Dockerfile lint over every tracked Dockerfile
# (20 at time of writing — the git ls-files glob keeps the list live, so a
# new service's Dockerfile is gated automatically). Runs unfiltered on
# every PR so it can be a required check (WARP-968/969); the job is ~15 s.
# Baseline rationale lives in .hadolint.yaml.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hadolint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hadolint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install hadolint v2.14.0 (pinned, checksummed)
        run: |
          set -eu
          curl -fsSL -o /tmp/hadolint \
            https://github.com/hadolint/hadolint/releases/download/v2.14.0/hadolint-linux-x86_64
          echo "6bf226944684f56c84dd014e8b979d27425c0148f61b3bd99bcc6f39e9dc5a47  /tmp/hadolint" | sha256sum -c -
          chmod +x /tmp/hadolint

      - name: Lint all tracked Dockerfiles
        run: |
          set -eu
          mapfile -t files < <(git ls-files '*Dockerfile*')
          echo "Linting ${#files[@]} Dockerfiles"
          /tmp/hadolint --config .hadolint.yaml --failure-threshold warning "${files[@]}"
