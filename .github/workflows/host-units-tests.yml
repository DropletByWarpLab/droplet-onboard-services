name: host-units-tests

# WARP-1829 — host units run their source out of the git working tree, and the
# box's refresh restarts containers only. Pure shell tests drive the detector +
# refresher against a PATH-stubbed systemctl and a fixture tree with controlled
# mtimes (no root, no systemd, no box), plus a shellcheck pass over the script.
#
# WARP-2575 — droplet-host-net.service joins the same job rather than getting a
# workflow of its own: it is the same class of artefact (a host unit installed
# by single-box.sh), and a second workflow would be a second check name that
# only some PRs report, which is how a required check becomes a merge deadlock
# in this repo. The job name `host-units` is a branch-protection contract —
# extend the steps, never rename the job.

on:
  pull_request:
    paths:
      - "scripts/host/droplet-host-units.sh"
      - "scripts/host/etc-systemd-system/droplet-host-units.service"
      - "scripts/host/etc-systemd-system/droplet-host-net.service"
      - "scripts/lib/single-box.sh"
      - "scripts/setup.sh"
      - "tests/droplet-host-units.test.sh"
      - "tests/droplet-host-net-unit.test.sh"
      - ".github/workflows/host-units-tests.yml"
  push:
    branches: [main]
    paths:
      - "scripts/host/droplet-host-units.sh"
      - "scripts/host/etc-systemd-system/droplet-host-units.service"
      - "scripts/host/etc-systemd-system/droplet-host-net.service"
      - "scripts/lib/single-box.sh"
      - "scripts/setup.sh"
      - "tests/droplet-host-units.test.sh"
      - "tests/droplet-host-net-unit.test.sh"
      - ".github/workflows/host-units-tests.yml"
  workflow_dispatch:

concurrency:
  group: host-units-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-units:
    runs-on: ubuntu-latest
    # Everything is local stubs + tmpdirs; a hung test must fail fast.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck the host-unit refresher
        # warning severity to match ship-check's bar; no global excludes —
        # waivers live inline per scripts/test/ship-check.sh convention.
        run: shellcheck --severity=warning scripts/host/droplet-host-units.sh
      - name: Validate the on-demand unit file
        # systemd-analyze verify parses the unit exactly the way systemd will,
        # so a bad directive fails here instead of on a box. Two outputs are
        # expected and only those two: the ExecStart binary is installed by
        # setup.sh and never exists on a runner, and the "Proceeding anyway"
        # permission advisories fire on filesystems that do not carry POSIX
        # modes. ANY other line fails the job — a filter wide enough to hide a
        # real error would make this step decorative.
        run: |
          out="$(systemd-analyze verify \
            scripts/host/etc-systemd-system/droplet-host-units.service 2>&1 || true)"
          printf '%s\n' "$out"
          unexpected="$(printf '%s\n' "$out" \
            | grep -v 'is not executable: No such file or directory' \
            | grep -v 'Proceeding anyway' \
            | grep -v '^$' || true)"
          if [ -n "$unexpected" ]; then
            echo "::error::systemd-analyze verify reported a unit-file problem:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
      - name: Run droplet-host-units shell tests
        run: bash tests/droplet-host-units.test.sh
      - name: Validate the host-net unit file
        # WARP-2575: same parse gate, same two-line allowlist, applied to the
        # unit that carries the br-lan condition. `systemd-analyze verify`
        # does NOT evaluate ConditionPathExists — it only parses — so this is
        # green on a runner that has no br-lan, which is the point: it catches
        # a malformed directive, and tests/droplet-host-net-unit.test.sh below
        # catches a directive that parses but no longer bounds the restarts.
        run: |
          out="$(systemd-analyze verify \
            scripts/host/etc-systemd-system/droplet-host-net.service 2>&1 || true)"
          printf '%s\n' "$out"
          unexpected="$(printf '%s\n' "$out" \
            | grep -v 'is not executable: No such file or directory' \
            | grep -v 'Proceeding anyway' \
            | grep -v '^$' || true)"
          if [ -n "$unexpected" ]; then
            echo "::error::systemd-analyze verify reported a unit-file problem:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
      - name: Run droplet-host-net unit-invariant tests
        run: bash tests/droplet-host-net-unit.test.sh
