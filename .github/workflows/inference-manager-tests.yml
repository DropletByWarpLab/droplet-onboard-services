name: inference-manager-tests

# Pytest for services/inference-manager — the vendored model-catalog sidecar
# (WARP-2131). Path-filtered.

on:
  # PR-time coverage for this suite is owned by ci.yml's path-aware
  # `inference-manager` leg, same as every other python service here.
  # Push-to-main stays as an independent post-merge canary and to satisfy
  # scripts/check-ci-coverage.sh.
  push:
    branches: [main]
    paths:
      - "services/inference-manager/**"
      - ".github/workflows/inference-manager-tests.yml"
  workflow_dispatch:

concurrency:
  group: inference-manager-tests-${{ github.ref }}
  cancel-in-progress: true

# WARP-3677: least privilege. Every job here only checks out the repo and
# runs tests (no step uses the token for anything else), so read is all the
# GITHUB_TOKEN needs. Stated explicitly so a new job cannot inherit a wider
# repository default by omission.
permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    # Safety net: a hung async test must fail the job fast rather than burn a
    # 6h default runner allocation.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/inference-manager
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/inference-manager/requirements-dev.lock

      - name: Install dependencies
        # The hash-pinned lock, not the loose .txt — this is a VENDORED tree
        # and its dependency set should be reproducible against the upstream it
        # was copied from. See services/inference-manager/VENDORED.md.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.lock

      - name: Run pytest
        run: pytest -v
