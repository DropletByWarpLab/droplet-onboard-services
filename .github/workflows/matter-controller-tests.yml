name: matter-controller-tests

# Vitest + tsc for services/matter-controller (WARP-850 host-network
# Matter sidecar). Path-filtered so unrelated PRs don't pay for it.
#
# Live pull_request/push triggers (unlike the dispatch-only siblings,
# parked when Actions minutes ran out): this suite is ~7s with no
# hardware or native-module dependency — every BLE/matter.js seam is
# injected — and the #586 code review flagged that the service would
# otherwise ship with its 40 tests never running in CI.

on:
  pull_request:
    paths:
      - "services/matter-controller/**"
      - "packages/fips-selftest/**"
      - ".github/workflows/matter-controller-tests.yml"
  push:
    branches: [main]
    paths:
      - "services/matter-controller/**"
      - "packages/fips-selftest/**"
      - ".github/workflows/matter-controller-tests.yml"
  workflow_dispatch:

concurrency:
  group: matter-controller-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies (npm workspaces, root install)
        run: npm ci

      - name: Build @droplet/fips-selftest
        run: npm run -w @droplet/fips-selftest build

      - name: Type-check @droplet/matter-controller
        run: npm run -w @droplet/matter-controller build

      - name: Run @droplet/matter-controller vitest
        run: npm run -w @droplet/matter-controller test
