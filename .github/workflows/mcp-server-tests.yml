name: mcp-server-tests

# Vitest for packages/tools-core + services/mcp-server. Path-filtered so a
# pure orchestrator or dashboard PR doesn't pay for these tests.
#
# Note: stdio-roundtrip.test.ts spawns the built mcp-server as a child
# process — the workspace must be built before tests run.

on:
  # PR-time coverage for this suite is owned by ci.yml's path-aware
  # `tools-core-mcp-server` leg (CI budget optimization, 2026-07): the pull_request
  # trigger here was retired as an exact duplicate of that leg.
  # Push-to-main stays as an independent post-merge canary and to
  # satisfy scripts/check-ci-coverage.sh.
  push:
    branches: [main]
    paths:
      - "packages/tools-core/**"
      - "packages/fips-selftest/**"
      - "services/mcp-server/**"
      - "apps/orchestrator/prisma/schema.prisma"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/mcp-server-tests.yml"
  workflow_dispatch:

concurrency:
  group: mcp-server-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vitest:
    runs-on: ubuntu-latest
    # A hung test must fail the job fast, not burn the 6h default runner
    # allocation. npm ci + workspace TS builds + vitest, no Docker — 15 min.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies (npm workspaces, root install)
        run: npm ci

      # mcp-server's PrismaClient instantiation needs the generated client
      # (orchestrator's schema is the canonical one; both packages share
      # node_modules/@prisma/client + node_modules/.prisma/client).
      - name: Generate Prisma client
        run: npm run -w @droplet/orchestrator db:generate

      - name: Build @droplet/fips-selftest
        run: npm run -w @droplet/fips-selftest build

      # WARP-1874: tools-core imports @droplet/shared-types. Its package.json
      # points `types` at ./src/index.ts (so a typecheck resolves from source)
      # but `exports["."].require` at ./dist/index.js — so tools-core's emitted
      # output needs the built dist. Must run before the tools-core build.
      - name: Build @droplet/shared-types
        run: npm run -w @droplet/shared-types build

      - name: Build @droplet/tools-core
        run: npm run -w @droplet/tools-core build

      - name: Build @droplet/mcp-server
        run: npm run -w @droplet/mcp-server build

      - name: Run @droplet/tools-core vitest
        run: npm run -w @droplet/tools-core test

      - name: Run @droplet/mcp-server vitest
        run: npm run -w @droplet/mcp-server test
