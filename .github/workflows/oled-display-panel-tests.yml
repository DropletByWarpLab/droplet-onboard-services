name: oled-display-panel-tests

# WARP-1640 — the rack panel's pure-software half.
#
# services/oled-display is listed in .github/ci-coverage-exempt as
# "hardware-only", and its pytest suite consequently runs in NO workflow. That
# was defensible while every backend needed a physical PyPortal on USB. It is
# not defensible for the framebuffer panel: fb.py's stride/pixel-order handling
# and the display.py data-gate wiring are ordinary software with ordinary bugs,
# and the specific bug they guard against (the panel rendering CPU 0% / MEM 0%
# / DISK 0% forever because the periodic data pumps were gated on the PyPortal
# backend) is invisible in review and only shows up on the hardware.
#
# WARP-1641 WIDENS THIS TO THE WHOLE SUITE. WARP-1640 deliberately scoped it
# to an explicit file list, on the grounds that the rest of tests/ had never
# run in CI and switching it on blind would ship a gate nobody had verified.
# That caution was based on a bad measurement: a scratch copy of the working
# tree reported 153 failures, which turned out to be an artifact of the copy
# (lost exec bits on the shell scripts the suite drives), not of the tests. A
# clean checkout runs 556 passed / 4 skipped / 0 failed.
#
# So the whole directory runs now. A service this size having zero CI was
# never defensible; it was just unmeasured.
#
# Bring-up of the panel itself (does it light up, is the image sheared, does
# touch land where you tapped) is verified on the box; nothing here needs a
# framebuffer, root, or a display.

on:
  pull_request:
    paths:
      - "services/oled-display/**"
      - "!services/oled-display/pyportal/**"
      - ".github/workflows/oled-display-panel-tests.yml"
  push:
    branches: [main]
    paths:
      - "services/oled-display/**"
      - "!services/oled-display/pyportal/**"
      - ".github/workflows/oled-display-panel-tests.yml"
  workflow_dispatch:

concurrency:
  group: oled-display-panel-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  panel-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/oled-display
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/oled-display/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # tzdata: display.py resolves ZoneInfo("America/Los_Angeles") at
          # import. pyserial is already in requirements.txt.
          pip install pytest tzdata
      - name: Run the oled-display suite
        run: pytest -v tests/
