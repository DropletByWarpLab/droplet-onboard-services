name: openwrt-attach-tests

# Host-side single-box AP bring-up tooling: droplet-openwrt-attach (moves the
# Wi-Fi phy into the openwrt container + wires hostapd/dnsmasq/fw4),
# droplet-wifi-watchdog (revives a silently-wedged radio) and
# droplet-openwrt-watch (re-applies the attach when the container restarts —
# WARP-2064). These pure shell units ran against fake sysfs + stubs (no
# root/PCI/Docker) — fast, but until now NOTHING in CI executed them, which is
# how a quote-break regression in the attach body (AP comes up with no
# forwarding) and a watchdog false-wedge on the container phy both shipped
# unnoticed.
on:
  pull_request:
    paths:
      - "scripts/host/usr-local-sbin/droplet-openwrt-attach"
      - "scripts/host/usr-local-sbin/droplet-wifi-watchdog"
      # WARP-843: every file the path-unit re-apply wiring spans — the static
      # guard (tests/openwrt-attach-path-unit.test.sh) pins invariants across
      # all of them, so an edit to any one must re-run it.
      - "scripts/host/etc-systemd-system/droplet-openwrt-attach.path"
      - "scripts/host/etc-systemd-system/droplet-openwrt-attach-reapply.service"
      - "scripts/host/etc-systemd-system/droplet-openwrt-attach.service"
      # WARP-2064: the container-lifecycle watcher. The path-unit suite pins
      # its unit/installer wiring AND the nft heal-syntax agreement between
      # droplet-openwrt-watch and droplet-openwrt-attach, so an edit touching
      # only the watcher files must still re-run the suite.
      - "scripts/host/usr-local-sbin/droplet-openwrt-watch"
      - "scripts/host/etc-systemd-system/droplet-openwrt-watch.service"
      - "scripts/host/droplet-set-hostapd.sh"
      - "scripts/host/droplet-set-guest-wifi.sh"
      - "services/oled-display/droplet-device-bridge.service"
      - "services/oled-display/50-droplet-device-bridge.rules"
      - "scripts/lib/single-box.sh"
      - "scripts/install-device-bridge.sh"
      - "scripts/factory-reset.sh"
      # WARP-1338 review: every file the extended root-EnvironmentFile LPE
      # guard (tests/openwrt-attach-env-invariant.test.sh) now inspects for
      # the /etc/droplet/automount.env wiring — an edit to any of them (e.g.
      # flipping the env file droplet-writable, or pointing a root unit at a
      # new EnvironmentFile) must re-run the WARP-843 invariant.
      - "services/automount/install.sh"
      - "services/automount/droplet-automount@.service"
      - "services/automount/droplet-automount-reconcile.service"
      - "services/oled-display/droplet-storage-pool-apply.service"
      - "tests/openwrt-attach-*.test.sh"
      - "tests/wifi-watchdog.test.sh"
      - ".github/workflows/openwrt-attach-tests.yml"
  push:
    branches: [main]
    paths:
      - "scripts/host/usr-local-sbin/droplet-openwrt-attach"
      - "scripts/host/usr-local-sbin/droplet-wifi-watchdog"
      # WARP-843: see the pull_request paths note above.
      - "scripts/host/etc-systemd-system/droplet-openwrt-attach.path"
      - "scripts/host/etc-systemd-system/droplet-openwrt-attach-reapply.service"
      - "scripts/host/etc-systemd-system/droplet-openwrt-attach.service"
      # WARP-2064: see the pull_request paths note above.
      - "scripts/host/usr-local-sbin/droplet-openwrt-watch"
      - "scripts/host/etc-systemd-system/droplet-openwrt-watch.service"
      - "scripts/host/droplet-set-hostapd.sh"
      - "scripts/host/droplet-set-guest-wifi.sh"
      - "services/oled-display/droplet-device-bridge.service"
      - "services/oled-display/50-droplet-device-bridge.rules"
      - "scripts/lib/single-box.sh"
      - "scripts/install-device-bridge.sh"
      - "scripts/factory-reset.sh"
      # WARP-1338 review: see the pull_request paths note above.
      - "services/automount/install.sh"
      - "services/automount/droplet-automount@.service"
      - "services/automount/droplet-automount-reconcile.service"
      - "services/oled-display/droplet-storage-pool-apply.service"
      - "tests/openwrt-attach-*.test.sh"
      - "tests/wifi-watchdog.test.sh"
      - ".github/workflows/openwrt-attach-tests.yml"
  workflow_dispatch:

concurrency:
  group: openwrt-attach-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  openwrt-attach:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Run host AP bring-up + watchdog shell tests
        run: |
          set -u
          fail=0
          for t in tests/openwrt-attach-*.test.sh tests/wifi-watchdog.test.sh; do
            echo "::group::$t"
            if bash "$t"; then echo "ok: $t"; else echo "FAILED: $t"; fail=1; fi
            echo "::endgroup::"
          done
          exit "$fail"
