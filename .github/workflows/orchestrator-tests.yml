name: orchestrator-tests

# Real-Postgres integration lane for apps/orchestrator (WARP-1026).
#
# The orchestrator UNIT suite (npm ci + Prisma generate + workspace builds +
# tsc --noEmit + vitest) runs in ci.yml's path-aware `orchestrator` leg on
# every PR and main push — its duplicate job here was retired in the 2026-07
# CI budget optimization. What remains is the coverage no ci.yml leg has:
# the pg-gated vitest files against a real service-container Postgres.
#
# Paths are only what the pg lane consumes: the app itself (source,
# migrations, prisma schema) and the root npm workspace manifests. The old
# workspace-dep paths (tools-core, mcp-server, fips-selftest, erp-connector)
# belonged to the retired unit job — the pg lane never builds those dists.

on:
  pull_request:
    paths:
      - "apps/orchestrator/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/orchestrator-tests.yml"
  push:
    branches: [main]
    paths:
      - "apps/orchestrator/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/orchestrator-tests.yml"
  workflow_dispatch:

concurrency:
  group: orchestrator-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # WARP-1026: real-Postgres lane. The unit suite (ci.yml's orchestrator
  # leg) runs with mocked Prisma and structurally cannot catch chain
  # forks — those are READ COMMITTED visibility artifacts. This job applies the full
  # migration set to a service-container Postgres and runs only the
  # pg-gated files (src/**/*.pg.test.ts, self-gated on RUN_PG_INTEGRATION).
  #
  # Image is pgvector/pgvector:pg16, NOT plain postgres:16: the migration
  # set includes 20260412000000_add_file_content_index, which does
  # `CREATE EXTENSION vector`, so `prisma migrate deploy` needs pgvector
  # present (same image tests/migrations.test.sh uses).
  pg-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: droplet_test
          POSTGRES_PASSWORD: droplet_test_pw
          POSTGRES_DB: droplet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U droplet_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://droplet_test:droplet_test_pw@localhost:5432/droplet_test?schema=public
      RUN_PG_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies (npm workspaces, root install)
        run: npm ci

      - name: Generate Prisma client
        run: npm run -w @droplet/orchestrator db:generate

      - name: Apply migrations
        run: npx prisma migrate deploy
        working-directory: apps/orchestrator

      - name: Run pg-gated vitest files
        run: npm run -w @droplet/orchestrator test -- pg.test
