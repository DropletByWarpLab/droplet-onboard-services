name: orchestrator-tests

# Vitest for apps/orchestrator. Path-filtered so dashboard-only or service-only
# PRs don't trigger a Prisma generate + Node install for no reason.
#
# Note: the orchestrator depends on @droplet/tools-core and @droplet/mcp-server
# (workspace packages). The MCP client test (`mcp-client.service.test.ts`)
# spawns `services/mcp-server/dist/index.js` as a child process, so we build
# both workspace packages before running vitest.

on:
  pull_request:
    paths:
      - "apps/orchestrator/**"
      - "packages/tools-core/**"
      - "packages/fips-selftest/**"
      - "services/mcp-server/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/orchestrator-tests.yml"
  push:
    branches: [main]
    paths:
      - "apps/orchestrator/**"
      - "packages/tools-core/**"
      - "packages/fips-selftest/**"
      - "services/mcp-server/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/orchestrator-tests.yml"
  workflow_dispatch:

concurrency:
  group: orchestrator-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vitest:
    runs-on: ubuntu-latest
    # A hung test must fail the job fast, not burn the 6h default runner
    # allocation. npm ci + Prisma generate + workspace builds + vitest, no
    # Docker — 15 min is a generous ceiling for the suite.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies (npm workspaces, root install)
        run: npm ci

      # Vitest imports from @prisma/client; without `prisma generate` the
      # suite crashes with "Cannot find module .prisma/client". The same
      # generated client is reused by services/mcp-server (shared
      # node_modules/.prisma/client).
      - name: Generate Prisma client
        run: npm run -w @droplet/orchestrator db:generate

      # Build the workspace packages the orchestrator depends on. mcp-client
      # tests spawn services/mcp-server/dist/index.js as a child process.
      - name: Build @droplet/fips-selftest
        run: npm run -w @droplet/fips-selftest build

      - name: Build @droplet/tools-core
        run: npm run -w @droplet/tools-core build

      - name: Build @droplet/mcp-server
        run: npm run -w @droplet/mcp-server build

      # WARP-537: the update-agent verify suite execs the REAL cosign
      # binary over golden fixtures (src/services/update-agent/verify.test.ts)
      # — mocked exit codes would prove nothing about cryptographic
      # rejection. Resolution is `cosign` on PATH (or DROPLET_COSIGN_BIN).
      - name: Install cosign (update-agent verify suite)
        uses: sigstore/cosign-installer@v3

      # WARP-1011: vitest transforms via esbuild and never typechecks —
      # mirrors ci.yml's orchestrator leg (this workflow retires when
      # ci-summary becomes the required check, WARP-1007).
      - name: Typecheck (tsc --noEmit)
        run: npm run -w @droplet/orchestrator typecheck

      - name: Run vitest
        run: npm run -w @droplet/orchestrator test
