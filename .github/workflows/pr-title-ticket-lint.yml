name: pr-title-ticket-lint

# Board truth, half 1 — every PR names the ticket it implements.
#
# 20% of this repo's PRs carry no WARP key in their title (323 of 1,591 at
# the 2026-08-15 readout), which is why 513 Done tickets can't be matched
# to code and the board drifts from the repo after every merge wave.
#
# ─── THIS JOB'S NAME IS A BRANCH-PROTECTION CONTRACT ─────────────────────
# `title carries a WARP key` is a required status check on the `Stage
# Protection` ruleset (id 20877684). The ruleset matches the check-run
# NAME, not the job id, so the `name:` below must stay byte-identical to
# that string. Renaming it does not disable the gate — it deadlocks every
# open PR on "Expected — waiting for status to be reported", including the
# rename's own. Retiring it is an ordered dance: add the new name as a
# required context, see both report green, merge the rename, then drop the
# old context. Inventory of every required check and what emits it:
# docs/ci-required-checks.md.
#
# ─── HISTORY (WARP-2171) ─────────────────────────────────────────────────
# Written under WARP-2066 and approved on PR #1614, which was auto-closed
# unmerged on 2026-08-17 when the `stage` branch was deleted (GitHub closes
# every PR whose base ref disappears). The required context had already
# been added to the ruleset in anticipation of that merge, so from
# 2026-08-16 until this file landed the ruleset listed a gate that nothing
# emitted — enforcing nothing for org admins, who bypass, and deadlocking
# anyone else. Restored verbatim; only this header changed.
#
# Half 2 (jira-close-on-merge.yml, transitioning tickets to Done on merge)
# is NOT restored here. It stays with WARP-2066: it is dormant without the
# JIRA_EMAIL / JIRA_API_TOKEN secrets, no ruleset references it, and #1614's
# review left an open finding against its dead-token canary.
#
# Convention this enforces, and that the failure message teaches:
#   - the title carries the key(s) the PR IMPLEMENTS: "WARP-123: …" or
#     "fix(scope): … (WARP-123)"
#   - keys that are merely REFERENCED (a gate, a follow-up, a related
#     ticket) belong in the PR body, never the title — the close-on-merge
#     automation (WARP-2066, not yet landed) closes every key it finds
#     in the title, so a referenced key there would close someone else's
#     ticket
#   - genuinely ticketless maintenance opts out with "[no-ticket]"
#
# Exempt: dependabot (its PRs never map to tickets) and branch-sync /
# promotion PRs whose head is stage or main (their titles describe a
# merge, not a ticket).
#
# Cost: one ~5-second ubuntu job per PR event. No checkout, no actions.

on:
  pull_request:
    # `edited` matters: a title fix must re-run the lint and clear the red X.
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  title-carries-ticket:
    name: title carries a WARP key
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the title
        env:
          # env indirection — a PR title is attacker-controlled input and
          # must never be interpolated into the script text itself.
          TITLE: ${{ github.event.pull_request.title }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -u
          if [ "$AUTHOR" = "dependabot[bot]" ]; then
            echo "dependabot PR — exempt"; exit 0
          fi
          case "$HEAD_REF" in
            stage|main)
              echo "branch sync / promotion PR (head=$HEAD_REF) — exempt"; exit 0 ;;
          esac
          if printf '%s' "$TITLE" | grep -qE 'WARP-[0-9]+'; then
            echo "title carries a WARP key"; exit 0
          fi
          if printf '%s' "$TITLE" | grep -qF '[no-ticket]'; then
            echo "explicitly ticketless via [no-ticket]"; exit 0
          fi
          echo "::error title=PR title needs a WARP key::Add the ticket this PR implements to the title — 'WARP-123: …' or '… (WARP-123)'. Keys that are only referenced belong in the body, not the title (the title is what will close tickets on merge). For genuinely ticketless maintenance, add [no-ticket] to the title."
          exit 1
