name: publish-release

# WARP-536 — CI half of the OTA update system (WARP-534).
#
# On demand (workflow_dispatch from main or stage — see the manual-only
# note below): re-run the must-pass test suites (gate), build
# every appliance app image, push to GHCR tagged by commit sha, capture
# the immutable digests, pack the tracked runtime configs, generate the
# design-schema-v1 release.json, cosign-sign it, and publish everything
# as a GitHub Release. The device-side update agent (WARP-537/538) polls
# Releases, verifies release.json.sig against the baked-in cosign.pub,
# and applies by digest.
#
# ── TWO BRANCHES, TWO CHANNELS (WARP-1670) ──
# The dispatch ref decides the channel — it is never a free-text input,
# so a release can only ever claim the channel of the branch it was
# actually built from:
#
#   refs/heads/stage → channel `stage`  → tag ota-stage-*  → PRERELEASE
#   refs/heads/main  → channel `stable` → tag ota-stable-* → --latest
#
# `--prerelease` on stage is load-bearing, not cosmetic: GitHub's
# /releases/latest endpoint SKIPS prereleases, and that endpoint is what
# stable devices poll. It is the mechanism that keeps a stage build off
# every stable box. Any other ref is refused before a single image is
# built (see the `channel` job).
#
# ── PUBLIC PACKAGES, TOKEN-FREE BOXES (WARP-3429, ADR-045) ──
# A box carries no GitHub token (ADR-045), so it pulls the images and reads
# the releases anonymously: every first-party GHCR package is PUBLIC. Public
# is irreversible per package and exposes every layer, and a package that is
# private by mistake breaks OTA on every box at once. Three additions defend
# that, none of which touches the channel/prerelease rules above:
#
#   1. Pre-push image secret scan — each image is `docker save`d and scanned
#      with the pinned gitleaks (config + every layer) between `docker build`
#      and `docker push`; a non-vendor finding outside the reviewed baseline
#      (scripts/release/image-secret-baseline.txt) fails the publish BEFORE
#      the image reaches the registry.
#   2. (Removed 2026-10-03: the "every package is public" gate. The images
#      stay private; box pulls become device-authenticated, WARP-3423.)
#   3. Signed channel index — once the Release exists, the `index` job signs
#      channel-<channel>.json (the newest tag + the sha256 of its release.json)
#      like release.json and uploads it to the rolling `ota-index` release,
#      whose download URL never changes, so a box finds the newest release
#      with one anonymous GET instead of listing releases through the API.
#      `ota-index` is a prerelease, never `latest`, and its tag does not start
#      with ota-stage-/ota-stable-, so no poller ever mistakes it for a release.
#
# ── PRIVATE IMAGES, R2 REGISTRY MIRROR (WARP-3502, ADR-068) ──
# The images stay private (Romain, 2026-10-03). A box pulls them from the
# fleet HQ read-only registry (a Cloudflare Worker in front of an R2 bucket)
# with a short-lived device token, never from GHCR, and CI is the only writer
# of that bucket. After the images are pushed, keyless-signed and
# self-verified, and before the GitHub Release exists, `mirror-to-r2.py copy`
# copies each image BY DIGEST (manifest, or index plus child manifests, and
# the config and layer blobs) and its cosign `sha256-<hex>.sig` artifact into
#
#   oci/blobs/sha256/<hex>                 oci/manifests/sha256/<hex>
#   oci/tags/<droplet-name>/sha256-<hex>.sig
#
# (manifests carry their media type as Content-Type; the layout is the
# contract the HQ Worker reads). `crane` reads GHCR with the docker login
# above, `aws s3` writes R2's S3 endpoint with an explicit 64MB multipart
# chunk (R2 needs equal-sized parts). Objects already in the bucket are
# skipped, every blob is re-hashed before it is stored, and ANY copy failure
# fails the job before the Release is created, so no release.json can name a
# digest the registry cannot serve. Details: scripts/release/mirror-to-r2.py.
#
# Configuration (Romain creates the bucket and an R2 API token with Object
# Read & Write on that one bucket, then sets these on the repo):
#   secrets    R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET
#   variable   OTA_REGISTRY_HOST — the HQ host, no scheme or path, e.g.
#              droplet-fleet-hq.rjouffret.workers.dev
#
#   R2 secrets absent, OTA_REGISTRY_HOST unset  mirror SKIPPED with a warning
#              annotation and a job-summary line; release.json keeps ghcr.io,
#              so publishing (stage) works before the bucket exists.
#   all four R2 secrets, host unset  the bucket is filled, release.json still
#              names ghcr.io: pre-populate R2, then flip the variable.
#   OTA_REGISTRY_HOST set  the R2 secrets are REQUIRED; a missing one fails the
#              publish. release.json then names <host>/droplet-<name>@sha256:…
#              (same digests, only the host changes, gen-release-manifest.py
#              --registry-host). Some but not all secrets is also a failure.
#
# The decision and a bucket read+write probe run BEFORE the build (the three
# "R2 mirror" steps in `publish`), so a wrong key or a typo costs seconds, not
# a 2 h build. The copy runs last, just before the Release is created.
#
# CI cost of the mirror (estimate, not yet measured; the job summary prints
# the real figure, replace this estimate with it after the first publish):
# about 1 min to install the pinned tools and probe the bucket, plus the copy.
# The copy moves every layer GHCR has that R2 does not. Dedupe is weaker than
# "most blobs already there": `docker build --pull` runs with no layer cache,
# so every layer an app image adds is rebuilt with new timestamps and a new
# digest each publish; only the unchanged base-image layers repeat. Assume
# 10-25 GB of compressed layers for ~25 images, read once from GHCR and
# written once to R2 at ~80 MB/s, sequentially: about 5-15 min per publish,
# roughly +4-12% on a ~2 h publish, ~$0.04-0.12 at $0.008/min. Publishing is
# manual dispatch only, so even 20 publishes a month add under 300 min,
# far below the 2k min/month callout line in docs/ci-cost-budget.md. The
# 180-minute job cap still has room.
#
# ── FAILS UNTIL THE KEY CEREMONY RUNS ──
# The sign step requires the COSIGN_PRIVATE_KEY + COSIGN_PASSWORD repo
# secrets, which are provisioned ONLY by the human key ceremony
# (scripts/README.md, "OTA release signing — key ceremony"). Until then
# every run of this workflow fails at "Sign release manifest". That is
# the intended fail-closed posture — do not stub the signature.
#
# ── MANUAL-ONLY UNTIL THE KEY CEREMONY (CI budget optimization, 2026-07) ──
# This workflow used to run on every push to main. Because the signing
# secrets don't exist yet, every run burned the full gate + a no-cache
# 13-image build/push/sign/SBOM pipeline (~2 runner-hours) and then failed
# at "Sign release manifest" — ~400 doomed runs in the 30 days before this
# change, against a $100/month Actions budget. Until the key ceremony
# provisions COSIGN_PRIVATE_KEY/COSIGN_PASSWORD, publishing is dispatch-only:
# run it from main or stage once the sha you want to ship is green on
# ci-summary.
# When re-enabling a per-merge (or tag-triggered) flow after the ceremony,
# also drop the inline gate jobs in favor of the ci.yml full-matrix push run
# (the WARP-536 follow-up) — they re-prove what ci-summary already proved
# for the same sha.

on:
  workflow_dispatch:

# One release at a time PER CHANNEL, never cancelled mid-publish: a
# cancelled run could leave images pushed but no signed manifest, or a
# half-uploaded Release. Queued runs each publish their own sha in order.
# Keyed by ref so a ~2h stage build can never queue a stable hotfix
# behind it — the two channels are independent publishers.
concurrency:
  group: publish-release-${{ github.ref }}
  cancel-in-progress: false

# WARP-3677: read-only by default. The write, packages and id-token scopes are
# granted to the one job that uses them (`publish`, below) instead of to the
# `channel` and gate jobs, which only resolve the ref and run tests.
permissions:
  contents: read

jobs:
  # WARP-1670 — resolve the channel from the dispatch ref and refuse
  # anything that is not a release branch. This runs FIRST and gates the
  # gate jobs themselves: a dispatch from a feature branch must cost zero
  # runner-minutes, not fail two hours later at `gh release create`.
  #
  # The channel is derived, never an input. That is the whole safety
  # property: a release cannot claim a channel its branch didn't earn,
  # and the device-side trust regexp (docker/ota/apply-update.sh) only
  # accepts workflow identities from these same two refs.
  channel:
    name: resolve channel
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      channel: ${{ steps.resolve.outputs.channel }}
      # `gh release create` flags: --latest for stable, --prerelease for
      # stage. Passed as a string the publish job expands unquoted.
      release_flags: ${{ steps.resolve.outputs.release_flags }}
    steps:
      - name: Resolve release channel from the dispatch ref
        id: resolve
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          case "$REF" in
            refs/heads/main)
              channel=stable
              flags="--latest"
              ;;
            refs/heads/stage)
              channel=stage
              # --latest=false is explicit rather than implied: GitHub
              # would otherwise promote this release to `latest` when it
              # happens to be the newest, which is exactly what stable
              # boxes poll.
              flags="--prerelease --latest=false"
              ;;
            *)
              echo "::error::publish-release may only be dispatched from refs/heads/main (stable) or refs/heads/stage (stage); got ${REF}"
              exit 1
              ;;
          esac
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"
          echo "release_flags=${flags}" >> "$GITHUB_OUTPUT"
          echo "publishing channel=${channel} from ${REF}" >> "$GITHUB_STEP_SUMMARY"

  gate-node:
    name: gate / node suites
    needs: channel
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # WARP-3665 — dependency vulnerability gate on the release path. Closes
      # the class "a known-vulnerable pinned dependency ships over the air
      # with every unit suite green": this workflow ran tests and a secret
      # scan but no vulnerability scan, so only the (non-required)
      # docker-build Trivy job ever looked. Same scan, same inputs as the
      # PR-time step in ci.yml's `gitleaks` job: Trivy over every lockfile and
      # requirements file, against the DB snapshot pinned in
      # .github/trivy-db-version, with .trivyignore as the reviewed baseline.
      # It fails on a fixable HIGH/CRITICAL that is NOT in the baseline (or
      # whose baseline entry has expired), so a dispatch on a tree with a new
      # finding stops here, before `publish` builds, pushes or signs anything.
      # The pinned DB keeps the verdict reproducible for a given commit.
      - name: Validate vulnerability exceptions and database freshness
        run: bash scripts/check-vuln-exceptions.sh

      - name: Read pinned Trivy DB digest
        id: trivydb
        run: echo "ref=$(grep -v '^#' .github/trivy-db-version | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Trivy dependency scan (block new HIGH/CRITICAL before publish)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db@${{ steps.trivydb.outputs.ref }}
          TRIVY_SKIP_VERSION_CHECK: "true"
          # Match the PR gate: hash locks contain the shipped Python resolution.
          TRIVY_FILE_PATTERNS: 'pip:requirements[^/]*\.lock$'
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
          skip-dirs: node_modules,.git

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies (npm workspaces, root install)
        run: npm ci

      - name: Generate Prisma client
        run: npm run -w @droplet/orchestrator db:generate

      - name: Build @droplet/fips-selftest
        run: npm run -w @droplet/fips-selftest build

      # WARP-1874: tools-core imports @droplet/shared-types, and its emitted
      # require() resolves `exports["."].require` at ./dist/index.js. Without
      # this the released artifact ships a tools-core that cannot load its own
      # dependency at run time — a green build and a broken release.
      - name: Build @droplet/shared-types
        run: npm run -w @droplet/shared-types build

      - name: Build @droplet/tools-core
        run: npm run -w @droplet/tools-core build

      - name: Build @droplet/mcp-server
        run: npm run -w @droplet/mcp-server build

      # WARP-1137: erp.service imports @droplet/erp-connector; its types
      # resolve from dist/, so build before the orchestrator suite runs
      # (mirrors orchestrator-tests.yml — this job was crashing on
      # unresolved @droplet/erp-connector imports without this step,
      # WARP-1249).
      - name: Build @droplet/erp-connector
        run: npm run -w @droplet/erp-connector build

      - name: Test @droplet/tools-core
        run: npm run -w @droplet/tools-core test

      - name: Test @droplet/mcp-server
        run: npm run -w @droplet/mcp-server test

      # WARP-537's update-agent verify suite (once merged) execs the real
      # cosign binary over golden fixtures — mirror orchestrator-tests.yml.
      # Harmless before that suite lands; required after.
      - name: Install cosign (update-agent verify suite)
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.1 # OTA consumers require the cosign v2 signature format.

      - name: Test @droplet/orchestrator
        run: npm run -w @droplet/orchestrator test

      # matter-controller ships in release.json (scripts/release/
      # services.json), so its suite gates publishing like every other
      # released image — mirrors matter-controller-tests.yml.
      - name: Type-check @droplet/matter-controller
        run: npm run -w @droplet/matter-controller build

      - name: Test @droplet/matter-controller
        run: npm run -w @droplet/matter-controller test

      - name: Lint dashboard class names
        run: bash scripts/check-dashboard-classes.sh

      - name: Test @droplet/web-dashboard
        run: npm run -w @droplet/web-dashboard test

  gate-python:
    name: gate / ${{ matrix.service }} pytest
    needs: channel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: ai-gateway
          - service: routing
          - service: switch
          - service: camera-discovery
          # WARP-970 coverage gate — keeps this list an exact mirror of
          # ci.yml's python matrix; same requirements-dev.txt + bare-pytest
          # shape as the legs above, no sysdeps.
          - service: email-indexer
          - service: ops-console
          - service: fleet-agent
          - service: file-indexer
            # libpq for psycopg build, ffmpeg + libmagic for content sniffing
            # (mirrors file-indexer-tests.yml)
            sysdeps: libpq-dev ffmpeg libmagic1
          - service: voice-io
            # portaudio/alsa import-time deps (mirrors voice-io-tests.yml)
            sysdeps: libportaudio2 alsa-utils
          - service: qwen-stt
          - service: kokoro-tts
          - service: device-identity-svc
            # tpm2-pytss builds against tss2-esapi headers
            # (mirrors device-identity-svc-tests.yml)
            sysdeps: libtss2-dev pkg-config
            reqs: requirements.txt
            extra_pip: pytest
            needs_pythonpath: "1"
          - service: inference-manager
            # Lock file, not requirements-dev.txt — mirrors ci.yml's detect
            # plan and inference-manager-tests.yml.
            reqs: requirements-dev.lock
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install system deps
        if: matrix.sysdeps != ''
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ matrix.sysdeps }}

      # WARP-1025: fleet-agent's release_verify/update_poll suites exec the
      # REAL cosign binary over the WARP-537 golden fixtures (mirrors
      # ci.yml's python matrix and fleet-agent-tests.yml).
      - name: Install cosign (fleet-agent release_verify suite)
        if: matrix.service == 'fleet-agent'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.1 # OTA consumers require the cosign v2 signature format.

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ${{ matrix.reqs || 'requirements-dev.txt' }}
          if [ -n "${{ matrix.extra_pip }}" ]; then pip install ${{ matrix.extra_pip }}; fi

      - name: Run pytest
        env:
          PYTHONPATH: ${{ matrix.needs_pythonpath == '1' && format('{0}/services/{1}', github.workspace, matrix.service) || '' }}
        run: pytest -v

  publish:
    name: build, push, sign, release
    runs-on: ubuntu-latest
    # WARP-3429: 120 -> 180. The pre-push secret scan adds a `docker save`
    # plus a per-layer gitleaks pass to every released image; the time that
    # needs is not measured yet, so the cap moves rather than failing a
    # publish late, after most of the images are already pushed. A cap, not
    # spend: runner-minutes are only billed when they are used.
    timeout-minutes: 180
    needs: [channel, gate-node, gate-python]
    # WARP-3565 (workflow half). Names the protected environment that is meant
    # to hold the signing secrets behind a required reviewer. Safe to merge at
    # any time, but it protects NOTHING until the repository owner finishes the
    # settings runbook (shared_brain operations/runbooks/github-org-hardening.md,
    # Step 6): GitHub creates a referenced environment that does not exist
    # UNPROTECTED on the first run, and COSIGN_PRIVATE_KEY / COSIGN_PASSWORD
    # stay repository-level secrets, readable by every job, until the owner
    # creates `release` with a required reviewer and moves them in. The `index`
    # job below also reads those two secrets: give it the same environment (or
    # keep the repository-level copies) before removing them.
    environment: release
    # WARP-3677: the scopes the top-level block no longer grants. contents:
    # write for `gh release create`; packages: write for the GHCR push;
    # id-token: write for keyless cosign signing of the pushed images.
    permissions:
      contents: write
      packages: write
      id-token: write
    outputs:
      # The release tag, for the `index` job — computed once, in the step
      # that creates the Release, so the pointer can never name another tag.
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The manifest generator has its own unit suite (schema shape +
      # loud-failure paths). A release must never publish from an
      # untested generator. WARP-3001: the same suite carries the
      # compose <-> services.json drift gate, so a release also refuses
      # to publish while a compose-built service is missing from the list.
      # WARP-3429: it also covers the pre-push secret scan and the channel
      # pointer generator, so neither can ship broken.
      - name: Test release manifest generator
        run: |
          python3 -m pip install --upgrade pip pytest pyyaml
          python3 -m pytest scripts/release/ -q

      # WARP-3120 — the client installers this release carries (today the
      # Droplet for Mac DMG), pinned in the tracked
      # data/app-downloads/clients.lock.json. Runs BEFORE the image builds so
      # a bad lock or a missing token fails in seconds, not after two hours.
      # The token is DROPLET_CLIENT_APPS_TOKEN, a fine-grained PAT with
      # contents:read on DropletAgent only (GITHUB_TOKEN cannot read another
      # private repo). An empty lock needs no token and only warns, so
      # releases keep publishing before the secret exists; a lock that pins
      # an entry fails closed without it, and on any size/sha256 mismatch.
      # Escape class closed: a Mac build reaching boxes only by hand (and
      # vanishing on reimage). One download per publish: no spend change.
      - name: Fetch client apps
        env:
          GH_TOKEN: ${{ secrets.DROPLET_CLIENT_APPS_TOKEN }}
        run: |
          python3 scripts/release/fetch-client-apps.py \
            --lock data/app-downloads/clients.lock.json \
            --out-dir dist/clients

      # ubuntu-latest has ~14GB free. Building every appliance image
      # fills that before BuildKit finishes (same fix as docker-build.yml
      # / setup-e2e.yml). Strip the preinstalled toolchains we don't use
      # to reclaim ~25GB.
      - name: Free disk space
        run: |
          set -eux
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/powershell \
            /usr/local/share/chromium \
            /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY/Ruby" \
            "$AGENT_TOOLSDIRECTORY/PyPy" \
            || true
          sudo apt-get clean
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # WARP-244 — cosign is needed both for the keyless image signing right
      # after push (below) and the key-based release.json signing later, so
      # install it once here, immediately after GHCR login.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.1 # OTA consumers require the cosign v2 signature format.

      # WARP-3429 — the pinned gitleaks the pre-push image scan below runs.
      # Same release and sha256 as ci.yml's `gitleaks` leg and
      # ghcr-secret-scan.yml, so one version decides "is this a secret" for
      # the repo, the registry history and every image about to be pushed.
      - name: Install gitleaks v8.30.1 (pinned, checksummed — same as ci.yml)
        run: |
          set -eu
          curl -fsSL -o /tmp/gitleaks.tgz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks

      # WARP-3502 — R2 registry mirror, part 1 of 4 (see the header). Decide
      # NOW, before the ~2 h build, whether this publish mirrors to R2: skip
      # with a warning when no R2 secret exists yet (publishing keeps working
      # before the bucket does), refuse when OTA_REGISTRY_HOST is set but a
      # secret is missing (release.json would name a registry nothing was
      # copied to), refuse a half-configured set. Escape class closed: a
      # release whose images boxes cannot pull, found only after two hours.
      # Python stdlib only; a few seconds.
      - name: R2 mirror — decide (skip, run or refuse)
        id: r2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          OTA_REGISTRY_HOST: ${{ vars.OTA_REGISTRY_HOST }}
        run: python3 scripts/release/mirror-to-r2.py decide

      # Part 2 of 4. crane (go-containerregistry) reads GHCR; the aws CLI v2
      # writes R2's S3 endpoint. Both pinned by version + sha256, same posture
      # as gitleaks and syft here. The aws pin replaces the runner image's
      # preinstalled copy (its version moves with the image), and the grep
      # fails the step if the pinned one is not the one on PATH. The aws zip
      # checksum was computed from the awscli.amazonaws.com download when
      # 2.37.0 was pinned (AWS publishes no checksum file for it).
      - name: R2 mirror — install crane + aws cli (pinned, checksummed)
        if: steps.r2.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          curl --fail -sSL -o /tmp/crane.tgz \
            https://github.com/google/go-containerregistry/releases/download/v0.22.1/go-containerregistry_Linux_x86_64.tar.gz
          echo "0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0  /tmp/crane.tgz" | sha256sum -c -
          sudo tar -C /usr/local/bin -xzf /tmp/crane.tgz crane
          crane version
          curl --fail -sSL -o /tmp/awscliv2.zip \
            https://awscli.amazonaws.com/awscli-exe-linux-x86_64-2.37.0.zip
          echo "842b0b9380a717eea99c94ed788af6addb926f4f14a225e7926f9207d2f35203  /tmp/awscliv2.zip" | sha256sum -c -
          unzip -q /tmp/awscliv2.zip -d /tmp
          sudo /tmp/aws/install --update
          aws --version | grep -F "aws-cli/2.37.0 " \
            || { echo "::error::the pinned aws cli 2.37.0 is not the one on PATH"; exit 1; }

      # Part 3 of 4. List the bucket and write one probe object so a wrong
      # account id, a typo'd bucket or a read-only API token fails here in
      # seconds instead of after the build (the copy needs write access).
      - name: R2 mirror — check bucket credentials
        if: steps.r2.outputs.enabled == 'true'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python3 scripts/release/mirror-to-r2.py check --scratch "${RUNNER_TEMP}/r2"

      # Build + push every service in scripts/release/services.json
      # (canonical list — the generator refuses to publish if this loop
      # and the list ever drift). Tag = full commit sha; the manifest
      # pins the pushed DIGEST, which is what devices actually pull.
      - name: Build and push app images
        run: |
          set -euo pipefail
          owner_lc="${GITHUB_REPOSITORY_OWNER,,}"
          registry="ghcr.io/${owner_lc}"
          mkdir -p dist
          python3 - <<'PY' > dist/services.list
          import json
          for s in json.load(open("scripts/release/services.json"))["services"]:
              print(s["name"], s["context"], s["dockerfile"])
          PY
          : > dist/digests.txt
          while read -r name ctx dockerfile; do
            image="${registry}/droplet-${name}"
            echo "::group::build+push ${name}"
            # compose semantics: dockerfile path is relative to its context
            docker build --pull -t "${image}:${GITHUB_SHA}" \
              -f "${ctx}/${dockerfile}" "${ctx}"
            # WARP-3429 — secret-scan the image BEFORE it can reach the
            # registry. The packages are public (ADR-045), and public is
            # irreversible and exposes every layer, so a credential baked
            # into any layer (or the config's Env / build args) must stop
            # the publish here, not be found afterwards in a public package.
            # Config and each layer are scanned on their own, so a secret
            # deleted by a later layer is still caught. A non-vendor finding
            # outside the reviewed baseline exits non-zero and `set -e`
            # aborts before the push. `</dev/null`: this loop reads its
            # list from stdin, and nothing the scan spawns may eat it.
            scan_tar="${RUNNER_TEMP}/image-scan.tar"
            docker save "${image}:${GITHUB_SHA}" -o "${scan_tar}"
            python3 scripts/release/scan-ghcr-secrets.py \
              --package "droplet-${name}" --gitleaks /tmp/gitleaks \
              --docker-save "${scan_tar}" \
              --baseline scripts/release/image-secret-baseline.txt \
              --fail-on-app </dev/null
            rm -f "${scan_tar}"
            docker push "${image}:${GITHUB_SHA}"
            digest="$(docker inspect \
              --format='{{range .RepoDigests}}{{println .}}{{end}}' \
              "${image}:${GITHUB_SHA}" | grep "^${image}@" | head -1 | cut -d@ -f2)"
            if [ -z "${digest}" ]; then
              echo "::error::no digest captured for ${name}"; exit 1
            fi
            echo "${name} ${digest}" >> dist/digests.txt
            echo "::endgroup::"
          done < dist/services.list
          python3 - <<'PY'
          import json
          digests = {}
          for line in open("dist/digests.txt"):
              name, digest = line.split()
              digests[name] = digest
          json.dump(digests, open("dist/digests.json", "w"), indent=2)
          print(json.dumps(digests, indent=2))
          PY

      # WARP-3423 — there is deliberately no "every package is public" gate
      # here any more. Romain, 2026-10-03: the images stay private, and box
      # pulls will be device-authenticated instead (WARP-3423, ADR-066 to be
      # superseded). The gate WARP-3429 added made every publish fail after
      # the full build while the packages are private.

      # WARP-244 — keyless (Sigstore) signature on EVERY pushed image. The
      # signer is this workflow's GitHub Actions OIDC identity: Fulcio
      # issues a short-lived certificate bound to
      #   https://github.com/DropletByWarpLab/droplet-onboard-services/.github/workflows/publish-release.yml@refs/heads/main
      # and cosign stores signature + certificate + Rekor bundle in GHCR
      # next to the image. This is a SEPARATE trust layer from the
      # key-based release.json signature below (WARP-536): the manifest key
      # is the device's offline OTA trust root ("this digest-set is a
      # release"); the keyless image signatures are the supply-chain gate
      # ("this image was built by our CI") that docker/ota/apply-update.sh
      # enforces before any docker pull. NOTE: Rekor is a PUBLIC
      # transparency log — entries expose repo/workflow identity and image
      # digests (never contents). Mandated by WARP-244.
      - name: Sign app images (cosign keyless + Rekor)
        run: |
          set -euo pipefail
          owner_lc="${GITHUB_REPOSITORY_OWNER,,}"
          registry="ghcr.io/${owner_lc}"
          while read -r name digest; do
            echo "::group::sign ${name}"
            cosign sign --yes "${registry}/droplet-${name}@${digest}"
            echo "::endgroup::"
          done < dist/digests.txt

      # Self-check with the SAME policy the device enforces (exact identity
      # + issuer), then capture each image's Rekor log index into
      # dist/image-signatures.json — the per-release "transparency log
      # entries" artifact (WARP-244 AC). A signature that our own policy
      # cannot verify must never ship.
      - name: Verify image signatures + capture Rekor entries
        run: |
          set -euo pipefail
          owner_lc="${GITHUB_REPOSITORY_OWNER,,}"
          registry="ghcr.io/${owner_lc}"
          # WARP-1670: the identity carries the ref this run was dispatched
          # from, so a stage publish self-verifies against @refs/heads/stage.
          # Hardcoding main here made every non-main publish fail its own
          # verify step. The `channel` job has already proven GITHUB_REF is
          # one of the two release branches, which is what keeps this
          # interpolation from widening the policy.
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/publish-release.yml@${GITHUB_REF}"
          issuer="https://token.actions.githubusercontent.com"
          : > dist/image-verify.jsonl
          while read -r name digest; do
            ref="${registry}/droplet-${name}@${digest}"
            cosign verify \
              --certificate-identity "${identity}" \
              --certificate-oidc-issuer "${issuer}" \
              --output json "${ref}" \
            | jq -c --arg name "$name" --arg ref "$ref" --arg digest "$digest" \
                --arg identity "$identity" --arg issuer "$issuer" \
                '{name: $name, ref: $ref, digest: $digest,
                  certificateIdentity: $identity,
                  certificateOidcIssuer: $issuer,
                  rekorLogIndex: (.[0].optional.Bundle.Payload.logIndex // null)}' \
              >> dist/image-verify.jsonl
          done < dist/digests.txt
          jq -s '{schemaVersion: 1, images: .}' dist/image-verify.jsonl > dist/image-signatures.json
          cat dist/image-signatures.json

      # WARP-245 — one CycloneDX 1.5 SBOM per released image (syft over the
      # locally-built image, source-version = the pushed digest), then ONE
      # aggregated device SBOM. syft + the CycloneDX validator are pinned
      # by version + sha256, same posture as the vendored cosign in
      # apps/orchestrator/Dockerfile.
      - name: Install syft
        run: |
          set -euo pipefail
          curl --fail -sSL -o /tmp/syft.tar.gz \
            https://github.com/anchore/syft/releases/download/v1.46.0/syft_1.46.0_linux_amd64.tar.gz
          echo "d654f678b709eb53c393d38519d5ed7d2e57205529404018614cfefa0fb2b5ca  /tmp/syft.tar.gz" | sha256sum -c -
          sudo tar -C /usr/local/bin -xzf /tmp/syft.tar.gz syft
          syft version

      - name: Generate per-image SBOMs (CycloneDX 1.5)
        run: |
          set -euo pipefail
          owner_lc="${GITHUB_REPOSITORY_OWNER,,}"
          registry="ghcr.io/${owner_lc}"
          mkdir -p dist/sbom
          while read -r name digest; do
            image="${registry}/droplet-${name}"
            echo "::group::sbom ${name}"
            syft "docker:${image}:${GITHUB_SHA}" \
              --source-name "droplet-${name}" \
              --source-version "${digest}" \
              -o "cyclonedx-json@1.5=dist/sbom/droplet-${name}.cdx.json"
            echo "::endgroup::"
          done < dist/digests.txt

      - name: Aggregate device SBOM + validate all against CycloneDX 1.5
        run: |
          set -euo pipefail
          owner_lc="${GITHUB_REPOSITORY_OWNER,,}"
          python3 scripts/release/aggregate-sboms.py \
            --services scripts/release/services.json \
            --digests dist/digests.json \
            --sbom-dir dist/sbom \
            --git-sha "${GITHUB_SHA}" \
            --registry "ghcr.io/${owner_lc}" \
            --out dist/sbom/droplet-device.cdx.json
          curl --fail -sSL -o /tmp/cyclonedx \
            https://github.com/CycloneDX/cyclonedx-cli/releases/download/v0.32.0/cyclonedx-linux-x64
          echo "454879e6a4a405c8a13bff49b8982adcb0596f3019b26b0811c66e4d7f0783e1  /tmp/cyclonedx" | sha256sum -c -
          chmod +x /tmp/cyclonedx
          for f in dist/sbom/*.cdx.json; do
            echo "validate ${f}"
            /tmp/cyclonedx validate --input-file "$f" \
              --input-format json --input-version v1_5 --fail-on-errors
          done

      # Tracked runtime configs only: `git archive` can never leak
      # untracked runtime state (.env, docker/certs, secrets) because it
      # packs the committed tree, not the working directory.
      - name: Pack configs
        run: |
          set -euo pipefail
          git archive --format=tar.gz -o dist/configs.tar.gz HEAD docker
          sha256sum dist/configs.tar.gz

      # WARP-3502: when the OTA_REGISTRY_HOST variable is set, every image ref
      # in the signed manifest names the HQ registry instead of ghcr.io (same
      # digests). The `r2` decide step above already refused the run unless
      # the R2 secrets exist, so a manifest can only name the HQ host if this
      # run is about to copy the images there; empty keeps ghcr.io.
      - name: Generate release.json
        env:
          CHANNEL: ${{ needs.channel.outputs.channel }}
          OTA_REGISTRY_HOST: ${{ vars.OTA_REGISTRY_HOST }}
        run: |
          set -euo pipefail
          owner_lc="${GITHUB_REPOSITORY_OWNER,,}"
          python3 scripts/release/gen-release-manifest.py \
            --services scripts/release/services.json \
            --digests dist/digests.json \
            --configs dist/configs.tar.gz \
            --git-sha "${GITHUB_SHA}" \
            --channel "${CHANNEL}" \
            --registry "ghcr.io/${owner_lc}" \
            --registry-host "${OTA_REGISTRY_HOST}" \
            --clients dist/clients/clients.json \
            --out dist/release.json
          cat dist/release.json

      # FAILS (by design) until the human key ceremony provisions the
      # secrets — see the header comment + scripts/README.md.
      #
      # --tlog-upload=false: these are private product releases; we don't
      # publish to the public Rekor transparency log. The device-side
      # verify (WARP-537) is offline key-based verification and passes
      # --insecure-ignore-tlog accordingly. The images themselves are not
      # individually signed: they are pinned by digest inside the SIGNED
      # manifest, which authenticates them transitively.
      - name: Sign release manifest
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${COSIGN_PRIVATE_KEY}" ]; then
            echo "::error::COSIGN_PRIVATE_KEY secret is not set — run the key ceremony in scripts/README.md (\"OTA release signing\") before releases can publish"
            exit 1
          fi
          cosign sign-blob --yes \
            --key env://COSIGN_PRIVATE_KEY \
            --tlog-upload=false \
            --output-signature dist/release.json.sig \
            dist/release.json

      # WARP-3502 — R2 registry mirror, part 4 of 4: the copy. It runs LAST,
      # after the build, push, keyless sign + self-verify, SBOMs and the signed
      # manifest have all succeeded (so a failure anywhere earlier never pays
      # for it), and BEFORE the Release exists, so the job fails closed: no
      # Release, and therefore no signed release.json, can name a digest R2
      # does not hold. For each image in dist/digests.json it copies the
      # manifest tree, its config + layer blobs and the cosign
      # `sha256-<hex>.sig` artifact, skipping what R2 already has, then
      # re-lists the bucket to prove every object the release needs is there.
      # Escape class closed: a release that boxes cannot pull from HQ. Cost:
      # see the header; the job summary prints the measured bytes and seconds.
      - name: Mirror images + cosign signatures to R2 (by digest)
        if: steps.r2.outputs.enabled == 'true'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          owner_lc="${GITHUB_REPOSITORY_OWNER,,}"
          python3 scripts/release/mirror-to-r2.py copy \
            --digests dist/digests.json \
            --registry "ghcr.io/${owner_lc}" \
            --scratch "${RUNNER_TEMP}/r2"

      # WARP-1670: the tag carries the channel (`ota-<channel>-<run>-g<sha7>`)
      # because it is the ONLY per-channel selector a device can see without
      # downloading and verifying a manifest first — the non-stable poller
      # uses it as a cheap pre-filter over the releases list. It stays a
      # HINT, never the trust decision: the device re-checks the channel
      # inside the cosign-verified manifest before accepting anything.
      - name: Create GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ needs.channel.outputs.channel }}
          RELEASE_FLAGS: ${{ needs.channel.outputs.release_flags }}
        run: |
          set -euo pipefail
          tag="ota-${CHANNEL}-${GITHUB_RUN_NUMBER}-g${GITHUB_SHA::7}"
          # Split the resolved flag string into an argv array rather than
          # letting it word-split at the call site.
          read -r -a release_flags <<< "${RELEASE_FLAGS}"
          # WARP-3120: the client installers release.json names (may be none).
          mapfile -t client_files < <(jq -r '.[].file | "dist/clients/" + .' dist/clients/clients.json)
          gh release create "${tag}" \
            --target "${GITHUB_SHA}" \
            --title "OTA release ${tag}" \
            --notes "Automated OTA release for ${GITHUB_SHA} (channel: ${CHANNEL}). Assets: release.json (signed manifest, schema v1), release.json.sig (cosign signature — verify against cosign.pub, attached), configs.tar.gz (tracked docker/ runtime configs), image-signatures.json (per-image keyless-signature + Rekor transparency-log index, WARP-244 — see docs/SECURITY.md for verification), cosign.pub (OTA manifest trust anchor). Client installers named in release.json's clients array, if any (WARP-3120). Plus CycloneDX 1.5 SBOMs: droplet-<service>.cdx.json per image and droplet-device.cdx.json aggregated (WARP-245)." \
            "${release_flags[@]}" \
            dist/release.json dist/release.json.sig dist/configs.tar.gz \
            dist/image-signatures.json \
            apps/orchestrator/src/services/update-agent/cosign.pub \
            dist/sbom/*.cdx.json \
            ${client_files[@]+"${client_files[@]}"}
          # WARP-3429: handed to the `index` job only once the Release and
          # every asset exist (a failed create exits above, under `set -e`).
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

  # WARP-3429 — signed channel index. A SEPARATE job so a failure here (a
  # transient `gh` error, say) is fixed with "Re-run failed jobs", which
  # re-runs only this job: re-running `publish` would redo ~2 hours of
  # builds and then fail at `gh release create`, because the tag exists.
  #
  # It publishes channel-<channel>.json (+ .sig) to the rolling `ota-index`
  # release. A box fetches
  #   .../releases/download/ota-index/channel-<channel>.json
  # (+ .sig), verifies it against the baked-in cosign.pub, and learns the
  # newest tag for its channel and the sha256 of that release's release.json
  # with one anonymous GET, no API listing and no token (ADR-045). The
  # pointer is a hint plus an integrity pin, never the trust decision: the box
  # still verifies release.json's own signature and re-checks the channel
  # inside it. The workflow-level concurrency group is held until this job
  # ends, so two publishes of one channel can never race on the pointer.
  index:
    name: channel index (signed pointer)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [channel, publish]
    # Least privilege: this job only reads and writes Releases (the signing
    # is key-based, so no OIDC token, and it pushes no package).
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      CHANNEL: ${{ needs.channel.outputs.channel }}
      TAG: ${{ needs.publish.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.1 # OTA consumers require the cosign v2 signature format.

      # The pointer pins the sha256 of release.json, so pin the bytes GitHub
      # actually serves for the release, not a local copy: if the Release is
      # missing or incomplete this fails here, and the hash can never
      # describe a file boxes will not get.
      - name: Download the published release.json
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "${TAG}" -R "${GITHUB_REPOSITORY}" \
            --pattern release.json --dir dist

      # Sign exactly as release.json is signed: the same key, the same
      # --tlog-upload=false (private product metadata stays out of the public
      # log; the box verifies offline with --insecure-ignore-tlog). The
      # generator refuses a channel/tag/manifest mismatch, so nothing wrong
      # ever gets a signature. Verifying with the committed cosign.pub before
      # upload is the same "never ship a signature our own policy cannot
      # verify" self-check the image signatures get.
      - name: Generate and sign the channel pointer
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${COSIGN_PRIVATE_KEY}" ]; then
            echo "::error::COSIGN_PRIVATE_KEY secret is not set — run the key ceremony in scripts/README.md (\"OTA release signing\") before releases can publish"
            exit 1
          fi
          pointer="dist/channel-${CHANNEL}.json"
          python3 scripts/release/gen-channel-pointer.py \
            --manifest dist/release.json --channel "${CHANNEL}" --tag "${TAG}" \
            --out "${pointer}"
          cat "${pointer}"
          cosign sign-blob --yes \
            --key env://COSIGN_PRIVATE_KEY \
            --tlog-upload=false \
            --output-signature "${pointer}.sig" \
            "${pointer}"
          cosign verify-blob \
            --key apps/orchestrator/src/services/update-agent/cosign.pub \
            --signature "${pointer}.sig" \
            --insecure-ignore-tlog=true \
            "${pointer}"

      # The rolling release the pointers live on. Created once, then reused
      # forever. It must never become `latest` (that is what stable boxes
      # poll) and its tag must never start with ota-stage-/ota-stable-
      # (older boxes list releases by that prefix), hence --prerelease
      # --latest=false and the bare `ota-index` tag. The stage and stable
      # publishers hold different concurrency groups, so two of them can both
      # find it missing on the very first run: the loser's create fails
      # (already exists), which is fine so long as the release is there now.
      - name: Ensure the ota-index release exists
        run: |
          set -euo pipefail
          ensure_index() {
            gh release view ota-index -R "${GITHUB_REPOSITORY}" >/dev/null 2>&1 && return 0
            gh release create ota-index -R "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "OTA channel index — do not delete" \
              --notes "Rolling release that holds the signed OTA channel pointers: channel-stage.json and channel-stable.json, each with a .sig. Rewritten in place by publish-release.yml after every successful OTA release (WARP-3429). A pointer names the newest release tag for its channel and the sha256 of that release's release.json; a box verifies the .sig against the cosign.pub baked into its image, then downloads that release. Deleting this release breaks that discovery path for every box. It is a prerelease and is never the latest release, and its tag does not start with ota-stage- or ota-stable-, so it is never mistaken for an OTA release." \
              --prerelease --latest=false && return 0
            for _ in 1 2 3 4 5; do
              sleep 3
              gh release view ota-index -R "${GITHUB_REPOSITORY}" >/dev/null 2>&1 && return 0
            done
            return 1
          }
          ensure_index || { echo "::error::could not create or find the ota-index release"; exit 1; }

      # --clobber: the pointer is rewritten in place on every release, under
      # the same asset name, which is what keeps the box-side URL stable. If
      # a box fetches between the two uploads it sees a json/.sig pair that
      # fails verification and simply retries on its next poll.
      - name: Upload the pointer to ota-index
        run: |
          set -euo pipefail
          gh release upload ota-index -R "${GITHUB_REPOSITORY}" --clobber \
            "dist/channel-${CHANNEL}.json" "dist/channel-${CHANNEL}.json.sig"
