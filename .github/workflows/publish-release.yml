name: publish-release

# WARP-536 — CI half of the OTA update system (WARP-534).
#
# On demand (workflow_dispatch from main — see the manual-only note
# below): re-run the must-pass test suites (gate), build
# every appliance app image, push to GHCR tagged by commit sha, capture
# the immutable digests, pack the tracked runtime configs, generate the
# design-schema-v1 release.json, cosign-sign it, and publish everything
# as a GitHub Release. The device-side update agent (WARP-537/538) polls
# Releases `latest`, verifies release.json.sig against the baked-in
# cosign.pub, and applies by digest.
#
# ── FAILS UNTIL THE KEY CEREMONY RUNS ──
# The sign step requires the COSIGN_PRIVATE_KEY + COSIGN_PASSWORD repo
# secrets, which are provisioned ONLY by the human key ceremony
# (scripts/README.md, "OTA release signing — key ceremony"). Until then
# every run of this workflow fails at "Sign release manifest". That is
# the intended fail-closed posture — do not stub the signature.
#
# ── MANUAL-ONLY UNTIL THE KEY CEREMONY (CI budget optimization, 2026-07) ──
# This workflow used to run on every push to main. Because the signing
# secrets don't exist yet, every run burned the full gate + a no-cache
# 13-image build/push/sign/SBOM pipeline (~2 runner-hours) and then failed
# at "Sign release manifest" — ~400 doomed runs in the 30 days before this
# change, against a $100/month Actions budget. Until the key ceremony
# provisions COSIGN_PRIVATE_KEY/COSIGN_PASSWORD, publishing is dispatch-only:
# run it from main once the sha you want to ship is green on ci-summary.
# When re-enabling a per-merge (or tag-triggered) flow after the ceremony,
# also drop the inline gate jobs in favor of the ci.yml full-matrix push run
# (the WARP-536 follow-up) — they re-prove what ci-summary already proved
# for the same sha.

on:
  workflow_dispatch:

# One release at a time, never cancelled mid-publish: a cancelled run
# could leave images pushed but no signed manifest, or a half-uploaded
# Release. Queued runs each publish their own sha in order.
concurrency:
  group: publish-release
  cancel-in-progress: false

permissions:
  contents: write # gh release create
  packages: write # push images to GHCR
  id-token: write # cosign / future keyless & provenance work

jobs:
  gate-node:
    name: gate / node suites
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies (npm workspaces, root install)
        run: npm ci

      - name: Generate Prisma client
        run: npm run -w @droplet/orchestrator db:generate

      - name: Build @droplet/fips-selftest
        run: npm run -w @droplet/fips-selftest build

      - name: Build @droplet/tools-core
        run: npm run -w @droplet/tools-core build

      - name: Build @droplet/mcp-server
        run: npm run -w @droplet/mcp-server build

      # WARP-1137: erp.service imports @droplet/erp-connector; its types
      # resolve from dist/, so build before the orchestrator suite runs
      # (mirrors orchestrator-tests.yml — this job was crashing on
      # unresolved @droplet/erp-connector imports without this step,
      # WARP-1249).
      - name: Build @droplet/erp-connector
        run: npm run -w @droplet/erp-connector build

      - name: Test @droplet/tools-core
        run: npm run -w @droplet/tools-core test

      - name: Test @droplet/mcp-server
        run: npm run -w @droplet/mcp-server test

      # WARP-537's update-agent verify suite (once merged) execs the real
      # cosign binary over golden fixtures — mirror orchestrator-tests.yml.
      # Harmless before that suite lands; required after.
      - name: Install cosign (update-agent verify suite)
        uses: sigstore/cosign-installer@v3

      - name: Test @droplet/orchestrator
        run: npm run -w @droplet/orchestrator test

      # matter-controller ships in release.json (scripts/release/
      # services.json), so its suite gates publishing like every other
      # released image — mirrors matter-controller-tests.yml.
      - name: Type-check @droplet/matter-controller
        run: npm run -w @droplet/matter-controller build

      - name: Test @droplet/matter-controller
        run: npm run -w @droplet/matter-controller test

      - name: Lint dashboard class names
        run: bash scripts/check-dashboard-classes.sh

      - name: Test @droplet/web-dashboard
        run: npm run -w @droplet/web-dashboard test

  gate-python:
    name: gate / ${{ matrix.service }} pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: ai-gateway
          - service: routing
          - service: switch
          - service: camera-discovery
          # WARP-970 coverage gate — keeps this list an exact mirror of
          # ci.yml's python matrix; same requirements-dev.txt + bare-pytest
          # shape as the legs above, no sysdeps.
          - service: email-indexer
          - service: ops-console
          - service: fleet-agent
          - service: file-indexer
            # libpq for psycopg build, ffmpeg + libmagic for content sniffing
            # (mirrors file-indexer-tests.yml)
            sysdeps: libpq-dev ffmpeg libmagic1
          - service: voice-io
            # portaudio/alsa import-time deps (mirrors voice-io-tests.yml)
            sysdeps: libportaudio2 alsa-utils
          - service: device-identity-svc
            # tpm2-pytss builds against tss2-esapi headers
            # (mirrors device-identity-svc-tests.yml)
            sysdeps: libtss2-dev pkg-config
            reqs: requirements.txt
            extra_pip: pytest
            needs_pythonpath: "1"
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7

      - name: Install system deps
        if: matrix.sysdeps != ''
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ matrix.sysdeps }}

      # WARP-1025: fleet-agent's release_verify/update_poll suites exec the
      # REAL cosign binary over the WARP-537 golden fixtures (mirrors
      # ci.yml's python matrix and fleet-agent-tests.yml).
      - name: Install cosign (fleet-agent release_verify suite)
        if: matrix.service == 'fleet-agent'
        uses: sigstore/cosign-installer@v3

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ${{ matrix.reqs || 'requirements-dev.txt' }}
          if [ -n "${{ matrix.extra_pip }}" ]; then pip install ${{ matrix.extra_pip }}; fi

      - name: Run pytest
        env:
          PYTHONPATH: ${{ matrix.needs_pythonpath == '1' && format('{0}/services/{1}', github.workspace, matrix.service) || '' }}
        run: pytest -v

  publish:
    name: build, push, sign, release
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: [gate-node, gate-python]
    steps:
      - uses: actions/checkout@v7

      # The manifest generator has its own unit suite (schema shape +
      # loud-failure paths). A release must never publish from an
      # untested generator.
      - name: Test release manifest generator
        run: |
          python3 -m pip install --upgrade pip pytest
          python3 -m pytest scripts/release/ -q

      # ubuntu-latest has ~14GB free. Building every appliance image
      # fills that before BuildKit finishes (same fix as docker-build.yml
      # / setup-e2e.yml). Strip the preinstalled toolchains we don't use
      # to reclaim ~25GB.
      - name: Free disk space
        run: |
          set -eux
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/powershell \
            /usr/local/share/chromium \
            /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY/Ruby" \
            "$AGENT_TOOLSDIRECTORY/PyPy" \
            || true
          sudo apt-get clean
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # WARP-244 — cosign is needed both for the keyless image signing right
      # after push (below) and the key-based release.json signing later, so
      # install it once here, immediately after GHCR login.
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # Build + push every service in scripts/release/services.json
      # (canonical list — the generator refuses to publish if this loop
      # and the list ever drift). Tag = full commit sha; the manifest
      # pins the pushed DIGEST, which is what devices actually pull.
      - name: Build and push app images
        run: |
          set -euo pipefail
          owner_lc="${GITHUB_REPOSITORY_OWNER,,}"
          registry="ghcr.io/${owner_lc}"
          mkdir -p dist
          python3 - <<'PY' > dist/services.list
          import json
          for s in json.load(open("scripts/release/services.json"))["services"]:
              print(s["name"], s["context"], s["dockerfile"])
          PY
          : > dist/digests.txt
          while read -r name ctx dockerfile; do
            image="${registry}/droplet-${name}"
            echo "::group::build+push ${name}"
            # compose semantics: dockerfile path is relative to its context
            docker build --pull -t "${image}:${GITHUB_SHA}" \
              -f "${ctx}/${dockerfile}" "${ctx}"
            docker push "${image}:${GITHUB_SHA}"
            digest="$(docker inspect \
              --format='{{range .RepoDigests}}{{println .}}{{end}}' \
              "${image}:${GITHUB_SHA}" | grep "^${image}@" | head -1 | cut -d@ -f2)"
            if [ -z "${digest}" ]; then
              echo "::error::no digest captured for ${name}"; exit 1
            fi
            echo "${name} ${digest}" >> dist/digests.txt
            echo "::endgroup::"
          done < dist/services.list
          python3 - <<'PY'
          import json
          digests = {}
          for line in open("dist/digests.txt"):
              name, digest = line.split()
              digests[name] = digest
          json.dump(digests, open("dist/digests.json", "w"), indent=2)
          print(json.dumps(digests, indent=2))
          PY

      # WARP-244 — keyless (Sigstore) signature on EVERY pushed image. The
      # signer is this workflow's GitHub Actions OIDC identity: Fulcio
      # issues a short-lived certificate bound to
      #   https://github.com/DropletByWarpLab/droplet-onboard-services/.github/workflows/publish-release.yml@refs/heads/main
      # and cosign stores signature + certificate + Rekor bundle in GHCR
      # next to the image. This is a SEPARATE trust layer from the
      # key-based release.json signature below (WARP-536): the manifest key
      # is the device's offline OTA trust root ("this digest-set is a
      # release"); the keyless image signatures are the supply-chain gate
      # ("this image was built by our CI") that scripts/lib/apply-update.sh
      # enforces before any docker pull. NOTE: Rekor is a PUBLIC
      # transparency log — entries expose repo/workflow identity and image
      # digests (never contents). Mandated by WARP-244.
      - name: Sign app images (cosign keyless + Rekor)
        run: |
          set -euo pipefail
          owner_lc="${GITHUB_REPOSITORY_OWNER,,}"
          registry="ghcr.io/${owner_lc}"
          while read -r name digest; do
            echo "::group::sign ${name}"
            cosign sign --yes "${registry}/droplet-${name}@${digest}"
            echo "::endgroup::"
          done < dist/digests.txt

      # Self-check with the SAME policy the device enforces (exact identity
      # + issuer), then capture each image's Rekor log index into
      # dist/image-signatures.json — the per-release "transparency log
      # entries" artifact (WARP-244 AC). A signature that our own policy
      # cannot verify must never ship.
      - name: Verify image signatures + capture Rekor entries
        run: |
          set -euo pipefail
          owner_lc="${GITHUB_REPOSITORY_OWNER,,}"
          registry="ghcr.io/${owner_lc}"
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/publish-release.yml@refs/heads/main"
          issuer="https://token.actions.githubusercontent.com"
          : > dist/image-verify.jsonl
          while read -r name digest; do
            ref="${registry}/droplet-${name}@${digest}"
            cosign verify \
              --certificate-identity "${identity}" \
              --certificate-oidc-issuer "${issuer}" \
              --output json "${ref}" \
            | jq -c --arg name "$name" --arg ref "$ref" --arg digest "$digest" \
                --arg identity "$identity" --arg issuer "$issuer" \
                '{name: $name, ref: $ref, digest: $digest,
                  certificateIdentity: $identity,
                  certificateOidcIssuer: $issuer,
                  rekorLogIndex: (.[0].optional.Bundle.Payload.logIndex // null)}' \
              >> dist/image-verify.jsonl
          done < dist/digests.txt
          jq -s '{schemaVersion: 1, images: .}' dist/image-verify.jsonl > dist/image-signatures.json
          cat dist/image-signatures.json

      # WARP-245 — one CycloneDX 1.5 SBOM per released image (syft over the
      # locally-built image, source-version = the pushed digest), then ONE
      # aggregated device SBOM. syft + the CycloneDX validator are pinned
      # by version + sha256, same posture as the vendored cosign in
      # apps/orchestrator/Dockerfile.
      - name: Install syft
        run: |
          set -euo pipefail
          curl --fail -sSL -o /tmp/syft.tar.gz \
            https://github.com/anchore/syft/releases/download/v1.46.0/syft_1.46.0_linux_amd64.tar.gz
          echo "d654f678b709eb53c393d38519d5ed7d2e57205529404018614cfefa0fb2b5ca  /tmp/syft.tar.gz" | sha256sum -c -
          sudo tar -C /usr/local/bin -xzf /tmp/syft.tar.gz syft
          syft version

      - name: Generate per-image SBOMs (CycloneDX 1.5)
        run: |
          set -euo pipefail
          owner_lc="${GITHUB_REPOSITORY_OWNER,,}"
          registry="ghcr.io/${owner_lc}"
          mkdir -p dist/sbom
          while read -r name digest; do
            image="${registry}/droplet-${name}"
            echo "::group::sbom ${name}"
            syft "docker:${image}:${GITHUB_SHA}" \
              --source-name "droplet-${name}" \
              --source-version "${digest}" \
              -o "cyclonedx-json@1.5=dist/sbom/droplet-${name}.cdx.json"
            echo "::endgroup::"
          done < dist/digests.txt

      - name: Aggregate device SBOM + validate all against CycloneDX 1.5
        run: |
          set -euo pipefail
          owner_lc="${GITHUB_REPOSITORY_OWNER,,}"
          python3 scripts/release/aggregate-sboms.py \
            --services scripts/release/services.json \
            --digests dist/digests.json \
            --sbom-dir dist/sbom \
            --git-sha "${GITHUB_SHA}" \
            --registry "ghcr.io/${owner_lc}" \
            --out dist/sbom/droplet-device.cdx.json
          curl --fail -sSL -o /tmp/cyclonedx \
            https://github.com/CycloneDX/cyclonedx-cli/releases/download/v0.32.0/cyclonedx-linux-x64
          echo "454879e6a4a405c8a13bff49b8982adcb0596f3019b26b0811c66e4d7f0783e1  /tmp/cyclonedx" | sha256sum -c -
          chmod +x /tmp/cyclonedx
          for f in dist/sbom/*.cdx.json; do
            echo "validate ${f}"
            /tmp/cyclonedx validate --input-file "$f" \
              --input-format json --input-version v1_5 --fail-on-errors
          done

      # Tracked runtime configs only: `git archive` can never leak
      # untracked runtime state (.env, docker/certs, secrets) because it
      # packs the committed tree, not the working directory.
      - name: Pack configs
        run: |
          set -euo pipefail
          git archive --format=tar.gz -o dist/configs.tar.gz HEAD docker
          sha256sum dist/configs.tar.gz

      - name: Generate release.json
        run: |
          set -euo pipefail
          owner_lc="${GITHUB_REPOSITORY_OWNER,,}"
          python3 scripts/release/gen-release-manifest.py \
            --services scripts/release/services.json \
            --digests dist/digests.json \
            --configs dist/configs.tar.gz \
            --git-sha "${GITHUB_SHA}" \
            --channel stable \
            --registry "ghcr.io/${owner_lc}" \
            --out dist/release.json
          cat dist/release.json

      # FAILS (by design) until the human key ceremony provisions the
      # secrets — see the header comment + scripts/README.md.
      #
      # --tlog-upload=false: these are private product releases; we don't
      # publish to the public Rekor transparency log. The device-side
      # verify (WARP-537) is offline key-based verification and passes
      # --insecure-ignore-tlog accordingly. The images themselves are not
      # individually signed: they are pinned by digest inside the SIGNED
      # manifest, which authenticates them transitively.
      - name: Sign release manifest
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${COSIGN_PRIVATE_KEY}" ]; then
            echo "::error::COSIGN_PRIVATE_KEY secret is not set — run the key ceremony in scripts/README.md (\"OTA release signing\") before releases can publish"
            exit 1
          fi
          cosign sign-blob --yes \
            --key env://COSIGN_PRIVATE_KEY \
            --tlog-upload=false \
            --output-signature dist/release.json.sig \
            dist/release.json

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="ota-${GITHUB_RUN_NUMBER}-g${GITHUB_SHA::7}"
          gh release create "${tag}" \
            --target "${GITHUB_SHA}" \
            --title "OTA release ${tag}" \
            --notes "Automated OTA release for ${GITHUB_SHA} (channel: stable). Assets: release.json (signed manifest, schema v1), release.json.sig (cosign signature — verify against cosign.pub, attached), configs.tar.gz (tracked docker/ runtime configs), image-signatures.json (per-image keyless-signature + Rekor transparency-log index, WARP-244 — see docs/SECURITY.md for verification), cosign.pub (OTA manifest trust anchor). Plus CycloneDX 1.5 SBOMs: droplet-<service>.cdx.json per image and droplet-device.cdx.json aggregated (WARP-245)." \
            --latest \
            dist/release.json dist/release.json.sig dist/configs.tar.gz \
            dist/image-signatures.json \
            apps/orchestrator/src/services/update-agent/cosign.pub \
            dist/sbom/*.cdx.json
