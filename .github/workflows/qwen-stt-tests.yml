name: qwen-stt-tests
on:
  push:
    branches: [main]
    paths:
      - "services/qwen-stt/**"
      - ".github/workflows/qwen-stt-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qwen-stt-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/qwen-stt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -v
