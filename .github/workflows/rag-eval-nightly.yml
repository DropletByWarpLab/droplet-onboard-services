name: rag-eval-nightly

# WARP-436 — RAGAS eval harness, run nightly + on demand.
#
# Two reasons this lives in its own workflow rather than tagging onto
# rag-tests.yml:
#   1. RAGAS calls a judge LLM per metric per query. With 20 queries
#      and 5 metrics that's 100 judge calls per run; on local Ollama
#      it's slow, on cloud judges it costs money. PR CI must stay on
#      the cheaper NDCG@10 lane.
#   2. The nightly schedule lets us track metric drift over time
#      independently of PR throughput.
#
# Triggers:
#   - schedule: 09:00 UTC daily (= 02:00 PT, off-peak)
#   - workflow_dispatch: manual run before/after a Phase 3 or Phase 4
#     change to compare against last night's baseline
#
# Judge LLM defaults to "local" (Ollama). To run with the cloud judge,
# trigger workflow_dispatch and set the ragas_judge input to "cloud"
# — requires the OPENAI_API_KEY secret to be configured at the repo
# or org level.

on:
  schedule:
    # Daily at 09:00 UTC. Picks up overnight regressions before the
    # team's working day starts.
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      ragas_judge:
        description: "Judge LLM mode"
        type: choice
        default: "local"
        options: ["local", "cloud"]

concurrency:
  group: rag-eval-nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rag-eval-nightly:
    name: RAGAS eval suite
    runs-on: ubuntu-latest
    # Same envelope as rag-tests.yml (35 min) plus ~20 min for the RAGAS
    # judge-LLM passes. Local-judge runs are CPU-bound on the Ollama
    # warmup; expect p95 ~50 min on a cold runner.
    timeout-minutes: 60

    env:
      RUN_RAG_INTEGRATION: "1"
      RAGAS_ENABLED: "1"
      RAGAS_JUDGE: ${{ inputs.ragas_judge || 'local' }}
      API_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      # Same disk reclamation as rag-tests.yml — Compose + Ollama push
      # ubuntu-latest's 14 GB envelope hard.
      - name: Free disk space
        run: |
          set -eux
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/powershell \
            /usr/local/share/chromium \
            /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY/Ruby" \
            "$AGENT_TOOLSDIRECTORY/PyPy" \
            || true
          sudo apt-get clean
          df -h /

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install root deps (workspaces)
        run: npm ci

      - name: Install tests workspace deps
        working-directory: tests
        run: npm ci || npm install --no-fund --no-audit

      - name: Build @droplet/tools-core
        run: npm run -w @droplet/tools-core build

      - name: Build @droplet/mcp-server
        run: npm run -w @droplet/mcp-server build

      - name: Generate Prisma client
        run: npm run -w @droplet/orchestrator db:generate

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate .env (secrets only)
        run: ./scripts/setup.sh --skip-docker --skip-drivers --skip-start --verbose

      - name: Force AUTH_ENABLED=false for test lane
        run: |
          set -euo pipefail
          if grep -qE '^AUTH_ENABLED=' .env; then
            sed -i 's/^AUTH_ENABLED=.*/AUTH_ENABLED=false/' .env
          else
            echo "AUTH_ENABLED=false" >> .env
          fi
          grep -E '^AUTH_ENABLED=' .env

      # Local judge needs Ollama + a chat model. Install a minimal
      # Ollama and pull mistral:7b-instruct on the runner. Pin a
      # specific Ollama version so behavior is reproducible across runs.
      - name: Install Ollama (local judge)
        if: env.RAGAS_JUDGE == 'local'
        run: |
          set -eux
          curl -fsSL https://ollama.com/install.sh | sh
          # Start Ollama as a background process. The systemd unit the
          # install script writes doesn't run on ubuntu-latest without
          # extra setup, so just nohup it.
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:11434/api/tags >/dev/null; then
              echo "Ollama is up."
              break
            fi
            sleep 1
          done
          ollama pull mistral:7b-instruct

      - name: Compose up (RAG stack)
        run: |
          docker compose \
            -f docker/docker-compose.yml \
            -f docker/docker-compose.test.override.yml \
            up -d db cache broker ai-gateway file-indexer mcp-server orchestrator nextcloud

      - name: Wait for orchestrator health
        run: |
          set -e
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/api/orchestrator/health > /dev/null; then
              echo "Orchestrator healthy after ${i}s polls."
              exit 0
            fi
            sleep 2
          done
          echo "::error::Orchestrator never became healthy"
          docker compose -f docker/docker-compose.yml \
            -f docker/docker-compose.test.override.yml logs orchestrator | tail -100
          exit 1

      - name: Wait for Prisma schema (BrainMemoryItem table exists)
        run: |
          set -e
          for i in $(seq 1 60); do
            if docker compose -f docker/docker-compose.yml \
                 -f docker/docker-compose.test.override.yml \
                 exec -T db psql -U droplet -d droplet -tA \
                 -c "SELECT to_regclass('public.\"BrainMemoryItem\"')" \
                 2>/dev/null | grep -q "BrainMemoryItem"; then
              echo "Prisma migrations complete after ${i}s polls."
              exit 0
            fi
            sleep 2
          done
          echo "::error::Prisma schema never reached BrainMemoryItem in 120s"
          exit 1

      - name: Wait for Nextcloud bootstrap
        run: |
          set -e
          for i in $(seq 1 120); do
            if docker compose -f docker/docker-compose.yml \
                -f docker/docker-compose.test.override.yml \
                exec -T -u www-data nextcloud php /var/www/html/occ status \
                > /dev/null 2>&1; then
              echo "Nextcloud bootstrapped after ${i} attempts."
              exit 0
            fi
            sleep 2
          done
          echo "::error::Nextcloud never bootstrapped"
          exit 1

      # Install the RAGAS deps once; the NDCG harness's beforeAll seeds
      # fixtures, and the RAGAS test then runs against the same stack.
      - name: Install RAGAS deps
        run: |
          python -m venv tests/retrieval-eval/ragas/.ragas-venv
          source tests/retrieval-eval/ragas/.ragas-venv/bin/activate
          pip install --upgrade pip
          pip install -r tests/retrieval-eval/ragas/requirements.txt

      - name: Run retrieval-eval (NDCG + RAGAS)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        working-directory: tests
        # tee runner stdout/stderr so the JSON+MD artifacts always have a
        # paired log even when the test process is SIGKILL'd (e.g. timeout
        # mid-judge). Without this, a runner crash leaves nothing to triage.
        run: |
          set -o pipefail
          npx vitest run --no-file-parallelism \
            retrieval-eval/run.integration.test.ts \
            2>&1 | tee /tmp/ragas-runner.log

      - name: Upload RAGAS results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ragas-results-${{ github.run_id }}
          path: |
            tests/retrieval-eval/ragas/results.json
            tests/retrieval-eval/ragas/results.md
            /tmp/ragas-runner.log
          retention-days: 30

      - name: Capture container logs (on failure)
        if: failure()
        run: |
          mkdir -p /tmp/rag-logs
          for svc in file-indexer orchestrator ai-gateway nextcloud db mcp-server; do
            docker compose -f docker/docker-compose.yml \
              -f docker/docker-compose.test.override.yml \
              logs --no-color "$svc" > "/tmp/rag-logs/${svc}.log" 2>&1 || true
          done
          if [[ -f /tmp/ollama.log ]]; then
            cp /tmp/ollama.log /tmp/rag-logs/
          fi

      - name: Upload logs artifact (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rag-eval-nightly-logs-${{ github.run_id }}
          path: /tmp/rag-logs
          retention-days: 7

      - name: Compose down
        if: always()
        run: |
          docker compose \
            -f docker/docker-compose.yml \
            -f docker/docker-compose.test.override.yml \
            down -v --remove-orphans
