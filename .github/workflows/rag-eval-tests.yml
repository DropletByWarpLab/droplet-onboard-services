name: rag-eval-tests

# Two lightweight pytest lanes, path-filtered:
#   1. tests/retrieval-eval/ragas/test_aggregate.py — the offline runner's
#      aggregation arithmetic (WARP-521). No Compose stack or Ollama.
#   2. services/rag-eval/tests/ — the appliance eval service's run-state
#      logic and uvicorn TLS config (wired in by the WARP-970 CI-coverage
#      gate: every service with a Dockerfile must have its suite on CI).
# Neither lane installs ragas/torch — that heavy stack stays deferred; these
# are purely unit-level tests.

on:
  pull_request:
    paths:
      - "tests/retrieval-eval/ragas/ragas_runner.py"
      - "tests/retrieval-eval/ragas/test_aggregate.py"
      - "services/rag-eval/**"
      - ".github/workflows/rag-eval-tests.yml"
  push:
    branches: [main]
    paths:
      - "tests/retrieval-eval/ragas/ragas_runner.py"
      - "tests/retrieval-eval/ragas/test_aggregate.py"
      - "services/rag-eval/**"
      - ".github/workflows/rag-eval-tests.yml"
  workflow_dispatch:

concurrency:
  group: rag-eval-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    # A hung test must fail the job fast, not burn the 6h default runner
    # allocation. Two small unit suites — 15 min is a generous ceiling.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          # 3.11 matches services/rag-eval/Dockerfile's base image.
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        # pandas: core aggregation arithmetic under test.
        # pyyaml + datasets: top-level imports in ragas_runner.py that must
        #   resolve when the module is imported (ragas itself is deferred and
        #   NOT installed here — that's the whole point of this lightweight lane).
        # pytest: test runner.
        # apscheduler + tzlocal + uvicorn: the services/rag-eval suite imports
        #   main.py (WARP-1061 uvicorn TLS config tests), which pulls in
        #   scheduler_service.py (apscheduler, tzlocal) and lazily uvicorn.
        # fastapi + httpx: the run-results visibility tests exercise
        #   server.py's /runs + /baselines surface through FastAPI's
        #   TestClient (httpx-backed), so the fastapi stack is now installed.
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyyaml datasets pytest apscheduler tzlocal uvicorn fastapi httpx

      - name: Run pytest (ragas aggregate)
        run: pytest tests/retrieval-eval/ragas/test_aggregate.py -v

      - name: Run pytest (rag-eval service unit tests)
        run: pytest services/rag-eval/tests -v
