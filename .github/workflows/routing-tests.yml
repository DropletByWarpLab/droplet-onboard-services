name: routing-tests

on:
  pull_request:
    paths:
      - "services/routing/**"
      - ".github/workflows/routing-tests.yml"
  push:
    branches: [main]
    paths:
      - "services/routing/**"
      - ".github/workflows/routing-tests.yml"
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/routing
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/routing/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest -v
