name: routing-tests

on:
  # PR-time coverage for this suite is owned by ci.yml's path-aware
  # `routing` leg (CI budget optimization, 2026-07): the pull_request
  # trigger here was retired as an exact duplicate of that leg.
  # Push-to-main stays as an independent post-merge canary and to
  # satisfy scripts/check-ci-coverage.sh.
  push:
    branches: [main]
    paths:
      - "services/routing/**"
      - ".github/workflows/routing-tests.yml"
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    # A hung test must fail the job fast, not burn the 6h default runner
    # allocation. Plain pytest suite — 15 min ceiling.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/routing
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/routing/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest -v
