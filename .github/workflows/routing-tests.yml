name: routing-tests

on:
  pull_request:
    paths:
      - "services/routing/**"
      - ".github/workflows/routing-tests.yml"
  push:
    branches: [main]
    paths:
      - "services/routing/**"
      - ".github/workflows/routing-tests.yml"
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    # A hung test must fail the job fast, not burn the 6h default runner
    # allocation. Plain pytest suite — 15 min ceiling.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/routing
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/routing/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest -v
