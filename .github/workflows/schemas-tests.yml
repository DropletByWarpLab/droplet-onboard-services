name: schemas-tests

# Codegen drift test for schemas/anchor.schema.json. Runs on PRs that touch
# the schema, the generator, the generated outputs, or this workflow itself.
# Re-runs `scripts/gen-anchor-schema.mjs` into a tmp dir and byte-compares
# against the checked-in files — any churn fails the build.

on:
  pull_request:
    paths:
      - "schemas/**"
      - "scripts/gen-anchor-schema.mjs"
      - "services/file-indexer/anchor_schema.py"
      - "packages/shared-types/src/anchor.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/schemas-tests.yml"
  push:
    branches: [main]
    paths:
      - "schemas/**"
      - "scripts/gen-anchor-schema.mjs"
      - "services/file-indexer/anchor_schema.py"
      - "packages/shared-types/src/anchor.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/schemas-tests.yml"

concurrency:
  group: schemas-tests-${{ github.ref }}
  cancel-in-progress: true

# WARP-3677: least privilege. Every job here only checks out the repo and
# runs tests (no step uses the token for anything else), so read is all the
# GITHUB_TOKEN needs. Stated explicitly so a new job cannot inherit a wider
# repository default by omission.
permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies (npm workspaces, root install)
        run: npm ci

      - name: Run codegen drift test
        run: npx vitest run schemas/__tests__/codegen-drift.test.ts
