name: security-tests

# Static security regression checks (scripts/test-security.sh). Very fast,
# no Docker. Triggered whenever compose or setup wiring changes because
# those are the main places security invariants live.

on:
  # Temporarily disabled: manual-only until GitHub Actions testing minutes
  # are restored. Restore the pull_request/push triggers from git history.
  workflow_dispatch:

concurrency:
  group: security-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run security regression suite
        run: ./scripts/test-security.sh
