name: setup-e2e

# End-to-end smoke test of ./scripts/setup.sh up to (but not including)
# `docker compose up`. Verifies a fresh device can actually be provisioned
# by the setup script: preflight → secrets → image build. Catches
# regressions in the setup flow itself, not just individual Dockerfiles
# (which the docker-build workflow covers separately).

on:
  pull_request:
    paths:
      - "scripts/**"
      - "docker/docker-compose.yml"
      - "docker/docker-compose.build-cache.yml"
      - "apps/**/Dockerfile"
      - "services/**/Dockerfile"
      - ".github/workflows/setup-e2e.yml"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "docker/docker-compose.yml"
      - "docker/docker-compose.build-cache.yml"
      - "apps/**/Dockerfile"
      - "services/**/Dockerfile"
      - ".github/workflows/setup-e2e.yml"
  workflow_dispatch:

concurrency:
  group: setup-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup-script:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read # pull the GHCR BuildKit layer cache (buildcache:<image>)
    # A hung step must fail the job fast, not burn the 6h default runner
    # allocation. This is the heaviest restored suite: setup.sh's build phase
    # runs a full `docker compose --profile full build` and the ai-gateway
    # image alone pulls ~5GB of CUDA/NCCL — 60 min covers a cold from-scratch
    # build on a disk-constrained runner while still bounding a hung build.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # ubuntu-latest has ~14GB free. `docker compose --profile full build`
      # (invoked by setup.sh in the build phase) fills that before BuildKit
      # finishes — the ai-gateway image alone pulls ~5GB of CUDA/NCCL libs.
      # Strip the preinstalled toolchains we don't use to reclaim ~25GB.
      # (docker-build.yml no longer needs this since it went one-image-per-
      # runner, but this job still builds the whole stack on one disk — the
      # GHCR layer cache below speeds up builds without shrinking them.)
      #
      # setup-e2e disk regression (2026-07-11): ~36GB post-clean only fits
      # when the GHCR layer cache mostly hits. With a stale cache (source-only
      # merge train — see the docker-build.yml push paths fix) or a PR that
      # touches docker/fips/** / docker/openssl-fips.cnf (invalidates an early
      # layer of EVERY image, e.g. PR #957), the multi-GB builder stages
      # rebuild cold in the local BuildKit store and the job dies with
      # "no space left on device" importing ai-gateway. The second rm batch
      # reclaims another ~10-14GB of toolchains this job never uses so a
      # cold full-stack build fits too.
      - name: Free disk space
        run: |
          set -eux
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/powershell \
            /usr/local/share/chromium \
            /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY/Ruby" \
            "$AGENT_TOOLSDIRECTORY/PyPy" \
            || true
          sudo rm -rf \
            /usr/local/.ghcup \
            /usr/lib/jvm \
            /usr/share/swift \
            /usr/lib/google-cloud-sdk \
            /usr/local/aws-cli \
            /usr/local/aws-sam-cli \
            /opt/microsoft \
            /opt/az \
            /usr/share/miniconda \
            /usr/local/share/vcpkg \
            /usr/local/lib/node_modules \
            "$AGENT_TOOLSDIRECTORY/go" \
            || true
          sudo apt-get clean
          df -h /

      # WARP-1065/WARP-1248: the rm above reclaims the ~14GB root disk to
      # ~36GB, but a PR that rewrites Dockerfile RUN steps (e.g. this branch
      # adding BuildKit cache mounts) busts the layer cache for those steps,
      # so `docker compose --profile full build` rebuilds the multi-GB
      # ai-gateway/CUDA/torch stages cold and holds them all in the local
      # BuildKit store at once — still overflowing root ("no space left on
      # device" importing ai-gateway). ubuntu-latest also mounts a large
      # ephemeral disk at /mnt (~65GB free) that Docker ignores by default.
      # Relocate Docker's data-root (image + BuildKit layer store) onto /mnt
      # so a cold full-stack build gets that headroom. Safe here: no images
      # have been pulled yet (checkout + free-disk only), and the GHCR layer
      # cache is imported during the build via cache_from, not pre-pulled.
      - name: Expand Docker disk (move data-root to /mnt)
        run: |
          set -eux
          df -h / /mnt
          sudo systemctl stop docker.socket docker.service
          sudo mkdir -p /mnt/docker
          printf '{\n  "data-root": "/mnt/docker"\n}\n' | sudo tee /etc/docker/daemon.json
          sudo rm -rf /var/lib/docker
          sudo systemctl start docker.service
          docker info --format 'Docker Root Dir: {{.DockerRootDir}}'
          test "$(docker info --format '{{.DockerRootDir}}')" = "/mnt/docker"
          df -h / /mnt

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Read-only login so builds can import the BuildKit layer cache that
      # docker-build.yml writes to ghcr.io/<repo>/buildcache:<image> on every
      # push to main. Best-effort: a cold/missing cache only slows the build.
      - name: Log in to GHCR (layer cache, read-only)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --skip-docker   → CI runner has Docker; also tells preflight to skip
      #                   the sudo prompt (unattended path).
      # --skip-drivers  → `modprobe uvcvideo` etc. is blocked inside the GHA
      #                   runner sandbox; the setup script would otherwise
      #                   exit 1 in Phase 3 before ever reaching image builds.
      # --skip-start    → no real router/Nextcloud account, so don't try to
      #                   bring the stack up.
      # DROPLET_COMPOSE_BUILD_EXTRA_FILE → scripts/lib/compose.sh merges the
      #                   build-cache overlay so each `compose build` imports
      #                   the GHCR layer cache (cache_from only; unset on
      #                   devices).
      - name: Run setup.sh (preflight + secrets + build)
        env:
          DROPLET_COMPOSE_BUILD_EXTRA_FILE: ${{ github.workspace }}/docker/docker-compose.build-cache.yml
        run: ./scripts/setup.sh --skip-docker --skip-drivers --skip-start --verbose

      - name: Verify .env was generated correctly
        run: |
          test -f .env || { echo "::error::.env not produced by setup.sh"; exit 1; }
          # MQTT_PASSWORD retired by WARP-235 (MQTT identity = client cert CN).
          for var in POSTGRES_PASSWORD REDIS_PASSWORD \
                     NEXTCLOUD_ADMIN_PASSWORD DEVICE_SECRET DEVICE_SECRET_KEY; do
            grep -q "^${var}=" .env || { echo "::error::missing $var in .env"; exit 1; }
          done
          perms=$(stat -c "%a" .env)
          [ "$perms" = "600" ] || { echo "::error::.env perms are $perms, expected 600"; exit 1; }
