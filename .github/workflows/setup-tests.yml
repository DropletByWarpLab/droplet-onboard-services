name: setup-tests

# Fast unit tests for scripts/setup.sh and scripts/lib/* — secret generation,
# .env permissions, idempotency, compose.sh psql wiring. No Docker.
#
# WARP-2647 widened the remit slightly: this is now the home for EVERY
# Docker-free shell suite over `scripts/**` whose subject has no more specific
# lane, because ci.yml has no setup-script leg and adding one would mean a new
# job. The trigger has not changed — `scripts/**` already fired this lane for
# all of them; they simply had no `run:` step anywhere. Total runtime ~10 s.

on:
  pull_request:
    paths:
      - "scripts/**"
      - "services/automount/**"
      - "tests/setup.test.sh"
      - "tests/fips-mode.test.sh"
      - "tests/luks2-data-partition.test.sh"
      - "tests/usb-luks-enroll.test.sh"
      # WARP-235: broker mTLS conf/ACL guards (tracked files + generator parity)
      - "tests/mosquitto-conf.test.sh"
      # WARP-2154: mosquitto-conf.test.sh greps the integration test's inline
      # staging wrapper (anti-drift), so edits to that file must trigger this
      # lane too — otherwise a wrapper-only edit lands unchecked and the pin
      # detonates on the next unrelated scripts/** PR
      - "tests/mqtt-mtls.integration.test.sh"
      # WARP-1061: internal-mTLS wiring guards + nginx internal-scheme checks
      - "tests/internal-mtls-wiring.test.sh"
      - "tests/nginx-internal-scheme.test.sh"
      - "tests/nginx-canonical-host.test.sh"
      # WARP-1688: the every-boot trusted_domains reconcile + the gateway's
      # Nextcloud asset legs the embedded editor loads from.
      - "tests/nextcloud-trusted-domains.test.sh"
      - "tests/nginx-nextcloud-assets.test.sh"
      # WARP-1973: overwriteprotocol reconcile, connector exclusivity, and the
      # RFC1918 coverage that keeps the editor reachable after a DHCP change.
      - "tests/nextcloud-docs-config-converges.test.sh"
      # WARP-1865: the dmr profile must survive a setup re-run on a flipped box
      - "tests/dmr-profile-survives-setup.test.sh"
      - "tests/dmr-default-provisioning.test.sh"
      # WARP-2543: the accelerator vendor selects the DMR profile AND image,
      # and a CPU-only image tag is refused outright.
      - "tests/gpu-vendor-selection.test.sh"
      # WARP-1947: single-box derives the overlay home endpoint IP
      - "tests/wireguard-home-endpoint.test.sh"
      # WARP-2647: seven Docker-free suites over scripts/setup.sh and
      # scripts/lib/* that ran in NO workflow at all. `scripts/**` above
      # already fires this lane for every change to the code they guard —
      # these lines exist so an edit to a GUARD ITSELF also fires it, which
      # is the only PR class they newly catch.
      - "tests/systemd.test.sh"
      - "tests/redis-acl.test.sh"
      - "tests/internal-ca.test.sh"
      - "tests/image-pipeline.test.sh"
      - "tests/single-box-openwrt-readiness.test.sh"
      - "tests/external-edge-router-survives-setup.test.sh"
      - "tests/framebuffer-panel-survives-reset.test.sh"
      - "tests/env-values-with-spaces-survive-sourcing.test.sh"
      - "docker/nextcloud-init.sh"
      - "docker/nginx/**"
      - "docker/mosquitto.conf"
      - "docker/mosquitto.acl"
      - "docker/frigate/config.yml"
      - "docker/docker-compose.yml"
      - ".github/workflows/setup-tests.yml"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "services/automount/**"
      - "tests/setup.test.sh"
      - "tests/fips-mode.test.sh"
      - "tests/luks2-data-partition.test.sh"
      - "tests/usb-luks-enroll.test.sh"
      # WARP-235: broker mTLS conf/ACL guards (tracked files + generator parity)
      - "tests/mosquitto-conf.test.sh"
      # WARP-2154: mosquitto-conf.test.sh greps the integration test's inline
      # staging wrapper (anti-drift), so edits to that file must trigger this
      # lane too — otherwise a wrapper-only edit lands unchecked and the pin
      # detonates on the next unrelated scripts/** PR
      - "tests/mqtt-mtls.integration.test.sh"
      # WARP-1061: internal-mTLS wiring guards + nginx internal-scheme checks
      - "tests/internal-mtls-wiring.test.sh"
      - "tests/nginx-internal-scheme.test.sh"
      - "tests/nginx-canonical-host.test.sh"
      # WARP-1688: the every-boot trusted_domains reconcile + the gateway's
      # Nextcloud asset legs the embedded editor loads from.
      - "tests/nextcloud-trusted-domains.test.sh"
      - "tests/nginx-nextcloud-assets.test.sh"
      # WARP-1973: overwriteprotocol reconcile, connector exclusivity, and the
      # RFC1918 coverage that keeps the editor reachable after a DHCP change.
      - "tests/nextcloud-docs-config-converges.test.sh"
      # WARP-1865: the dmr profile must survive a setup re-run on a flipped box
      - "tests/dmr-profile-survives-setup.test.sh"
      - "tests/dmr-default-provisioning.test.sh"
      # WARP-2543: the accelerator vendor selects the DMR profile AND image,
      # and a CPU-only image tag is refused outright.
      - "tests/gpu-vendor-selection.test.sh"
      # WARP-1947: single-box derives the overlay home endpoint IP
      - "tests/wireguard-home-endpoint.test.sh"
      # WARP-2647: seven Docker-free suites over scripts/setup.sh and
      # scripts/lib/* that ran in NO workflow at all. `scripts/**` above
      # already fires this lane for every change to the code they guard —
      # these lines exist so an edit to a GUARD ITSELF also fires it, which
      # is the only PR class they newly catch.
      - "tests/systemd.test.sh"
      - "tests/redis-acl.test.sh"
      - "tests/internal-ca.test.sh"
      - "tests/image-pipeline.test.sh"
      - "tests/single-box-openwrt-readiness.test.sh"
      - "tests/external-edge-router-survives-setup.test.sh"
      - "tests/framebuffer-panel-survives-reset.test.sh"
      - "tests/env-values-with-spaces-survive-sourcing.test.sh"
      - "docker/nextcloud-init.sh"
      - "docker/nginx/**"
      - "docker/mosquitto.conf"
      - "docker/mosquitto.acl"
      - "docker/frigate/config.yml"
      - "docker/docker-compose.yml"
      - ".github/workflows/setup-tests.yml"
  workflow_dispatch:

concurrency:
  group: setup-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup-unit:
    runs-on: ubuntu-latest
    # A hung test must fail the job fast, not burn the 6h default runner
    # allocation. Despite the name this is the fast unit suite (<5s, no
    # Docker — docker is stubbed on PATH); the heavy from-scratch image build
    # lives in setup-e2e.yml. 15 min is a very wide ceiling here.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Run setup unit tests
        run: bash tests/setup.test.sh
      - name: Run mosquitto mTLS conf/ACL unit tests
        # WARP-235: single :8883 mTLS listener, per-CN topic ACLs, generator/
        # tracked-file parity, shared-password retirement. Pure bash, no Docker.
        run: bash tests/mosquitto-conf.test.sh
      - name: Run internal-mTLS wiring guards
        # WARP-1061: setup writes the knob, compose mounts every mesh bundle +
        # passes the knob where env_file is absent, images use the TLS-aware
        # launcher/healthcheck, host installers deliver client certs. Pure
        # bash + a functional migrate_env run, no Docker.
        run: bash tests/internal-mtls-wiring.test.sh
      - name: Run nginx internal-scheme unit tests
        # WARP-1061: the default/mtls upstream-scheme variants, the
        # entrypoint selector, and nginx.conf's first-party-only
        # $internal_scheme legs. Pure bash, no Docker.
        run: bash tests/nginx-internal-scheme.test.sh
      - name: Run Nextcloud trusted-domains reconcile tests
        # WARP-1688: the stock image applies NEXTCLOUD_TRUSTED_DOMAINS only on
        # the install boot, so a box renamed afterwards answers 400 "untrusted
        # domain" on its own FQDN. Runs the extracted reconcile against a stub
        # occ: add-on-rename, zero writes when converged, no empty domain, and
        # errexit survival when the key is unset. Pure bash, no Docker.
        run: bash tests/nextcloud-trusted-domains.test.sh
      - name: Run Nextcloud docs-config convergence tests
        # WARP-1973: overwriteprotocol is the SECOND key the stock image applies
        # only on the install boot (an already-installed box freezes with it
        # empty, so Nextcloud emits http:// redirects to an https page and the
        # editor iframe is blocked as mixed content); the DOCS_ENGINE choice must
        # disable the other connector, or both register providers for the same
        # Office MIME types; and trusted domains must cover all of RFC1918 so a
        # new DHCP lease cannot 400 the editor. Pure bash, no Docker.
        run: bash tests/nextcloud-docs-config-converges.test.sh
      - name: Run nginx Nextcloud asset-routing unit tests
        # WARP-1688: the editor page emits root-absolute /apps/, /core/, /dist/
        # and /index.php/apps/{richdocuments,theming}/ URLs. Asserts those legs
        # exist, forward the prefix unstripped, sit before the catch-all, and
        # that the whole /index.php/ leg stays UNrouted. Pure bash, no Docker.
        run: bash tests/nginx-nextcloud-assets.test.sh
      - name: Run nginx canonical-host unit tests
        # Warning-free droplet.local: render decisions (authority knob +
        # cert-artifact gates), variant contents, nginx.conf/Dockerfile/
        # compose wiring, tls-reload render hook. Pure bash, no Docker.
        run: bash tests/nginx-canonical-host.test.sh
      - name: Run DMR profile-preservation unit tests
        # WARP-1865: on a box with INFERENCE_RUNTIME=dmr, a setup re-run must
        # keep `dmr` in COMPOSE_PROFILES. The WARP-1772 guard preserved the DMR
        # URLs but not the profile, so a re-run kept OLLAMA_URL=http://dmr:12434
        # while starting ollama and never starting dmr — inference pointed at a
        # container that wasn't running, and setup logged success. Pure bash.
        run: bash tests/dmr-profile-survives-setup.test.sh
      - name: Run DMR default-provisioning unit tests
        # WARP-1870: a freshly provisioned box must come up on DMR WITH a model
        # id that matches DMR's /api/tags byte-for-byte. An empty LLM_MODEL is a
        # dead appliance out of the crate; a mis-spelled one re-pulls ~13.79 GB
        # on every orchestrator boot. Also pins that a setup re-run can never
        # flip or un-flip an existing box. Pure bash.
        run: bash tests/dmr-default-provisioning.test.sh
      - name: Run GPU vendor-selection unit tests
        # WARP-2543: the box must pick its DMR shape from the SILICON it has.
        # A bench box shipped with an NVIDIA RTX 5060 Ti while compose still
        # wired AMD ROCm devices — which resolved to a 512 MiB integrated GPU —
        # and docker/.env had been hand-pinned to the CPU-only image tag. The
        # 20B then served at 8 tok/s with every healthcheck green for days.
        # Pins: profile<->image agreement, the AMD token stays `dmr` so the
        # installed fleet is untouched, and a suffix-less DMR_IMAGE is refused.
        # Pure bash, no GPU required.
        run: bash tests/gpu-vendor-selection.test.sh
      - name: Run single-box overlay home-endpoint derivation tests
        # WARP-1947: single-box must DERIVE WIREGUARD_HOME_ENDPOINT_HOST from the
        # box's default route so an approved overlay device's profile carries a
        # reachable `lan` candidate. The live box shipped a dead 192.168.1.87 that
        # shadowed request-time discovery; deriving + overwriting every run keeps
        # it correct across DHCP changes and a factory reset. Pure bash, no Docker.
        run: bash tests/wireguard-home-endpoint.test.sh
      - name: Run FIPS-mode knob unit tests
        # WARP-318: apply_fips_mode env-write helper (knob → derived vars),
        # idempotency, on↔off convergence, atomic staged-rename, explicit-boolean
        # rejection. Pure bash, no Docker.
        run: bash tests/fips-mode.test.sh
      - name: Run TLS secrets unit tests
        run: bash scripts/test/secrets-tls.test.sh
      - name: Run OTA apply helper integration tests
        # WARP-539: per-target digest pinning + the detached self-swap
        # helper's wait-then-rollback, driven through a PATH-shimmed fake
        # docker; the pin-resolution assertions run the real
        # `docker compose config` client-side (no daemon needed).
        run: bash scripts/test/apply-update.test.sh
      - name: Run LUKS2 data-partition tests
        # WARP-232: HERMETICALLY EXECUTES droplet-luks-provision.sh provision +
        # the existing-LUKS re-run refusal, scripts/lib/luks.sh secrets
        # relocation (real cp/symlink/perms, not grep), the symlink-aware .env
        # writer, fstab/crypttab nofail, and crypto-shred partition-target — all
        # against PATH-stubbed cryptsetup/systemd-cryptenroll + a tmp fs. No
        # Docker, no root, no TPM.
        run: bash tests/luks2-data-partition.test.sh
      - name: Run USB LUKS2 enroll tests
        # WARP-232: derivation KAT + the enroll drill, the .env-fallback for
        # DEVICE_SECRET_KEY (production sudo has a scrubbed env), interrupt-safe
        # keyslot ordering, and fail-fast when the recovery key is underivable.
        run: bash tests/usb-luks-enroll.test.sh

      # ── WARP-2647: suites that ran in NO workflow at all ──────────────────
      # Each of these guards a file already covered by this lane's `scripts/**`
      # trigger, so the job they join was going to run anyway; together they
      # add ~4 s. They live here rather than in a ci.yml leg because ci.yml has
      # no `setup-script` leg and adding one means a new job — a new required
      # check and a new per-PR runner allocation (docs/ci-cost-budget.md). They
      # are NOT in a new workflow and add NO new trigger: this lane has fired
      # on `pull_request` + `scripts/**` since it was written.
      - name: Run systemd unit-render tests
        # WARP-571: render_systemd_unit() in scripts/lib/systemd.sh — the unit
        # text setup.sh installs on the box. Distinct from
        # systemd-unit-sandbox-tests.yml, which checks the TRACKED unit files
        # under scripts/host/etc-systemd-system/; nothing checked the rendered
        # ones. No Docker, no sudo.
        run: bash tests/systemd.test.sh

      - name: Run Redis ACL generation tests
        # WARP-234: _generate_redis_acl in scripts/lib/secrets.sh — that the
        # materialised users.acl carries ONLY sha256 hashes (never a plaintext
        # password byte), that `default` stays PING-only, and that each service
        # keeps its least-privilege shape. The DOCKER half of this invariant is
        # scripts/test/redis-tls.test.sh, which is declared developer-only; this
        # is the half a runner can prove.
        run: bash tests/redis-acl.test.sh

      - name: Run internal-CA issuance tests
        # WARP-236: scripts/lib/internal-ca.sh — CA mint idempotency, leaf
        # issuance, SAN shape and rotation. Pure openssl. Three suites this lane
        # already runs (mosquitto-conf, internal-mtls-wiring, mqtt staging) are
        # downstream of this library, and none of them exercised it directly.
        run: bash tests/internal-ca.test.sh

      - name: Run appliance image-pipeline tests
        # WARP-663 / ADR-020: the `droplet-image` CLI and scripts/image/
        # manifest tooling — sign↔verify round-trip with a throwaway ECDSA-P256
        # key, tamper detection, schema rejection, and the four `flash`
        # pre-flight refusals under DROPLET_IMAGE_DRY_RUN=1. No real block
        # device, no root.
        run: |
          set -eu
          # One assertion parses the autoinstall user-data as YAML. The runner's
          # system python3 ships PyYAML; install it if a future image drops it,
          # rather than letting a missing dependency be reported as a broken
          # manifest. No-op (and no cost) in the expected case. egress-gate.yml
          # needs the explicit `pip install pyyaml` because setup-python@v7 puts
          # a tool-cache interpreter in front; this lane uses the system one.
          python3 -c 'import yaml' 2>/dev/null \
            || sudo apt-get install -y -qq python3-yaml
          bash tests/image-pipeline.test.sh

      - name: Run single-box OpenWrt readiness tests
        # WARP-826: provision_single_box_openwrt must poll a REAL readiness
        # signal (ubus answering) rather than `.State.Running`, which flips true
        # seconds before procd is up — the race that brought the router back
        # offline after a factory reset. Docker is stubbed on PATH.
        run: bash tests/single-box-openwrt-readiness.test.sh

      - name: Run external-edge-router preservation tests
        # WARP-1980: a setup re-run must not re-point a box off its real edge
        # router. Silent when it regresses — the bundled container answers, so
        # the routing service just starts describing a router nobody is on.
        run: bash tests/external-edge-router-survives-setup.test.sh

      - name: Run framebuffer-panel provisioning tests
        # WARP-1981: setup must write DISPLAY_BACKEND=fb explicitly on a box
        # with a framebuffer panel, because factory-reset deletes .env and the
        # runtime `auto` probe deliberately never selects fb.
        run: bash tests/framebuffer-panel-survives-reset.test.sh

      - name: Run .env whitespace-survives-sourcing tests
        # WARP-1987: .env is `.`-sourced in four places, so a bare `KEY=a b c`
        # exits 127 and fails the enclosing step — the 2026-08-13 customer wipe.
        run: bash tests/env-values-with-spaces-survive-sourcing.test.sh
