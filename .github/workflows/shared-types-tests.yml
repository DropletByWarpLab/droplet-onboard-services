name: shared-types-tests

# Vitest + tsc for packages/shared-types — the leaf util package both the
# orchestrator and the dashboard import (WARP-979 added the box-name validator,
# "the ONE ruleset both apps share"). Path-filtered so unrelated PRs don't pay
# for it. No native modules, no sidecars, no Docker — a couple of seconds.
#
# Follows the per-package-workflow convention documented in ci-coverage.yml:
# without this, the package's colocated specs (e.g. box-name.test.ts) would
# never run in CI — the validator would be gated only transitively through the
# orchestrator route + dashboard component specs.

on:
  pull_request:
    paths:
      - "packages/shared-types/**"
      - ".github/workflows/shared-types-tests.yml"
  push:
    branches: [main]
    paths:
      - "packages/shared-types/**"
      - ".github/workflows/shared-types-tests.yml"
  workflow_dispatch:

concurrency:
  group: shared-types-tests-${{ github.ref }}
  cancel-in-progress: true

# WARP-3677: least privilege. Every job here only checks out the repo and
# runs tests (no step uses the token for anything else), so read is all the
# GITHUB_TOKEN needs. Stated explicitly so a new job cannot inherit a wider
# repository default by omission.
permissions:
  contents: read

jobs:
  vitest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies (npm workspaces, root install)
        run: npm ci

      - name: Type-check @droplet/shared-types
        run: npm run -w @droplet/shared-types build

      - name: Run @droplet/shared-types vitest
        run: npm run -w @droplet/shared-types test
