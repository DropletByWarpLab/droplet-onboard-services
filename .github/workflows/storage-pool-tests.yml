name: storage-pool-tests

# Fast unit tests for scripts/host/droplet-storage-pool.sh — pool_destroy
# captures md members BEFORE `mdadm --stop` so each superblock is actually
# zeroed (no array re-assembles on next boot). < 5s, no Docker.
#
# WARP-1988 adds the factory-reset storage wipe to the same job: same shape
# (fake sysfs + stub binaries, no root/disks/Docker), same invariant family —
# never touch the OS disk, never wipe a member out from under a live array.

on:
  # Temporarily disabled: manual-only until GitHub Actions testing minutes
  # are restored. Restore the pull_request/push triggers from git history.
  workflow_dispatch:

concurrency:
  group: storage-pool-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  storage-pool-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run storage-pool unit tests
        run: bash tests/storage-pool-destroy-superblock.test.sh
      - name: Run factory-reset storage-wipe unit tests
        run: bash tests/factory-reset-storage-wipe.test.sh
      # WARP-2629 — the live-secrets wipe on /data. Kept in step with ci.yml's
      # `storage` leg so the dispatch copy and the PR copy do not drift.
      - name: Run factory-reset live-secrets wipe unit tests
        run: bash tests/factory-reset-secrets-wipe.test.sh
      # WARP-2638 — same reason: kept in step with ci.yml's `storage` leg.
      - name: Run factory-reset volume-wipe + purge-scope guards
        run: |
          bash tests/factory-reset-volume-wipe.test.sh
          bash tests/factory-reset-purge-scope.test.sh
