name: switch-tests

# Pytest for services/switch. Path-filtered so orchestrator-only or dashboard-only
# PRs don't trigger a Python install.

on:
  # PR-time coverage for this suite is owned by ci.yml's path-aware
  # `switch` leg (CI budget optimization, 2026-07): the pull_request
  # trigger here was retired as an exact duplicate of that leg.
  # Push-to-main stays as an independent post-merge canary and to
  # satisfy scripts/check-ci-coverage.sh.
  push:
    branches: [main]
    paths:
      - "services/switch/**"
      - ".github/workflows/switch-tests.yml"
  workflow_dispatch:

concurrency:
  group: switch-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    # A hung test must fail the job fast, not burn the 6h default runner
    # allocation. Plain pytest suite — 15 min ceiling.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/switch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/switch/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest -v
