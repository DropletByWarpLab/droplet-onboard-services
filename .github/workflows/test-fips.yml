name: test-fips

# FIPS 140-3 static lint (scripts/test-fips.sh). Mirrors the security-tests
# workflow's shape — fast, no Docker, runs on every PR touching source/config
# directories.
#
# WARP-229: PR-BLOCKING. After commits 3-11 landed the allowlist registry
# (docs/security/fips-exceptions.md), the brain_ingest MD5 → SHA-256 fix,
# and the camera-discovery + routing + fips-selftest escape annotations,
# the lint reports zero violations against `main`. From this point forward
# any PR that introduces a non-FIPS algorithm without a registered
# `fips:allowed: <reason-id>` escape fails CI.
#
# To register a new exception: add an entry under `exceptions:` in
# `docs/security/fips-exceptions.md` and reference it from source via a
# `fips:allowed: <id>` comment within ±2 lines. Code review is the
# enforcement gate for new entries; the rationale + annual-review owner
# must be documented.

on:
  pull_request:
    paths:
      - "apps/**"
      - "services/**"
      - "packages/**"
      - "scripts/**"
      - "docker/**"
      - "docs/security/fips-exceptions.md"
      - "docs/security/fips-allowed-algorithms.md"
      - "tests/fips-sabotage.test.sh"
      - "tests/fips-sabotage-logic.test.sh"
      - ".github/workflows/test-fips.yml"
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "services/**"
      - "packages/**"
      - "scripts/**"
      - "docker/**"
      - "docs/security/fips-exceptions.md"
      - "docs/security/fips-allowed-algorithms.md"
      - "tests/fips-sabotage.test.sh"
      - "tests/fips-sabotage-logic.test.sh"
      - ".github/workflows/test-fips.yml"
  workflow_dispatch:

concurrency:
  group: test-fips-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # WARP-229 static SOURCE lint — distinct from the BUILD-TIME provider gate in
  # docker-build.yml (install-fips-provider.sh KATs + positive/negative probes,
  # required-to-merge via the `docker-build ok` fan-in check). This job greps
  # source for non-FIPS algorithms; it does NOT build images or check runtime
  # enforcement. See scripts/test-fips.sh header for the lint-vs-gate split.
  fips-lint:
    runs-on: ubuntu-latest
    # A hung test must fail the job fast, not burn the 6h default runner
    # allocation. Pure static lint (no Docker, no pip/apt builds) — 15 min is
    # a wide ceiling for a sub-minute suite.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Run lint script's own unit tests
        run: ./tests/test-fips-script/run.sh

      - name: Run FIPS static lint (PR-blocking)
        run: ./scripts/test-fips.sh

      - name: Validate the sabotage-proof harness (Docker-free logic checks)
        # WARP-316: asserts tests/fips-sabotage.test.sh encodes a real sabotage
        # (build → install → rm fips.so → assert provider gone) and skips
        # cleanly without Docker. The Docker build itself runs in fips-sabotage.
        run: bash tests/fips-sabotage-logic.test.sh

  # WARP-316 deliberate-sabotage proof: builds one throwaway image, installs the
  # validated provider for real, deletes fips.so, and asserts the FIPS provider
  # can no longer load — demonstrating the build-time gate is NOT a no-op. This
  # is the runtime-*capability* counterpart to docker-build.yml's PRESENT gate;
  # it does not gate merges by itself (docker-build.yml owns the required check).
  fips-sabotage:
    runs-on: ubuntu-latest
    # Compiles the OpenSSL FIPS module in a throwaway build (minutes cold).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Deliberate-sabotage proof (removing fips.so breaks the gate)
        run: bash tests/fips-sabotage.test.sh
