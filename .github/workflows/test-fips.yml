name: test-fips

# FIPS 140-3 HEAVYWEIGHT proofs only: the WARP-316 deliberate-sabotage build
# and the WARP-317 full-stack activation smoke test. Both compile/build real
# images, so both are gated twice — by this workflow's `paths:` below and
# again by each job's own dorny filter.
#
# ── THE STATIC LINT IS NO LONGER HERE (WARP-2481) ─────────────────────────
# `scripts/test-fips.sh` and the three Docker-free harness checks moved to
# `.github/workflows/ci.yml`, job `fips` (check name `fips / static lint`).
#
# WHY: this file's old header claimed the lint was "PR-BLOCKING". It was not.
# The job went red and the merge went through anyway, because `fips-lint` was
# never a required status check — and a job in a PATH-FILTERED workflow can
# never become one: on a PR outside the filter it never reports, and GitHub
# hangs the PR on "Expected — waiting for status" forever (the WARP-2172
# trap, docs/ci-required-checks.md). Demonstrated on PR #1815 (2026-08-28):
# `fips-lint` red with 3 violations, `semgrep` red, `CodeQL` red — and
# `ci-summary`, `egress-gate` and `title carries a WARP key`, the only three
# required contexts, all green. One approval would have merged it.
#
# As a leg of ci.yml the lint's verdict is aggregated by `ci-summary`, which
# IS required by both the Stage (20877684) and Main (14884851) rulesets. That
# is what makes "PR-blocking" true by construction rather than aspirational,
# and it needed no ruleset change and no new required context.
#
# The two jobs below are deliberately NOT merge-blocking — they are
# *capability* proofs (docs/security/fips-ci-gate-required.md). The required
# build-time gate is docker-build.yml's `docker-build ok` fan-in.
#
# ── PATHS (WARP-2481) ─────────────────────────────────────────────────────
# The lists below are now exactly the UNION of the two jobs' own dorny
# filters. They used to be a much broader superset (apps/**, services/**,
# packages/**, scripts/**, docker/**) inherited from the lint that no longer
# lives here, which meant both jobs spun up a runner, checked out, evaluated
# their filter and did nothing on ~91% of PRs and 271 of 293 monthly main
# pushes — ~2 billable minutes each time, since GitHub rounds every job up to
# the minute. Every path that can make a job's inner filter true is still
# listed, so no run that did real work is lost. See docs/ci-cost-budget.md.

# NOTE: the two lists below are duplicated on purpose. GitHub Actions does
# not support YAML anchors/aliases in workflow files, so they cannot be
# factored out — keep them byte-identical to each other AND to the `fips:`
# filter inside both jobs.
on:
  pull_request:
    paths:
      - "scripts/setup.sh"
      - "scripts/lib/secrets.sh"
      - "scripts/lib/compose.sh"
      - "docker/docker-compose.yml"
      - "docker/docker-compose.test.override.yml"
      - "docker/fips/**"
      - "docker/openssl-fips.cnf"
      - "docker/nginx/**"
      - "services/_shared/fips_selftest.py"
      - "packages/fips-selftest/**"
      - "services/device-identity-svc/**"
      - "tests/integration/fips-stack.test.sh"
      - "tests/fips-sabotage.test.sh"
      - ".github/workflows/test-fips.yml"
  push:
    branches: [main]
    paths:
      - "scripts/setup.sh"
      - "scripts/lib/secrets.sh"
      - "scripts/lib/compose.sh"
      - "docker/docker-compose.yml"
      - "docker/docker-compose.test.override.yml"
      - "docker/fips/**"
      - "docker/openssl-fips.cnf"
      - "docker/nginx/**"
      - "services/_shared/fips_selftest.py"
      - "packages/fips-selftest/**"
      - "services/device-identity-svc/**"
      - "tests/integration/fips-stack.test.sh"
      - "tests/fips-sabotage.test.sh"
      - ".github/workflows/test-fips.yml"
  workflow_dispatch:

concurrency:
  group: test-fips-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # WARP-316 deliberate-sabotage proof: builds one throwaway image, installs the
  # validated provider for real, deletes fips.so, and asserts the FIPS provider
  # can no longer load — demonstrating the build-time gate is NOT a no-op. This
  # is the runtime-*capability* counterpart to docker-build.yml's PRESENT gate;
  # it does not gate merges by itself (docker-build.yml owns the required check).
  #
  # CI budget optimization (2026-07): the OpenSSL FIPS-module compile is
  # gated on the FIPS option paths, because this workflow's trigger list used
  # to be broad (apps/**, services/**, …) and the sabotage proof ran its
  # multi-minute throwaway build on every ordinary app PR (~1,400 runs/month).
  # WARP-2481 narrowed the workflow `paths:` to the same option paths, so the
  # filter below is now a belt-and-braces second gate rather than the only
  # one — keep it: it is what still protects the build on `workflow_dispatch`
  # and against any future re-widening of the trigger.
  # The Docker-free logic check of this harness
  # (tests/fips-sabotage-logic.test.sh) runs unconditionally in ci.yml's
  # `fips / static lint` leg.
  fips-sabotage:
    runs-on: ubuntu-latest
    # Compiles the OpenSSL FIPS module in a throwaway build (minutes cold).
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read # dorny/paths-filter lists PR files via the API
    steps:
      - uses: actions/checkout@v7

      # Keep this filter list in lockstep with fips-stack's below (same
      # rationale: only FIPS-option-path changes pay for a real build).
      - name: Detect FIPS-option-path changes
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v4
        id: gate
        with:
          # push events diff against the previous main commit by default.
          filters: |
            fips:
              - "scripts/setup.sh"
              - "scripts/lib/secrets.sh"
              - "scripts/lib/compose.sh"
              - "docker/docker-compose.yml"
              - "docker/docker-compose.test.override.yml"
              - "docker/fips/**"
              - "docker/openssl-fips.cnf"
              - "docker/nginx/**"
              - "services/_shared/fips_selftest.py"
              - "packages/fips-selftest/**"
              - "services/device-identity-svc/**"
              - "tests/integration/fips-stack.test.sh"
              - "tests/fips-sabotage.test.sh"
              - ".github/workflows/test-fips.yml"

      - name: Deliberate-sabotage proof (removing fips.so breaks the gate)
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.fips == 'true'
        run: bash tests/fips-sabotage.test.sh

  # WARP-317 full-stack FIPS ACTIVATION smoke test: boots the real compose
  # stack with DROPLET_FIPS_MODE=1 (via the real setup.sh --fips path) and
  # asserts the whole appliance runs on the validated provider — per-service
  # fips_self_test lines, FIPS-restricted edge TLS (WARP-1021), live API
  # endpoints, in-container MD5 refusal, and no crash-loops on the images
  # that don't ship the provider. Heavy (builds the app images), so it is
  # gated on the FIPS *option paths* below as well as by the workflow's own
  # `paths:` — ordinary app PRs must not pay a stack boot. Like fips-sabotage,
  # it does not gate merges by itself. Docker-free logic checks for this
  # harness run in ci.yml's `fips / static lint` leg.
  fips-stack:
    runs-on: ubuntu-latest
    # Full image-set build (GHCR layer cache warm ≈ 15-25 min; ai-gateway is
    # the long pole) + stack boot + probes. 60 min bounds a cold build.
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read # pull the GHCR BuildKit layer cache (buildcache:<image>)
      pull-requests: read # dorny/paths-filter lists PR files via the API
    steps:
      - uses: actions/checkout@v7

      - name: Detect FIPS-option-path changes
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v4
        id: gate
        with:
          # push events diff against the previous main commit by default.
          filters: |
            fips:
              - "scripts/setup.sh"
              - "scripts/lib/secrets.sh"
              - "scripts/lib/compose.sh"
              - "docker/docker-compose.yml"
              - "docker/docker-compose.test.override.yml"
              - "docker/fips/**"
              - "docker/openssl-fips.cnf"
              - "docker/nginx/**"
              - "services/_shared/fips_selftest.py"
              - "packages/fips-selftest/**"
              # WARP-1248: the sidecar is part of the booted set and its image
              # now owns the bind-mount ownership fix — image changes must pay
              # the stack boot instead of regressing it silently.
              - "services/device-identity-svc/**"
              - "tests/integration/fips-stack.test.sh"
              - ".github/workflows/test-fips.yml"

      # ubuntu-latest has ~14GB free; the full compose image set does not fit
      # cold. Same reclaim as setup-e2e.yml / rag-tests.yml.
      - name: Free disk space
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.fips == 'true'
        run: |
          set -eux
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/powershell \
            /usr/local/share/chromium \
            /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY/Ruby" \
            "$AGENT_TOOLSDIRECTORY/PyPy" \
            || true
          sudo apt-get clean
          df -h /

      - name: Set up Docker Buildx
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.fips == 'true'
        uses: docker/setup-buildx-action@v4

      # Read-only: import the BuildKit layer cache docker-build.yml refreshes
      # on every push to main. Best-effort — a cold cache only slows the run.
      - name: Log in to GHCR (layer cache, read-only)
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.fips == 'true'
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Full-stack FIPS activation smoke test
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.fips == 'true'
        env:
          # compose merges this overlay so `up` builds import the GHCR cache
          # (cache_from only; unset on devices) — same hook as setup-e2e.yml.
          DROPLET_COMPOSE_BUILD_EXTRA_FILE: ${{ github.workspace }}/docker/docker-compose.build-cache.yml
        run: bash tests/integration/fips-stack.test.sh
