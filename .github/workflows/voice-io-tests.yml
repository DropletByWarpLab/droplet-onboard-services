name: voice-io-tests

# Pytest for services/voice-io. Path-filtered.

on:
  # PR-time coverage for this suite is owned by ci.yml's path-aware
  # `voice-io` leg (CI budget optimization, 2026-07): the pull_request
  # trigger here was retired as an exact duplicate of that leg.
  # Push-to-main stays as an independent post-merge canary and to
  # satisfy scripts/check-ci-coverage.sh.
  push:
    branches: [main]
    paths:
      - "services/voice-io/**"
      - ".github/workflows/voice-io-tests.yml"
  workflow_dispatch:

concurrency:
  group: voice-io-tests-${{ github.ref }}
  cancel-in-progress: true

# WARP-3677: least privilege. Every job here only checks out the repo and
# runs tests (no step uses the token for anything else), so read is all the
# GITHUB_TOKEN needs. Stated explicitly so a new job cannot inherit a wider
# repository default by omission.
permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    # A hung test must fail the job fast, not burn the 6h default runner
    # allocation. Plain pytest suite (apt binary deps only) — 15 min ceiling.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/voice-io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/voice-io/requirements-dev.txt

      - name: Install system deps
        # libportaudio2: sounddevice's runtime dynamic-link target. The
        # device-discovery + scoring tests don't touch real audio (they
        # inject a fake sounddevice module), but the package's top-level
        # `import sounddevice` still tries to load libportaudio.so.2 at
        # import time — having it installed lets the import succeed and
        # the lazy-fallback path stays cleanly testable.
        # alsa-utils: gives the test runner aplay/arecord for the
        # follow-up commits that exercise audio capture.
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 alsa-utils

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest -v
