name: web-dashboard-tests

# Vitest for apps/web-dashboard. Path-filtered so only dashboard-relevant
# changes trigger a run.

on:
  # Temporarily disabled: manual-only until GitHub Actions testing minutes
  # are restored. Restore the pull_request/push triggers from git history.
  workflow_dispatch:

concurrency:
  group: web-dashboard-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies (npm workspaces, root install)
        run: npm ci

      # WARP-288: catch silently-dropped Tailwind utility classes before
      # they reach the unit suite. Runs before vitest so a regression
      # fails fast with a clear per-class summary.
      - name: Lint dashboard class names
        run: bash scripts/check-dashboard-classes.sh

      - name: Run vitest
        run: npm run -w @droplet/web-dashboard test
