name: web-dashboard-tests

# Typecheck (tsc --noEmit) + vitest + next build for apps/web-dashboard.
# Path-filtered so only dashboard-relevant changes trigger a run. This is the
# fast per-service mirror of the ci.yml node/web-dashboard leg — that leg feeds
# the required `ci-summary` check (ci.yml runs on every PR); this workflow just
# gives quicker targeted signal on dashboard-only changes.
# WARP-1296: added the tsc + next build steps — vitest strips types via esbuild,
# so type/build regressions were shipping green (WARP-1261/#1007, WARP-1267/#1026).

on:
  # PR-time coverage for this suite is owned by ci.yml's path-aware
  # `web-dashboard` leg (CI budget optimization, 2026-07): the pull_request
  # trigger here was retired as an exact duplicate of that leg.
  # Push-to-main stays as an independent post-merge canary and to
  # satisfy scripts/check-ci-coverage.sh.
  push:
    branches: [main]
    paths:
      - "apps/web-dashboard/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/check-dashboard-classes.sh"
      - "scripts/dashboard-token-allowlist.txt"
      - ".github/workflows/web-dashboard-tests.yml"
  workflow_dispatch:

concurrency:
  group: web-dashboard-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    # next build is the heavy leg; 20 min gives cold-cache headroom.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies (npm workspaces, root install)
        run: npm ci

      # WARP-288: catch silently-dropped Tailwind utility classes before
      # they reach the unit suite. Runs before vitest so a regression
      # fails fast with a clear per-class summary.
      - name: Lint dashboard class names
        run: bash scripts/check-dashboard-classes.sh

      # WARP-1296: vitest transforms via esbuild and never typechecks, so
      # dashboard type regressions shipped green (WARP-1261/#1007 dropped
      # `available` from FileSpace and broke SpaceSwitcher.tsx). Enforce the
      # compile-time contract — mirrors the orchestrator's WARP-1011 gate.
      - name: Typecheck (tsc --noEmit)
        working-directory: apps/web-dashboard
        run: npx tsc --noEmit

      - name: Run vitest
        run: npm run -w @droplet/web-dashboard test

      # WARP-1296: `next build` catches breakage tsc/vitest alone miss —
      # Next route/page contract violations and production bundling / module
      # resolution (e.g. the auth-policy .js->.ts webpack alias). Heaviest
      # step, runs last.
      - name: Build (next build)
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run -w @droplet/web-dashboard build
