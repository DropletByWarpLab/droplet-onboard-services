name: web-dashboard-tests

# Vitest for apps/web-dashboard. Path-filtered so only dashboard-relevant
# changes trigger a run.

on:
  # Re-enabled 2026-06-10: Actions minutes are flowing again (docker-build's
  # ~18-min job has run green on every PR/push since 2026-06-05). The month
  # this sat dispatch-only let three dashboard suites rot red on main.
  pull_request:
    paths:
      - "apps/web-dashboard/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/check-dashboard-classes.sh"
      - ".github/workflows/web-dashboard-tests.yml"
  push:
    branches: [main]
    paths:
      - "apps/web-dashboard/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/check-dashboard-classes.sh"
      - ".github/workflows/web-dashboard-tests.yml"
  workflow_dispatch:

concurrency:
  group: web-dashboard-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies (npm workspaces, root install)
        run: npm ci

      # WARP-288: catch silently-dropped Tailwind utility classes before
      # they reach the unit suite. Runs before vitest so a regression
      # fails fast with a clear per-class summary.
      - name: Lint dashboard class names
        run: bash scripts/check-dashboard-classes.sh

      - name: Run vitest
        run: npm run -w @droplet/web-dashboard test
