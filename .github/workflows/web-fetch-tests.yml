name: web-fetch-tests

# Pytest for services/web-fetch (WARP-1436 screened ambient-data fetcher).
# Path-filtered.

on:
  pull_request:
    paths:
      - "services/web-fetch/**"
      - ".github/workflows/web-fetch-tests.yml"
  push:
    branches: [main]
    paths:
      - "services/web-fetch/**"
      - ".github/workflows/web-fetch-tests.yml"
  workflow_dispatch:

concurrency:
  group: web-fetch-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    # A hung test must fail the job fast, not burn the 6h default runner
    # allocation. Plain pytest suite — 15 min is a generous ceiling.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/web-fetch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/web-fetch/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest -v
