name: android-app

on:
  push:
    branches: [main]
    paths:
      - "clients/android-app/**"
      - ".github/workflows/android-app.yml"
  pull_request:
    paths:
      - "clients/android-app/**"
      - ".github/workflows/android-app.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Gradle wrapper
        # The wrapper jar isn't checked in (see README). CI regenerates it
        # fresh from the system gradle every run so we never ship a stale
        # binary.
        run: |
          gradle wrapper --gradle-version 8.10.2 --distribution-type bin
        shell: bash

      - name: Lint
        run: ./gradlew :app:lintDebug

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ github.sha }}
          path: clients/android-app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  release:
    # Only build a signed release on main pushes; PRs get debug-only above.
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3

      - name: Generate wrapper
        run: gradle wrapper --gradle-version 8.10.2 --distribution-type bin

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.DROPLET_ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::DROPLET_ANDROID_KEYSTORE_B64 not set — skipping signed release build"
            exit 0
          fi
          mkdir -p $RUNNER_TEMP/keystore
          echo "$KEYSTORE_B64" | base64 -d > $RUNNER_TEMP/keystore/release.keystore
          echo "DROPLET_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/keystore/release.keystore" >> $GITHUB_ENV

      - name: Assemble release AAB
        if: env.DROPLET_ANDROID_KEYSTORE_PATH != ''
        env:
          DROPLET_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.DROPLET_ANDROID_KEYSTORE_PASSWORD }}
          DROPLET_ANDROID_KEY_ALIAS: ${{ secrets.DROPLET_ANDROID_KEY_ALIAS }}
          DROPLET_ANDROID_KEY_PASSWORD: ${{ secrets.DROPLET_ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease

      - name: Upload release AAB
        if: env.DROPLET_ANDROID_KEYSTORE_PATH != ''
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ github.sha }}
          path: clients/android-app/app/build/outputs/bundle/release/*.aab
          retention-days: 90
