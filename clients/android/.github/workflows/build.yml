name: Build Droplet Android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Copy brand overlay
        run: cp -r overlay/* .

      - name: Build APK
        run: ./gradlew assembleRelease -PapplicationId=com.droplet.android

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: droplet-android-apk
          path: app/build/outputs/apk/release/
