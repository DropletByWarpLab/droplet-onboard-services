# Droplet Android client — Gradle brand override.
#
# Place in the root of your nextcloud/android fork to override the package
# name, version, and default server URL.

applicationId=com.droplet.android
versionName=1.0.0
versionCode=1

# Default server for account wizard
droplet.defaultServerUrl=https://droplet.local/nextcloud

# URL scheme for pairing
droplet.urlScheme=droplet
