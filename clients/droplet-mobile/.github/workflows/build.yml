name: Build Droplet Mobile (Android)

on:
  push:
    branches: [main]
    paths:
      - 'clients/droplet-mobile/**'
      - '.github/workflows/droplet-mobile.yml'
  pull_request:
    paths:
      - 'clients/droplet-mobile/**'
  workflow_dispatch:

defaults:
  run:
    working-directory: clients/droplet-mobile

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Validate Gradle wrapper
        run: ./gradlew --version

      - name: Run shared unit tests
        run: ./gradlew :shared:allTests

      - name: Assemble debug APK
        run: ./gradlew :androidApp:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: droplet-android-debug
          path: clients/droplet-mobile/androidApp/build/outputs/apk/debug/*.apk

      - name: Assemble release APK (unsigned)
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./gradlew :androidApp:assembleRelease

      - name: Upload release APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: droplet-android-release-unsigned
          path: clients/droplet-mobile/androidApp/build/outputs/apk/release/*.apk
