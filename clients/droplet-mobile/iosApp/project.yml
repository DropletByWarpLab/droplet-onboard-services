# Generated by `xcodegen generate` (https://github.com/yonaskolb/XcodeGen).
# Run on a Mac with Xcode installed:
#
#   brew install xcodegen
#   cd clients/droplet-mobile/iosApp
#   xcodegen generate
#   open iosApp.xcodeproj
#
# The Run scheme depends on a build phase that asks Gradle to embed the
# DropletShared.framework produced by `shared`'s iosArm64/iosX64/iosSimulatorArm64
# targets. The script invokes Gradle on every build — first-time builds take a
# few minutes; subsequent incremental ones are fast.

name: iosApp

options:
  bundleIdPrefix: com.droplet
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # The Gradle build phase writes the framework into
    # $(CONFIGURATION_BUILD_DIR)/$(FRAMEWORKS_FOLDER_PATH); make sure Xcode
    # looks there for module imports.
    FRAMEWORK_SEARCH_PATHS:
      - $(inherited)
      - $(CONFIGURATION_BUILD_DIR)/$(FRAMEWORKS_FOLDER_PATH)
      - $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)

targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleDisplayName: Droplet
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Camera prompt copy.
        NSCameraUsageDescription: Droplet uses the camera only to read the pair QR. Frames are processed on-device and never uploaded.
        # droplet:// URL scheme so the dashboard QR can hand off to us.
        CFBundleURLTypes:
          - CFBundleURLName: com.droplet.pair
            CFBundleURLSchemes: [droplet]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.droplet.ios
        PRODUCT_NAME: Droplet
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
    preBuildScripts:
      - name: Embed DropletShared from Gradle
        # `embedAndSignAppleFrameworkForXcode` reads $CONFIGURATION + $SDK_NAME
        # + $ARCHS from Xcode's env and writes a fat framework with bitcode/ARM
        # slices appropriate to the current build.
        script: |
          cd "$SRCROOT/.."
          if [ -f "./gradlew" ]; then
            ./gradlew :shared:embedAndSignAppleFrameworkForXcode
          else
            echo "warning: gradlew not found in $SRCROOT/.. — run 'gradle wrapper' from clients/droplet-mobile once."
            exit 1
          fi
        inputFiles:
          - $(SRCROOT)/../shared/build.gradle.kts
        outputFiles:
          - $(BUILT_PRODUCTS_DIR)/$(FRAMEWORKS_FOLDER_PATH)/DropletShared.framework/DropletShared
