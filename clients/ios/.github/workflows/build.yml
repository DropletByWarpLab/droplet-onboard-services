name: Build Droplet iOS

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Copy brand overlay
        run: cp -r overlay/* .

      - name: Build
        run: |
          xcodebuild -scheme Nextcloud -destination 'generic/platform=iOS' \
            -configuration Release \
            PRODUCT_BUNDLE_IDENTIFIER=com.droplet.ios \
            PRODUCT_NAME=Droplet \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: droplet-ios-build
          path: build/
