# ───────────────────────────────────────────────────────────────────
# Droplet development stack — Windows / Docker Desktop friendly.
#
# Brings up the subset of the production compose that doesn't require
# Linux hardware (no AMD GPU, no OpenWrt netns, no iGPU render node,
# no kernel WireGuard). The bound services:
#
#   db          — pgvector/pgvector:pg16 (orchestrator + nextcloud)
#   cache       — redis:7-alpine (no password in dev)
#   broker      — eclipse-mosquitto:2 (anonymous allowed in dev)
#   nextcloud   — nextcloud:29-apache (Files surface)
#   orchestrator— bind-mounted, tsx watch on src/index.ts
#   web-dashboard — bind-mounted, next dev -p 3001
#
# NOT in this stack (intentional — see docker/dev/README.md):
#   ai-gateway, ai-stack, routing, switch, frigate, camera-discovery,
#   voice-io, wyoming-*, oled-display, mcp-server (standalone),
#   device-identity-svc, file-indexer, gateway (nginx)
#
# The orchestrator gracefully handles missing companion services
# (logs a warning, returns degraded state) so the dashboard renders
# from seed data without a perfect external surface.
#
# Quickstart:
#   cp docker/dev/.env.example .env
#   docker compose --env-file .env -f docker/docker-compose.dev.yml up
#   open http://localhost:3001
#
# First boot: ~5 minutes (npm install in each container + Prisma
# migrations + seed + Next.js compile). Subsequent boots: ~30 seconds.
# ───────────────────────────────────────────────────────────────────

services:

  # ─── Postgres (with pgvector for the orchestrator's embeddings) ──
  db:
    image: pgvector/pgvector:pg16
    container_name: droplet-dev-db
    restart: unless-stopped
    environment:
      # Dev-only defaults. Matches the .env.example values so the
      # orchestrator's DATABASE_URL resolves out of the box.
      POSTGRES_USER: ${POSTGRES_USER:-droplet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dropletdev}
      # We seed TWO databases — droplet (orchestrator) and nextcloud.
      # The init script below creates the second one.
      POSTGRES_DB: droplet
    volumes:
      - dev-pgdata:/var/lib/postgresql/data
      - ./init-nextcloud-db.sh:/docker-entrypoint-initdb.d/10-init-nextcloud-db.sh:ro
    ports:
      # Expose to host so dev tools (TablePlus, DataGrip, psql) can attach.
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-droplet}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ─── Redis (sessions, BullMQ queues) ─────────────────────────────
  cache:
    image: redis:7-alpine
    container_name: droplet-dev-cache
    restart: unless-stopped
    # No password in dev — production sets one via REDIS_PASSWORD.
    # The orchestrator's redis client accepts an empty password as
    # "no auth".
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ─── MQTT broker (camera events, smart-home state, chat signals) ─
  broker:
    image: eclipse-mosquitto:2
    container_name: droplet-dev-broker
    restart: unless-stopped
    # Anonymous allowed for dev — production runs the WARP-235 mTLS-only
    # listener (client identity = cert CN, per-CN ACLs; see
    # docs/security/internal-mtls.md).
    command:
      - "sh"
      - "-c"
      - |
        cat > /mosquitto/config/mosquitto.conf <<'CONF'
        listener 1883
        allow_anonymous true
        persistence false
        log_dest stdout
        log_type warning
        log_type error
        CONF
        exec mosquitto -c /mosquitto/config/mosquitto.conf
    ports:
      - "1883:1883"

  # ─── Nextcloud (Files surface — dashboard's /files tab) ──────────
  nextcloud:
    image: nextcloud:29-apache
    container_name: droplet-dev-nextcloud
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: nextcloud
      POSTGRES_USER: ${POSTGRES_USER:-droplet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dropletdev}
      REDIS_HOST: cache
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER:-admin}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD:-dropletdev}
      NEXTCLOUD_TRUSTED_DOMAINS: "localhost nextcloud orchestrator"
      OVERWRITEPROTOCOL: http
    volumes:
      - dev-nextcloud-data:/var/www/html
    ports:
      - "8082:80"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/status.php"]
      interval: 10s
      timeout: 5s
      retries: 20

  # ─── Orchestrator (Express API, port 3000) ───────────────────────
  orchestrator:
    container_name: droplet-dev-orchestrator
    restart: unless-stopped
    build:
      context: ..
      dockerfile: docker/dev/Dockerfile.orchestrator-dev
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
      # WARP-2845: wait for Nextcloud too. The dev seed provisions the dev
      # owner's Nextcloud account over OCS, and Nextcloud's first-boot install
      # is far slower than Postgres + migrate + seed — so without this the very
      # first OCS call reliably lost the race. The seed now repairs itself on a
      # later boot either way, but not racing beats healing.
      nextcloud:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      # ── Database / cache / broker ──
      DATABASE_URL: postgresql://${POSTGRES_USER:-droplet}:${POSTGRES_PASSWORD:-dropletdev}@db:5432/droplet
      # The orchestrator reads REDIS_URL (config.ts) — REDIS_HOST/PORT are
      # Nextcloud's vars. With only those set, cache.service silently fell
      # back to redis://localhost:6379 inside the container: an ioredis
      # reconnect storm and no working cache/claim-rate-limit state in dev.
      REDIS_URL: redis://cache:6379
      MQTT_BROKER: mqtt://broker:1883
      # ── Auth ──
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-do-not-ship}
      DEVICE_SECRET: ${DEVICE_SECRET:-dev-only-device-secret-do-not-ship}
      # WARP-2844 — the column-encryption master key. WITHOUT IT THE SETUP
      # WIZARD CANNOT COMPLETE, so the dev stack had no way to create an
      # account at all: emailWriteData HKDFs the User.email column key from
      # this value and deviceIkm() throws when it is empty
      # (column-crypto.service.ts:40-50), so POST /auth/setup answered
      # 500 SETUP_FAILED on every dev stack. config.ts defaults it to "" and
      # compose never passed it — same class as the NEXTCLOUD_ADMIN_* note
      # below, which was found the same way.
      #
      # Must base64-decode to EXACTLY 32 bytes or deviceIkm() throws a
      # different error. Never copy a real box's value in, and never change it
      # on a stack that already has users: both the email ciphertext and the
      # emailLookupHash blind index derive from it, so a change silently 401s
      # every existing login rather than failing loudly.
      DEVICE_SECRET_KEY: ${DEVICE_SECRET_KEY:-ZHJvcGxldC1kZXYtY29sdW1uLWtleS0zMmJ5dGVzISE=}
      # Audit-chain signing key (WARP-456/476). The container has no /data
      # mount, so the env fallback is the only source in dev; without it the
      # orchestrator fails closed at boot. base64 of a ≥32-byte dev string.
      AUDIT_SIGNING_KEY: ${AUDIT_SIGNING_KEY:-ZGV2LW9ubHktYXVkaXQtc2lnbmluZy1rZXktZG8tbm90LXNoaXAtMzJi}
      # ── First-run claim code. On the box the minted code renders on the
      #    lid display; the dev stack has no display, so pass a known code
      #    through so the wizard's Claim step is walkable locally. ──
      CLAIM_CODE: ${CLAIM_CODE:-}
      # ── Companion services. URLs intentionally point at non-existent
      #    hosts; the orchestrator should gracefully degrade. ──
      NEXTCLOUD_URL: http://nextcloud:80
      # nextcloud.client authenticates to the OCS API as the Nextcloud
      # admin (defaults admin/admin). Without these, the wizard's account
      # step 500s — "Cannot reach Nextcloud OCS API: 401". Must match the
      # nextcloud service's NEXTCLOUD_ADMIN_* above.
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER:-admin}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD:-dropletdev}
      AI_GATEWAY_URL: http://ai-gateway-disabled:8000
      AI_GATEWAY_GRPC_URL: ai-gateway-disabled:50051
      ROUTING_SERVICE_URL: http://routing-disabled:8080
      ROUTING_SERVICE_TOKEN: dev-routing-token-unused
      # "disabled" is the WARP-44 short-circuit (no network calls at all).
      # "mock" is a unit-test seam, NOT a network stub — with it every
      # routing call still fetched routing-disabled:8080, and the poller
      # retry storm (device-reconcile, ap-discovery, schedule-ticker)
      # saturated the event loop until wizard endpoints took 25s+.
      ROUTING_MODE: disabled
      SWITCH_SERVICE_URL: http://switch-disabled:8081
      DISPLAY_SERVICE_URL: http://display-disabled:8082
      FRIGATE_URL: http://frigate-disabled:5000
      # ── FIPS off in dev (no provider available on this base image) ──
      DROPLET_FIPS_REQUIRED: "false"
      # ── WARP-2844: module availability ──
      # A module is effective iff `available && enabled`, and availability is a
      # CONFIG READ, not a health probe (module-registry.ts:92-98) — which is
      # why cameras/network/switch/smart_home all read as available here with
      # no hardware attached: their config defaults are non-empty URLs.
      #
      # These three are the exception. Their defaults are the EMPTY STRING, so
      # without them `docs`, `email` and `voice` are not merely off — they
      # cannot be turned on at all: setModuleEnabled answers 409
      # module_unavailable and no API call or UI toggle gets past it.
      #
      # The values are deliberately unreachable hosts/placeholder tokens. The
      # surfaces render and their backend calls degrade, which is the point:
      # a developer can walk every screen without owning a Droplet.
      DOCS_ENABLED: ${DOCS_ENABLED:-1}
      DOCS_INTERNAL_URL: ${DOCS_INTERNAL_URL:-http://docs-disabled:9980}
      SERVICE_TOKEN_EMAIL: ${SERVICE_TOKEN_EMAIL:-dev-only-email-token-unused}
      SERVICE_TOKEN_VOICE: ${SERVICE_TOKEN_VOICE:-dev-only-voice-token-unused}
      # Household group name — the seed puts the dev owner in it so the Files
      # space has an identity. Matches the occ init script's group folder.
      DROPLET_SHARED_FOLDER_NAME: ${DROPLET_SHARED_FOLDER_NAME:-Household}
      # ── Seed dev data on first boot (idempotent) ──
      DROPLET_DEV_SEED: "1"
      # ── WARP-2844: the seeded dev owner ──
      # NO DEFAULT for the password, on purpose. Unset means the seed skips
      # the account entirely and says so; it must never fall back to a
      # well-known credential, because a tracked default password on an
      # owner-role account is a backdoor no matter which file it lives in.
      # The seed additionally refuses when NODE_ENV=production and whenever an
      # owner already exists — see src/services/dev-owner-seed.policy.ts.
      DROPLET_DEV_OWNER_EMAIL: ${DROPLET_DEV_OWNER_EMAIL:-dev@warp-lab.ai}
      DROPLET_DEV_OWNER_PASSWORD: ${DROPLET_DEV_OWNER_PASSWORD:-}
      # ── CORS for the dashboard reaching the API from the browser ──
      CORS_ORIGINS: http://localhost:3001,http://localhost:3000
      # ── File storage ──
      BRAIN_MEMORY_ROOT: /workspace/.dev-data/brain-memory
      MATTER_STORAGE_PATH: /workspace/.dev-data/matter-storage
      NEXTCLOUD_DATA_ROOT: /workspace/.dev-data/nextcloud-data
    volumes:
      # Bind-mount the whole repo so workspace symlinks resolve + edits
      # hot-reload. Named volumes shadow node_modules at each workspace
      # level so the Windows host never has to serve those files.
      - ..:/workspace
      - dev-workspace-modules:/workspace/node_modules
      - dev-orchestrator-modules:/workspace/apps/orchestrator/node_modules
      - dev-tools-core-modules:/workspace/packages/tools-core/node_modules
      - dev-fips-selftest-modules:/workspace/packages/fips-selftest/node_modules
      - dev-mcp-server-modules:/workspace/services/mcp-server/node_modules
      - dev-dashboard-modules:/workspace/apps/web-dashboard/node_modules
      - dev-ai-gateway-modules:/workspace/services/ai-gateway/node_modules

  # ─── Web dashboard (Next.js, port 3001) ──────────────────────────
  web-dashboard:
    container_name: droplet-dev-dashboard
    restart: unless-stopped
    build:
      context: ..
      dockerfile: docker/dev/Dockerfile.dashboard-dev
    depends_on:
      orchestrator:
        condition: service_started
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      PORT: 3001
      # Server-side rewrite target — used by next.config.js so /api/*
      # from the browser proxies to the orchestrator container by
      # service name (NOT localhost, which would be the dashboard
      # container itself).
      ORCHESTRATOR_INTERNAL_URL: http://orchestrator:3000
      # File watcher polling — bind-mounts on Windows don't fire
      # inotify events reliably. Polling costs CPU but is predictable.
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "500"
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - ..:/workspace
      - dev-workspace-modules:/workspace/node_modules
      - dev-dashboard-modules:/workspace/apps/web-dashboard/node_modules
      - dev-orchestrator-modules:/workspace/apps/orchestrator/node_modules
      - dev-tools-core-modules:/workspace/packages/tools-core/node_modules
      - dev-fips-selftest-modules:/workspace/packages/fips-selftest/node_modules
      - dev-mcp-server-modules:/workspace/services/mcp-server/node_modules
      - dev-ai-gateway-modules:/workspace/services/ai-gateway/node_modules
      # Next.js writes .next/ during dev — keep it container-local
      # (named volume) so the Windows host doesn't see thousands of
      # invalidations per save.
      - dev-dashboard-next:/workspace/apps/web-dashboard/.next

# ─────────────────────────────────────────────────────────────────
# Volumes
#   pgdata + nextcloud-data: persistent state, survives `down`/`up`
#   *-modules: per-workspace node_modules, shadow the Windows bind
#     mount so npm install lands in the Linux filesystem (fast)
#   dashboard-next: Next.js build cache, container-local for speed
# ─────────────────────────────────────────────────────────────────
volumes:
  dev-pgdata:
  dev-nextcloud-data:
  dev-workspace-modules:
  dev-orchestrator-modules:
  dev-dashboard-modules:
  dev-tools-core-modules:
  dev-fips-selftest-modules:
  dev-mcp-server-modules:
  dev-ai-gateway-modules:
  dev-dashboard-next:
