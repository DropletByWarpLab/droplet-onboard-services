# POC overrides on top of docker-compose.yml.
#   - FIPS provider not layered on host -> stock OpenSSL on Node services.
#   - No /dev/tpm0 on consumer Ryzen -> mock TPM backend.
#   - dGPU reserved for Ollama -> Frigate's render node remapped to iGPU.
#   - Ollama runs in-container with native gfx1200 (no HSA_OVERRIDE), pinned
#     to the dGPU, models persisted in named volume.
#   - OpenWrt runs in-container, owns the MT7921 WiFi card (passed via netns
#     by scripts/poc-attach-wifi.sh after start) for the customer AP.
services:
  orchestrator:
    environment:
      OPENSSL_CONF: ""
      DROPLET_FIPS_REQUIRED: "false"
  mcp-server:
    environment:
      OPENSSL_CONF: ""
      DROPLET_FIPS_REQUIRED: "false"
  ai-gateway:
    environment:
      OPENSSL_CONF: ""
      DROPLET_FIPS_REQUIRED: "false"
      JETSON_OLLAMA_URL: "http://ollama:11434"
  device-identity-svc:
    environment:
      DROPLET_TPM_BACKEND: "mock"
      DROPLET_FIPS_REQUIRED: "false"
  frigate:
    devices:
      - "/dev/bus/usb:/dev/bus/usb"
      - "/dev/dri/renderD129:/dev/dri/renderD128"

  # ============================================================
  # Ollama (ROCm) - local LLM inference on the AMD dGPU.
  # ============================================================
  ollama:
    image: ollama/ollama:rocm
    container_name: droplet-ollama
    restart: unless-stopped
    expose:
      - "11434"
    ports:
      - "127.0.0.1:11434:11434"
    devices:
      - "/dev/kfd:/dev/kfd"
      - "/dev/dri/renderD128:/dev/dri/renderD128"
    group_add:
      - "993"
      - "44"
    environment:
      ROCR_VISIBLE_DEVICES: "0"
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_KEEP_ALIVE: "24h"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "--version"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ============================================================
  # OpenWrt router-in-container (POC).
  # ============================================================
  openwrt:
    image: openwrt/rootfs:x86_64-24.10.2
    container_name: droplet-openwrt
    hostname: openwrt
    command: /sbin/init
    privileged: true
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    tmpfs:
      - /tmp
      - /run
    volumes:
      - openwrt-config:/etc/config
      - openwrt-overlay:/overlay

volumes:
  ollama-data:
  openwrt-config:
  openwrt-overlay:
