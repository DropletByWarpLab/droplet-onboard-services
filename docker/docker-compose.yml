# IMPORTANT: Run ./scripts/setup.sh before starting services.
# This file contains NO secret interpolation — all secrets flow through .env
# via env_file. This means compose commands (down, ps, logs) always work,
# even without .env. The setup script validates secrets before starting.

services:
  # --- Ingress ---
  gateway:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      orchestrator:
        condition: service_started
      web-dashboard:
        condition: service_started
    restart: always

  # --- Apps ---
  # NOTE: No host ports exposed — Nginx routes all traffic internally.
  # This avoids conflicts with local dev servers (npm run dev on 3000/3001).
  web-dashboard:
    build:
      context: ../apps/web-dashboard
      dockerfile: Dockerfile
    expose:
      - "3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
    restart: always

  orchestrator:
    build:
      context: ../apps/orchestrator
      dockerfile: Dockerfile
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started
      broker:
        condition: service_started
    env_file:
      - path: ../.env
        required: false
    environment:
      # Static config only — all secrets come from .env via env_file
      - PORT=3000
      - AI_GATEWAY_URL=http://ai-gateway:8000
      - HOMEASSISTANT_URL=http://homeassistant:8123
      - NEXTCLOUD_URL=http://nextcloud:80
      - MATTER_STORAGE_PATH=/data/matter-storage
      - MATTER_CONTROLLER_NAME=${MATTER_CONTROLLER_NAME:-Droplet}
      # NOTE: Uses localhost because the routing service runs with network_mode: host.
      # If routing moves to bridge networking, change to http://routing:8080.
      - ROUTING_SERVICE_URL=${ROUTING_SERVICE_URL:-http://localhost:8080}
      - FRIGATE_URL=${FRIGATE_URL:-http://frigate:5000}
    volumes:
      - matter-data:/data/matter-storage
    restart: always

  # --- Nextcloud (headless backend) ---
  nextcloud:
    image: nextcloud:29-apache
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started
    env_file:
      - path: ../.env
        required: false
    environment:
      # Static Nextcloud config — passwords come from .env via env_file
      - POSTGRES_HOST=db
      - POSTGRES_DB=nextcloud
      - REDIS_HOST=cache
      - NEXTCLOUD_TRUSTED_DOMAINS=localhost nextcloud gateway
      - OVERWRITEPROTOCOL=https
    volumes:
      - nextcloud-data:/var/www/html
      - ./nextcloud-skeleton:/skeleton:ro
      - ./nextcloud-init.sh:/docker-entrypoint-hooks.d/post-installation/init-droplet.sh:ro
    restart: always

  # --- Infrastructure ---
  db:
    image: postgres:16-alpine
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-nextcloud-db.sh:/docker-entrypoint-initdb.d/init-nextcloud-db.sh:ro
    env_file:
      - path: ../.env
        required: false
    environment:
      - POSTGRES_USER=droplet
      - POSTGRES_DB=droplet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U droplet"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  cache:
    image: redis:7-alpine
    env_file:
      - path: ../.env
        required: false
    command: ["sh", "-c", "redis-server --requirepass \"$REDIS_PASSWORD\""]
    restart: always

  broker:
    image: eclipse-mosquitto:2
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto_passwd_dir:/mosquitto/config/passwd_dir:ro
    restart: always

  # --- AI Services ---
  ai-gateway:
    build:
      context: ../services/ai-gateway
      dockerfile: Dockerfile
    expose:
      - "8000"
      - "50051"
    env_file:
      - path: ../.env
        required: false
    environment:
      # Static config only — secrets come from .env via env_file
      - ORCHESTRATOR_URL=http://orchestrator:3000
      - GRPC_PORT=50051
    volumes:
      - aikeys:/data/keys
    depends_on:
      - cache
      - broker
      - orchestrator
    restart: always

  # --- Home Assistant ---
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    ports:
      - "8123:8123"
    volumes:
      - ha-config:/config
    environment:
      - TZ=UTC
    restart: always

  # --- File indexer (Phase 4: AI content search) ---
  # Watches the Nextcloud data volume for file changes, extracts text,
  # computes embeddings via the ai-gateway gRPC, and stores them in
  # pgvector for semantic search. Read-only access to Nextcloud data.
  file-indexer:
    build:
      context: ../services/file-indexer
      dockerfile: Dockerfile
    volumes:
      - nextcloud-data:/data/nextcloud:ro
      - ../proto:/app/proto:ro
    env_file:
      - path: ../.env
        required: false
    environment:
      - DATABASE_URL=postgresql://droplet:${POSTGRES_PASSWORD}@db:5432/droplet
      - MQTT_BROKER=mqtt://${MQTT_USER:-droplet}:${MQTT_PASSWORD}@broker:1883
      - NEXTCLOUD_DATA_ROOT=/data/nextcloud/data
      - AI_GATEWAY_GRPC_URL=ai-gateway:50051
    depends_on:
      db:
        condition: service_healthy
      ai-gateway:
        condition: service_started
      broker:
        condition: service_started
    profiles: ["full"]
    restart: always

  # --- Routing (OpenWrt control) ---
  routing:
    build:
      context: ../services/routing
      dockerfile: Dockerfile
    network_mode: host
    cap_add:
      - NET_ADMIN
    environment:
      - OPENWRT_HOST=${OPENWRT_HOST:-10.0.0.1}
      - OPENWRT_PORT=${OPENWRT_PORT:-80}
      - OPENWRT_USERNAME=${OPENWRT_USERNAME:-droplet-ai}
      - OPENWRT_PASSWORD=${OPENWRT_PASSWORD:-}
      - PORT=8080
    profiles: ["full"]
    restart: always

  # --- Frigate NVR (camera management + AI detection) ---
  frigate:
    image: ghcr.io/blakeblackshear/frigate:stable-tensorrt
    shm_size: "256mb"
    runtime: nvidia
    cap_add:
      - SYS_RAWIO      # GPU access for TensorRT
    expose:
      - "8971"
      - "5000"
      - "8554"
      - "8555"
    devices:
      - /dev/bus/usb:/dev/bus/usb              # USB cameras
      - /dev/dri/renderD128:/dev/dri/renderD128  # GPU render node
    volumes:
      - frigate-config:/config
      - nvrdata:/media/frigate
      - /etc/localtime:/etc/localtime:ro
      - ../docker/frigate/config.yml:/config/config.yml:ro
    env_file:
      - path: ../.env
        required: false
    environment:
      # Static config — FRIGATE_MQTT_USER and FRIGATE_MQTT_PASSWORD from .env
      - FRIGATE_MQTT_HOST=broker
      - FRIGATE_MQTT_PORT=1883
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    depends_on:
      - broker
    profiles: ["full"]
    restart: always

  # --- Camera auto-discovery (ONVIF + RTSP scanning) ---
  camera-discovery:
    build:
      context: ../services/camera-discovery
      dockerfile: Dockerfile
    network_mode: host
    cap_add:
      - NET_ADMIN
    env_file:
      - path: ../.env
        required: false
    environment:
      # Host-mode service — uses MQTT_BROKER_LOCAL from .env (localhost, not broker)
      - MQTT_BROKER=${MQTT_BROKER_LOCAL:-mqtt://localhost:1883}
      - ROUTING_SERVICE_URL=${ROUTING_SERVICE_URL:-http://localhost:8080}
      - FRIGATE_URL=http://localhost:5000
      - SCAN_INTERVAL=${CAMERA_SCAN_INTERVAL:-30}
      - CAMERA_SUBNET=${CAMERA_SUBNET:-192.168.100.0/24}
    depends_on:
      - frigate
      - broker
    profiles: ["full"]
    restart: always

volumes:
  pgdata:
  nvrdata:
  frigate-config:
  aikeys:
  nextcloud-data:
  ha-config:
  matter-data:
