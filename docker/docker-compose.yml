# IMPORTANT: Run ./scripts/setup.sh before starting services.
# This file contains NO secret interpolation — all secrets flow through .env
# via env_file. This means compose commands (down, ps, logs) always work,
# even without .env. The setup script validates secrets before starting.

services:
  # --- Ingress ---
  gateway:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      orchestrator:
        condition: service_started
      web-dashboard:
        condition: service_started
    restart: always

  # --- Apps ---
  # NOTE: No host ports exposed — Nginx routes all traffic internally.
  # This avoids conflicts with local dev servers (npm run dev on 3000/3001).
  web-dashboard:
    build:
      context: ../apps/web-dashboard
      dockerfile: Dockerfile
    expose:
      - "3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
    restart: always

  orchestrator:
    build:
      context: ../apps/orchestrator
      dockerfile: Dockerfile
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started
      broker:
        condition: service_started
    env_file:
      - path: ../.env
        required: false
    environment:
      # Static config only — all secrets come from .env via env_file
      - PORT=3000
      - AI_GATEWAY_URL=http://ai-gateway:8000
      - HOMEASSISTANT_URL=http://homeassistant:8123
      - NEXTCLOUD_URL=http://nextcloud:80
      - MATTER_STORAGE_PATH=/data/matter-storage
      - MATTER_CONTROLLER_NAME=${MATTER_CONTROLLER_NAME:-Droplet}
      # NOTE: Uses localhost because the routing service runs with network_mode: host.
      # If routing moves to bridge networking, change to http://routing:8080.
      - ROUTING_SERVICE_URL=${ROUTING_SERVICE_URL:-http://localhost:8080}
      - ROUTING_SERVICE_TOKEN=${ROUTING_SERVICE_TOKEN:-}
      # WARP-44: `real` (default) / `mock` / `disabled`. When disabled the
      # orchestrator short-circuits router calls and the dashboard surfaces a
      # "Router supervision disabled" banner. `mock` is handled on the routing
      # side — orchestrator still calls the endpoints as normal.
      - ROUTING_MODE=${ROUTING_MODE:-real}
      - FRIGATE_URL=${FRIGATE_URL:-http://frigate:5000}
      # NOTE: Uses localhost because the oled-display service runs with network_mode: host.
      - DISPLAY_SERVICE_URL=${DISPLAY_SERVICE_URL:-http://localhost:8082}
    volumes:
      - matter-data:/data/matter-storage
    # WARP-43: rolled-up health includes postgres, redis, routing, ai-gateway,
    # nextcloud. A `down` aggregate returns HTTP 503 so Docker restarts this
    # container when a HARD dependency (postgres) is lost.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/orchestrator/health >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    restart: always

  # --- Nextcloud (headless backend) ---
  nextcloud:
    image: nextcloud:29-apache
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started
    env_file:
      - path: ../.env
        required: false
    environment:
      # Static Nextcloud config — passwords come from .env via env_file
      - POSTGRES_HOST=db
      - POSTGRES_DB=nextcloud
      - REDIS_HOST=cache
      - NEXTCLOUD_TRUSTED_DOMAINS=localhost nextcloud gateway
      - OVERWRITEPROTOCOL=https
    volumes:
      - nextcloud-data:/var/www/html
      - ./nextcloud-skeleton:/skeleton:ro
      - ./nextcloud-init.sh:/docker-entrypoint-hooks.d/post-installation/init-droplet.sh:ro
    restart: always

  # --- Infrastructure ---
  db:
    # pgvector/pgvector:pg16 = official postgres 16 image + pgvector extension
    # pre-installed. The 20260412000000_add_file_content_index migration
    # needs `CREATE EXTENSION vector`, which plain postgres:16-alpine lacks.
    image: pgvector/pgvector:pg16
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-nextcloud-db.sh:/docker-entrypoint-initdb.d/init-nextcloud-db.sh:ro
    env_file:
      - path: ../.env
        required: false
    environment:
      - POSTGRES_USER=droplet
      - POSTGRES_DB=droplet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U droplet"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  cache:
    image: redis:7-alpine
    env_file:
      - path: ../.env
        required: false
    command: ["sh", "-c", "redis-server --requirepass \"$REDIS_PASSWORD\""]
    restart: always

  broker:
    image: eclipse-mosquitto:2
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto_passwd_dir:/mosquitto/config/passwd_dir:ro
    restart: always

  # --- AI Services ---
  ai-gateway:
    build:
      context: ../services/ai-gateway
      dockerfile: Dockerfile
    expose:
      - "8000"
      - "50051"
    env_file:
      - path: ../.env
        required: false
    environment:
      # Static config only — secrets come from .env via env_file
      - ORCHESTRATOR_URL=http://orchestrator:3000
      - GRPC_PORT=50051
      - CORS_ORIGINS=https://localhost,http://localhost,https://localhost:3001,http://localhost:3001
    volumes:
      - aikeys:/data/keys
    depends_on:
      - cache
      - broker
      - orchestrator
    restart: always

  # --- Home Assistant ---
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    ports:
      - "8123:8123"
    volumes:
      - ha-config:/config
    environment:
      - TZ=UTC
    restart: always

  # --- File indexer (Phase 4: AI content search) ---
  # Watches the Nextcloud data volume for file changes, extracts text,
  # computes embeddings via the ai-gateway gRPC, and stores them in
  # pgvector for semantic search. Read-only access to Nextcloud data.
  file-indexer:
    build:
      # Repo root as context so Dockerfile can `COPY proto/` at build time
      # (proto/ lives outside the service dir). All COPY paths in the
      # Dockerfile are relative to the monorepo root.
      context: ..
      dockerfile: services/file-indexer/Dockerfile
    volumes:
      - nextcloud-data:/data/nextcloud:ro
      - ../proto:/app/proto:ro
    env_file:
      - path: ../.env
        required: false
    environment:
      - DATABASE_URL=postgresql://droplet:${POSTGRES_PASSWORD}@db:5432/droplet
      - MQTT_BROKER=mqtt://${MQTT_USER:-droplet}:${MQTT_PASSWORD}@broker:1883
      - NEXTCLOUD_DATA_ROOT=/data/nextcloud/data
      - AI_GATEWAY_GRPC_URL=ai-gateway:50051
    depends_on:
      db:
        condition: service_healthy
      ai-gateway:
        condition: service_started
      broker:
        condition: service_started
    profiles: ["full"]
    restart: always

  # --- Routing (OpenWrt control) ---
  # WARP-44: default dependency — starts on every `docker compose up`. Set
  # ROUTING_MODE=mock in .env to run without a real router (fixtures).
  routing:
    build:
      context: ../services/routing
      dockerfile: Dockerfile
    network_mode: host
    cap_add:
      - NET_ADMIN
    environment:
      - OPENWRT_HOST=${OPENWRT_HOST:-10.0.0.1}
      - OPENWRT_PORT=${OPENWRT_PORT:-80}
      - OPENWRT_USERNAME=${OPENWRT_USERNAME:-droplet-ai}
      # OPENWRT_PASSWORD is read from /run/secrets/openwrt_password (WARP-37).
      # No longer exposed via `docker inspect`.
      # ROUTING_SERVICE_TOKEN (WARP-36) replaces PR#5's SERVICE_SECRET for this service.
      - ROUTING_SERVICE_TOKEN=${ROUTING_SERVICE_TOKEN:-}
      # WARP-44: `real` (default) = connect to OpenWrt. `mock` = serve fixtures
      # so dev laptops without a router get a realistic UI. `disabled` is an
      # orchestrator-side concern; this service still runs fine with it.
      - ROUTING_MODE=${ROUTING_MODE:-real}
      - PORT=8080
    secrets:
      - openwrt_password
    restart: always

  # --- Managed Switch (PoE + VLAN control) ---
  switch:
    build:
      context: ../services/switch
      dockerfile: Dockerfile
    network_mode: host
    environment:
      - SWITCH_HOST=${SWITCH_HOST:-192.168.1.77}
      - SWITCH_PORT=${SWITCH_PORT:-443}
      - SWITCH_USERNAME=${SWITCH_USERNAME:-admin}
      - SWITCH_PASSWORD=${SWITCH_PASSWORD:-}
      - SWITCH_DRIVER=${SWITCH_DRIVER:-lantronix}
      - SERVICE_SECRET=${DEVICE_SECRET_KEY:-}
      - PORT=8081
    profiles: ["full"]
    restart: always

  # --- Managed Switch (PoE + VLAN control) ---
  switch:
    build:
      context: ../services/switch
      dockerfile: Dockerfile
    network_mode: host
    environment:
      - SWITCH_HOST=${SWITCH_HOST:-192.168.1.77}
      - SWITCH_PORT=${SWITCH_PORT:-443}
      - SWITCH_USERNAME=${SWITCH_USERNAME:-admin}
      - SWITCH_PASSWORD=${SWITCH_PASSWORD:-}
      - SWITCH_DRIVER=${SWITCH_DRIVER:-lantronix}
      - PORT=8081
    profiles: ["full"]
    restart: always

  # --- Frigate NVR (camera management + AI detection) ---
  # Always runs — even with zero cameras. Ready to accept cameras later
  # via auto-discovery or manual add in the dashboard.
  # Override FRIGATE_IMAGE in .env for GPU-accelerated variant:
  #   FRIGATE_IMAGE=ghcr.io/blakeblackshear/frigate:stable-tensorrt
  frigate:
    image: ${FRIGATE_IMAGE:-ghcr.io/blakeblackshear/frigate:stable}
    shm_size: "256mb"
    expose:
      - "8971"
      - "5000"
      - "8554"
      - "8555"
    devices:
      - /dev/bus/usb:/dev/bus/usb              # USB cameras
      - /dev/dri/renderD128:/dev/dri/renderD128  # GPU render node
    volumes:
      - frigate-config:/config
      - nvrdata:/media/frigate
      - /etc/localtime:/etc/localtime:ro
      - ../docker/frigate/config.yml:/config/config.yml:ro
    env_file:
      - path: ../.env
        required: false
    environment:
      # Static config — FRIGATE_MQTT_USER and FRIGATE_MQTT_PASSWORD from .env
      - FRIGATE_MQTT_HOST=broker
      - FRIGATE_MQTT_PORT=1883
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    depends_on:
      - broker
    restart: always

  # --- Camera auto-discovery (ONVIF + RTSP scanning) ---
  camera-discovery:
    build:
      context: ../services/camera-discovery
      dockerfile: Dockerfile
    network_mode: host
    cap_add:
      - NET_ADMIN
    env_file:
      - path: ../.env
        required: false
    environment:
      # Host-mode service — uses MQTT_BROKER_LOCAL from .env (localhost, not broker)
      - MQTT_BROKER=${MQTT_BROKER_LOCAL:-mqtt://localhost:1883}
      - ROUTING_SERVICE_URL=${ROUTING_SERVICE_URL:-http://localhost:8080}
      - ROUTING_SERVICE_TOKEN=${ROUTING_SERVICE_TOKEN:-}
      - FRIGATE_URL=http://localhost:5000
      - SCAN_INTERVAL=${CAMERA_SCAN_INTERVAL:-30}
      - CAMERA_SUBNET=${CAMERA_SUBNET:-192.168.100.0/24}
    depends_on:
      - frigate
      - broker
    profiles: ["full"]
    restart: always

  # --- TFT Display (Inland 3.5" 480x320 ILI9481 + XPT2046 touch, SPI) ---
  # Directory name stays `oled-display` for compat with orchestrator client.
  #
  # `privileged: true` is needed because the Jetson.GPIO chardev ioctls
  # are blocked by Docker's default seccomp/AppArmor profile even with
  # `cap_add: SYS_RAWIO`. The alternative is a custom seccomp profile
  # explicitly allowing GPIO ioctls; privileged is simpler and this
  # service already has full /dev access anyway.
  #
  # `JETSON_MODEL_NAME` short-circuits Jetson.GPIO's auto-detection,
  # which fails inside the container because /proc/device-tree isn't
  # remounted from the host. We also bind the device tree directory for
  # any code path that falls through to file-based detection.
  oled-display:
    privileged: true
    build:
      context: ../services/oled-display
      dockerfile: Dockerfile
    network_mode: host
    cap_add:
      - SYS_RAWIO
    environment:
      - SERVICE_SECRET=${DEVICE_SECRET_KEY:-}
      - PORT=8082
      - DISPLAY_BACKEND=${DISPLAY_BACKEND:-auto}
      - FB_DEVICE=${FB_DEVICE:-/dev/fb1}
      - SPI_DEVICE=/dev/spidev0.0
      - LCD_DRIVER=${LCD_DRIVER:-ili9486}
      - LCD_WIDTH=480
      - LCD_HEIGHT=320
      - LCD_ROTATE=${LCD_ROTATE:-1}
      - SPI_HZ=${SPI_HZ:-32000000}
      - DC_PIN=18
      - RST_PIN=22
      - TOUCH_BACKEND=${TOUCH_BACKEND:-auto}
      - TOUCH_CS=1
      - JETSON_MODEL_NAME=${JETSON_MODEL_NAME:-JETSON_ORIN_NANO}
      # PyPortal backend — if $PYPORTAL_TTY exists inside the container, the
      # service uses it instead of the SPI / framebuffer path when
      # DISPLAY_BACKEND=auto or =pyportal. See services/oled-display/pyportal/.
      - PYPORTAL_TTY=${PYPORTAL_TTY:-/dev/ttyACM1}
      - PYPORTAL_BAUD=${PYPORTAL_BAUD:-115200}
    devices:
      - /dev/spidev0.0:/dev/spidev0.0
      - /dev/spidev0.1:/dev/spidev0.1
      - /dev/gpiochip0:/dev/gpiochip0
      # fb1 / input event devices are mounted below via volumes when present.
    volumes:
      - /dev:/dev:rw
      - /sys/firmware/devicetree/base:/sys/firmware/devicetree/base:ro
    profiles: ["full"]
    restart: always

secrets:
  # WARP-37: OpenWrt router password mounted read-only at /run/secrets/openwrt_password
  # in the routing container. Written by scripts/setup.sh from $OPENWRT_PASSWORD.
  openwrt_password:
    file: ../docker/secrets/openwrt_password

volumes:
  pgdata:
  nvrdata:
  frigate-config:
  aikeys:
  nextcloud-data:
  ha-config:
  matter-data:
