services:
  # --- Ingress ---
  gateway:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api-server:
        condition: service_started
      web-dashboard:
        condition: service_started
    restart: always

  # --- Apps ---
  web-dashboard:
    build:
      context: ../apps/web-dashboard
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
    restart: always

  api-server:
    build:
      context: ../apps/api-server
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started
      broker:
        condition: service_started
    environment:
      - DATABASE_URL=postgresql://droplet:droplet@db:5432/droplet
      - REDIS_URL=redis://cache:6379
      - MQTT_BROKER=mqtt://broker:1883
      - AI_GATEWAY_URL=http://ai-gateway:8000
      - FILES_ROOT=/data/files
      - PORT=3000
    volumes:
      - filedata:/data/files
    restart: always

  # --- Infrastructure ---
  db:
    image: postgres:16-alpine
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=droplet
      - POSTGRES_PASSWORD=droplet
      - POSTGRES_DB=droplet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U droplet"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  cache:
    image: redis:7-alpine
    restart: always

  broker:
    image: eclipse-mosquitto:2
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: always

  # --- AI Services ---
  ai-gateway:
    build:
      context: ../services/ai-gateway
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - JETSON_OLLAMA_URL=http://jetson-ai.local:11434
      - REDIS_URL=redis://cache:6379
      - MQTT_BROKER=mqtt://broker:1883
      - DEVICE_SECRET=dev-secret-change-in-production
    volumes:
      - aikeys:/data/keys
    depends_on:
      - cache
      - broker
    restart: always

  # --- Services (full profile — not needed for vertical slice) ---
  routing:
    build:
      context: ../services/routing
      dockerfile: Dockerfile
    network_mode: host
    cap_add:
      - NET_ADMIN
    profiles: ["full"]
    restart: always

  file-sync:
    build:
      context: ../services/file-sync
      dockerfile: Dockerfile
    volumes:
      - filedata:/data/files
    environment:
      - DATABASE_URL=postgresql://droplet:droplet@db:5432/droplet
      - MQTT_BROKER=mqtt://broker:1883
      - FILES_ROOT=/data/files
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_started
    restart: always

  nvr:
    build:
      context: ../services/nvr
      dockerfile: Dockerfile
    volumes:
      - nvrdata:/data/recordings
    profiles: ["full"]
    restart: always

volumes:
  pgdata:
  filedata:
  nvrdata:
  aikeys:
