services:
  # --- Ingress ---
  gateway:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      orchestrator:
        condition: service_started
      web-dashboard:
        condition: service_started
    restart: always

  # --- Apps ---
  web-dashboard:
    build:
      context: ../apps/web-dashboard
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
    restart: always

  orchestrator:
    build:
      context: ../apps/orchestrator
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started
      broker:
        condition: service_started
    environment:
      - DATABASE_URL=postgresql://droplet:droplet@db:5432/droplet
      - REDIS_URL=redis://cache:6379
      - MQTT_BROKER=mqtt://broker:1883
      - AI_GATEWAY_URL=http://ai-gateway:8000
      - FILES_ROOT=/data/files
      - PORT=3000
      - STORAGE_BACKEND=nextcloud
      - NEXTCLOUD_URL=http://nextcloud:80
      - AUTH_ENABLED=true
    volumes:
      - filedata:/data/files
    restart: always

  # --- Nextcloud (headless backend) ---
  nextcloud:
    image: nextcloud:29-apache
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_DB=nextcloud
      - POSTGRES_USER=droplet
      - POSTGRES_PASSWORD=droplet
      - NEXTCLOUD_ADMIN_USER=admin
      - NEXTCLOUD_ADMIN_PASSWORD=admin
      - REDIS_HOST=cache
      - NEXTCLOUD_TRUSTED_DOMAINS=localhost nextcloud gateway
      - OVERWRITEPROTOCOL=http
    volumes:
      - nextcloud-data:/var/www/html
    restart: always

  # --- Infrastructure ---
  db:
    image: postgres:16-alpine
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-nextcloud-db.sh:/docker-entrypoint-initdb.d/init-nextcloud-db.sh:ro
    environment:
      - POSTGRES_USER=droplet
      - POSTGRES_PASSWORD=droplet
      - POSTGRES_DB=droplet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U droplet"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  cache:
    image: redis:7-alpine
    restart: always

  broker:
    image: eclipse-mosquitto:2
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: always

  # --- AI Services ---
  ai-gateway:
    build:
      context: ../services/ai-gateway
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - JETSON_OLLAMA_URL=http://jetson-ai.local:11434
      - REDIS_URL=redis://cache:6379
      - MQTT_BROKER=mqtt://broker:1883
      - DEVICE_SECRET=dev-secret-change-in-production
    volumes:
      - aikeys:/data/keys
    depends_on:
      - cache
      - broker
    restart: always

  # --- Home Assistant ---
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    ports:
      - "8123:8123"
    volumes:
      - ha-config:/config
    environment:
      - TZ=UTC
    profiles: ["full"]
    restart: always

  # --- Background Services ---
  file-sync:
    build:
      context: ../services/file-sync
      dockerfile: Dockerfile
    volumes:
      - filedata:/data/files
    environment:
      - DATABASE_URL=postgresql://droplet:droplet@db:5432/droplet
      - MQTT_BROKER=mqtt://broker:1883
      - FILES_ROOT=/data/files
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_started
    profiles: ["legacy"]
    restart: always

  # --- Future Services ---
  routing:
    build:
      context: ../services/routing
      dockerfile: Dockerfile
    network_mode: host
    cap_add:
      - NET_ADMIN
    profiles: ["full"]
    restart: always

  nvr:
    build:
      context: ../services/nvr
      dockerfile: Dockerfile
    volumes:
      - nvrdata:/data/recordings
    profiles: ["full"]
    restart: always

volumes:
  pgdata:
  filedata:
  nvrdata:
  aikeys:
  nextcloud-data:
  ha-config:
