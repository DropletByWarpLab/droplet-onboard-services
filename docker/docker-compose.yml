# IMPORTANT: Run ./scripts/setup.sh before starting services.
# This file contains NO secret interpolation — all secrets flow through .env
# via env_file. This means compose commands (down, ps, logs) always work,
# even without .env. The setup script validates secrets before starting.

# Explicit project name so containers don't collide with the sibling
# `droplet-local-LLM` repo, whose compose file is also under a `docker/`
# directory and would otherwise auto-derive the same project name from
# its parent dir. Caught locally during the WARP-187 verification.
name: droplet

# =============================================================================
# WARP-569 — Per-container resource limits
# =============================================================================
# Target hardware: ~7 GB shared RAM (single-box; multi-box inference host is similar).
# Host/kernel reserve: ~1 GB → allocate up to ~6 GB to default-on services.
#
# IMPORTANT: use top-level keys (mem_limit / cpus / pids_limit), NOT
# deploy.resources.limits.  deploy.* is silently IGNORED by `docker compose up`
# outside Swarm and would pass review while enforcing nothing.
#
# Every limit is env-overridable so operators on bigger hardware can raise them
# without editing tracked files.  The test-security.sh CI guard (Test 10) fails
# if any service is missing mem_limit or accidentally uses deploy.resources.
#
# Default-profile RAM budget (always-on services):
#   gateway           128 MB
#   web-dashboard     384 MB
#   orchestrator      768 MB   (reservation 512 MB)
#   device-identity   128 MB
#   mcp-server        256 MB
#   nextcloud         768 MB
#   db              1,024 MB   (reservation 512 MB)
#   cache             256 MB   (reservation 128 MB)
#   broker             64 MB
#   ai-gateway      ≤4,096 MB (model-dependent; BGE reranker fp32 — see WARP-644)
#   file-indexer      512 MB
#   routing           256 MB
#   ──────────────────────────
#   Total           ~8.6 GB   (exceeds the 6 GB target — ai-gateway reranker bump pending ADR-012 review; see WARP-644)
#
# Profile-gated services are sized for their provisioned hardware and are
# NOT counted in the 6 GB default budget:
#   linux:       frigate 1 GB, voice-io 512 MB, whisper 1 GB, piper 512 MB
#   single-box:  ollama 4 GB, openwrt 512 MB, switch 128 MB (ADR-018 item 9:
#                the managed switch auto-provisions a plugged-in AP onto the
#                LAN — shared with the `full` profile, +128 MB on single-box).
#   eval:        rag-eval 1 GB
#   full:        email-indexer 256 MB, switch 128 MB, camera-discovery 256 MB
#   ops:         ops-console 256 MB
# =============================================================================

# =============================================================================
# WARP-591 — Bounded container logs
# =============================================================================
# Without an explicit logging config, Docker's default json-file driver keeps
# every container's stdout/stderr forever — an unbounded write that fills the
# OS drive on a long-lived appliance. This anchor caps each container at
# 3 × 10 MB of rotated logs (30 MB ceiling per service) and is merged into the
# long-running services below via `<<: *default-logging`.
x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # --- Ingress ---
  gateway:
    # WARP-1021: Bookworm-based nginx with the NIST-validated OpenSSL FIPS
    # provider (CMVP #4282) baked DORMANT — replaces the pulled nginx:alpine
    # (Alpine/musl has no validated FIPS path; same reason WARP-229 moved every
    # service image off Alpine). Repo root as context so the Dockerfile COPYs
    # the shared docker/fips/** + docker/openssl-fips.cnf exactly like the
    # five service images. Default posture is byte-identical to the old
    # gateway: same nginx.conf (mounted below), same cipher lines
    # (cipher-profile.default.conf is verbatim the old inline pair).
    build:
      context: ..
      dockerfile: docker/nginx/Dockerfile
    ports:
      - "80:80"
      - "443:443"
    environment:
      # WARP-1021: /docker-entrypoint.d/00-fips-profile.sh keys the edge-TLS
      # cipher profile on the single customer knob — 0 (default) → modern
      # posture, 1 → FIPS-approved suites only. OPENSSL_CONF is the same
      # setup.sh-derived var the service images consume (belt-and-suspenders:
      # the entrypoint also exports it when DROPLET_FIPS_MODE=1); nginx links
      # the SYSTEM OpenSSL 3, so the conf alone activates the provider.
      - DROPLET_FIPS_MODE=${DROPLET_FIPS_MODE:-0}
      - OPENSSL_CONF=${OPENSSL_CONF:-/etc/ssl/openssl.cnf}
      # WARP-1061: /docker-entrypoint.d/01-internal-scheme.sh keys the
      # first-party upstream scheme on this knob — 0 (default) → plain
      # `http://` proxy_pass exactly as before, 1 → `https://` + the
      # proxy_ssl_* client-cert block against the orchestrator/ai-gateway
      # mTLS listeners. Same selector pattern as the FIPS cipher profile.
      - DROPLET_INTERNAL_TLS=${DROPLET_INTERNAL_TLS:-0}
      # Warning-free droplet.local: render-canonical-host.sh only turns the
      # friendly-name → FQDN redirect ON when this box owns the LAN's
      # DHCP/DNS (the split-horizon FQDN is unresolvable otherwise). Written
      # 1 by scripts/lib/single-box.sh, absent/0 on every other shape.
      - DROPLET_LAN_DNS_AUTHORITY=${DROPLET_LAN_DNS_AUTHORITY:-0}
      # WARP-1686: /docker-entrypoint.d/03-docs-engine.sh keys the /docs/
      # proxy variant on the document engine — collabora (default) keeps the
      # /docs prefix → docserver:9980 (coolwsd net.service_root); onlyoffice
      # strips it → docserver:80. Same selector pattern as the knobs above.
      - DOCS_ENGINE=${DOCS_ENGINE:-collabora}
    volumes:
      # nginx.conf moved docker/nginx.conf → docker/nginx/nginx.conf
      # (WARP-1021). Still mounted read-only over the baked copy (same file)
      # so config edits keep applying with a reload, no rebuild — the
      # ADR-023 cert-swap flow and ops muscle memory are unchanged.
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      # WARP-1061: the gateway's OWN internal-CA bundle (CN = "gateway") —
      # internal-scheme.mtls.conf points proxy_ssl_certificate here so nginx
      # presents a client cert on the orchestrator/ai-gateway upstream legs
      # when DROPLET_INTERNAL_TLS=1. Inert (never read) when the knob is 0.
      - ../data/secrets/service-tls/gateway:/etc/nginx/service-tls:ro
    depends_on:
      orchestrator:
        condition: service_started
      web-dashboard:
        condition: service_started
    restart: always
    <<: *default-logging
    mem_limit: ${GATEWAY_MEM_LIMIT:-128m}
    cpus: ${GATEWAY_CPUS:-0.5}
    pids_limit: ${CONTAINER_PIDS_LIMIT:-512}

  # --- Apps ---
  # NOTE: No host ports exposed — Nginx routes all traffic internally.
  # This avoids conflicts with local dev servers (npm run dev on 3000/3001).
  web-dashboard:
    build:
      context: ..
      dockerfile: apps/web-dashboard/Dockerfile
    expose:
      - "3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
      # WARP-318: FIPS activation env, keyed on the single DROPLET_FIPS_MODE
      # knob. The dashboard (Next.js standalone) has no boot self-test, but its
      # bundled OpenSSL must enter FIPS in lockstep with the other Node services
      # so the orchestrator's /_/fips probe reflects a consistent posture. All
      # empty/false by default → byte-identical to today; setup.sh --fips fills
      # them from the knob. No OPENSSL_MODULES: node resolves fips.so from its
      # own baked MODULESDIR copy (WARP-1063 — a process-wide module path makes
      # multi-libcrypto processes fight over one fips.so; openssl#25553).
      - OPENSSL_CONF=${OPENSSL_CONF:-/etc/ssl/openssl.cnf}
      - NODE_OPTIONS=${NODE_OPTIONS:-}
      - DROPLET_FIPS_REQUIRED=${DROPLET_FIPS_REQUIRED:-false}
    # WARP-535 (OTA foundations): liveness probe so the update agent's
    # future health-gated swap can watch this container. `node` is the
    # only runtime in the image (no wget/curl) — same rationale as the
    # orchestrator's check below. /healthz is the dashboard's OWN probe;
    # /health is the human status page and /api/* is the orchestrator's
    # surface behind nginx.
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3001/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: always
    <<: *default-logging
    mem_limit: ${WEB_DASHBOARD_MEM_LIMIT:-384m}
    cpus: ${WEB_DASHBOARD_CPUS:-1.0}
    pids_limit: ${CONTAINER_PIDS_LIMIT:-512}

  orchestrator:
    build:
      # Build context is the repo root so the orchestrator's workspace
      # deps (@droplet/tools-core, @droplet/mcp-server) resolve via npm
      # workspaces. Runtime spawns the mcp-server's dist as a stdio
      # child, so it ships inside the same image — see Dockerfile.
      context: ..
      dockerfile: apps/orchestrator/Dockerfile
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started
      broker:
        condition: service_started
    env_file:
      - path: ../.env
        required: false
    # routing, switch, and display all run with `network_mode: host` on
    # the appliance. The orchestrator is on the default bridge network — so
    # `localhost` from inside this container is the container itself, not
    # the host. Docker's magic `host-gateway` resolves to the host's IP on
    # the bridge subnet (172.x.0.1 on Linux, the gateway IP on Docker
    # Desktop) and lets URLs below target `host.docker.internal`.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Static config only — all secrets come from .env via env_file
      - PORT=3000
      - AI_GATEWAY_URL=http://ai-gateway:8000
      # WARP-1118 (§10): the orchestrator's request-size estimator
      # (context-budget.service.ts) budgets the assembled chat request against
      # this window before dispatch, PREVENTING (not merely detecting) the
      # WARP-854 overflow. Mirrors the `ollama` service's OLLAMA_CONTEXT_LENGTH
      # (both default 16384 via the same env token) so the estimator's window
      # tracks the model server's actual window. NOT a model swap — window only.
      - OLLAMA_CONTEXT_LENGTH=${OLLAMA_CONTEXT_LENGTH:-16384}
      - NEXTCLOUD_URL=http://nextcloud:80
      # WARP-101: the orchestrator's MCP client spawns the mcp-server's
      # dist as a stdio child. Pin the path explicitly so we don't rely
      # on the singleton's process.cwd()-relative fallback.
      - MCP_SERVER_BIN=/app/services/mcp-server/dist/index.js
      # WARP-850: the matter.js controller moved into the matter-controller
      # host-network sidecar (raw HCI for BLE commissioning + native LAN
      # mDNS). Same host-gateway rationale as ROUTING_SERVICE_URL below;
      # port 8083 follows the host-service ladder (routing 8080, switch
      # 8081, display 8082). The token is the X-Droplet-Auth shared bearer
      # (device-bridge precedent) generated by setup.sh — both ends read
      # the same .env key and the sidecar fails closed when it's empty.
      - DROPLET_MATTER_SERVICE_URL=${DROPLET_MATTER_SERVICE_URL:-http://host.docker.internal:8083}
      # WARP-203: chat-attached files land here. Default matches the
      # volume mount below; override only if you bind-mount a different
      # host path (e.g. an NVMe partition for backup convenience).
      - BRAIN_MEMORY_ROOT=${BRAIN_MEMORY_ROOT:-/data/brain-memory}
      # Routing runs with network_mode: host; host.docker.internal is added
      # via the extra_hosts above so the orchestrator can reach it without
      # bridge-network compose DNS.
      - ROUTING_SERVICE_URL=${ROUTING_SERVICE_URL:-http://host.docker.internal:8080}
      # Service-principal bearer that voice-io presents on /api/llm/chat.
      # MUST equal voice-io's ORCHESTRATOR_TOKEN env value or the handshake
      # 401s. authMiddleware does a constant-time compare against this.
      # WARP-339: same shape for mcp-server's outbound calls to
      # /api/matter/*, /api/audit-log/*, etc. matchServiceToken
      # binds matches to the `_service:mcp` AuthUser. Rotate
      # independently of SERVICE_TOKEN_VOICE.
      # SERVICE_TOKEN_RAG_EVAL — the rag-eval runner's bearer for
      # /api/admin/retrieval-eval/search (WARP-449 role gate). MUST equal the
      # rag-eval container's ORCHESTRATOR_SERVICE_TOKEN (wired below) or every
      # RAGAS run 401s at the first query.
      #
      # WARP-1860: deliberately NOT re-declared here. It arrives via the
      # `env_file: ../.env` above. Re-declaring it as
      # `SERVICE_TOKEN_RAG_EVAL=${SERVICE_TOKEN_RAG_EVAL:-}` resolved the
      # substitution against docker/.env — a DIFFERENT file from the env_file
      # above — which does not carry the key. That yielded "", and because
      # `environment:` outranks `env_file:`, the empty string shadowed the
      # real token. Both ends went blank and 15 consecutive nightly evals
      # 401'd on every query while pinning the GPU. Only use ${...}
      # substitution here for values that genuinely need renaming.
      # WARP-44: `real` (default) / `mock` / `disabled`. When disabled the
      # orchestrator short-circuits router calls and the dashboard surfaces a
      # "Router supervision disabled" banner. `mock` is handled on the routing
      # side — orchestrator still calls the endpoints as normal.
      - ROUTING_MODE=${ROUTING_MODE:-real}
      # WARP-808: which deployment shape broadcasts the home Wi-Fi AP. `uci`
      # (default, multi-box) routes Home Wi-Fi SSID/PSK writes through the
      # routing service exactly as before; `hostapd` (single-box, set by
      # single-box.sh's configure_single_box_env) routes them through the
      # device-bridge's POST /openwrt/wifi/hostapd because the single-box AP is
      # a raw host hostapd, not a UCI router. Read by network.service.ts. The
      # .env (env_file above) also carries it; listing it here keeps the
      # orchestrator's AP-mode dependency self-documenting, like ROUTING_MODE.
      - DROPLET_AP_MODE=${DROPLET_AP_MODE:-uci}
      # WARP-562: credentialed CORS allowlist. Empty falls through to the safe
      # code default (https://droplet-ai.local). NEVER set this to '*' — the
      # orchestrator rejects a wildcard at startup.
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - FRIGATE_URL=${FRIGATE_URL:-http://frigate:5000}
      # WARP-1957 — retention a newly adopted camera is given. MUST match the
      # camera-discovery service's block below; both adoption writers read
      # these same names so a manual add and an auto-adopt agree. Leave unset
      # for the shipped defaults (3d continuous / 30d motion / ±20s padding);
      # an empty value is treated as absent, not as zero.
      - NVR_DEFAULT_CONTINUOUS_DAYS=${NVR_DEFAULT_CONTINUOUS_DAYS:-}
      - NVR_DEFAULT_MOTION_DAYS=${NVR_DEFAULT_MOTION_DAYS:-}
      - NVR_DEFAULT_ALERTS_RETAIN_DAYS=${NVR_DEFAULT_ALERTS_RETAIN_DAYS:-}
      - NVR_DEFAULT_DETECTIONS_RETAIN_DAYS=${NVR_DEFAULT_DETECTIONS_RETAIN_DAYS:-}
      - NVR_DEFAULT_EVENT_PRE_CAPTURE_SEC=${NVR_DEFAULT_EVENT_PRE_CAPTURE_SEC:-}
      - NVR_DEFAULT_EVENT_POST_CAPTURE_SEC=${NVR_DEFAULT_EVENT_POST_CAPTURE_SEC:-}
      - NVR_DEFAULT_SNAPSHOT_RETAIN_DAYS=${NVR_DEFAULT_SNAPSHOT_RETAIN_DAYS:-}
      - SWITCH_SERVICE_URL=${SWITCH_SERVICE_URL:-http://host.docker.internal:8081}
      - DISPLAY_SERVICE_URL=${DISPLAY_SERVICE_URL:-http://host.docker.internal:8082}
      # camera-discovery is `network_mode: host` like routing/switch/display,
      # so it needs the same host-gateway address. Without this the
      # orchestrator fell through to config.ts's `http://localhost:8085`
      # default, which inside this bridge-network container is the
      # orchestrator itself — every call ECONNREFUSED, and the cameras page
      # rendered "Camera discovery service is not running" on a box whose
      # camera-discovery container was up and publishing to MQTT the whole time.
      - CAMERA_DISCOVERY_URL=${CAMERA_DISCOVERY_URL:-http://host.docker.internal:8085}
      # WARP-165: orchestrator → oled-display bearer. Read by
      # display.client.ts; must equal the oled-display container's
      # SERVICE_SECRET env (wired below to the same source).
      # Orchestrator → switch service bearer. Read by switch.client.ts;
      # must equal the switch container's SERVICE_SECRET env (wired below
      # to the same source). Before this key existed the orchestrator sent
      # no bearer at all, so a switch container with SERVICE_SECRET set
      # 403'd every call (dashboard Network page → "Router unavailable").
      # WARP-560: orchestrator → ai-gateway bearer. Read by ai-gateway.client.ts;
      # must equal the ai-gateway container's SERVICE_TOKEN_AI_GATEWAY (wired
      # below to the same source). The gateway had no inbound auth before this.
      # WARP-318: FIPS 140-3 per-customer activation, keyed on the single
      # DROPLET_FIPS_MODE knob. Default OFF → the `:-` defaults below render
      # today's exact byte-identical posture (empty NODE_OPTIONS,
      # DROPLET_FIPS_REQUIRED=false, OPENSSL_CONF=/etc/ssl/openssl.cnf). When
      # setup.sh --fips writes OPENSSL_CONF=/etc/ssl/openssl-fips.cnf +
      # NODE_OPTIONS=--openssl-shared-config + DROPLET_FIPS_REQUIRED=true into
      # .env, the validated provider activates WITHOUT a rebuild.
      #
      # ┌─ Prisma-under-FIPS (P1011) — root-caused + fixed by WARP-1063 ───────┐
      # │ WARP-317's smoke test surfaced that this container could not boot    │
      # │ FIPS-on: Prisma's `$connect()` threw P1011 "library has no ciphers"  │
      # │ (0A0000A1) while the boot self-test read fips:true. Root cause: the  │
      # │ orchestrator hosts TWO libcrypto instances — Node's bundled OpenSSL  │
      # │ and the Prisma query engine's system libssl — and the FIPS module    │
      # │ cannot be initialized by two libcryptos resolving the SAME fips.so  │
      # │ file (upstream limitation, openssl#25553: the second activation      │
      # │ fails with `common libcrypto routines::init fail`). The old          │
      # │ process-wide OPENSSL_MODULES forced exactly that collision: Node     │
      # │ activated first and won; Prisma's libssl lost, and under the         │
      # │ config's fips=yes property pin a provider-less libcrypto has ZERO    │
      # │ fetchable algorithms — its default SSL_CTX comes up empty and TLS-   │
      # │ client construction dies before any peer contact. (ai-gateway hit    │
      # │ the same wall: pyca cryptography's static OpenSSL vs the system      │
      # │ libssl httpx uses.) The old self-tests couldn't see it: getFips()/   │
      # │ _fips_enabled mirror the property pin, and "MD5 refused" is also     │
      # │ true of a dead provider.                                             │
      # │                                                                      │
      # │ The WARP-1063 fix: no process-wide OPENSSL_MODULES (removed below +  │
      # │ from setup.sh); each image installs a dedicated fips.so COPY into    │
      # │ every bundled runtime's own baked MODULESDIR so each libcrypto       │
      # │ activates its own module (docker/fips/install-fips-provider.sh);     │
      # │ docker/openssl-fips.cnf pins an explicit FIPS-approved TLS posture   │
      # │ (ssl_conf/system_default); and both boot self-tests now positively   │
      # │ probe an approved digest so a dead provider fails the boot with the  │
      # │ real diagnosis. tests/integration/fips-stack.test.sh asserts the     │
      # │ full FIPS-enforcing boot. The separate WARP-233 clash (Postgres TLS  │
      # │ + sslmode=require) still lands on top of this and keeps decision (A) │
      # │ `?sslmode=disable` on the FIPS path.                                 │
      # └──────────────────────────────────────────────────────────────────────┘
      - OPENSSL_CONF=${OPENSSL_CONF:-/etc/ssl/openssl.cnf}
      - NODE_OPTIONS=${NODE_OPTIONS:-}
      - DROPLET_FIPS_REQUIRED=${DROPLET_FIPS_REQUIRED:-false}
      # WARP-519: rag-eval HTTP trigger server. The orchestrator's
      # /api/admin/rag-eval/* route proxies ad-hoc RAGAS runs here. rag-eval
      # is in the `eval` Compose profile — when that profile is inactive the
      # service name doesn't resolve and the proxy route returns 503
      # (rag_eval_unavailable), which the dashboard renders as a "enable the
      # eval profile" banner. Setting the URL unconditionally is correct;
      # the route detects the connection failure at request time.
      - RAG_EVAL_URL=${RAG_EVAL_URL:-http://rag-eval:8090}
      # WARP-539 — OTA apply over the host compose socket. APPLY_SCRIPT points
      # at the helper bind-mounted below; empty DISABLES the apply window (the
      # box still polls + tracks pending releases). COMPOSE_FILE is the on-host
      # path to THIS compose file as the host daemon sees it (the runner passes
      # it to the socket, so it must resolve on the HOST, not in-container).
      # UPDATES_DIR is the in-container mount of the ota-updates volume.
      - DROPLET_OTA_APPLY_SCRIPT=${DROPLET_OTA_APPLY_SCRIPT:-}
      - DROPLET_OTA_COMPOSE_FILE=${DROPLET_OTA_COMPOSE_FILE:-/opt/droplet/docker/docker-compose.yml}
      - DROPLET_OTA_UPDATES_DIR=/data/updates
      # WARP-234: per-service Redis ACL identity over TLS. Overrides the
      # .env default-user URL (which is ping-only); cache.service.ts pins
      # trust to the internal CA from the /data/service-tls bundle below.
      - REDIS_URL=rediss://orchestrator:${REDIS_PASSWORD_ORCHESTRATOR:-}@cache:6380
    volumes:
      # WARP-539: the OTA apply host helper, bind-mounted read-only so the
      # orchestrator can exec it against the docker socket below. Its container
      # path is what DROPLET_OTA_APPLY_SCRIPT must be set to. Read-only — the
      # orchestrator only ever execs it, never rewrites it.
      - ../scripts/lib/apply-update.sh:/opt/droplet/scripts/lib/apply-update.sh:ro
      # WARP-234/236: this service's internal-TLS bundle (cert/key/ca) at the
      # canonical /data/service-tls path — the Redis client reads ca.pem.
      - ../data/secrets/service-tls/orchestrator:/data/service-tls:ro
      # WARP-573: pre-migration DB snapshots written by the guarded boot
      # entrypoint (scripts/migrate-and-start.sh) immediately before applying
      # pending migrations, so a power-cut mid-migration can be auto-recovered.
      - migration-snapshots:/data/migration-snapshots
      # WARP-203: chat-attached "brain memory" files. Per-user dirs at
      # /data/brain-memory/<userId>/<itemId>/ hold the original bytes,
      # extracted text, and a manifest mirroring the BrainMemoryItem
      # row. Same volume is bind-mounted into file-indexer (read-write
      # so it can write extracted.txt + updated manifest) so a single
      # ingest step covers both write paths.
      - brain-memory-data:/data/brain-memory
      # WARP-456: HMAC signing key for the append-only activity log.
      # setup.sh writes the 32-byte key to <repo>/data/secrets/audit.key
      # (mode 0600). The orchestrator's loadAuditKeyFromDisk() reads
      # /data/secrets/audit.key inside the container; without this mount
      # initActivityRecorder() throws at boot and the orchestrator
      # restart-loops. Read-only — the key is loaded once and never
      # mutated.
      # WARP-235 decision-4 hardening: mount ONLY the audit key, not the
      # data/secrets ROOT — the root now holds the internal CA private key
      # (internal-ca/ca.key) and every service's TLS bundle; a root mount
      # would let this container mint arbitrary service identities.
      # (Single-file bind: setup.sh materializes audit.key before compose up.)
      - ../data/secrets/audit.key:/data/secrets/audit.key:ro
      # WARP-242: doc-KEK master keyfile — wraps the per-document DEKs that
      # encrypt brain chunks (decrypt-on-read lives in file-search.service /
      # the chat attachment-context builder). Deliberately a keyfile and NOT
      # an .env value: .env travels inside restic snapshots, the keyfile is
      # excluded from the backup set (droplet-backup.sh) so crypto-shredding
      # a DEK holds against restored backups. Single-file bind, same
      # rationale as audit.key above. TPM-sealing is WARP-1033.
      - ../data/secrets/doc-kek.key:/data/secrets/doc-kek.key:ro
      # WARP-235/236: this service's own TLS bundle (cert+key+CA, CN =
      # "orchestrator") from the internal CA. The MQTT clients present it on
      # mqtts:// brokers; the DROPLET_TLS_* defaults point here.
      - ../data/secrets/service-tls/orchestrator:/data/service-tls:ro
      # WARP-230: share the device-identity sidecar's Unix-socket dir so
      # the orchestrator's gRPC client can reach it without exposing a
      # network port. Read-only — the orchestrator never writes.
      - /var/run/droplet:/var/run/droplet:ro
      # WARP-1964: the ERP export-drop folder — where a practice's own PMS
      # report exports land, normally a CIFS mount of a share on the practice
      # LAN. Point ERP_EXPORT_DROP_HOST_PATH at that mount point; the default
      # is a local directory so a box without one still composes.
      #
      # READ-ONLY, and that is the whole security model of this track rather
      # than a precaution: the connector's applyWrite always refuses, and a
      # read-only mount means it could not write back even if that changed.
      # Combined with a share the practice exports into (their account writes,
      # ours only reads), Droplet physically cannot alter the practice's data.
      #
      # Opt-in twice, like the erp-sql-bridge: this mount existing does nothing
      # until ERP_EXPORT_DROP_ROOT names the container path below.
      - ${ERP_EXPORT_DROP_HOST_PATH:-../data/erp-exports}:/data/erp-exports:ro
      # ADR-023 (C2): the TLS cert dir, mounted READ-WRITE so the
      # tls-issuance cron can atomically install the freshly-issued LE
      # fullchain (droplet.crt) + private key (droplet.key). The gateway
      # mounts the SAME dir read-only (see the gateway service above) and
      # serves from it — nginx needs zero config change because the LE
      # fullchain overwrites the same droplet.crt the bootstrap wrote. The
      # orchestrator triggers the nginx reload via the device-bridge (the
      # nginx reload path deliberately does NOT use the docker socket).
      - ./certs:/app/docker/certs:rw
      # ─────────────────────────────────────────────────────────────────────
      # WARP-539 — OTA apply (compose-over-socket). SECURITY-SENSITIVE.
      # ─────────────────────────────────────────────────────────────────────
      # The OTA apply path recreates every appliance container — INCLUDING the
      # orchestrator itself — which requires talking to the host Docker daemon.
      # This socket mount is what makes that possible.
      #
      # A Docker socket is ROOT-EQUIVALENT on the host. It is granted here on a
      # deliberate, fenced basis:
      #   * this is the ONLY service in the whole compose file that mounts it —
      #     no sidecar, no gateway, no ai-gateway ever gets the socket;
      #   * NOTHING in the codebase talks to the socket directly. Every daemon
      #     op funnels through host-compose-runner.ts → the single audited host
      #     helper scripts/lib/apply-update.sh, whose surface is a FIXED set of
      #     subcommands invoked with an argv array (never a shell string), not
      #     an arbitrary `docker` passthrough;
      #   * only a cosign-VERIFIED (WARP-537) release whose configs.tar.gz
      #     sha256 matches the signed manifest (apply.ts) ever reaches the
      #     runner — the crypto verify chain is the gate in front of the socket.
      # Mounted read-only from the orchestrator's side; the daemon still honors
      # writes over the API, but :ro keeps the container from tampering with the
      # socket file itself. To DISABLE OTA apply on a box (dev/CI, or until the
      # key ceremony runs), leave DROPLET_OTA_APPLY_SCRIPT empty — the window
      # then no-ops even with the socket present.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # WARP-539: per-update rollback backups + staged configs live here
      # (<updatesDir>/<id>/{backup,configs.tar.gz}). A daily 03:00 cron GCs
      # terminal-update backups older than 7 days. Named volume so backups
      # survive the orchestrator's own recreation mid-apply.
      - ota-updates:/data/updates
    # WARP-43: rolled-up health includes postgres, redis, routing, ai-gateway,
    # nextcloud. A `down` aggregate returns HTTP 503 so Docker restarts this
    # container when a HARD dependency (postgres) is lost.
    healthcheck:
      # `wget` isn't installed in the orchestrator image (only `node`).
      # WARP-1061: run the WARP-236 cert-presenting healthcheck client
      # (dist/healthcheck.js — relative to the image WORKDIR
      # /app/apps/orchestrator) instead of the old inline plain-HTTP
      # `node -e fetch` one-liner: when DROPLET_INTERNAL_TLS=1 the :3000
      # listener is HTTPS + requires a client cert, so a plain-HTTP probe
      # would mark the container permanently unhealthy. The client is a
      # no-op wrapper around the same fetch when the flag is off. Exits 0
      # on 2xx, 1 on any error (including 5xx body responses the
      # orchestrator returns when it's truly degraded).
      test: ["CMD", "node", "dist/healthcheck.js"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    restart: always
    <<: *default-logging
    # Protected core: reservation ensures the OOM killer targets other
    # containers before the orchestrator. mem_limit caps absolute ceiling.
    mem_limit: ${ORCHESTRATOR_MEM_LIMIT:-768m}
    mem_reservation: ${ORCHESTRATOR_MEM_RESERVATION:-512m}
    cpus: ${ORCHESTRATOR_CPUS:-2.0}
    pids_limit: ${CONTAINER_PIDS_LIMIT:-512}

  # --- Device identity sidecar (WARP-230) ---
  # Python gRPC service holding the device's non-extractable identity
  # key sealed to TPM 2.0 PCRs [0, 2, 4, 7]. Only container with
  # /dev/tpm0 passthrough; orchestrator talks to it over a Unix socket
  # so no network port is exposed.
  device-identity-svc:
    build:
      context: ..
      dockerfile: services/device-identity-svc/Dockerfile
    container_name: droplet-device-identity-svc
    env_file:
      - path: ../.env
        required: false
    environment:
      # WARP-317: this image ships the FIPS cnf + self-test helper but NOT
      # the validated fips.so module (only the five provider images +
      # gateway carry it). The env_file above would leak a FIPS-on .env's
      # DROPLET_FIPS_REQUIRED=true / OPENSSL_CONF=<fips cnf> straight into
      # this container — boot self-test exit 1 (restart-loop) and, even
      # with the gate off, a cnf-without-module libcrypto that fails at
      # first crypto use. `environment:` beats env_file, so pin both to
      # the literal OFF posture (identical to the pre-WARP-318 render).
      DROPLET_FIPS_REQUIRED: "false"
      OPENSSL_CONF: /etc/ssl/openssl.cnf
      # Backend selection. The 'real' (tpm2-pytss) backend is an unfinished
      # scaffold (IDX-002) that device-identity-svc fails closed on unless
      # DROPLET_TPM_ALLOW_SCAFFOLD is set, so the default is 'mock' — a box
      # whose .env omits the key must NOT auto-land on the crash-looping
      # scaffold. secrets.sh writes DROPLET_TPM_BACKEND=mock into .env; an
      # operator knowingly running the scaffold sets real + the opt-in by hand.
      # docker-compose.test.override.yml forces 'mock' for the test lane.
      DROPLET_TPM_BACKEND: ${DROPLET_TPM_BACKEND:-mock}
      DROPLET_DEVICE_ID: ${DROPLET_DEVICE_ID:-droplet}
      # Auto-provision on first start: if /var/lib/droplet/tpm/ has no
      # provisioned.json, generate the EK / SRK / device-id key and
      # seal to the canonical PCR set. Idempotent — no-op on subsequent
      # starts.
      DROPLET_AUTO_PROVISION: "1"
      # Sealing PCR set. Override per spec §Risk register when the
      # device's UEFI/cboot uses a different canonical set.
      DROPLET_TPM_PCRS: "0,2,4,7"
    # /dev/tpm0 passthrough for the real backend. Docker silently
    # skips this entry on hosts where /dev/tpm0 doesn't exist (Mac,
    # CI), so the same compose file works everywhere. The test
    # override clears the devices list to be explicit.
    devices:
      - "/dev/tpm0:/dev/tpm0"
    volumes:
      # Persistent artifacts: EK cert, SRK pub, device-id pub/cert,
      # sealed blob, provisioned.json. Bind-mounted from the host so
      # the artifacts survive container recreate.
      - /var/lib/droplet/tpm:/var/lib/droplet/tpm
      # Unix-socket directory — the orchestrator container mounts the
      # same path read-only so it can dial unix:///var/run/droplet/
      # device-identity.sock.
      - /var/run/droplet:/var/run/droplet
    restart: always
    <<: *default-logging
    mem_limit: ${DEVICE_IDENTITY_MEM_LIMIT:-128m}
    cpus: ${DEVICE_IDENTITY_CPUS:-0.5}
    pids_limit: ${CONTAINER_PIDS_LIMIT:-512}

  # --- MCP Server (HTTP transport) ---
  # WARP-103: streamable-HTTP MCP transport for off-process consumers
  # (droplet-local-LLM, Claude Desktop, dev tools). The orchestrator's
  # in-process agent already talks to the mcp-server over stdio inside
  # its own container (see apps/orchestrator/Dockerfile + WARP-101); this
  # service is the JWT-gated network surface.
  #
  # Internal-only by default — no `ports:` section. JWT_SECRET must
  # match the orchestrator so externally-issued admin JWTs verify here.
  # Add a host port mapping if/when droplet-local-LLM runs off-box.
  mcp-server:
    build:
      # Repo root context, mirroring the orchestrator's WARP-101 pattern,
      # so workspace deps (@droplet/tools-core) resolve via npm workspaces.
      context: ..
      dockerfile: services/mcp-server/Dockerfile
    container_name: droplet-mcp-server
    volumes:
      # WARP-234/236: internal-TLS bundle — redis-tls.ts reads ca.pem.
      - ../data/secrets/service-tls/mcp-server:/data/service-tls:ro
      # WARP-242: doc-KEK master keyfile — the standalone mcp-server
      # decrypts encrypted brain chunks in its search_content results
      # (see the orchestrator service's mount comment for the full story).
      - ../data/secrets/doc-kek.key:/data/secrets/doc-kek.key:ro
    restart: unless-stopped
    <<: *default-logging
    env_file:
      - path: ../.env
        required: false
    environment:
      - MCP_PORT=${MCP_PORT:-9090}
      - JWT_SECRET=${JWT_SECRET}
      - DATABASE_URL=${DATABASE_URL}
      # WARP-234: rerank-cache Redis identity (get/setex on rerank:* only)
      # over TLS; trust pinned to the internal CA from the bundle below.
      - REDIS_URL=rediss://mcp-server:${REDIS_PASSWORD_MCP:-}@cache:6380
      - ROUTING_SERVICE_URL=${ROUTING_SERVICE_URL:-http://host.docker.internal:8080}
      - SWITCH_SERVICE_URL=${SWITCH_SERVICE_URL:-http://host.docker.internal:8081}
      # WARP-861: the files-domain tools speak the orchestrator's
      # /api/files contract (it validates the per-user ncToken headers
      # and proxies WebDAV itself) — NOT raw Nextcloud, which can't serve
      # the JSON shape and redirects plain HTTP to an unserved :443
      # behind the TLS gateway.
      - FILES_API_URL=${FILES_API_URL:-http://orchestrator:3000/api/files}
      # WARP-102: Matter tool calls + audit-log proxy through here back
      # to the orchestrator's /api/matter/*, /api/audit-log/*. Explicit
      # wiring (rather than relying on baseUrlFor's compose-DNS default)
      # matches the pattern every other service-to-service URL uses.
      - ORCHESTRATOR_URL=${ORCHESTRATOR_URL:-http://orchestrator:3000}
      # WARP-339: service-principal bearer for the outbound orchestrator
      # calls above. MUST equal the orchestrator's SERVICE_TOKEN_MCP env
      # value or authMiddleware rejects with 401. Mirrors the
      # voice-io ORCHESTRATOR_TOKEN pattern (line ~588). The
      # ${SERVICE_TOKEN_MCP:-${ORCHESTRATOR_TOKEN:-}} fallback lets a
      # dev install override the whole pair with a single env var
      # without needing both names in their local .env.
      - ORCHESTRATOR_TOKEN=${SERVICE_TOKEN_MCP:-${ORCHESTRATOR_TOKEN:-}}
      # WARP-229: FIPS self-test gating. The mcp-server's startup
      # invokes @droplet/fips-selftest, which exits non-zero on
      # development hosts where OpenSSL's FIPS provider isn't loaded —
      # restart-looping the container. The orchestrator already opts
      # out via this same env on non-production deployments (see its
      # log: "FIPS boot self-test skipped (DROPLET_FIPS_REQUIRED=false
      # or non-production env)"); mcp-server needs the same opt-out
      # passed through compose. Defaults to `false` so single-box +
      # multi-box dev deployments boot cleanly; set to `true` in
      # production .env to re-enable strict FIPS enforcement.
      - DROPLET_FIPS_REQUIRED=${DROPLET_FIPS_REQUIRED:-false}
      # WARP-967: same override the orchestrator carries (see its
      # comment above). The image bakes OPENSSL_CONF=/etc/ssl/
      # openssl-fips.cnf (WARP-229) and now also ships the validated
      # fips.so + fipsmodule.cnf — so, unlike before WARP-967, that
      # config LOADS successfully for anything linked against the
      # system libssl. `node` itself ignores it (nodejs_conf appname),
      # but the Prisma query engine this container boots links the
      # system OpenSSL and would come up FIPS-enforcing by default,
      # hitting the same non-FIPS-cipher clash with Postgres TLS the
      # orchestrator documents. Pin the stock config until WARP-318
      # flips activation deliberately.
      - OPENSSL_CONF=${OPENSSL_CONF:-/etc/ssl/openssl.cnf}
      # WARP-318: the extra var Node's bundled OpenSSL needs to enter FIPS
      # (shared-config opt-in). Empty by default → byte-identical to today;
      # setup.sh --fips populates it from the knob. No OPENSSL_MODULES: each
      # libcrypto in this container (node bundled + Prisma's system libssl)
      # resolves fips.so from its OWN baked MODULESDIR copy (WARP-1063;
      # openssl#25553 — one shared module file breaks the second initializer).
      - NODE_OPTIONS=${NODE_OPTIONS:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "9090"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:9090/health >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    mem_limit: ${MCP_SERVER_MEM_LIMIT:-256m}
    cpus: ${MCP_SERVER_CPUS:-1.0}
    pids_limit: ${CONTAINER_PIDS_LIMIT:-512}

  # --- Nextcloud (headless backend) ---
  # Not published to host — accessed only via nginx at /nextcloud/.
  # Direct host publish would collide with routing (host-net :8080) and
  # bypass auth/HTTPS the gateway enforces.
  nextcloud:
    # WARP-1254: digest-pinned so the appliance never silently drifts onto a
    # newer Nextcloud/groupfolders point release across an image re-pull — the
    # exact groupfolders version bundled server-side is otherwise not
    # reproducible. Validated live against this digest in
    # docs/spikes/WARP-1254-groupfolders-spike.md (Nextcloud 29.0.16 build 1,
    # groupfolders 17.0.16). Bumping this pin (e.g. for an NC security patch)
    # should be a deliberate, reviewed change — re-run that spike's curl
    # checks against the new digest before rolling it out.
    image: nextcloud:29-apache@sha256:a7fbfcd4759bdd19b8fb8b1044b47ee3a9471d2e2c8bc68d56a2e671f86cebd2
    # WARP-234: the zz-redis-tls.config.php file-mount makes Docker pre-create
    # config/ as root:root (www-data cannot write config.php -> install fails)
    # AND, under the TLS-only Postgres (WARP-233, PGSSLMODE=require), the
    # auto-install runs with HOME=/root so libpq probes /root/.postgresql/
    # postgresql.crt -> EACCES. Chown config/ + set HOME=/var/www so the
    # client-cert probe is skipped. Validated live on .87.
    entrypoint:
      - bash
      - -c
      - 'export HOME=/var/www; chown 33:33 /var/www/html/config 2>/dev/null || true; exec /entrypoint.sh apache2-foreground'
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started
    env_file:
      - path: ../.env
        required: false
    environment:
      # Static Nextcloud config — passwords come from .env via env_file
      - POSTGRES_HOST=db
      - POSTGRES_DB=nextcloud
      # WARP-233: the db's pg_hba.conf is TLS-only (hostssl + reject plaintext),
      # so Nextcloud must speak TLS to Postgres or it can never reach
      # 'installed'. Nextcloud connects via PHP's PDO_pgsql/libpq, which honours
      # libpq's PGSSLMODE env var for EVERY connection — the entrypoint's
      # auto-install (occ maintenance:install, before the post-installation
      # hook runs) AND all ongoing config.php connections. PG_SSLMODE is the same
      # shared knob the DATABASE_URL producers key on (default `require`, flipped
      # to `disable` under `setup.sh --fips` where the FIPS pg_hba tolerates
      # plaintext from the private bridge), so this stays in lockstep with the
      # orchestrator/file-indexer posture. `require` (encrypt, don't verify CA)
      # matches those services; the internal CA is NOT mounted into this
      # container so verify-full is not available here.
      - PGSSLMODE=${PG_SSLMODE:-require}
      # WARP-234 / WARP-1607 — the Nextcloud→Redis endpoint, defined ONCE.
      #
      # Nextcloud reaches Redis from two independent surfaces and both read
      # this contract, so neither can be re-pointed without the other:
      #   * config.php  — ./nextcloud/zz-redis-tls.config.php (getenv)
      #   * PHP sessions — ./nextcloud/zz-redis-session.ini   (ini ${...})
      # Both files are mounted below; scripts/test-security.sh (Test 21)
      # fails if they ever stop resolving from the same variables.
      #
      # The image's own artifacts (the baked redis.config.php and the
      # entrypoint-generated redis-session.ini) are built from these same
      # names, so they land as close to correct as the image allows — but
      # both hardcode a plaintext scheme with no CA-bundle knob, so the two
      # mounts below are what actually carry TLS. REDIS_HOST also stays for
      # a pre-WARP-234 config volume's baseline keys (memcache.* etc.).
      - REDIS_HOST=cache
      - REDIS_HOST_PORT=6380
      - REDIS_HOST_USER=nextcloud
      # The scheme is a variable, not a literal, because it is precisely
      # what differs between the retired plaintext hop and the TLS one —
      # it belongs in the contract both surfaces read, not in each of them.
      - REDIS_TLS_SCHEME=tls
      - REDIS_TLS_CAFILE=/data/service-tls/ca.pem
      # Nextcloud rejects requests whose Host header isn't in this list with
      # "Access through untrusted domain". droplet-ai.local (mDNS) and
      # droplet-ai.lan (OpenWrt dnsmasq) are the primary names registered by
      # scripts/lib/local-dns.sh; droplet.local / droplet.lan are accepted too
      # so OpenWrt's own umdns/expand_hosts entries keep working if a user
      # ever points them at the appliance directly.
      # ADR-023 (C4): append the publicly-trusted per-device FQDN
      # (${DROPLET_PUBLIC_FQDN}) so Nextcloud trusts the one-URL-everywhere
      # address. Empty until the box learns it from HQ — a trailing blank token
      # is harmless to Nextcloud's space-separated trusted-domains list.
      #
      # WARP-1966 — the private-range wildcards are NOT belt-and-braces, they
      # are the only entries a browser addressing the box BY IP can match, and
      # that is a first-class way to reach this appliance:
      #   - the setup wizard hands out an IP before any name resolves;
      #   - droplet.local / .lan answer only for clients on the Droplet's own
      #     LAN, and the per-device FQDN is split-horizon (it resolves via the
      #     appliance's router, NXDOMAIN anywhere else) — so a client on a
      #     neighbouring segment has NO name to use, only an address;
      #   - the appliance's own AP subnets are 192.168.10.x / 192.168.20.x, so a
      #     customer on the Droplet's Wi-Fi browses to a bare 192.168.x.x.
      # Without these, the dashboard loads over IP (Next.js does not check Host)
      # while every Nextcloud-served leg — the embedded document editor above
      # all — answers HTTP 400 "Access through untrusted domain".
      #
      # Nextcloud expands `*` in a trusted-domain entry to [-.a-zA-Z0-9]*, so
      # `192.168.*` matches any host in that range. The list stays an ALLOWLIST:
      # only RFC1918 space is trusted, so a public Host header is still refused
      # and the Host-poisoning control the allowlist exists for (password-reset
      # and other absolute links) still holds for anything off-LAN. 172.16/12 is
      # deliberately ABSENT: it is the Docker bridge range, not a browser-facing
      # LAN, the in-compose hosts already have names above, and the only wildcard
      # that would cover it (`172.*`) reaches far into public address space.
      - NEXTCLOUD_TRUSTED_DOMAINS=localhost nextcloud gateway droplet-ai.local droplet-ai.lan droplet.local droplet.lan 192.168.* 10.* ${DROPLET_PUBLIC_FQDN:-}
      - OVERWRITEPROTOCOL=https
      # WARP-883 (ADR-027 WS-5) — shared "Household" group folder. The
      # post-installation hook (nextcloud-init.sh) reads these to create the
      # groupfolders-backed shared space idempotently. Quota accepts any
      # `occ groupfolders:quota` value ("unlimited" or e.g. "50 GB").
      - DROPLET_SHARED_FOLDER_NAME=${DROPLET_SHARED_FOLDER_NAME:-Household}
      - DROPLET_SHARED_FOLDER_QUOTA=${DROPLET_SHARED_FOLDER_QUOTA:-unlimited}
    volumes:
      - nextcloud-data:/var/www/html
      - ./nextcloud-skeleton:/skeleton:ro
      # WARP-1694 — `before-starting`, NOT `post-installation`. The stock
      # entrypoint runs post-installation hooks only on the run that installs
      # Nextcloud (entrypoint.sh `run_path post-installation`, inside
      # `if [ "$install" = true ]`), so on an already-installed box this hook
      # never fired again — and every "the next boot's idempotent re-run will
      # reconcile it" fallback in the script below was a promise nothing kept.
      # A no-wipe deploy that changed DOCS_ENGINE, or any WARP-990-class
      # convergence, silently did not converge.
      #
      # `run_path before-starting` sits at the end of the entrypoint, outside
      # the install branch and after any upgrade, so it runs on EVERY start —
      # including the install run, just a few lines later. That makes this the
      # reconcile slot the script was always written for (every step is
      # guarded; a re-run is a no-op). Deliberately not mounted in both slots:
      # that would double the appstore round-trips on first boot, which is the
      # slowest and most failure-prone moment (see the WARP-883 retry loop).
      - ./nextcloud-init.sh:/docker-entrypoint-hooks.d/before-starting/init-droplet.sh:ro
      # WARP-234: Redis-over-TLS config override (sorts after the
      # entrypoint's redis.config.php, so its `redis` key wins) + the
      # internal-CA bundle phpredis verifies the cache cert against.
      - ./nextcloud/zz-redis-tls.config.php:/var/www/html/config/zz-redis-tls.config.php:ro
      # WARP-1607: the SECOND Redis surface — PHP's session handler. The
      # entrypoint rewrites conf.d/redis-session.ini on every boot with a
      # hardcoded plaintext scheme it has no knob to change, so this file
      # overrides it by sorting later in PHP's alphabetical conf.d scan.
      # Without it every session write fails against the retired listener
      # and department provisioning never converges (ADR-029).
      - ./nextcloud/zz-redis-session.ini:/usr/local/etc/php/conf.d/zz-redis-session.ini:ro
      - ../data/secrets/service-tls/nextcloud:/data/service-tls:ro
      # USB drives auto-mounted on the host (services/automount/) show up
      # under /mnt/droplet/<name>. Bind-mounting with rshared propagation
      # lets new drives appear inside Nextcloud without a container
      # restart, so `occ files_external:create --datadir="/host/<name>"`
      # works for any drive plugged in after container boot.
      - type: bind
        source: /mnt/droplet
        target: /host
        bind:
          create_host_path: true
          propagation: rshared
    restart: always
    <<: *default-logging
    mem_limit: ${NEXTCLOUD_MEM_LIMIT:-768m}
    cpus: ${NEXTCLOUD_CPUS:-1.0}
    pids_limit: ${NEXTCLOUD_PIDS_LIMIT:-1024}

  # ==========================================================================
  # WARP-882 / WARP-1686 — Document engine (in-browser viewing/editing + co-author)
  # ==========================================================================
  # The engine behind the Nextcloud connector app (WOPI-style handshake).
  # Mirrors the `nextcloud` block: default network, NO `ports:` (reached only
  # via the gateway's `location /docs/` + sibling containers), env_file,
  # restart: always, shared logging.
  #
  # ENGINE-SELECTABLE (WARP-1686 / ADR-034): `DOCS_ENGINE` picks the engine;
  # every seam is WOPI (connector app, gateway leg, orchestrator probe), so
  # the engine stays a CONFIG choice, not a code dependency (ADR-027):
  #   * collabora (DEFAULT) — Collabora CODE, LibreOffice technology. NO
  #     licensing fee (MPLv2 core, free-of-charge binaries) — ADR-034 flips
  #     the default off OnlyOffice because its OEM license was the one
  #     remaining GA gate. Listens on :9980 under `net.service_root=/docs`,
  #     so the gateway forwards the ORIGINAL /docs/-prefixed URI (no strip)
  #     — see docker/nginx/docs-engine.collabora.conf.
  #   * onlyoffice — OnlyOffice DS Community Edition (AGPLv3; an OEM license
  #     is required to ship it at GA). Kept selectable for a future
  #     OEM-licensed SKU. Listens on :80 at its root — the gateway variant
  #     strips /docs/ (the original WARP-882 shape).
  # DOCS_ENGINE_IMAGE must track DOCS_ENGINE — scripts/lib/single-box.sh
  # writes both together; compose cannot branch an image on another var.
  #
  # PROFILE: `["docs"]`. The 32 GB box runs this DEFAULT-ON — scripts/setup.sh
  # appends `docs` to COMPOSE_PROFILES (see .env.example). A ≤8 GB box drops
  # `docs` (and sets DOCS_ENABLED=0) to reclaim the ~2 GB engine; the dashboard
  # then renders the "Edit" affordance as unavailable rather than dead.
  #
  # Resource limits are top-level (mem_limit/cpus/pids_limit), NEVER
  # deploy.resources (silently ignored outside Swarm; scripts/test-security.sh
  # Test 14 / WARP-569 fails it).
  docserver:
    image: ${DOCS_ENGINE_IMAGE:-collabora/code:26.04.2.4.1}
    profiles: ["docs"]
    depends_on:
      nextcloud:
        condition: service_started
    env_file:
      - path: ../.env
        required: false
    environment:
      # ── Collabora CODE knobs (DOCS_ENGINE=collabora; OnlyOffice ignores) ──
      # aliasgroup1 is coolwsd's WOPI-host ALLOWLIST: the only WOPI host this
      # engine serves is the compose-internal Nextcloud — exactly where the
      # connector pins its callback (`wopi_callback_url` in
      # docker/nextcloud-init.sh). No wildcard, no browser-origin coupling;
      # the browser only reaches the engine through the gateway's /docs/ leg.
      - aliasgroup1=http://nextcloud:80
      # ssl.enable=false + ssl.termination=true: the gateway owns edge TLS
      # (ADR-023); the engine speaks plain HTTP on the compose network but
      # emits https URLs. net.service_root=/docs keeps every engine endpoint
      # under the public /docs prefix. security.capabilities=false runs the
      # per-document jails without added Linux capabilities — the documented
      # alternative (granting MKNOD) is a capability a security-first
      # appliance does not hand out; the cost is a slower per-document open.
      - extra_params=--o:ssl.enable=false --o:ssl.termination=true --o:net.service_root=/docs --o:security.capabilities=false
      # The gateway terminates TLS — never generate a self-signed cert inside.
      - DONT_GEN_SSL_CERT=1
      # ── OnlyOffice DS knobs (DOCS_ENGINE=onlyoffice; Collabora ignores) ──
      # JWT-protected handshake between the connector, the engine, and the
      # orchestrator. The connector + orchestrator sign with the SAME secret.
      - JWT_ENABLED=${ONLYOFFICE_JWT_ENABLED:-true}
      - JWT_SECRET=${ONLYOFFICE_JWT_SECRET:-}
      - JWT_HEADER=Authorization
      # The engine is fronted by the gateway under /docs/; it must build its
      # asset URLs relative to that public path.
      - DOCSERVER_PUBLISHER_NAME=Droplet
    restart: always
    <<: *default-logging
    mem_limit: ${DOCS_MEM_LIMIT:-2g}
    cpus: ${DOCS_CPUS:-2.0}
    pids_limit: ${DOCS_PIDS_LIMIT:-1024}

  # --- Infrastructure ---
  db:
    # pgvector/pgvector:pg16 = official postgres 16 image + pgvector extension
    # pre-installed. The 20260412000000_add_file_content_index migration
    # needs `CREATE EXTENSION vector`, which plain postgres:16-alpine lacks.
    image: pgvector/pgvector:pg16
    # WARP-233: TLS 1.3 + SCRAM enforced via server flags (equivalent to
    # postgresql.conf edits; the stock image config stays untouched). The
    # bash -c wrapper stages the key with postgres-uid ownership BEFORE
    # exec'ing the stock entrypoint — its argv[1] is `postgres`, so
    # first-boot initdb still runs. pg_hba.conf has NO plaintext host lines.
    # The server cert is the WARP-236 internal-CA `db` bundle
    # (data/secrets/service-tls/db, issued by scripts/lib/internal-ca.sh) —
    # one trust root for mesh mTLS AND infra TLS, not a second CA.
    #
    # PG_HBA (default pg_hba.conf) is DERIVED from DROPLET_FIPS_MODE by
    # setup.sh's apply_fips_mode — never hand-edit. FIPS-on selects
    # pg_hba.fips.conf, which tolerates plaintext+SCRAM from the private
    # container bridge because Prisma/libpq under the FIPS provider cannot
    # do TLS at all (P1011; decision A — see the orchestrator env comment).
    command:
      - bash
      - -c
      - install -o postgres -g postgres -m 600 /certs-src/key.pem /tmp/server.key && install -o postgres -g postgres -m 644 /certs-src/cert.pem /tmp/server.crt && exec docker-entrypoint.sh postgres -c ssl=on -c ssl_cert_file=/tmp/server.crt -c ssl_key_file=/tmp/server.key -c ssl_min_protocol_version=TLSv1.3 -c password_encryption=scram-sha-256 -c hba_file=/etc/postgresql/${PG_HBA:-pg_hba.conf}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-nextcloud-db.sh:/docker-entrypoint-initdb.d/init-nextcloud-db.sh:ro
      - ../data/secrets/service-tls/db:/certs-src:ro
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./postgres/pg_hba.fips.conf:/etc/postgresql/pg_hba.fips.conf:ro
    env_file:
      - path: ../.env
        required: false
    environment:
      - POSTGRES_USER=droplet
      - POSTGRES_DB=droplet
    healthcheck:
      # `pg_isready` flips to "accepting connections" before Postgres
      # finishes internal recovery — clients that connect during that
      # window see "FATAL: the database system is starting up" and
      # crash. Caught file-indexer hitting it on every cold boot
      # (RestartCount=4 even with depends_on: service_healthy). Run an
      # actual SELECT 1 instead so the check fails until the query
      # path is genuinely ready.
      test: ["CMD-SHELL", "psql -U droplet -d droplet -c 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: always
    <<: *default-logging
    # db is the most critical protected core: mem_reservation ensures the OOM
    # killer targets lighter containers before Postgres. A database OOM kills
    # every dependent service simultaneously — protect it hardest.
    mem_limit: ${DB_MEM_LIMIT:-1g}
    mem_reservation: ${DB_MEM_RESERVATION:-512m}
    cpus: ${DB_CPUS:-2.0}
    pids_limit: ${DB_PIDS_LIMIT:-1024}

  cache:
    image: redis:7-alpine
    env_file:
      - path: ../.env
        required: false
    # WARP-234: TLS-only (plaintext :6379 disabled via --port 0) with
    # per-service least-privilege ACLs (--aclfile, generated by
    # scripts/lib/secrets.sh into data/secrets/redis/users.acl — sha256
    # hashes only; the shared requirepass flag is retired, the `default`
    # user is the ping-only health/harness identity). The cert is the WARP-236
    # internal-CA `cache` bundle — same trust root as the mesh, staged with
    # redis-uid ownership before the stock entrypoint drops privileges
    # (mirrors the WARP-233 db pattern). TLS 1.3 only, matching the db
    # posture. --tls-auth-clients no: clients authenticate with ACL
    # passwords; the CA pin is the transport trust.
    command:
      - "sh"
      - "-c"
      - >-
        install -o redis -g redis -m 600 /certs-src/key.pem /tmp/redis.key
        && install -o redis -g redis -m 644 /certs-src/cert.pem /tmp/redis.crt
        && install -o redis -g redis -m 644 /certs-src/ca.pem /tmp/redis-ca.crt
        && exec docker-entrypoint.sh redis-server
        --port 0
        --tls-port 6380
        --tls-cert-file /tmp/redis.crt
        --tls-key-file /tmp/redis.key
        --tls-ca-cert-file /tmp/redis-ca.crt
        --tls-auth-clients no
        --tls-protocols "TLSv1.3"
        --aclfile /etc/redis/users.acl
    volumes:
      - ../data/secrets/service-tls/cache:/certs-src:ro
      - ../data/secrets/redis/users.acl:/etc/redis/users.acl:ro
    restart: always
    <<: *default-logging
    # mem_reservation on cache: session + auth data — OOM kills here cascade
    # to every authenticated request. Protect before db fills its budget.
    mem_limit: ${CACHE_MEM_LIMIT:-256m}
    mem_reservation: ${CACHE_MEM_RESERVATION:-128m}
    cpus: ${CACHE_CPUS:-0.5}
    pids_limit: ${CONTAINER_PIDS_LIMIT:-512}

  broker:
    image: eclipse-mosquitto:2
    ports:
      # WARP-235: host-LOOPBACK TLS listener for host-network clients
      # (camera-discovery). Never bound on LAN interfaces. Also fixes the
      # pre-WARP-235 latent bug where camera-discovery (network_mode: host)
      # could never reach the unpublished broker at localhost:1883.
      - "127.0.0.1:8883:8883"
    volumes:
      # WARP-235: single mTLS listener — client identity is the cert CN
      # (use_identity_as_username), per-CN topic grants in mosquitto.acl,
      # server bundle issued by the WARP-236 internal CA. The shared-password
      # file mount is retired.
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto.acl:/mosquitto/config/droplet.acl:ro
      - ../data/secrets/service-tls/broker:/mosquitto/config/tls:ro
    restart: always
    <<: *default-logging
    mem_limit: ${BROKER_MEM_LIMIT:-64m}
    cpus: ${BROKER_CPUS:-0.5}
    pids_limit: ${CONTAINER_PIDS_LIMIT:-512}

  # --- AI Services ---
  ai-gateway:
    build:
      # WARP-229: context promoted from `../services/ai-gateway` to `..`
      # (repo root) so the Dockerfile can `COPY docker/openssl-fips.cnf`
      # and `COPY services/_shared/fips_selftest.py` for the FIPS boot
      # self-test. Mirrors file-indexer's repo-root context.
      context: ..
      dockerfile: services/ai-gateway/Dockerfile
    expose:
      - "8000"
      - "50051"
    env_file:
      - path: ../.env
        required: false
    # Mirrors orchestrator + mcp-server: the chat path's default
    # OLLAMA_URL is `http://host.docker.internal:11434` (host-installed
    # Ollama for local Docker Desktop dev). Without this mapping, ai-gateway
    # cannot resolve the name and chat throws "Temporary failure in name
    # resolution". On the single-box deployment shape
    # (COMPOSE_PROFILES=single-box) the bundled `ollama` service below
    # resolves via compose DNS and this mapping is unused — but it's
    # harmless and keeps the local-dev story intact. See .env.example
    # "AI Gateway" block for the deployment matrix.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Static config only — secrets come from .env via env_file
      # WARP-234: session-store + rate-limit Redis identity over TLS.
      # redis-py's from_url maps the query params onto ssl kwargs, so the
      # sessions/rate-limit code needs no changes; ca.pem comes from the
      # /data/service-tls bundle mounted below.
      - REDIS_URL=rediss://ai-gateway:${REDIS_PASSWORD_AI_GATEWAY:-}@cache:6380/0?ssl_cert_reqs=required&ssl_ca_certs=/data/service-tls/ca.pem
      - ORCHESTRATOR_URL=http://orchestrator:3000
      - GRPC_PORT=50051
      # WARP-560: inbound service-auth bearer. The ai-gateway's
      # ServiceAuthMiddleware requires this on every /ai/* route (except
      # /ai/health). MUST equal the orchestrator's SERVICE_TOKEN_AI_GATEWAY env
      # (wired above to the same source). Empty = unauthenticated (dev only).
      # ADR-023 (C4): append https://${DROPLET_PUBLIC_FQDN} so the ai-gateway
      # accepts the publicly-trusted one-URL-everywhere origin. Empty until the
      # box learns its FQDN from HQ — a trailing comma is tolerated by the
      # ai-gateway's comma-split (empty entries are dropped, see main.py).
      - CORS_ORIGINS=https://localhost,http://localhost,https://localhost:3001,http://localhost:3001,https://${DROPLET_PUBLIC_FQDN:-}
      # GW-14: socket peers (your nginx edge) whose forwarded client-IP headers
      # the rate limiter trusts. Empty default = trust nothing (key on the real
      # socket peer). Set RATE_LIMIT_TRUSTED_PROXIES to nginx's IP/subnet.
      - RATE_LIMIT_TRUSTED_PROXIES=${RATE_LIMIT_TRUSTED_PROXIES:-}
      # WARP-318: FIPS activation for the Python stack. Python's `cryptography`
      # / `_hashlib` use the SYSTEM Debian libcrypto, so OPENSSL_CONF alone
      # activates FIPS — no MODULES/NODE_OPTIONS needed (that asymmetry is
      # Node-only). Made explicit here (previously relied on .env) for symmetry
      # with the other services. Empty/false by default → byte-identical to
      # today; setup.sh --fips populates from the DROPLET_FIPS_MODE knob. The
      # boot self-test (services/_shared/fips_selftest.py) enforces on
      # DROPLET_FIPS_REQUIRED=true.
      - OPENSSL_CONF=${OPENSSL_CONF:-/etc/ssl/openssl.cnf}
      - DROPLET_FIPS_REQUIRED=${DROPLET_FIPS_REQUIRED:-false}
    volumes:
      - aikeys:/data/keys
      # WARP-234/236: internal-TLS bundle — the rediss:// URL above points
      # ssl_ca_certs at this mount.
      - ../data/secrets/service-tls/ai-gateway:/data/service-tls:ro
    depends_on:
      - cache
      - broker
      - orchestrator
    restart: always
    <<: *default-logging
    # WARP-644: raised 512m -> 4g. The BGE-reranker-base fp32 ONNX graph
    # (BAAI/bge-reranker-base no longer publishes the smaller int8
    # `model_quantized.onnx`) peaks at ~2.9 GB RSS for a batch-8 forward
    # pass, measured on the gateway image. 512m OOM-killed model load.
    # See docs/ADR-021-container-resource-limits.md for the RAM budget;
    # revisit if int8 quantization is reintroduced (would drop this back
    # toward the original ~1g tier).
    mem_limit: ${AI_GATEWAY_MEM_LIMIT:-4g}
    cpus: ${AI_GATEWAY_CPUS:-2.0}
    pids_limit: ${CONTAINER_PIDS_LIMIT:-512}

  # --- File indexer (Phase 4: AI content search) ---
  # Watches the Nextcloud data volume for file changes, extracts text,
  # computes embeddings via the ai-gateway gRPC, and stores them in
  # pgvector for semantic search. Read-only access to Nextcloud data.
  file-indexer:
    build:
      # Repo root as context so Dockerfile can `COPY proto/` at build time
      # (proto/ lives outside the service dir). All COPY paths in the
      # Dockerfile are relative to the monorepo root.
      context: ..
      dockerfile: services/file-indexer/Dockerfile
    volumes:
      - nextcloud-data:/data/nextcloud:ro
      - ../proto:/app/proto:ro
      # WARP-203: brain-memory shared volume — chat-attached files are
      # written here by the orchestrator and read by file-indexer to
      # run the extract → embed → upsert pipeline.
      - brain-memory-data:/data/brain-memory
      # WARP-235: this service's own TLS bundle (CN = "file-indexer") for the
      # mqtts:// broker connection — identity is the cert CN, no password.
      - ../data/secrets/service-tls/file-indexer:/data/service-tls:ro
      # WARP-242: doc-KEK master keyfile — the indexer mints each brain
      # item's DEK at first chunk-write and encrypts chunk text before it
      # lands in pgvector (see the orchestrator service's mount comment).
      - ../data/secrets/doc-kek.key:/data/secrets/doc-kek.key:ro
    env_file:
      - path: ../.env
        required: false
    environment:
      # WARP-233: sslmode pinned; PG_SSLMODE (default require) is DERIVED from
      # DROPLET_FIPS_MODE by setup.sh's apply_fips_mode — FIPS-on flips it to
      # `disable` because this container's Prisma/libpq connection hits the
      # P1011 clash (decision A, see the orchestrator comment). Never hand-edit.
      - DATABASE_URL=postgresql://droplet:${POSTGRES_PASSWORD}@db:5432/droplet?sslmode=${PG_SSLMODE:-require}
      - MQTT_BROKER=${MQTT_BROKER:-mqtts://broker:8883}
      - NEXTCLOUD_DATA_ROOT=/data/nextcloud/data
      - AI_GATEWAY_GRPC_URL=ai-gateway:50051
      # WARP-1140: shared "Household" groupfolder — display-path prefix for
      # chunks indexed from __groupfolders/. Must match the orchestrator's
      # DROPLET_SHARED_FOLDER_NAME (same "Household" default).
      - DROPLET_SHARED_FOLDER_NAME=${DROPLET_SHARED_FOLDER_NAME:-Household}
      # WARP-318: FIPS activation for the Python file-indexer (same shape as
      # ai-gateway — OPENSSL_CONF alone; system libcrypto). Previously relied on
      # .env with neither in `environment:`; made explicit for symmetry. Empty/
      # false default → byte-identical to today. WARP-1063: this container
      # carries two libcrypto instances (pyca cryptography's static OpenSSL +
      # the system libssl its Prisma/libpq + httpx paths use); each activates
      # its OWN fips.so copy from its own baked MODULESDIR (see the
      # orchestrator's Prisma-under-FIPS box for the openssl#25553 story).
      # DATABASE_URL is left exactly as-is (WARP-233 owns it).
      - OPENSSL_CONF=${OPENSSL_CONF:-/etc/ssl/openssl.cnf}
      - DROPLET_FIPS_REQUIRED=${DROPLET_FIPS_REQUIRED:-false}
    depends_on:
      db:
        condition: service_healthy
      ai-gateway:
        condition: service_started
      broker:
        condition: service_started
    # WARP-215: previously `profiles: ["full"]`, but file-indexer is core
    # to the RAG pipeline (extract → chunk → embed → upsert) and should
    # always run alongside the orchestrator, not be opt-in like the
    # hardware-specific services (camera-discovery, switch, oled-display,
    # frigate). The profile gate also broke compose override merging for
    # the rag-tests workflow: `docker-compose.test.override.yml` couldn't
    # add `WATCHER_MODE=polling` because compose strips override
    # directives for profile-gated services when the profile isn't
    # active. file-indexer now starts on every `docker compose up`.
    restart: always
    <<: *default-logging
    mem_limit: ${FILE_INDEXER_MEM_LIMIT:-512m}
    cpus: ${FILE_INDEXER_CPUS:-1.0}
    pids_limit: ${CONTAINER_PIDS_LIMIT:-512}

  # --- RAG eval (RAGAS scoring, scheduled hourly off-hours) ---
  # WARP-RAG-EVAL: gated behind the `eval` profile, which is STANDARD in
  # every environment as of the WARP-844 follow-up: scripts/lib/secrets.sh
  # writes it into the fresh-install COMPOSE_PROFILES on Linux AND macOS,
  # and scripts/lib/single-box.sh keeps appending it idempotently for
  # upgraded boxes (bug #15). The judge runs against the appliance's own
  # Ollama (RAGAS_LOCAL_JUDGE_MODEL → LLM_MODEL fallback), so no GPU is
  # strictly required — just slower on CPU. Pause the scheduled runs with
  # RAG_EVAL_DISABLED=1 rather than dropping the profile; the ad-hoc
  # /api/admin/rag-eval/* surface needs the container up.
  #
  # The container bakes queries.yaml + goldens.yaml + ragas_runner.py at
  # build time. Goldens are part of the image version; updating them
  # means rebuilding + redeploying the rag-eval image.
  #
  # Results land in the `rag-eval-data` named volume at /data/rag-eval/.
  # Per-run JSON + Markdown summaries are written under runs/; the
  # bootstrap mode (`docker exec rag-eval python main.py bootstrap`)
  # writes baselines.candidate.json at the volume root.
  rag-eval:
    build:
      context: ..
      dockerfile: services/rag-eval/Dockerfile
    env_file:
      - path: ../.env
        required: false
    environment:
      - ORCHESTRATOR_URL=http://orchestrator:3000
      # SERVICE_TOKEN_RAG_EVAL is generated by scripts/lib/secrets.sh into
      # .env on first install. The runner reads it as
      # ORCHESTRATOR_SERVICE_TOKEN (Python convention "the token I use to
      # call the orchestrator" — email-indexer precedent) and presents it
      # on /api/admin/retrieval-eval/search (WARP-449 role gate); the
      # orchestrator stores it as SERVICE_TOKEN_RAG_EVAL (TS convention
      # SERVICE_TOKEN_<consumer>).
      - ORCHESTRATOR_SERVICE_TOKEN=${SERVICE_TOKEN_RAG_EVAL:-}
      # RAGAS_EVAL_USER — whose indexed corpus the eval measures. The runner
      # passes it as ?user= on every search, because the service principal
      # owns no files of its own. NO default: the operator sets it
      # deliberately in .env; unset, runs fail fast with eval_user_required
      # instead of scoring an empty corpus into the baselines.
      #
      # WARP-1908: deliberately NOT re-declared here — it arrives via the
      # `env_file: ../.env` above. Re-declaring it as
      # `RAGAS_EVAL_USER=${RAGAS_EVAL_USER:-}` resolved the substitution
      # against docker/.env — a DIFFERENT file from that env_file — which
      # does not carry the key. That yielded "", and because `environment:`
      # outranks `env_file:`, the empty string shadowed the operator's real
      # value. Every search then went out with no ?user= and 400'd on
      # eval_user_required, so every run aborted at the third query. Exactly
      # the WARP-1860 failure recorded in the orchestrator block above,
      # arriving through the other variable. ORCHESTRATOR_SERVICE_TOKEN
      # below keeps its ${...} because it genuinely renames the key — that
      # is the only reason to use substitution in this block.
      # RAGAS_OLLAMA_URL points at the judge LLM's OpenAI-compat /v1
      # endpoint. The default suits mac/dev where Ollama runs ON the host
      # (host.docker.internal). It does NOT work on the single-box shape:
      # the bundled `ollama` container publishes only 127.0.0.1:11434 on
      # the host, and a loopback bind is unreachable from the
      # bridge-gateway IP on Linux — single-box.sh overrides this in .env
      # to the in-network http://ollama:11434/v1.
      - RAGAS_OLLAMA_URL=${RAGAS_OLLAMA_URL:-http://host.docker.internal:11434/v1}
      # ragas_runner.py falls back RAGAS_LOCAL_JUDGE_MODEL → LLM_MODEL →
      # mistral; leaving this unset lets that chain pick the hosted model.
      - RAGAS_LOCAL_JUDGE_MODEL=${RAGAS_LOCAL_JUDGE_MODEL:-}
      - RAGAS_JUDGE=${RAGAS_JUDGE:-local}
      - RAGAS_VARIANT=${RAGAS_VARIANT:-hybrid}
      - RAGAS_LIMIT=${RAGAS_LIMIT:-10}
      - RAG_EVAL_CRON_HOUR=${RAG_EVAL_CRON_HOUR:-22-23,0-5}
      - RAG_EVAL_CRON_MINUTE=${RAG_EVAL_CRON_MINUTE:-0}
      - RAG_EVAL_DISABLED=${RAG_EVAL_DISABLED:-0}
      # OPENAI_API_KEY only consumed when RAGAS_JUDGE=cloud.
      # WARP-519: HTTP trigger server bind port. The orchestrator proxies
      # ad-hoc /run, /bootstrap, and run-listing here via RAG_EVAL_URL
      # (set on the orchestrator service). Keep in sync with the expose
      # below and EXPOSE in services/rag-eval/Dockerfile.
      - RAG_EVAL_HTTP_PORT=${RAG_EVAL_HTTP_PORT:-8090}
    # WARP-519: internal-network only — no host publish. The orchestrator
    # reaches this by service name (rag-eval:8090) and is the auth wall;
    # the HTTP server itself has no auth.
    expose:
      - "8090"
    volumes:
      - rag-eval-data:/data/rag-eval
      # WARP-1061: this service's internal-CA bundle (CN = "rag-eval").
      # Server cert for the :8090 trigger server and client cert for the
      # ragas runner's orchestrator search calls when DROPLET_INTERNAL_TLS=1
      # (knob arrives via env_file); inert when 0.
      - ../data/secrets/service-tls/rag-eval:/data/service-tls:ro
    extra_hosts:
      # So RAGAS_OLLAMA_URL can resolve `host.docker.internal` on Linux
      # the same way it does on macOS / WSL. Mirrors the pattern used by
      # the routing service for OpenWrt access.
      - "host.docker.internal:host-gateway"
    depends_on:
      orchestrator:
        condition: service_started
    profiles: ["eval"]
    restart: always
    <<: *default-logging
    mem_limit: ${RAG_EVAL_MEM_LIMIT:-1g}
    cpus: ${RAG_EVAL_CPUS:-2.0}
    pids_limit: ${CONTAINER_PIDS_LIMIT:-512}

  # --- Routing (OpenWrt control) ---
  # WARP-44: default dependency — starts on every `docker compose up`. Set
  # ROUTING_MODE=mock in .env to run without a real router (fixtures).
  routing:
    build:
      # WARP-229: repo-root context for shared FIPS config + helper.
      context: ..
      dockerfile: services/routing/Dockerfile
    network_mode: host
    cap_add:
      - NET_ADMIN
    environment:
      # WARP-815 (K2): the documented default is 192.168.50.1 — the multi-box
      # router-host OpenWrt (matches services/routing/main.py and the docs). The
      # single-box shape talks to the in-container OpenWrt on 127.0.0.1:8181;
      # scripts/lib/single-box.sh writes that override into .env before bring-up,
      # so this default is only the multi-box / dev fallback. The previous
      # 10.0.0.1 here matched no shape and was a rule-12 host-specific footgun.
      - OPENWRT_HOST=${OPENWRT_HOST:-192.168.50.1}
      - OPENWRT_PORT=${OPENWRT_PORT:-80}
      - OPENWRT_USERNAME=${OPENWRT_USERNAME:-droplet-ai}
      # Hardware-agnostic escape hatches (WARP-1845). WAN_DEVICE_NAME: empty =
      # resolve the WAN netdev live from `network.interface.wan status` (the
      # right answer on every shape; Pi=eth1, RB5009=p1) — set only if that
      # resolution ever fails. DROPLET_MGMT_INTERFACES gates which interfaces
      # the write routes refuse to touch without `force`; the fallback here
      # must be the REAL default `lan,mgmt`, never empty — an empty value
      # would silently disable the management-interface guard (the compose
      # `${VAR:-}` empty-string-defeats-default trap).
      - WAN_DEVICE_NAME=${WAN_DEVICE_NAME:-}
      - DROPLET_MGMT_INTERFACES=${DROPLET_MGMT_INTERFACES:-lan,mgmt}
      # OPENWRT_PASSWORD is read from /run/secrets/openwrt_password (WARP-37).
      # No longer exposed via `docker inspect`.
      # WARP-1675 (ADR-033 edge-router shape): rpcd account for addressing an
      # EXTERNAL OpenWrt AP directly at its discovered address. The password is
      # read from /run/secrets/ap_openwrt_password (empty → AP-direct
      # configuration is skipped and approvals stay router-side only).
      - AP_USERNAME=${AP_USERNAME:-droplet-ai}
      - AP_PORT=${AP_PORT:-80}
      # ROUTING_SERVICE_TOKEN (WARP-36) replaces PR#5's SERVICE_SECRET for this service.
      - ROUTING_SERVICE_TOKEN=${ROUTING_SERVICE_TOKEN:-}
      # WARP-44: `real` (default) = connect to OpenWrt. `mock` = serve fixtures
      # so dev laptops without a router get a realistic UI. `disabled` is an
      # orchestrator-side concern; this service still runs fine with it.
      - ROUTING_MODE=${ROUTING_MODE:-real}
      # WARP-815 (K4): the Wi-Fi scan radio. The orchestrator no longer hardcodes
      # `wlan0` on the /wireless/scan call, so the SDK resolves the radio from
      # this env (services/routing/droplet_openwrt_sdk.py). Empty default keeps
      # the SDK's last-resort `wlan0` for multi-box/dev; scripts/lib/single-box.sh
      # writes wlp14s0 (sourced from DROPLET_AP_IFACE) into .env on the single-box.
      - DROPLET_WIFI_SCAN_DEVICE=${DROPLET_WIFI_SCAN_DEVICE:-}
      - PORT=8080
      # WARP-1061: internal mTLS. No env_file on this service, so the knob is
      # passed explicitly; 1 flips the :8080 uvicorn listener to TLS +
      # required client certs AND makes the samplers/meters present the
      # bundle below on their orchestrator POSTs. 0 (default) = plaintext.
      - DROPLET_INTERNAL_TLS=${DROPLET_INTERNAL_TLS:-0}
    volumes:
      # WARP-1061: this service's internal-CA bundle (CN = "routing", SANs
      # include host.docker.internal + the single-box bridge-gateway IP for
      # its host-network callers). Server cert for :8080 and client cert for
      # the orchestrator samplers when DROPLET_INTERNAL_TLS=1; inert when 0.
      - ../data/secrets/service-tls/routing:/data/service-tls:ro
    secrets:
      - openwrt_password
      # WARP-1675: external-AP droplet-ai password (see the `secrets:` block).
      - ap_openwrt_password
    restart: always
    <<: *default-logging
    mem_limit: ${ROUTING_MEM_LIMIT:-256m}
    cpus: ${ROUTING_CPUS:-1.0}
    pids_limit: ${CONTAINER_PIDS_LIMIT:-512}

  # --- Matter controller (smart-home commissioning + control) ---
  # WARP-850: owns the matter.js CommissioningController, extracted from
  # the orchestrator. Runs in the init network namespace so it gets:
  #   - raw HCI access to the host Bluetooth adapter (hci0, Intel AX210
  #     on the single-box) for BLE commissioning, and
  #   - native LAN multicast for mDNS discovery on BOTH the home LAN and
  #     the in-container OpenWrt AP's br-lan (a host bridge).
  # The orchestrator is its only consumer (HTTP on :8083 — host-service
  # ladder after routing 8080 / switch 8081 / display 8082), authed via
  # the X-Droplet-Auth shared token. Host Bluetooth prep (bluez tools,
  # bluetoothd DISABLED per WARP-1939 — its LE connection management
  # corrupts noble's raw-HCI connects — droplet-bt-power.service owning
  # adapter power, rfkill unblock) is owned by scripts/setup.sh.
  matter-controller:
    build:
      # Repo-root context so the workspace deps resolve via npm
      # workspaces (same rationale as the orchestrator image).
      context: ..
      dockerfile: services/matter-controller/Dockerfile
    network_mode: host
    cap_add:
      # NET_RAW + NET_ADMIN: AF_BLUETOOTH raw HCI sockets for
      # @stoprocent/noble's hci-socket bindings (BLE central role) plus
      # device up/down during commissioning. Mirrors the noble Docker
      # guidance (host network + raw socket capability).
      - NET_ADMIN
      - NET_RAW
    # NO env_file here — deliberately. matter.js auto-imports every
    # MATTER_* process env var (see scripts/test-security.sh Test 7), so
    # this is the one container that must never inherit the operator's
    # whole .env. Every key it needs is explicit below; compose still
    # interpolates ${...} defaults from --env-file without injecting
    # unrelated vars into the process.
    environment:
      - NODE_ENV=production
      - PORT=8083
      # The ONE allow-listed MATTER_* env var (scripts/test-security.sh).
      # It deliberately folds to matter.js's `storage.path`, pointing the
      # persisted fabric at the matter-data volume below — the SAME
      # volume + path the orchestrator used pre-WARP-850, so commissioned
      # fabrics survive the migration without re-pairing.
      - MATTER_STORAGE_PATH=/data/matter-storage
      - DROPLET_MATTER_CONTROLLER_NAME=${DROPLET_MATTER_CONTROLLER_NAME:-Droplet}
      - DROPLET_MATTER_SERVICE_TOKEN=${DROPLET_MATTER_SERVICE_TOKEN:-}
      # Which HCI adapter to commission over (default hci0).
      - DROPLET_MATTER_BLE_HCI_ID=${DROPLET_MATTER_BLE_HCI_ID:-0}
      # WARP-895: Wi-Fi network handed to BLE-first Matter devices so they
      # can join the LAN. All default empty ⇒ on-network-only commissioning
      # (unchanged behaviour). DROPLET_ prefix (never MATTER_WIFI_*) — a
      # bare MATTER_* name is one stray env_file away from matter.js's
      # auto-import minefield. single-box.sh sets SSID + an operator PSK.
      - DROPLET_MATTER_WIFI_SSID=${DROPLET_MATTER_WIFI_SSID:-}
      - DROPLET_MATTER_WIFI_SSID_FILE=${DROPLET_MATTER_WIFI_SSID_FILE:-}
      - DROPLET_MATTER_WIFI_PSK=${DROPLET_MATTER_WIFI_PSK:-}
      - DROPLET_MATTER_WIFI_PSK_FILE=${DROPLET_MATTER_WIFI_PSK_FILE:-}
      - DROPLET_MATTER_REGULATORY_COUNTRY=${DROPLET_MATTER_REGULATORY_COUNTRY:-XX}
      # WARP-317: this image does NOT ship the validated fips.so (only the
      # five provider images + gateway do — see docker-build.yml), so the
      # FIPS boot gate is pinned OFF *literally*, never interpolated from
      # the global knob. Before this pin, `setup.sh --fips` (WARP-318)
      # wrote DROPLET_FIPS_REQUIRED=true into .env and the old
      # `${...:-false}` interpolation passed it through → getFips()==false
      # → exit 1 → restart-loop. Same values as the old OFF-path render, so
      # the default posture is unchanged. Revisit only if this image gains
      # the provider (then also add it to tests/integration/fips-stack).
      - OPENSSL_CONF=/etc/ssl/openssl.cnf
      - DROPLET_FIPS_REQUIRED=false
      # WARP-1061: internal mTLS. This container deliberately has NO
      # env_file (matter.js MATTER_* auto-import minefield above), so the
      # knob is passed explicitly. 1 flips the :8083 listener to HTTPS +
      # required client certs (src/internal-tls.ts); 0 (default) = the
      # plain node:http server, byte-identical to before.
      - DROPLET_INTERNAL_TLS=${DROPLET_INTERNAL_TLS:-0}
    volumes:
      # Fabric continuity (WARP-850 requirement #2): the named volume
      # moves here from the orchestrator UNCHANGED.
      - matter-data:/data/matter-storage
      # WARP-1061: this service's internal-CA bundle (CN =
      # "matter-controller", SANs include host.docker.internal + the
      # single-box bridge-gateway IP — it's a host-network listener dialled
      # by the orchestrator). Inert when DROPLET_INTERNAL_TLS=0.
      - ../data/secrets/service-tls/matter-controller:/data/service-tls:ro
      # WARP-1035 (closes the WARP-895 follow-up): per-box AP PSK for
      # BLE-first commissioning. Mount the DIRECTORY, never the file — if
      # /etc/droplet/ap-psk were bind-mounted directly and absent at
      # container-create, dockerd would create it as a root-owned
      # DIRECTORY, permanently breaking droplet-openwrt-attach's
      # read-then-generate PSK logic (WARP-819: `tr < dir` fails and the
      # persist can never land). single-box.sh pre-creates /etc/droplet
      # (install -d -m 0755) before bring-up and sets
      # DROPLET_MATTER_WIFI_PSK_FILE=/etc/droplet/ap-psk; the sidecar
      # re-reads the file per commission AND per /capabilities request,
      # so a PSK generated by attach AFTER this container started is
      # picked up with no restart. Read-only: the sidecar is a consumer;
      # attach (host-side) is the only writer.
      - /etc/droplet:/etc/droplet:ro
    restart: always
    <<: *default-logging
    # DROPLET_ prefix (not MATTER_CONTROLLER_*): the ADR-021 knob lives in
    # the operator's .env, and a bare MATTER_* name there is one stray
    # env_file away from matter.js's auto-import minefield.
    mem_limit: ${DROPLET_MATTER_MEM_LIMIT:-256m}
    cpus: ${DROPLET_MATTER_CPUS:-1.0}
    pids_limit: ${CONTAINER_PIDS_LIMIT:-512}

  # --- Email indexer (IMAP IDLE + MIME parser + outbound SMTP) ---
  # WARP-465 D1 follow-up. One async task per EmailAccount via
  # apscheduler — no `while True`. Reads accounts from postgres at
  # boot + every 5 min, POSTs parsed messages to the orchestrator
  # ingest endpoint, drains queued EmailDraft rows via SMTP every 10 s.
  # Fernet key for password decryption lives at /data/secrets/email.key
  # (mode 0600, setup.sh-generated). Health endpoint on :8086 for
  # the docker healthcheck.
  email-indexer:
    build:
      context: ..
      dockerfile: services/email-indexer/Dockerfile
    environment:
      # Compose service names are `db` and `broker` (NOT `postgres` /
      # `mosquitto`). Match the rest of the file's interpolations
      # otherwise the indexer can't open its Prisma connection.
      - DATABASE_URL=${DATABASE_URL:-postgresql://droplet:droplet@db:5432/droplet?sslmode=require}
      - ORCHESTRATOR_URL=${ORCHESTRATOR_URL:-http://orchestrator:3000}
      # SERVICE_TOKEN_EMAIL is generated by scripts/lib/secrets.sh into
      # .env on first install. The email-indexer reads it as
      # ORCHESTRATOR_SERVICE_TOKEN (Python convention "the token I use
      # to call the orchestrator"); the orchestrator stores it as
      # SERVICE_TOKEN_EMAIL (TS convention SERVICE_TOKEN_<consumer>).
      - ORCHESTRATOR_SERVICE_TOKEN=${SERVICE_TOKEN_EMAIL:-}
      # WARP-235: mTLS broker — identity is the client cert CN
      # ("email-indexer"); the username/password pair is retired.
      - MQTT_HOST=${MQTT_HOST:-broker}
      - MQTT_PORT=${MQTT_PORT:-8883}
      - MQTT_TLS=${MQTT_TLS:-1}
      - EMAIL_KEY_PATH=/data/secrets/email.key
      - OUTBOUND_POLL_SECONDS=${OUTBOUND_POLL_SECONDS:-10}
      - ACCOUNT_REFRESH_SECONDS=${ACCOUNT_REFRESH_SECONDS:-300}
      # WARP-317: pinned OFF, replacing the legacy `${...:-true}` default.
      # This image does not ship the validated fips.so, so REQUIRED=true can
      # only ever crash-loop it — and because `:-` treats an *empty* .env
      # value the same as unset, any install that never ran `setup.sh
      # --fips/--no-fips` rendered `true` here and hit exactly that loop on
      # the `full` profile. Literal false is the only boot posture this
      # image can honor; the FIPS boundary (the five provider images +
      # gateway) is asserted by tests/integration/fips-stack.test.sh.
      - DROPLET_FIPS_REQUIRED=false
      # WARP-1061: internal mTLS. No env_file on this service, so the knob
      # is passed explicitly; orchestrator_client.py (already flag-gated)
      # presents the bundle below and dials https:// when it's 1, and the
      # :8086 uvicorn listener flips to TLS + required client certs.
      - DROPLET_INTERNAL_TLS=${DROPLET_INTERNAL_TLS:-0}
    volumes:
      # WARP-235 decision-4 hardening: mount ONLY the Fernet key this service
      # reads (creds.py EMAIL_KEY_PATH), never the data/secrets ROOT — the
      # root holds the internal CA private key + every service's TLS bundle.
      # (Single-file bind: setup.sh materializes email.key before compose up.)
      - ../data/secrets/email.key:/data/secrets/email.key:ro
      # WARP-235: this service's own TLS bundle (CN = "email-indexer") for the
      # mqtts:// broker connection.
      - ../data/secrets/service-tls/email-indexer:/data/service-tls:ro
    depends_on:
      # `db` / `broker` are the canonical service names. `orchestrator`
      # is required because the indexer POSTs ingest deltas on every
      # IDLE cycle; without it, first-boot deliveries land before the
      # orchestrator accepts connections and are permanently lost (the
      # client has no retry queue — a failed POST drops the message).
      - db
      - broker
      - orchestrator
    restart: always
    <<: *default-logging
    profiles: ["full"]
    mem_limit: ${EMAIL_INDEXER_MEM_LIMIT:-256m}
    cpus: ${EMAIL_INDEXER_CPUS:-1.0}
    pids_limit: ${CONTAINER_PIDS_LIMIT:-512}

  # --- Managed Switch (PoE + VLAN control) ---
  switch:
    build:
      # WARP-229: repo-root context for shared FIPS config + helper.
      context: ..
      dockerfile: services/switch/Dockerfile
    network_mode: host
    environment:
      # WARP-1674: defaults mirror the Droplet OpenWrt switch image
      # (droplet-edge-router switch/): static mgmt 192.168.9.2, LAN-side rpcd
      # on :80, per-unit droplet-ai account.
      - SWITCH_HOST=${SWITCH_HOST:-192.168.9.2}
      - SWITCH_PORT=${SWITCH_PORT:-80}
      - SWITCH_USERNAME=${SWITCH_USERNAME:-droplet-ai}
      # ADR-018 T1: the managed-switch credential is read from the Docker secret
      # file at /run/secrets/switch_password (mounted via the `secrets:` block
      # below, written by scripts/setup.sh from the operator-supplied
      # SWITCH_PASSWORD in .env). drivers._load_switch_password() resolves the
      # file first, then this deprecated env var. Mirrors openwrt_password (WARP-37).
      - SWITCH_PASSWORD_FILE=${SWITCH_PASSWORD_FILE:-/run/secrets/switch_password}
      # Deprecated — env fallback kept for local dev / upgrades. Prefer the secret
      # file above. Empty default → driver degrades to "disconnected" (non-fatal).
      - SWITCH_PASSWORD=${SWITCH_PASSWORD:-}
      - SWITCH_DRIVER=${SWITCH_DRIVER:-openwrt}
      # Dedicated orchestrator → switch bearer (same WARP-165 rationale as
      # the display path): the prior ${DEVICE_SECRET_KEY} wiring put the
      # FIPS-sealed master encryption key on the wire for every switch
      # call — and the orchestrator never presented it anyway, so all
      # authenticated endpoints 403'd. Must equal the orchestrator's
      # SERVICE_TOKEN_SWITCH env (wired above to the same source).
      - SERVICE_SECRET=${SERVICE_TOKEN_SWITCH:-}
      - PORT=8081
      # ADR-018 item 9: bring-up provisioning. Off unless explicitly enabled
      # (single-box sets SWITCH_AUTOPROVISION=1 + SWITCH_VLAN_PROFILE=flat-lan
      # in .env). flat-lan only pulls a stranded access port back to VLAN 1;
      # segmented isolation is double-gated on the routing cameras.present
      # cross-check (item 9 depends on item 3).
      - SWITCH_AUTOPROVISION=${SWITCH_AUTOPROVISION:-0}
      - SWITCH_VLAN_PROFILE=${SWITCH_VLAN_PROFILE:-flat-lan}
      - SWITCH_PROTECTED_PORT=${SWITCH_PROTECTED_PORT:-0}
      - SWITCH_CAMERA_PORTS=${SWITCH_CAMERA_PORTS:-}
      - SWITCH_AP_PORTS=${SWITCH_AP_PORTS:-}
      - SWITCH_CLIENT_PORTS=${SWITCH_CLIENT_PORTS:-}
      # ADR-018 item 10: plan-only by default; set SWITCH_LIVE_WRITES=1 after
      # one-time supervised confirmation of the write shape per firmware.
      - SWITCH_LIVE_WRITES=${SWITCH_LIVE_WRITES:-0}
      - SWITCH_PROVISION_TIMEOUT=${SWITCH_PROVISION_TIMEOUT:-30}
      - ROUTING_SERVICE_URL=${ROUTING_SERVICE_URL:-http://localhost:8080}
      - ROUTING_SERVICE_TOKEN=${ROUTING_SERVICE_TOKEN:-}
      # WARP-1061: internal mTLS. No env_file on this service, so the knob is
      # passed explicitly; 1 flips the :8081 uvicorn listener to TLS +
      # required client certs AND makes the routing cross-check client
      # present the bundle below. 0 (default) = plaintext.
      - DROPLET_INTERNAL_TLS=${DROPLET_INTERNAL_TLS:-0}
    # single-box bundles the managed switch so a plugged-in AP auto-provisions
    # onto the LAN instead of stranding on an isolated VLAN (ADR-018 item 9);
    # `full` is the multi-box/explicit-managed shape.
    volumes:
      # ADR-018 item 12: persist last_provisioned_at across container restarts.
      # provision_state.py writes to SWITCH_STATE_DIR (default /var/lib/droplet/switch).
      - switch-state:/var/lib/droplet/switch
      # WARP-1061: this service's internal-CA bundle (CN = "switch"). Server
      # cert for :8081 and client cert toward routing when
      # DROPLET_INTERNAL_TLS=1; inert when 0.
      - ../data/secrets/service-tls/switch:/data/service-tls:ro
    secrets:
      # ADR-018 T1: mounts at /run/secrets/switch_password (0600). Written by
      # scripts/setup.sh from the operator-supplied SWITCH_PASSWORD in .env.
      # No longer exposed via `docker inspect` once the operator sets it.
      - switch_password
    profiles: ["full", "single-box"]
    restart: always
    <<: *default-logging
    mem_limit: ${SWITCH_MEM_LIMIT:-128m}
    cpus: ${SWITCH_CPUS:-0.5}
    pids_limit: ${CONTAINER_PIDS_LIMIT:-512}

  # --- Frigate NVR (camera management + AI detection) ---
  # Linux-only: requires /dev/dri/renderD128 (Intel/AMD VAAPI) and /dev/bus/usb,
  # neither of which exist in Docker Desktop on macOS. Setup writes
  # COMPOSE_PROFILES=linux to .env on Linux so this starts automatically;
  # macOS dev installs skip it and reach the dashboard via the gateway only.
  # Image variants (override FRIGATE_IMAGE in .env):
  #   stable              — default; CPU detector only (works everywhere)
  #   stable-tensorrt     — x86_64 hosts with NVIDIA discrete GPUs
  #   stable-tensorrt-jp6 — a JetPack 6 GPU host (pair with
  #                          FRIGATE_RUNTIME=nvidia + YOLO_MODELS=yolov9-s)
  # FRIGATE_RUNTIME lets the GPU-host scripts set `nvidia` without forcing
  # macOS / Docker Desktop (which has no nvidia runtime) to fail validation.
  frigate:
    image: ${FRIGATE_IMAGE:-ghcr.io/blakeblackshear/frigate:0.17.1}
    runtime: ${FRIGATE_RUNTIME:-runc}
    profiles: ["linux"]
    shm_size: "256mb"
    expose:
      - "8971"
      - "5000"
      - "8554"
      - "8555"
    # Bind the API on host loopback only so the camera-discovery service
    # (network_mode: host — can't resolve compose service DNS) can POST
    # config updates. Not exposed off-host: the orchestrator's
    # /api/cameras/* surface is the only external entry point — there
    # is no /frigate/ route by design. See docs/FRIGATE_PARITY.md.
    ports:
      - "127.0.0.1:5000:5000"
    devices:
      - /dev/bus/usb:/dev/bus/usb              # USB cameras
      # GPU render node. Default `/dev/dri/renderD128` matches every host
      # with a single render node (an NVIDIA GPU host's nvgpu, x86 single-GPU
      # boxes). Override via `FRIGATE_RENDER_NODE` in .env when the dGPU
      # is reserved for another container — on the single-box deployment
      # shape the AMD dGPU (renderD128) hosts Ollama, so Frigate detects
      # on the iGPU at renderD129. Setup wizard / `setup.sh --single-box`
      # writes this.
      - ${FRIGATE_RENDER_NODE:-/dev/dri/renderD128}:/dev/dri/renderD128  # GPU render node
    volumes:
      - frigate-config:/config
      # NVR recordings default to the `nvrdata` named volume so every fresh
      # deployment works out of the box. On GPU lab hosts the operator
      # can redirect this to a dedicated NVMe partition by overriding
      # `NVR_MEDIA_SOURCE` in .env (e.g. NVR_MEDIA_SOURCE=/mnt/cameras)
      # once the partition is provisioned. See docs/STATUS.md.
      - ${NVR_MEDIA_SOURCE:-nvrdata}:/media/frigate
      - /etc/localtime:/etc/localtime:ro
      # Writable: Frigate 0.17 persists API-driven config changes
      # (camera-discovery auto-adoption PUTs to /api/config/set) by
      # rewriting this file on disk. A :ro mount silently reverts every
      # auto-added camera on restart and trips "Config file is read-only,
      # unable to migrate" on version bumps.
      - ../docker/frigate/config.yml:/config/config.yml
      # NVIDIA Tegra TensorRT + NVMM libraries. The JP6 TensorRT image
      # calls into libnvdla_compiler.so / libnvmedia* which live in
      # /usr/lib/aarch64-linux-gnu/tegra on the host; without this
      # bind-mount the ONNX→TensorRT model compilation falls back to
      # CPU detection. Harmless on x86/macOS because the path is missing
      # and docker-compose skips the mount with a warning.
      - /usr/lib/aarch64-linux-gnu/tegra:/usr/lib/aarch64-linux-gnu/tegra:ro
      - /usr/lib/aarch64-linux-gnu/nvidia:/usr/lib/aarch64-linux-gnu/nvidia:ro
      # WARP-235: this service's own TLS bundle (CN = "frigate") for the
      # mqtts:// broker connection — host/port/cert paths are static in
      # docker/frigate/config.yml now (no env substitution, no password).
      - ../data/secrets/service-tls/frigate:/data/service-tls:ro
    env_file:
      - path: ../.env
        required: false
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      # JP6 image only: ``YOLO_MODELS`` triggers the ``trt-model-prepare``
      # s6-overlay service which still expects legacy ``.cfg`` inputs and
      # fails with "file (yolov9-s.cfg) not found!" on the 0.17.1 image.
      # Leave empty to keep the s6 service a no-op; hand-drop the ONNX
      # model into the ``frigate-config`` volume and set ``detectors.onnx``
      # in config.yml when you want GPU detection.
      - YOLO_MODELS=${YOLO_MODELS:-}
    depends_on:
      - broker
    restart: always
    <<: *default-logging
    # Frigate is the most memory-intensive linux-profile service: it runs
    # the detector model + FFmpeg decode pipelines concurrently.
    # NOTE (cgroups v2): the 256mb shm_size above is tmpfs that counts
    # AGAINST mem_limit, so the effective process budget here is ~768 MB,
    # not 1 GB. Single-stream is fine; for 2+ camera streams raise the
    # ceiling, e.g. FRIGATE_MEM_LIMIT=1536m. See docs/ADR-012.
    mem_limit: ${FRIGATE_MEM_LIMIT:-1g}
    cpus: ${FRIGATE_CPUS:-2.0}
    pids_limit: ${FRIGATE_PIDS_LIMIT:-1024}

  # --- Ambient-data web fetcher (WARP-1436) ---
  # The ONLY component with outbound HTTP for the get_weather /
  # currency_convert LLM tools (Open-Meteo + ECB, keyless — see
  # docs/security/allowed-egress.yaml and docs/screened-web-access-design.md).
  # Opt-in twice over: the `web` compose profile AND the ambient_data
  # off-LAN channel both default off. Bridge-net on purpose: no LAN
  # membership, no host ports — only the orchestrator talks to it
  # (bearer service token).
  web-fetch:
    build:
      context: ..
      dockerfile: services/web-fetch/Dockerfile
    expose:
      - "8010"
    env_file:
      - path: ../.env
        required: false
    environment:
      # Not one of the six FIPS provider-carrying images — pin the boot
      # gate + OpenSSL config to the literal OFF posture (see the
      # device-identity-svc comment; `environment:` beats env_file).
      - DROPLET_FIPS_REQUIRED=false
      - OPENSSL_CONF=/etc/ssl/openssl.cnf
    profiles: ["web"]
    restart: unless-stopped
    <<: *default-logging
    mem_limit: ${WEB_FETCH_MEM_LIMIT:-256m}
    cpus: ${WEB_FETCH_CPUS:-0.5}
    pids_limit: ${CONTAINER_PIDS_LIMIT:-512}

  # --- ERP direct-SQL bridge (WARP-1106) ---
  # The DB-touching half of the direct-SQL Eaglesoft track: unixODBC + pyodbc
  # against a practice's SAP SQL Anywhere database. It exists because there is
  # no viable modern Node driver for SQL Anywhere, so the orchestrator reaches
  # it over internal REST instead (services/erp-connector/src/sql-bridge-client.ts).
  #
  # NEVER PUBLISHED OFF-BOX. `expose:` only, no `ports:` — this container holds
  # the practice's database credentials and executes statements against their
  # system of record. The orchestrator is its only caller.
  #
  # Opt-in twice over, and both are load-bearing:
  #   1. the `erp` compose profile (off by default), and
  #   2. an operator vendoring the license-gated SAP SQL Anywhere client into
  #      the image (services/erp-sql-bridge/vendor/README.md). Without it the
  #      container starts and answers /health honestly with ok:false.
  # The orchestrator's ERP_SQL_BRIDGE_URL is likewise empty by default, so a
  # box that has not done both degrades to ERP_NOT_CONNECTED rather than
  # reporting a connection failure it cannot act on.
  #
  # ERP_DB_RO_PASSWORD / ERP_DB_RW_PASSWORD are the practice's own least-
  # privilege accounts (services/erp-connector/sql/provision.sql). They live in
  # .env, never in this file, and are never accepted from a request — the
  # bridge picks the identity by ROUTE (/read/* → ro, /write/* → rw). The write
  # account is unset until a write capability is explicitly enabled.
  erp-sql-bridge:
    build:
      # WARP-229: repo-root context for shared FIPS config + helper.
      context: ..
      dockerfile: services/erp-sql-bridge/Dockerfile
    expose:
      - "9095"
    env_file:
      - path: ../.env
        required: false
    environment:
      # Not one of the six FIPS provider-carrying images — pin the boot gate +
      # OpenSSL config to the literal OFF posture (see the device-identity-svc
      # comment; `environment:` beats env_file).
      - DROPLET_FIPS_REQUIRED=false
      - OPENSSL_CONF=/etc/ssl/openssl.cnf
      - ERP_DB_HOST=${ERP_DB_HOST:-}
      - ERP_DB_PORT=${ERP_DB_PORT:-2638}
      - ERP_DB_NAME=${ERP_DB_NAME:-PattersonPM}
      - ERP_DB_SERVER_NAME=${ERP_DB_SERVER_NAME:-PattersonPM}
      - ERP_DB_RO_USER=${ERP_DB_RO_USER:-droplet_ro}
      - ERP_DB_RW_USER=${ERP_DB_RW_USER:-droplet_rw}
      - ERP_ODBC_DRIVER=${ERP_ODBC_DRIVER:-SQL Anywhere 17}
      - ERP_DB_ENCRYPTION=${ERP_DB_ENCRYPTION:-NONE}
    healthcheck:
      # /health returns 200 with ok:false when the practice's DB is
      # unreachable — that is the honest answer, and it is deliberately NOT a
      # container failure: a dental server rebooting must not restart-loop this
      # sidecar. The probe checks the service answers, not that the practice is up.
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:9095/health',timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    profiles: ["erp"]
    restart: unless-stopped
    <<: *default-logging
    mem_limit: ${ERP_SQL_BRIDGE_MEM_LIMIT:-256m}
    cpus: ${ERP_SQL_BRIDGE_CPUS:-0.5}
    pids_limit: ${CONTAINER_PIDS_LIMIT:-512}

  # --- Camera auto-discovery (ONVIF + RTSP scanning) ---
  camera-discovery:
    build:
      # WARP-229: repo-root context for shared FIPS config + helper.
      context: ..
      dockerfile: services/camera-discovery/Dockerfile
    network_mode: host
    cap_add:
      - NET_ADMIN
    env_file:
      - path: ../.env
        required: false
    volumes:
      # WARP-235: this service's own TLS bundle (CN = "camera-discovery") for
      # the mqtts:// broker connection over the loopback :8883 publish.
      - ../data/secrets/service-tls/camera-discovery:/data/service-tls:ro
    environment:
      # WARP-317: no validated fips.so in this image — pin the FIPS boot
      # gate + OpenSSL config to the literal OFF posture so a FIPS-on .env
      # inherited via env_file can't crash-loop it (see the
      # device-identity-svc comment; `environment:` beats env_file).
      - DROPLET_FIPS_REQUIRED=false
      - OPENSSL_CONF=/etc/ssl/openssl.cnf
      # Host-mode service — dials the broker's host-loopback TLS publish
      # (127.0.0.1:8883) via MQTT_BROKER_LOCAL from .env
      - MQTT_BROKER=${MQTT_BROKER_LOCAL:-mqtts://localhost:8883}
      - ROUTING_SERVICE_URL=${ROUTING_SERVICE_URL:-http://localhost:8080}
      - FRIGATE_URL=http://localhost:5000
      - SCAN_INTERVAL=${CAMERA_SCAN_INTERVAL:-30}
      - CAMERA_SUBNET=${CAMERA_SUBNET:-192.168.100.0/24}
      # WARP-583: optional CA bundle / cert path enabling TLS verification of
      # the camera first-run (vendor-init) HTTPS clients. The path must be
      # visible INSIDE the container (bind-mount it via a compose override).
      # Unset -> unverified fallback (cameras ship per-device self-signed
      # certs on first run) with a once-per-process warning; a set-but-missing
      # path fails closed.
      - CAMERA_INIT_CA_CERT=${CAMERA_INIT_CA_CERT:-}
      # WARP-1957 — what a newly adopted camera keeps. Frigate 0.17 defaults
      # `continuous` and `motion` to 0, so a camera adopted without these
      # explicitly set records nothing beyond alert clips while the UI says
      # "Recording". Both adoption writers (this service and the orchestrator)
      # read the SAME names — keep the two blocks in step.
      #
      # ⚠ Leave these UNSET to get the shipped defaults. Compose expands an
      # unset variable to an EMPTY STRING, which both readers deliberately
      # treat as absent — a naive numeric coercion would turn "" into 0,
      # i.e. "keep nothing", which is the exact bug being fixed.
      - NVR_DEFAULT_CONTINUOUS_DAYS=${NVR_DEFAULT_CONTINUOUS_DAYS:-}
      - NVR_DEFAULT_MOTION_DAYS=${NVR_DEFAULT_MOTION_DAYS:-}
      - NVR_DEFAULT_ALERTS_RETAIN_DAYS=${NVR_DEFAULT_ALERTS_RETAIN_DAYS:-}
      - NVR_DEFAULT_DETECTIONS_RETAIN_DAYS=${NVR_DEFAULT_DETECTIONS_RETAIN_DAYS:-}
      # Seconds of footage kept either side of an event. Frigate 0.17 bounds
      # these at 60 (le=60 on RecordConfig); a larger value fails the WHOLE
      # config save, so both readers clamp.
      - NVR_DEFAULT_EVENT_PRE_CAPTURE_SEC=${NVR_DEFAULT_EVENT_PRE_CAPTURE_SEC:-}
      - NVR_DEFAULT_EVENT_POST_CAPTURE_SEC=${NVR_DEFAULT_EVENT_POST_CAPTURE_SEC:-}
      - NVR_DEFAULT_SNAPSHOT_RETAIN_DAYS=${NVR_DEFAULT_SNAPSHOT_RETAIN_DAYS:-}
    # NOTE: no `depends_on: frigate` — frigate is profile-gated to "linux"
    # (Linux-only). Compose errors on a depends_on whose target isn't in the
    # active profile set, so camera-discovery waits only on broker and treats
    # frigate as best-effort over its localhost HTTP client.
    depends_on:
      - broker
    # ADR-018 Decision 4 / T5: also active on the `single-box` shape. A compose
    # service runs when ANY of its profiles is active; the single-box brings up
    # { linux, display, single-box } (scripts/lib/single-box.sh), so without
    # `single-box` here camera-discovery was orphaned — no container ran and the
    # camera scan found nothing (live symptom #5). `full` is retained so the
    # multi-box / explicit-`full` path is unchanged. The shape's actual camera
    # network is set via the CAMERA_SUBNET knob (single-box → "auto", resolved
    # from the edge router at scan time — WARP-1805), not by dropping the
    # profile guard onto macOS dev installs.
    profiles: ["full", "single-box"]
    restart: always
    <<: *default-logging
    mem_limit: ${CAMERA_DISCOVERY_MEM_LIMIT:-256m}
    cpus: ${CAMERA_DISCOVERY_CPUS:-1.0}
    pids_limit: ${CONTAINER_PIDS_LIMIT:-512}

  # --- Voice assistant (WARP-154) ---
  # Always-on voice loop: mic capture -> wake-word -> STT -> orchestrator
  # agent loop -> TTS -> speaker. Hardware-agnostic device discovery in
  # services/voice-io/voice/devices.py picks the best mic/speaker
  # at startup (USB > platform-bus I²S codec > onboard PCI > HDMI). Env
  # overrides (VOICE_INPUT_DEVICE / VOICE_OUTPUT_DEVICE) pin specific
  # hardware for production. See services/voice-io/README.md
  # §"Hardware compatibility" for the supported configurations.
  #
  # Profile-gated to "linux" because /dev/snd doesn't exist on Docker
  # Desktop for macOS; dev installs there skip it. Single-box and
  # multi-box deployments both run Linux so the profile is on by
  # default via setup.sh.
  voice-io:
    build:
      context: ..
      dockerfile: services/voice-io/Dockerfile
    # /dev/snd is the ALSA device tree. WARP-1092: mount it as a LIVE bind
    # (not a static `devices:` snapshot) and grant the whole ALSA char
    # class via a device-cgroup rule, so a ReSpeaker XVF3800 that settles a
    # few seconds AFTER this container starts — the boot/reflash container-
    # storm race — becomes visible AND usable WITHOUT a container restart.
    # A `devices:` entry only mknods the minors present at create time and
    # cgroup-permits exactly those, so a late-enumerating card is stranded
    # (container sees no cards, /health flatlines) until a human restarts
    # voice-io. The bind is a live view of the host dir (late nodes appear)
    # and the wildcard cgroup rule permits them; voice-io's wake loop
    # re-resolves + opens the card when it shows up (pipeline.py).
    #
    # WARP-1055 — voice-calibration is a named volume so the wizard's
    # applied mic calibration (voice/calibration.py, mounted at /data)
    # survives container restarts/recreates; factory-reset's volume sweep
    # wipes it, which is exactly the §6.4 "reset ⇒ Not calibrated yet"
    # behaviour. WARP-1056 — per-person voiceprints live on the same
    # volume (/data/voiceprints, voice/speaker_id.py), so the sweep also
    # deletes every voiceprint on reset. WARP-1599 — the admin kill
    # switch is the third resident (/data/voice-enabled.json,
    # voice/enabled.py), which means a factory reset turns voice back ON:
    # the flag is gone, an absent file reads as enabled, and the box
    # comes back listening. Intended — reset returns the appliance to
    # out-of-the-box behaviour, and out of the box it listens — but it is
    # the one item on this volume whose loss ADDS a capability rather
    # than removing one, so it belongs in any reset-facing copy.
    volumes:
      - /dev/snd:/dev/snd
      - voice-calibration:/data
      # WARP-1061: this service's internal-CA bundle (CN = "voice-io").
      # Server cert for :8086 and client cert toward the orchestrator (llm.py
      # is already flag-gated) when DROPLET_INTERNAL_TLS=1; inert when 0.
      # NOTE: /data is the calibration volume above, so the bundle mounts at
      # the same canonical path INSIDE it — Docker layers the two mounts.
      - ../data/secrets/service-tls/voice-io:/data/service-tls:ro
      # WARP-1057 — DSP restart path. POST /voice/restart-processor execs
      # the vendor xvf_host CLI (`REBOOT 1` — the host watchdog's exact
      # heal) over raw USB. The whole host /usr/local/bin is bound
      # read-only rather than the single binary: a single-file bind of a
      # not-yet-installed tool would materialise a root-owned DIRECTORY
      # at the host path (breaking a later install AND the watchdog's -x
      # probe), while the directory bind is a live view — install the
      # tool on the host and the endpoint starts working, no recreate.
      # /dev/bus/usb is the same live-bind pattern as /dev/snd above so
      # the re-enumerated device node stays reachable.
      - /usr/local/bin:/host/usr-local-bin:ro
      - /dev/bus/usb:/dev/bus/usb
    # ALSA sound-class char major is 116; the wildcard minor covers ANY
    # card, including one that enumerates after container-create (which the
    # old per-minor `devices:` rule could not). read / write / mknod.
    # 189 is the usb_device char class — xvf_host's control path to the
    # XVF3800 (WARP-1057); wildcard minor for the same late-enumeration
    # reason (a DSP reboot re-enumerates by design).
    device_cgroup_rules:
      - "c 116:* rmw"
      - "c 189:* rmw"
    # Pairs with the device-cgroup grant above, matching the oled-display
    # scoped-device pattern: the cgroup rule is the real access control;
    # this just stops a setuid binary inside the container from escalating
    # beyond its launch cap-bag. voice-io (a Python FastAPI service) needs
    # no privilege elevation, so this is free belt-and-braces.
    security_opt:
      - no-new-privileges:true
    # The host's audio group GID. On Ubuntu/Debian (single-box + inference host) it's 29;
    # docker-compose's numeric group_add doesn't care if a name exists
    # in the container's /etc/group as long as the kernel sees the GID
    # match for /dev/snd's owner.
    group_add:
      - "29"
    env_file:
      - path: ../.env
        required: false
    environment:
      - VOICE_INPUT_DEVICE=${VOICE_INPUT_DEVICE:-}
      - VOICE_OUTPUT_DEVICE=${VOICE_OUTPUT_DEVICE:-}
      # Multichannel→mono: "first" (default) consumes channel 0 — the
      # primary/processed channel on mic arrays (the reSpeaker XVF3800
      # carries beamformed voice on L, AEC residual on R; averaging the
      # two halves the voice). "mean" averages, for plain stereo mics.
      - VOICE_INPUT_DOWNMIX=${VOICE_INPUT_DOWNMIX:-}
      # Digital gain on the mono capture frame (int16-clipped). 1.0 =
      # untouched; ~2.0 ≈ +6 dB for a quiet chain. Survives chip
      # reboots, unlike xvf_host AUDIO_MGR_MIC_GAIN tweaks.
      - VOICE_INPUT_GAIN=${VOICE_INPUT_GAIN:-}
      # Flatline watchdog (WARP-1037). The ReSpeaker XVF3800's XMOS DSP
      # can wedge with the USB stream still open — voice-io keeps
      # "listening" while every frame is pure digital silence. When the
      # input sits at/near digital zero (below VOICE_FLATLINE_DBFS,
      # default -70 dBFS) for VOICE_FLATLINE_WINDOW_S seconds (default
      # 240) while state=listening, /health degrades to 503 so this
      # container's healthcheck + the ops-console flag the wedge instead
      # of reporting healthy-but-deaf. 0 disables. Recovery is automatic
      # once audio returns (e.g. after an xvf_host DSP reboot).
      - VOICE_FLATLINE_WINDOW_S=${VOICE_FLATLINE_WINDOW_S:-}
      - VOICE_FLATLINE_DBFS=${VOICE_FLATLINE_DBFS:-}
      # WARP-1057 — recovery half of the flatline watchdog above. The
      # xvf_host binary as seen INSIDE the container (default resolves
      # into the /host/usr-local-bin read-only bind); timeout is the
      # subprocess deadline for the REBOOT control write.
      - XVF_HOST_PATH=${XVF_HOST_PATH:-/host/usr-local-bin/xvf_host}
      - XVF_RESTART_TIMEOUT_S=${XVF_RESTART_TIMEOUT_S:-}
      # WARP-1055 — where the applied mic calibration persists (JSON on
      # the voice-calibration named volume above). The dashboard wizard
      # writes it via POST /voice/calibration; startup re-applies the
      # tuned gain + wake threshold over the env defaults.
      - VOICE_CALIBRATION_PATH=${VOICE_CALIBRATION_PATH:-/data/calibration.json}
      - VOICE_SAMPLE_RATE=${VOICE_SAMPLE_RATE:-16000}
      - VOICE_FRAME_MS=${VOICE_FRAME_MS:-30}
      - DEVICE_RESCAN_INTERVAL=${DEVICE_RESCAN_INTERVAL:-5}
      - ORCHESTRATOR_URL=${ORCHESTRATOR_URL:-http://orchestrator:3000}
      # MUST equal the orchestrator's SERVICE_TOKEN_VOICE env. Wire both
      # to the same secret in .env (a single generated value). Empty
      # default lets dev installs run with LLM_URL=__mock__; production
      # requires a real shared secret or every /api/llm/chat 401s.
      - ORCHESTRATOR_TOKEN=${SERVICE_TOKEN_VOICE:-${ORCHESTRATOR_TOKEN:-}}
      # Wake-word backend. `vosk` (default) recognizes the WAKE_WORD
      # phrases out of the box — no per-phrase training, no licensing fee
      # — so "droplet" and "hey droplet" both work on every box.
      # Automatically falls back to openWakeWord (hey_jarvis) if the
      # bundled Vosk model is absent. WAKE_WORD is a comma-separated list
      # of phrases; the box wakes on ANY of them (WARP-1431).
      - WAKE_ENGINE=${WAKE_ENGINE:-vosk}
      - WAKE_WORD=${WAKE_WORD:-droplet,hey droplet}
      # Threshold semantics are engine-aware (resolve_wake_threshold in
      # voice-io main.py). Under vosk every fire carries real acoustic
      # evidence — the MINIMUM per-word confidence of the finalized
      # phrase match (evidence-free matches never fire) — and a genuine
      # spoken wake scores ~0.9+, so unset means the vosk default (0.7).
      # That gates the living-room-TV false accepts the old fixed-0.5
      # partial-fire scoring let through. Lower toward 0.5 if real wakes
      # get missed at distance; tune per docs/voice-assistant-plan.md.
      # (openWakeWord scores are sigmoids — its unset default stays 0.3.)
      - WAKE_THRESHOLD=${WAKE_THRESHOLD:-}
      # STT — wake → next 5 s of audio gets streamed here for transcription.
      # `wyoming-faster-whisper` is the sibling container below (Rhasspy's
      # Wyoming-protocol wrapper around faster-whisper). Set STT_URL=__mock__
      # to disable STT (wake fires but no transcription).
      - STT_URL=${STT_URL:-tcp://wyoming-faster-whisper:10300}
      - STT_LANGUAGE=${STT_LANGUAGE:-en}
      - STT_MAX_RECORD_S=${STT_MAX_RECORD_S:-5.0}
      # WARP-1434 — end-of-speech VAD for the STT capture window. Once the
      # user starts talking, the capture ends after a short run of trailing
      # silence instead of always holding the mic for the full
      # STT_MAX_RECORD_S. Empty passthrough: effective defaults live in
      # services/voice-io/voice/pipeline.py (single source of truth).
      #   VAD_SILENCE_S    — trailing silence (s) that ends the turn (default
      #                      0.6). Raise if the box cuts people off mid-pause.
      #   VAD_SPEECH_RMS   — int16 frame RMS above which a frame counts as
      #                      speech (default 700; between a ~400 room floor and
      #                      ~1000+ speech). Tune per room — this is the knob
      #                      the pipeline docstring points operators at.
      #   VAD_MIN_SPEECH_S — min cumulative speech before end-of-speech may
      #                      fire (default 0.4), so the wake-word tail + a pause
      #                      before the command don't end the turn early.
      - VAD_SILENCE_S=${VAD_SILENCE_S:-}
      - VAD_SPEECH_RMS=${VAD_SPEECH_RMS:-}
      - VAD_MIN_SPEECH_S=${VAD_MIN_SPEECH_S:-}
      # WARP-1434 — how long (s) the wake_detected / transcript_ready UI hints
      # linger before decaying back to 'listening' so the dashboard's pulse
      # animation has time to play (default 2.0). Empty passthrough.
      - WAKE_VISUAL_DECAY_S=${WAKE_VISUAL_DECAY_S:-}
      # TTS — synthesizes the LLM's reply via Piper. Same Wyoming
      # protocol as STT, different port. Set TTS_URL=__mock__ for a dev
      # box with no Piper container (the pipeline will accept speak()
      # calls but play silent audio).
      - TTS_URL=${TTS_URL:-tcp://wyoming-piper:10200}
      - TTS_VOICE=${TTS_VOICE:-en_US-ryan-medium}
      # LLM — voice posts transcripts to the orchestrator's /api/llm/chat
      # which runs the full ReAct agent loop (MCP tool dispatch -> ai-
      # gateway -> ollama-manager :8002 -> Ollama). This is the canonical
      # path per shared_brain `docs/agentic-workflows.md` + `docs/
      # LLM_AGENT.md` — voice gets the same conversational + tool surface
      # the dashboard does. Service auth via ORCHESTRATOR_TOKEN above.
      # Set LLM_URL=__mock__ for a dev box with no orchestrator (transcript
      # echoes as the spoken reply).
      - LLM_URL=${LLM_URL:-http://orchestrator:3000}
      # Default per shared_brain LLM_AGENT.md (qwen2.5:3b-instruct fits
      # the inference host's 7 GB RAM budget with the rest of the stack up).
      # Override via env if the appliance has a larger/different model
      # loaded (see droplet-local-LLM /models/sync).
      - LLM_MODEL=${LLM_MODEL:-qwen2.5:3b-instruct}
      # WARP-1432 — voice turn shaping (client-side request shape only).
      # Empty passthrough: the effective defaults live in
      # services/voice-io/voice/llm.py (single source of truth), same
      # pattern as WAKE_THRESHOLD above.
      #   VOICE_MAX_TOKENS — per-turn generation cap (default 1024).
      #   Voice always sends ephemeral:true too (no env — it's a
      #   constant: voice has no persisted session). The box's gpt-oss
      #   voice model spends reasoning tokens before visible content, so
      #   the cap is generous (covers reasoning + a short spoken answer);
      #   too low → empty completion. Gateway hard-caps at 4096.
      - VOICE_MAX_TOKENS=${VOICE_MAX_TOKENS:-}
      #   VOICE_ALLOWED_TOOLS — comma-separated tool names the voice
      #   assistant may use on tool-enabled turns. Empty → the curated
      #   in-code default (box health, cameras, network, files, smart
      #   devices + control_device, calendar, reminders) instead of the
      #   full ~43-tool set, cutting ~5k → ~1-1.5k tokens of schema
      #   prefill per turn. The greeting fast path (tool_choice="none")
      #   sends zero tools regardless.
      - VOICE_ALLOWED_TOOLS=${VOICE_ALLOWED_TOOLS:-}
      # Context the LLM gets in its system prompt at every reply():
      # current local time + the device's location. Both auto-detected
      # via voice/geo.py (free IP-geolocation lookup at startup,
      # cached for the process lifetime). Set DROPLET_LOCATION here to
      # pin manually and skip the lookup; same for TZ. Empty default
      # means "auto-detect — let the geo lookup fill it in".
      - DROPLET_LOCATION=${DROPLET_LOCATION:-}
      - TZ=${TZ:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    # Internal-only; orchestrator's /api/voice/* proxy is how the dashboard
    # reaches it. Port intentionally not published to the host.
    expose:
      - "8086"
    # Skip on macOS Docker Desktop (no /dev/snd).
    profiles: ["linux"]
    restart: always
    <<: *default-logging
    mem_limit: ${VOICE_IO_MEM_LIMIT:-512m}
    cpus: ${VOICE_IO_CPUS:-1.0}
    pids_limit: ${CONTAINER_PIDS_LIMIT:-512}

  # --- Whisper STT sidecar (WARP-154) ---
  # Rhasspy's wyoming-faster-whisper — TCP-protocol Whisper server that
  # voice-io streams post-wake audio to. Same `small.en` default
  # the file-indexer service uses; the named volume mount shares the
  # download path so we don't pay the 470 MB download twice. Whisper runs
  # CPU-only in every current deployment shape — the single-box's dGPU is
  # Ollama's and its iGPU is Frigate's, so there is deliberately no device
  # knob. (WARP-1434 removed a stale "set WHISPER_DEVICE=cuda — image
  # auto-detects" comment here: that env var was wired into neither the
  # command nor the environment, and the image does not auto-detect a
  # device — it takes an explicit --device it was never given.)
  wyoming-faster-whisper:
    # Pinned (WARP-844 follow-up): the Wyoming wire format differs across
    # image versions (v1 inline-data vs v2 data_length framing), so a
    # floating tag meant a routine pull could flip the protocol under the
    # STT clients. Both in-repo clients (voice-io stt.py, orchestrator
    # stt.client.ts) parse BOTH formats, but the pin keeps upgrades
    # deliberate. 3.1.0 == today's `latest`.
    image: rhasspy/wyoming-whisper:${WHISPER_IMAGE_TAG:-3.1.0}
    # Profile gate matches voice-io — same Linux-only audio
    # stack. On macOS dev installs the whole voice path is skipped.
    profiles: ["linux"]
    # Wyoming protocol on TCP/10300 (default). Bound to the compose
    # network only — voice-io reaches it by service name.
    expose:
      - "10300"
    environment:
      - WHISPER_MODEL=${WHISPER_MODEL:-small.en}
      - WHISPER_LANGUAGE=${WHISPER_LANGUAGE:-en}
    # WARP-1434 — the CTranslate2 thread count MUST track the CPU quota
    # (cpus: ${WHISPER_CPUS:-2.0} below). The old --cpu-threads 4 inside a
    # 2.0-core cap oversubscribed: 4 compute threads contending for 2 cores
    # adds context-switch churn without speeding transcription. Default 2 =
    # the quota; if you raise WHISPER_CPUS, raise WHISPER_CPU_THREADS to match.
    command: >
      --model ${WHISPER_MODEL:-small.en}
      --language ${WHISPER_LANGUAGE:-en}
      --uri tcp://0.0.0.0:10300
      --beam-size 1
      --compute-type ${WHISPER_COMPUTE:-int8}
      --cpu-threads ${WHISPER_CPU_THREADS:-2}
    volumes:
      # Whisper model cache (~470 MB for small.en). Named volume so a
      # `docker compose down` doesn't redownload; mounted read-write so
      # the first-run download can land in the right place.
      - whisper-models:/data
    restart: always
    <<: *default-logging
    # Whisper loads the full model into RAM at startup: small.en ~470 MB.
    mem_limit: ${WHISPER_MEM_LIMIT:-1g}
    cpus: ${WHISPER_CPUS:-2.0}
    pids_limit: ${CONTAINER_PIDS_LIMIT:-512}

  # --- Piper TTS sidecar (WARP-154) ---
  # Rhasspy's wyoming-piper. Pairs with wyoming-faster-whisper to
  # complete the voice loop: mic → STT (text) → LLM → reply text → TTS
  # (audio) → speaker. Same Wyoming protocol on TCP/10200 by default.
  # Voices download on first request and cache in the named volume.
  wyoming-piper:
    # Pinned (WARP-590): match the whisper sidecar's deliberate-upgrade
    # posture instead of floating on `latest`. 2.2.2 == today's `latest`.
    image: rhasspy/wyoming-piper:${PIPER_IMAGE_TAG:-2.2.2}
    profiles: ["linux"]
    expose:
      - "10200"
    environment:
      - PIPER_VOICE=${TTS_VOICE:-en_US-ryan-medium}
    command: >
      --voice ${TTS_VOICE:-en_US-ryan-medium}
      --uri tcp://0.0.0.0:10200
    volumes:
      # ~70 MB per voice — persistent so we don't redownload on every
      # compose down/up. Multiple voices coexist; change TTS_VOICE in
      # .env to switch.
      - piper-voices:/data
    restart: always
    <<: *default-logging
    mem_limit: ${PIPER_MEM_LIMIT:-512m}
    cpus: ${PIPER_CPUS:-1.0}
    pids_limit: ${CONTAINER_PIDS_LIMIT:-512}

  # --- TFT Display (3.5" front-panel) ---
  # Drives the Adafruit PyPortal Titano over USB-serial. DISPLAY_BACKEND
  # accepts: auto (probe PyPortal, fall back to sim), pyportal, or sim.
  # The direct-SPI / fbtft-framebuffer / GPIO paths were removed; the
  # PyPortal's own SAMD51 handles rendering, so we just stream JSON
  # commands over /dev/ttyACM* — no privileged access or GPIO needed.
  # Service name stays `oled-display` for backwards-compatibility with the
  # orchestrator's display.client.ts and existing env wiring.
  oled-display:
    build:
      # WARP-229: repo-root context for shared FIPS config + helper.
      context: ..
      dockerfile: services/oled-display/Dockerfile
    network_mode: host
    environment:
      # WARP-165: dedicated service-to-service bearer for the orchestrator
      # → display path (was reusing DEVICE_SECRET_KEY, the FIPS-sealed
      # AES-256 master encryption key). Both ends of the channel — the
      # FastAPI app inside this container and the host-side device-bridge
      # — verify the same value, wired below.
      - SERVICE_SECRET=${SERVICE_TOKEN_DISPLAY:-}
      # Same token — the container talks to host-side device-bridge.
      - BRIDGE_AUTH_TOKEN=${SERVICE_TOKEN_DISPLAY:-}
      - PORT=8082
      - DISPLAY_BACKEND=${DISPLAY_BACKEND:-auto}
      # WARP-1640 — parameterised for the rack panel. A box with the 1424x280
      # HDMI bar sets DISPLAY_BACKEND=fb + LCD_WIDTH=1424 + LCD_HEIGHT=280 in
      # .env; the defaults keep every PyPortal box byte-identical.
      - LCD_WIDTH=${LCD_WIDTH:-480}
      - LCD_HEIGHT=${LCD_HEIGHT:-320}
      - FB_DEVICE=${FB_DEVICE:-/dev/fb0}
      # Touch calibration for the USB touchscreen (fb backend only). Left
      # blank the reader finds the panel by VID:PID and reads the axis ranges
      # off the device itself.
      - TOUCH_DEVICE=${TOUCH_DEVICE:-}
      - TOUCH_SWAP_XY=${TOUCH_SWAP_XY:-0}
      - TOUCH_INVERT_X=${TOUCH_INVERT_X:-0}
      - TOUCH_INVERT_Y=${TOUCH_INVERT_Y:-0}
      - PYPORTAL_TTY=${PYPORTAL_TTY:-/dev/ttyACM1}
      - PYPORTAL_BAUD=${PYPORTAL_BAUD:-115200}
      # WARP-1061: internal mTLS. No env_file on this service, so the knob is
      # passed explicitly; 1 flips the :8082 uvicorn listener to TLS +
      # required client certs (the orchestrator's display.client.ts and the
      # host droplet-shutdown-screen.sh both present certs). 0 = plaintext.
      - DROPLET_INTERNAL_TLS=${DROPLET_INTERNAL_TLS:-0}
    volumes:
      # Bind /dev so /dev/ttyACM* is visible in the container and survives
      # PyPortal re-enumeration (USB hotplug changes the minor number).
      - /dev:/dev:rw
      # WARP-1061: this service's internal-CA bundle (CN = "oled-display",
      # SANs include host.docker.internal + the single-box bridge-gateway IP
      # — host-network listener dialled by the orchestrator). Inert when
      # DROPLET_INTERNAL_TLS=0.
      - ../data/secrets/service-tls/oled-display:/data/service-tls:ro
    # Scoped device access — just the USB ACM class (major 166) instead of
    # full `privileged: true`. Without the cgroup rule the kernel refuses
    # open() on /dev/ttyACM* with EPERM and the service falls back to sim
    # mode; with it, and only it, nothing else in the container can touch
    # arbitrary host devices. `c 166:* rmw` = character device, major 166,
    # any minor, read/write/mknod.
    #
    # WARP-1640 adds two more for the rack panel: major 29 (framebuffer, so
    # the fb backend can open /dev/fb0) and major 13 (input, so the touch
    # reader can open /dev/input/event*). Both are still device-class-scoped —
    # this is NOT `privileged: true`.
    #
    # ⚠ Without the rule, open() fails **EPERM**, not EACCES: /dev is already
    # bind-mounted rw above and the container runs as root, so the denial comes
    # from the device cgroup, not file permissions. Reading that EPERM as a
    # perms problem costs an hour; fb.py's error message says so explicitly.
    device_cgroup_rules:
      - "c 166:* rmw"
      - "c 29:* rmw"
      - "c 13:* rmw"
    # Don't let the container escalate beyond whatever cap-bag it launched
    # with. Belt-and-braces — device_cgroup_rules above is the actual
    # access control; this just blocks setuid binaries from flipping.
    security_opt:
      - no-new-privileges:true
    # WARP-165: own profile (was `full` alongside switch + camera-discovery).
    # The `display` profile defaults on for Linux installs because the
    # service auto-falls back to a `simulated` backend (PNG file) when
    # /dev/ttyACM* is absent, so a customer without a physical PyPortal
    # still gets a working stack. Splitting it out of `full` means
    # default Linux installs no longer drag in switch + camera-discovery,
    # which both require real hardware + credentials and either error
    # silently or scan the network on boot.
    profiles: ["display"]
    restart: always
    <<: *default-logging
    mem_limit: ${OLED_DISPLAY_MEM_LIMIT:-128m}
    cpus: ${OLED_DISPLAY_CPUS:-0.5}
    pids_limit: ${CONTAINER_PIDS_LIMIT:-512}

  # ---------------------------------------------------------------------------
  # ops-console — operator-side monitoring + control surface.
  #
  # Profile-gated to "ops" so the customer's normal `docker compose up`
  # (default + "full") does not start it. Operator turns it on with:
  #   docker compose --profile ops up -d ops-console
  # which is wired up by the operator's reverse-tunnel script (future).
  #
  # Mounts /var/run/docker.sock — that's the privilege boundary. Anyone
  # inside this container is effectively root on the host. The bearer
  # token in services/ops-console/ops/auth.py is what stops uninvited
  # /ops/* requests; the reverse tunnel + tailscale ACL is the outer
  # layer (covered in services/ops-console/README.md).
  # ---------------------------------------------------------------------------
  ops-console:
    build:
      context: ..
      dockerfile: services/ops-console/Dockerfile
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # Operator pastes this token into the UI. setup.sh writes a 32-byte
      # hex string to .env; if missing the container generates an
      # ephemeral one and logs it loudly (NOT for production).
      - OPS_TOKEN=${OPS_TOKEN:-}
      # Per-service probe URLs. Defaults verified live on the single-box 2026-05-15.
      # Empty default = container exists but exposes no HTTP /health
      # endpoint; surfaces as `unknown` (relies on /ops/containers for
      # liveness). Override any with a real URL via .env to enable.
      - OPS_PROBE_ORCHESTRATOR=${OPS_PROBE_ORCHESTRATOR:-http://orchestrator:3000/api/orchestrator/health}
      - OPS_PROBE_AI_GATEWAY=${OPS_PROBE_AI_GATEWAY:-http://ai-gateway:8000/ai/health}
      - OPS_PROBE_VOICE=${OPS_PROBE_VOICE:-http://voice-io:8086/health}
      - OPS_PROBE_FRIGATE=${OPS_PROBE_FRIGATE:-http://frigate:5000/healthz}
      # WARP-535: dashboard ships /healthz — probe via service DNS. The
      # default must live HERE too, not just in ops/services.py: this
      # line injects the env as an empty string when .env omits it, and
      # an empty (but set) env overrides the Python-side default.
      - OPS_PROBE_WEB_DASHBOARD=${OPS_PROBE_WEB_DASHBOARD:-http://web-dashboard:3001/healthz}
      # Workers / no-HTTP-by-design — leave defaults empty:
      - OPS_PROBE_FILE_INDEXER=${OPS_PROBE_FILE_INDEXER:-}
      - OPS_PROBE_CAMERA_DISCOVERY=${OPS_PROBE_CAMERA_DISCOVERY:-}
      - OPS_PROBE_DEVICE_IDENTITY=${OPS_PROBE_DEVICE_IDENTITY:-}
      - OPS_PROBE_MCP=${OPS_PROBE_MCP:-}
      - OPS_PROBE_ROUTING=${OPS_PROBE_ROUTING:-}
      - OPS_PROBE_SWITCH=${OPS_PROBE_SWITCH:-}
      - OPS_PROBE_NEXTCLOUD=${OPS_PROBE_NEXTCLOUD:-}
      # WARP-1061: internal mTLS. No env_file on this service, so the knob is
      # passed explicitly; 1 makes the mesh probes (ops/services.py) present
      # the bundle below and dial https://. The INBOUND :8087 listener stays
      # plain HTTP deliberately — it is loopback-published for the operator's
      # browser over an SSH/WireGuard tunnel, which cannot present internal
      # client certs; the bearer token + loopback bind remain the gate
      # (documented exemption in docs/security/internal-mtls.md).
      - DROPLET_INTERNAL_TLS=${DROPLET_INTERNAL_TLS:-0}
    ports:
      # Bind to 127.0.0.1 only — the operator reaches it through an SSH
      # tunnel or (future) the WireGuard reverse tunnel. Never expose
      # this on the customer-facing IP, even with the bearer token,
      # because docker.sock = host root.
      #
      # Host port 8089 (not 8087) to stay outside the 808x service
      # cluster (gateway/routing/switch/mcp/voice all live there) and
      # avoid any chance of colliding with oled-display which runs in
      # host network mode. Container still listens on 8087 internally.
      - "127.0.0.1:8089:8087"
    volumes:
      # The whole point of this container — read container state +
      # restart sick ones. Mount as :ro is NOT possible because the
      # daemon needs write to act on POSTs. The bearer-token gate +
      # the compose-project label scoping in ops/docker_client.py
      # restrict what callers can ask for.
      - /var/run/docker.sock:/var/run/docker.sock
      # WARP-1061: this service's internal-CA bundle (CN = "ops-console") —
      # client cert for the mesh health probes when DROPLET_INTERNAL_TLS=1.
      - ../data/secrets/service-tls/ops-console:/data/service-tls:ro
      # WARP-337: persistent audit log. Every /ops/* request lands
      # here as a JSONL line (timestamp, identity, method, path,
      # status, latency, optional detail). Mount the named volume
      # rather than a bind so the audit trail survives ops-console
      # container restarts during a support engagement.
      - ops-audit:/var/log/ops-console
    # No-new-privileges defence-in-depth — even with docker.sock the
    # container itself can't gain extra caps. Helpful if a future
    # ops-console exec path lands and we forget to harden it.
    security_opt:
      - no-new-privileges:true
    profiles: ["ops"]
    restart: unless-stopped
    <<: *default-logging
    mem_limit: ${OPS_CONSOLE_MEM_LIMIT:-256m}
    cpus: ${OPS_CONSOLE_CPUS:-1.0}
    pids_limit: ${CONTAINER_PIDS_LIMIT:-512}

  # ==========================================================================
  # single-box profile (`COMPOSE_PROFILES=single-box`) — bundled-inference
  # deployment shape services.
  # ==========================================================================
  # The multi-box deployment runs Ollama on a separate inference host (the dGPU
  # host) and a real OpenWrt router host. The single-box shape
  # collapses both into containers on the same x86 host. Services below
  # ONLY start when the `single-box` profile is active; on every other
  # deployment shape they're invisible.
  #
  # Activation: `COMPOSE_PROFILES=single-box` in .env (setup.sh writes this
  # when it detects single-box hardware: dGPU + iGPU + no separate inference host
  # on LAN). Operators can also force it with
  # `COMPOSE_PROFILES=single-box,linux docker compose up -d` for testing.
  #
  # Captured 2026-05-24 from /home/droplet/edge-platform/docker/docker-compose.override.yml
  # on the box at 192.168.1.87 — Phase 1 of the "box = repo" cleanup.
  # See scripts/host/_box-snapshot-2026-05-24.md for the full inventory.

  # --- Ollama (ROCm) ---------------------------------------------------------
  # Local LLM inference on the AMD dGPU. Image is the upstream rocm variant
  # which natively supports gfx1200 (RDNA4) — do NOT set HSA_OVERRIDE_GFX_VERSION,
  # it would force gfx1100 emulation and break things.
  #
  # Bound to host loopback so the ollama-manager sidecar (Phase 3) can reach
  # it without exposing :11434 off-box. The chat path from ai-gateway uses
  # the compose service name `ollama` (resolved via the default bridge
  # network), not the host loopback.
  ollama:
    # Pinned (WARP-590): the upstream `rocm` tag rolls forward on every
    # release, so a routine pull could swap the inference runtime under the
    # box. 0.30.8-rocm == today's `rocm`; it still natively supports gfx1200
    # (RDNA4), so the no-HSA_OVERRIDE note above still holds.
    image: ollama/ollama:0.30.8-rocm
    container_name: droplet-ollama
    # Its OWN profile, deliberately not `single-box`.
    #
    # `single-box` is a four-service bundle — it also carries `openwrt` (2557),
    # `switch` (1541) and `camera-discovery` (1792). While ollama shared that
    # token there was no way to stop serving Ollama without also dropping the
    # in-container router, the switch agent and camera discovery with it. On a
    # DMR-flipped box that left a model-less daemon holding /dev/kfd and
    # renderD128 open next to the runtime actually serving — precisely the
    # "never both" the SINGLE GPU OWNER note below forbids.
    #
    # Splitting it out makes the runtime choice a single token:
    #   Ollama box -> COMPOSE_PROFILES=...,single-box,ollama
    #   DMR box    -> COMPOSE_PROFILES=...,single-box,dmr
    # `scripts/lib/single-box.sh` appends whichever matches INFERENCE_RUNTIME,
    # so neither a fresh provision nor a setup re-run can start both or neither.
    profiles: ["ollama"]
    restart: unless-stopped
    <<: *default-logging
    expose:
      - "11434"
    ports:
      # Host loopback for ollama-manager + host-side `ollama` CLI. Public
      # access goes through ai-gateway, not direct.
      - "127.0.0.1:11434:11434"
    # SINGLE GPU OWNER (WARP-1826): exactly one inference runtime may hold
    # these devices in production — this service, or the dark `dmr` profile
    # INSTEAD of it, never both. Bench/soak stacks run as separate compose
    # projects and are NOT covered by profiles: WARP-1824 happened because a
    # bench project held ~10 GiB of the card while this service loaded the
    # chat model, which landed 0/25 layers on the GPU and served from CPU.
    # Do not run any GPU-resident stack against a box that is serving.
    devices:
      - "/dev/kfd:/dev/kfd"
      - "${OLLAMA_RENDER_NODE:-/dev/dri/renderD128}:/dev/dri/renderD128"
    group_add:
      - "993"  # render
      - "44"   # video
    environment:
      ROCR_VISIBLE_DEVICES: "0"
      OLLAMA_HOST: "0.0.0.0:11434"
      # WARP-1826: 5m, matching the inference repo's own compose default
      # (300 s). Placement is decided at LOAD time and pinned until unload —
      # the previous "24h" here kept the WARP-1824 CPU placement alive for a
      # day after VRAM freed. A short keep-alive means a bad placement
      # self-heals within minutes, and an idle card between conversations
      # costs one ~30 s warm-up (the UI owns the "warming up" honesty,
      # WARP-836/1112). Raise via .env only with a reason written down.
      OLLAMA_KEEP_ALIVE: "${OLLAMA_KEEP_ALIVE:-5m}"
      # WARP-854: Ollama's baked-in default context is 4096 tokens. The
      # owner-role agent loop ships ~80 tool schemas (~11k tokens of
      # prompt), so the default overflowed before generation even began —
      # Ollama returned finish_reason=length with ZERO output tokens and
      # every dashboard chat surfaced as an instant empty answer. 16k
      # fits tools + memory block + history while keeping gpt-oss:20b's
      # KV cache fully resident on a 16 GB GPU.
      OLLAMA_CONTEXT_LENGTH: "${OLLAMA_CONTEXT_LENGTH:-16384}"
      # 2026-07-21 agent-budgets spec §5 — window-experiment levers. Empty
      # defaults = Ollama's own defaults (f16 KV cache, flash attention off),
      # so today's behavior is byte-identical. OLLAMA_KV_CACHE_TYPE=q8_0
      # roughly halves KV-cache VRAM (flash attention is its prerequisite);
      # set both in .env only per the spec §6 measurement protocol — never
      # as a silent default change.
      OLLAMA_FLASH_ATTENTION: "${OLLAMA_FLASH_ATTENTION:-}"
      OLLAMA_KV_CACHE_TYPE: "${OLLAMA_KV_CACHE_TYPE:-}"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      # `ollama --version` only confirms the binary executes; the
      # container can be healthy while the HTTP server on :11434 is
      # still starting (or has died). `ollama list` makes a real call
      # to the daemon at the default OLLAMA_HOST (loopback), so a
      # non-zero exit signals the server isn't listening. No extra
      # tools required — `ollama` is already in the image.
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    # Ollama's ceiling is the dominant RAM consumer on single-box: the
    # qwen2.5:3b model weights + KV cache sit at ~3-4 GB hot. 4 GB cap
    # lets it finish loading without starving the rest of the default
    # stack. Raise OLLAMA_MEM_LIMIT in .env for larger models.
    mem_limit: ${OLLAMA_MEM_LIMIT:-4g}
    cpus: ${OLLAMA_CPUS:-4.0}
    pids_limit: ${OLLAMA_PIDS_LIMIT:-2048}

  # --- Docker Model Runner (THE DEFAULT RUNTIME — WARP-1870) ----------------
  # The second implementation of the ADR-036 runtime contract, and since
  # WARP-1870 the one a FRESH BOX PROVISIONS TO: `scripts/lib/secrets.sh`
  # writes `INFERENCE_RUNTIME=dmr` and `.env.example` ships
  # `COMPOSE_PROFILES=linux,single-box,dmr`, so this service starts on a
  # default install and `ollama` below does not.
  #
  # It is still profile-gated rather than unconditional, because the profile
  # token IS the runtime switch: `scripts/lib/single-box.sh` appends exactly
  # one of `dmr` / `ollama` from INFERENCE_RUNTIME and strips the other, so a
  # box can never run both (the WARP-1826 SINGLE GPU OWNER rule) or neither.
  #
  # HISTORY (this header said "DARK — NEVER started by default" until
  # WARP-1926 corrected it): the flip was gated on a lab soak and human
  # sign-off per ADR-036 §8. Both happened — WARP-1772 phase 2 shipped the
  # single-box flip, WARP-1870 made it the provisioning default.
  #
  # Phase-0 gate (WARP-1741) PASSED on this box 2026-08-08: gfx1200 visible
  # via rocminfo inside the container; decode 103.5% of Ollama on the 3B pair
  # (50-trial tool arm, 100% parse both sides) and 102.8% on gpt-oss:20b
  # (65.87 vs 64.10 tok/s, 25/25 tool parse both sides, 80 schemas). Full
  # tables in docs/ADR-036-inference-runtime-abstraction.md §5a.
  dmr:
    # Pinned for the same reason `ollama` above is (WARP-590): a floating tag
    # would swap the inference runtime under the box on a routine pull. The
    # `-rocm` variant is the AMD build; bare `v1.2.6` is CPU-only and presents
    # as a catastrophic-looking perf regression rather than as an error.
    image: ${DMR_IMAGE:-docker/model-runner:v1.2.6-rocm}
    container_name: droplet-dmr
    profiles: ["dmr"]
    restart: unless-stopped
    <<: *default-logging
    ports:
      # LOOPBACK ONLY — a security control, not a convenience (ADR-036 §6).
      # DMR's API is unauthenticated by design, and POST /models/create is an
      # arbitrary-registry-pull primitive: anything that reaches this port can
      # make the box fetch an OCI artifact of its choosing. Never the LAN
      # bridge, never 0.0.0.0. Parity here is with THIS file's `ollama`
      # (127.0.0.1:11434 above); the appliance repo's cross-host 11434 publish
      # is a divergence its own ADR-005 §5 owns and must not be copied.
      - "127.0.0.1:${DMR_PORT:-12434}:12434"
    devices:
      # Identical GPU wiring to `ollama` above — same kernel interfaces, same
      # render node, so the two runtimes are interchangeable on this card.
      # Inline rather than droplet-local-LLM#51's per-vendor overlay split:
      # this file IS the single-box shape and already wires its `ollama` for
      # ROCm inline; adopt the overlay idiom only if single-box ever ships on
      # non-AMD silicon.
      - "/dev/kfd:/dev/kfd"
      - "${OLLAMA_RENDER_NODE:-/dev/dri/renderD128}:/dev/dri/renderD128"
    group_add:
      # Host GIDs, mirrored from `ollama` above. DMR runs as the non-root
      # `modelrunner` user, so without these it opens /dev/kfd and the render
      # node with no group membership and silently falls back to CPU — which
      # presents as "40x slower", not as a permissions error.
      - "993"  # render
      - "44"   # video
    environment:
      # DMR's model store, pointed at the named volume below. Restated (it is
      # the image default) because the mount and this value must agree — a
      # silent disagreement means an empty store.
      MODELS_PATH: /models
      # Same single-GPU pin as `ollama` above.
      ROCR_VISIBLE_DEVICES: "0"
      # WARP-854 parity: the same 16k window as OLLAMA_CONTEXT_LENGTH above,
      # expressed the only way that provably applies AND survives a container
      # restart. LLAMA_ARG_CTX_SIZE is llama.cpp's env form of --ctx-size; the
      # image itself relies on that mechanism (its baked env sets
      # LLAMA_ARG_HOST), and model-runner spawns llama-server without
      # scrubbing the environment. MEASURED on the box 2026-08-08: the HTTP
      # _configure alternative returns 202 yet silently no-ops unless the
      # model id is REGISTRY-QUALIFIED (docker.io/ai/…) — an env var has no
      # such trap and is visible in `docker inspect`.
      #
      # DELIBERATELY ABSENT: HSA_OVERRIDE_GFX_VERSION. gfx1200 (RDNA4) is
      # native; the override forces gfx1100 kernels onto it and breaks it —
      # same warning as `ollama` above.
      LLAMA_ARG_CTX_SIZE: "${DMR_CONTEXT_LENGTH:-16384}"
    volumes:
      # Its OWN store, never ollama-data. The two runtimes use different
      # on-disk formats (OCI artifact layout vs Ollama's manifest/blob
      # layout); pointing them at one directory risks either runtime
      # rewriting the other's store, which is unrecoverable short of a purge.
      - dmr-models:/models
    # HEALTHCHECK DELIBERATELY NOT DECLARED — the image ships its own against
    # GET /engines/status, which is exactly the right probe, so the correct
    # action is to inherit it. Restating it would hard-code a tool (curl/wget/
    # sh) we have not verified exists in the image; `disable: true` would
    # suppress it entirely. Same stage-rather-than-guess call as the openwrt
    # cap reduction below.
    security_opt:
      # Defence in depth on an unauthenticated listener: the process cannot
      # gain capabilities it didn't start with.
      - "no-new-privileges:true"
    # Model loads are slow; a SIGKILL mid-load can tear the model store.
    stop_grace_period: 60s
    # ADR-021 parity with `ollama` above — same default, same .env override.
    # CAVEAT (recorded, not guessed away): the Phase-0 bench rig ran UNCAPPED
    # (the rig file documents that as a known confound), so 4g is inherited
    # from the ollama service's reasoning, not re-measured under DMR's
    # staging behavior. Verify under load before any flip; raise via
    # DMR_MEM_LIMIT if the 20B load thrashes.
    mem_limit: ${DMR_MEM_LIMIT:-4g}
    cpus: ${DMR_CPUS:-4.0}
    pids_limit: ${DMR_PIDS_LIMIT:-2048}

  # --- OpenWrt (router-in-container) ---------------------------------------
  # Hosts the Wi-Fi AP (after `droplet-openwrt-attach` moves the host's
  # MT7922 PHY into this container's netns) plus the WireGuard VPN
  # endpoint. The routing service (above) talks to this via 127.0.0.1:8181
  # over host networking — see scripts/host/usr-local-sbin/droplet-openwrt-attach
  # for the full bootstrap sequence.
  #
  # Privileged + NET_ADMIN/SYS_ADMIN because OpenWrt's procd does a lot of
  # network interface manipulation that requires real capabilities. tmpfs
  # for /tmp and /run because OpenWrt expects writable scratch space at
  # init time and these are runtime-state-only.
  #
  # WARP-585 (threat model + hardening): this is the riskiest cell in the
  # compose file — the ONLY service that pairs `privileged: true` with a
  # customer-facing UDP listener (WireGuard :51820). `privileged: true` is an
  # OVER-GRANT: it hands the container ALL capabilities (not just the two in
  # cap_add below — those are redundant while privileged is set), ALL host
  # devices, and disables the seccomp + AppArmor profiles. procd/netifd only
  # justify NET_ADMIN (+ likely SYS_ADMIN for procd mounts); the rest is blast
  # radius. On the single-box shape this container boundary stands in for the
  # Foundation's physical WAN/Edge-vs-Vault air-gap, so it must be as tight as
  # possible. Full boundary, attack scenarios, and the exact reduced cap set:
  #   docs/security/openwrt-container-threat-model.md
  # The reduced cap set is STAGED (commented) below rather than applied: the
  # single-box profile is Linux-only and cannot run in CI/macOS, so a cap
  # reduction cannot be verified here without a real Wi-Fi PHY + host netns
  # move + kernel WireGuard module. It must be validated on hardware first
  # (WARP Hardware Test) — see the block after this service.
  openwrt:
    # WARP-826: bake the AP/router packages (hostapd, iw, wpad, umdns, wireguard,
    # uhttpd/rpcd) into the image so a fresh container / post-factory-reset box
    # never depends on a first-boot `opkg install` — the race that left the AP
    # dead (hostapd absent) until droplet-openwrt-attach could reach the feed.
    # `network: host` so opkg can resolve downloads.openwrt.org at build time via
    # the host resolv.conf; the Dockerfile makes /var/lock first (the rootfs has
    # none pre-init, so opkg cannot lock). droplet-openwrt-attach still
    # installs-if-missing at runtime as a safety net.
    build:
      # WARP-868: context is openwrt/ (not singlebox-image/) so the Dockerfile
      # can COPY the canonical rpcd ACL from openwrt/files/usr/share/rpcd/acl.d/
      # — one source of truth shared with the multi-box image overlay, instead
      # of a duplicated copy that drifts.
      context: ../openwrt
      dockerfile: singlebox-image/Dockerfile
      network: host
    image: droplet/openwrt-singlebox:24.10.2
    container_name: droplet-openwrt
    hostname: openwrt
    profiles: ["single-box"]
    command: /sbin/init
    # WARP-585: over-grant (see the block comment above + the threat-model doc).
    # The STAGED hardened alternative that replaces this — cap_drop ALL + a
    # scoped cap_add + no-new-privileges + explicit sysctls — is commented after
    # this service; do NOT enable it until it passes on a real single-box.
    privileged: true
    restart: unless-stopped
    <<: *default-logging
    # NOTE: redundant while `privileged: true` is set (privileged already grants
    # ALL caps). Kept so the intended scoped set is visible; they become the
    # actual grant only once privileged is removed per the staged block below.
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    # WARP-1385: the customer-facing WireGuard listener (udp/51820) is NO LONGER
    # published here via docker-proxy. docker-proxy owns host:51820 and
    # masquerades the container's OUTBOUND wg packets with an EPHEMERAL host
    # source port, so the box's egress mapping never matches the inbound path and
    # the direct-punch overlay (ADR-031) can't hole-punch (verified live on .87,
    # 2026-06-10). The listener is now wired at the HOST layer by
    # scripts/host/usr-local-sbin/droplet-openwrt-attach: a DNAT of inbound
    # udp/51820 into this container plus a source-port-PRESERVING masquerade on
    # egress. Only the host-only ubus port stays published.
    ports:
      - "127.0.0.1:8181:80"                   # uhttpd / ubus, host-only —
                                              # routing service reaches it
                                              # via 127.0.0.1:8181 (Phase L).
    tmpfs:
      - /tmp
      - /run
    volumes:
      - openwrt-config:/etc/config
      - openwrt-overlay:/overlay
    mem_limit: ${OPENWRT_MEM_LIMIT:-512m}
    cpus: ${OPENWRT_CPUS:-1.0}
    pids_limit: ${OPENWRT_PIDS_LIMIT:-1024}

  # ===========================================================================
  # WARP-585 — STAGED hardening for the `openwrt` service above. NOT ACTIVE.
  # ===========================================================================
  # This is the ready-to-test end state that replaces `privileged: true` with a
  # scoped capability set, restores the default seccomp + AppArmor profiles, and
  # blocks setuid elevation. It is intentionally COMMENTED OUT: the single-box
  # profile is Linux-only and cannot run in CI or on macOS, so this cannot be
  # verified here without a real Wi-Fi PHY, the host netns move, and the host
  # kernel WireGuard module. Enabling an unverified cap reduction risks a box
  # whose AP/WireGuard/procd silently fails to boot.
  #
  # HARDWARE-VERIFY BEFORE ENABLING — tracked in WARP-1016 (WARP Hardware Test):
  # on a real single-box, delete `privileged: true` + the two `cap_add` entries
  # from the live `openwrt` service and merge the keys below into it, then
  # confirm:
  #   1. procd boots clean (no mount errors in `docker logs droplet-openwrt`);
  #   2. `droplet-openwrt-attach` brings the AP up (hostapd `type AP`, client
  #      gets a DHCP lease);
  #   3. WireGuard `:51820/udp` completes a handshake + the VPN client reaches
  #      the dashboard;
  #   4. ubus over 127.0.0.1:8181 answers (routing service healthy);
  #   5. a container restart re-attaches cleanly (overlay + config persist).
  # If procd fails at step 1, re-add SYS_ADMIN first (procd mount ops), then
  # MKNOD (procd/hotplug device-node creation at init) — the two most-likely
  # re-adds from the Docker-default caps that `cap_drop: ALL` intentionally
  # removes.
  #   DON'T misdiagnose EROFS: removing `privileged` re-applies Docker's default
  #   read-only /proc/sys, so runtime sysctl writers NOT covered by the `sysctls:`
  #   below (netifd per-interface knobs, fw4's net.netfilter.*, procd applying
  #   /etc/sysctl.d) will log benign `Read-only file system` warnings. Those are
  #   EXPECTED and are NOT a missing capability — only mount/device errors point
  #   to a cap re-add.
  # Rationale for every line:
  #   docs/security/openwrt-container-threat-model.md §6.
  #
  # openwrt-hardened-staged:      # merge these keys INTO `openwrt`, don't run standalone
  #   # Remove `privileged: true` and the redundant cap_add from the live block.
  #   # `cap_drop: ALL` intentionally drops the 14 Docker-default caps too (MKNOD,
  #   # SETPCAP, SYS_CHROOT, AUDIT_WRITE, FSETID, SETFCAP, ...); the add-back below
  #   # is only what OpenWrt is expected to need. WARP-1016 re-adds any that an
  #   # observed boot/runtime failure proves necessary (MKNOD is the likeliest).
  #   cap_drop:
  #     - ALL
  #   cap_add:
  #     - NET_ADMIN          # netifd, hostapd (nl80211), fw4/nftables, wg, ip link/addr/route
  #     - NET_RAW            # hostapd + dnsmasq raw sockets (DHCP)
  #     - NET_BIND_SERVICE   # uhttpd :80, dnsmasq :53/:67 under cap_drop ALL
  #     - SYS_ADMIN          # procd early-init mounts. CONFIRM whether droppable on hardware.
  #     - CHOWN              # passwd root / procd service files
  #     - DAC_OVERRIDE       # procd + uci writes under /etc, /overlay
  #     - FOWNER
  #     - SETUID             # passwd (setuid-root), dnsmasq drop-to-user
  #     - SETGID
  #     - KILL               # procd service supervision
  #   security_opt:
  #     # Blocks ONLY privilege elevation across execve (setuid/setgid/file-caps);
  #     # verify vs passwd/dnsmasq. The seccomp + docker-default AppArmor profiles
  #     # come back from REMOVING `privileged`, NOT from this opt.
  #     - no-new-privileges:true
  #   sysctls:
  #     - net.ipv4.ip_forward=1
  #     - net.ipv4.conf.all.forwarding=1
  #   # No devices:/device_cgroup_rules: — the Wi-Fi PHY is moved into the netns
  #   # host-side (iw phy set netns), and WireGuard is a kernel netdev; neither
  #   # is a /dev node the container opens.
  # ===========================================================================

  # Cloudflare Tunnel connector (WARP-974 / ADR-025) — the OUTBOUND, serverless
  # replacement for DuckDNS + the inbound WireGuard port. It dials Cloudflare's
  # edge (no inbound port, no port-forward, CGNAT-friendly; the home IP is never
  # published). A Cloudflare WARP client reaches the box's LAN over the tunnel and
  # the box serves its OWN droplet-us.com cert end-to-end — Cloudflare routes at
  # L3 and never terminates TLS (see docs/ADR-025). `cloudflared` reads its
  # connector token from TUNNEL_TOKEN in ../.env (never tracked).
  #
  # Gated behind the `relay` profile, which scripts/lib/single-box.sh activates
  # ONLY when TUNNEL_TOKEN is set — so an unconfigured box never crash-loops a
  # tokenless connector. Pinned by digest to the image verified on .87 (WARP-974).
  cloudflared:
    image: cloudflare/cloudflared@sha256:6d91c121b803126f7a5344005d17a9324788fc09d305b6e2560ec6040a7ae283
    container_name: droplet-cloudflared
    profiles: ["relay"]
    # host netns so the connector reaches the box dashboard (192.168.1.87) and the
    # AP resolver/LAN (192.168.20.1) that the tunnel's private-network route serves.
    network_mode: host
    command: ["tunnel", "--no-autoupdate", "--loglevel", "info", "run"]
    env_file:
      - path: ../.env
        required: false
    restart: unless-stopped
    mem_limit: ${CLOUDFLARED_MEM_LIMIT:-128m}
    cpus: ${CLOUDFLARED_CPUS:-0.5}
    pids_limit: ${CLOUDFLARED_PIDS_LIMIT:-512}

  # --- Fleet telemetry agent (WARP-963) ---
  # Outbound-only, fail-open push of operational telemetry (heartbeat /
  # metrics / errors / inventory / network shape) to the Warp Lab analytics
  # portal over the frozen droplet-analytics agent API. DOUBLE-gated:
  # profile `telemetry` (a default box never starts the container) AND
  # DROPLET_TELEMETRY_ENABLED=1 + credentials inside the process (a started
  # container with the flag off idles with ZERO egress). v1 answers every
  # portal command with an explicit "unsupported" — no remote actuation.
  # Egress audit table: services/fleet-agent/README.md (ADR-012 discipline).
  fleet-agent:
    build:
      # Repo-root context for the shared FIPS config + helper (WARP-229),
      # mirroring camera-discovery / ai-gateway.
      context: ..
      dockerfile: services/fleet-agent/Dockerfile
    # RegisterRequest.hostname is captured ONCE into the portal's
    # Machine.hostname — the operator-facing fleet identifier. config.py
    # falls back to socket.gethostname() when DROPLET_HOSTNAME is empty,
    # and inside a container that is Docker's random hex container id;
    # pin the container hostname so the fallback is a stable, honest
    # name instead. Mirrors device-identity's DROPLET_DEVICE_ID default.
    hostname: ${DROPLET_HOSTNAME:-droplet}
    env_file:
      - path: ../.env
        required: false
    environment:
      # WARP-317: no validated fips.so in this image — pin the FIPS boot
      # gate + OpenSSL config to the literal OFF posture so a FIPS-on .env
      # inherited via env_file can't crash-loop it (see the
      # device-identity-svc comment; `environment:` beats env_file).
      - DROPLET_FIPS_REQUIRED=false
      - OPENSSL_CONF=/etc/ssl/openssl.cnf
      - DROPLET_TELEMETRY_ENABLED=${DROPLET_TELEMETRY_ENABLED:-0}
      - DROPLET_TELEMETRY_PORTAL_URL=${DROPLET_TELEMETRY_PORTAL_URL:-https://analytics.warp-lab.ai/api/v1}
      - DROPLET_TELEMETRY_PROVISIONING_CODE=${DROPLET_TELEMETRY_PROVISIONING_CODE:-}
      - DROPLET_TELEMETRY_GEO_COUNTRY=${DROPLET_TELEMETRY_GEO_COUNTRY:-}
      - DROPLET_TELEMETRY_GEO_REGION=${DROPLET_TELEMETRY_GEO_REGION:-}
      - DROPLET_FIRMWARE_VERSION=${DROPLET_FIRMWARE_VERSION:-}
      - DROPLET_TIER=${DROPLET_TIER:-home}
      - DROPLET_HOSTNAME=${DROPLET_HOSTNAME:-}
      # WARP-1025: signed update-poll (ADR-028 mount). Its OWN opt-in,
      # default OFF; verification fails closed on the placeholder trust
      # anchor until the key ceremony (scripts/README.md). Empty
      # RELEASES_URL falls back to the canonical publisher in config.py.
      - DROPLET_UPDATE_POLL_ENABLED=${DROPLET_UPDATE_POLL_ENABLED:-0}
      - DROPLET_OTA_RELEASES_URL=${DROPLET_OTA_RELEASES_URL:-}
      - DROPLET_UPDATE_POLL_SEC=${DROPLET_UPDATE_POLL_SEC:-300}
      - DROPLET_UPDATE_CHANNEL=${DROPLET_UPDATE_CHANNEL:-stable}
      - DROPLET_CUSTOMER=${DROPLET_CUSTOMER:-}
    volumes:
      # Ingest token + bounded heartbeat spool + verified update-candidate
      # record. Runtime-only, never tracked.
      - fleet-agent-state:/var/lib/droplet/fleet-agent
    profiles: ["telemetry"]
    restart: unless-stopped
    <<: *default-logging
    mem_limit: ${FLEET_AGENT_MEM_LIMIT:-64m}
    cpus: ${FLEET_AGENT_CPUS:-0.25}
    pids_limit: ${CONTAINER_PIDS_LIMIT:-512}

secrets:
  # WARP-37: OpenWrt router password mounted read-only at /run/secrets/openwrt_password
  # in the routing container. Written by scripts/setup.sh from $OPENWRT_PASSWORD.
  openwrt_password:
    file: ../docker/secrets/openwrt_password
  # ADR-018 T1: managed-switch password mounted read-only at
  # /run/secrets/switch_password in the switch container. The value is
  # OPERATOR-SUPPLIED (the switch is not a device we mint secrets for) — setup.sh
  # writes it from $SWITCH_PASSWORD in .env, never generated. The file is created
  # (empty when unset) so this `file:` resolves and `docker compose up` works on
  # boxes without a managed switch; an empty file → driver "disconnected".
  switch_password:
    file: ../docker/secrets/switch_password
  # WARP-1675 (ADR-033): external OpenWrt AP droplet-ai password mounted
  # read-only at /run/secrets/ap_openwrt_password in the routing container.
  # OPERATOR-SUPPLIED (the AP mints its own per-unit password at first boot —
  # copy /etc/droplet/droplet-ai-password off the AP) — setup.sh's
  # sync_ap_password_secret() writes it from $AP_OPENWRT_PASSWORD in .env,
  # never generated, empty placeholder when unset so `docker compose up`
  # works on boxes without an external AP.
  ap_openwrt_password:
    file: ../docker/secrets/ap_openwrt_password

volumes:
  pgdata:
  nvrdata:
  frigate-config:
  aikeys:
  nextcloud-data:
  # WARP-337: ops-console JSONL audit trail. Named volume rather than a
  # bind mount so the trail survives container restarts during support
  # engagements and doesn't require operators to pre-create a host dir.
  ops-audit:
  matter-data:
  # WARP-573: pre-migration snapshots taken by the orchestrator's guarded
  # boot entrypoint. Wiped on factory reset (see scripts/factory-reset.sh).
  migration-snapshots:
  brain-memory-data:
  # WARP-539: OTA per-update rollback backups + staged configs
  # (<id>/{backup,configs.tar.gz}). GC'd by the daily purge cron (terminal
  # updates, 7-day window). Named so backups survive the orchestrator's own
  # recreation mid-apply.
  ota-updates:
  # WARP-RAG-EVAL: per-run RAGAS JSON + Markdown + the bootstrap
  # baselines.candidate.json. Named volume so results survive container
  # restarts during ops work and don't require an operator-created host
  # dir. Retention: the runner prunes runs/ to the newest
  # RAG_EVAL_KEEP_RUNS (default 500) after each run (WARP-1192) — no
  # operator sweep needed.
  rag-eval-data:
  # WARP-1055 — voice-io's applied mic-calibration record (small JSON).
  # Named so a container recreate never silently reverts the tuned
  # gain/threshold; factory-reset's volume sweep clears it.
  # WARP-1056 — the same volume (mounted at /data) also holds the
  # per-person voiceprints (/data/voiceprints/<user>.json, biometric-
  # adjacent, on-box only); the factory-reset sweep wiping it IS the
  # "reset ⇒ every voiceprint deleted" guarantee.
  voice-calibration:
  # WARP-154 — Wyoming Whisper model cache (~470 MB for small.en).
  # Persists across `docker compose down`/`up`. Manual reset:
  # `docker volume rm <project>_whisper-models`.
  whisper-models:
  # WARP-154 — Piper voice cache (~70 MB per voice).
  piper-voices:
  # ADR-018 item 12: switch provision-state persistence (last_provisioned_at).
  switch-state:
  # single-box profile (`COMPOSE_PROFILES=single-box`) — only used when the bundled
  # ollama + openwrt services are active. Declared unconditionally so
  # `docker volume ls` shows the names whether the profile is on or off;
  # the volumes themselves are only materialized when the services start.
  # factory-reset.sh includes these in its wipe list.
  ollama-data:
  # WARP-1772 — Docker Model Runner's OCI model store (dark `dmr` profile).
  # Separate from ollama-data by construction: different on-disk formats, and
  # sharing a directory risks either runtime rewriting the other's store.
  # Only materialized when the `dmr` profile is active. Classified everywhere
  # ollama-data is: factory-reset.sh wipes it, device-backup.sh excludes it
  # (model blobs are re-pulled, never customer data).
  dmr-models:
  openwrt-config:
  openwrt-overlay:
  # WARP-963 — fleet-agent runtime state: portal ingest token (identity.json,
  # a credential — named volume, never a tracked file) + the bounded offline
  # heartbeat spool. Only materialized when the `telemetry` profile is active.
  fleet-agent-state:
