services:
  # --- Ingress ---
  gateway:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      orchestrator:
        condition: service_started
      web-dashboard:
        condition: service_started
    restart: always

  # --- Apps ---
  # NOTE: No host ports exposed — Nginx routes all traffic internally.
  # This avoids conflicts with local dev servers (npm run dev on 3000/3001).
  web-dashboard:
    build:
      context: ../apps/web-dashboard
      dockerfile: Dockerfile
    expose:
      - "3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
    restart: always

  orchestrator:
    build:
      context: ../apps/orchestrator
      dockerfile: Dockerfile
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started
      broker:
        condition: service_started
    env_file:
      - path: ../.env
        required: false
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-droplet}:${POSTGRES_PASSWORD:-droplet}@db:5432/${POSTGRES_DB:-droplet}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis-dev-password}@cache:6379
      - MQTT_BROKER=mqtt://${MQTT_USER:-droplet}:${MQTT_PASSWORD:-mqtt-dev-password}@broker:1883
      - AI_GATEWAY_URL=http://ai-gateway:8000
      - HOMEASSISTANT_URL=http://homeassistant:8123
      - HOMEASSISTANT_TOKEN=${HOMEASSISTANT_TOKEN:-}
      - FILES_ROOT=/data/files
      - PORT=3000
      - STORAGE_BACKEND=${STORAGE_BACKEND:-nextcloud}
      - NEXTCLOUD_URL=http://nextcloud:80
      - NEXTCLOUD_ADMIN_USER=${NEXTCLOUD_ADMIN_USER:-admin}
      - NEXTCLOUD_ADMIN_PASSWORD=${NEXTCLOUD_ADMIN_PASSWORD:-admin}
      - AUTH_ENABLED=${AUTH_ENABLED:-true}
    volumes:
      - filedata:/data/files
    restart: always

  # --- Nextcloud (headless backend) ---
  nextcloud:
    image: nextcloud:29-apache
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_DB=nextcloud
      - POSTGRES_USER=${POSTGRES_USER:-droplet}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-droplet}
      - NEXTCLOUD_ADMIN_USER=${NEXTCLOUD_ADMIN_USER:-admin}
      - NEXTCLOUD_ADMIN_PASSWORD=${NEXTCLOUD_ADMIN_PASSWORD:-admin}
      - REDIS_HOST=cache
      - REDIS_HOST_PASSWORD=${REDIS_PASSWORD:-redis-dev-password}
      - NEXTCLOUD_TRUSTED_DOMAINS=localhost nextcloud gateway
      - OVERWRITEPROTOCOL=https
    volumes:
      - nextcloud-data:/var/www/html
      - ./nextcloud-skeleton:/skeleton:ro
      - ./nextcloud-init.sh:/docker-entrypoint-hooks.d/post-installation/init-droplet.sh:ro
    restart: always

  # --- Infrastructure ---
  db:
    image: postgres:16-alpine
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-nextcloud-db.sh:/docker-entrypoint-initdb.d/init-nextcloud-db.sh:ro
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-droplet}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-droplet}
      - POSTGRES_DB=${POSTGRES_DB:-droplet}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-droplet}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  cache:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis-dev-password}
    restart: always

  broker:
    image: eclipse-mosquitto:2
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto_passwd_dir:/mosquitto/config/passwd_dir:ro
    restart: always

  # --- AI Services ---
  ai-gateway:
    build:
      context: ../services/ai-gateway
      dockerfile: Dockerfile
    expose:
      - "8000"
    env_file:
      - path: ../.env
        required: false
    environment:
      - JETSON_OLLAMA_URL=${JETSON_OLLAMA_URL:-http://inference-engine.local:11434}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis-dev-password}@cache:6379
      - MQTT_BROKER=mqtt://${MQTT_USER:-droplet}:${MQTT_PASSWORD:-mqtt-dev-password}@broker:1883
      - DEVICE_SECRET=${DEVICE_SECRET:-dev-secret-change-in-production}
      - ORCHESTRATOR_URL=http://orchestrator:3000
    volumes:
      - aikeys:/data/keys
    depends_on:
      - cache
      - broker
      - orchestrator
    restart: always

  # --- Home Assistant ---
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    ports:
      - "8123:8123"
    volumes:
      - ha-config:/config
    environment:
      - TZ=UTC
    restart: always

  # --- Background Services ---
  file-sync:
    build:
      context: ../services/file-sync
      dockerfile: Dockerfile
    volumes:
      - filedata:/data/files
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-droplet}:${POSTGRES_PASSWORD:-droplet}@db:5432/${POSTGRES_DB:-droplet}
      - MQTT_BROKER=mqtt://${MQTT_USER:-droplet}:${MQTT_PASSWORD:-mqtt-dev-password}@broker:1883
      - FILES_ROOT=/data/files
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_started
    profiles: ["legacy"]
    restart: always

  # --- Future Services ---
  routing:
    build:
      context: ../services/routing
      dockerfile: Dockerfile
    network_mode: host
    cap_add:
      - NET_ADMIN
    profiles: ["full"]
    restart: always

  nvr:
    build:
      context: ../services/nvr
      dockerfile: Dockerfile
    volumes:
      - nvrdata:/data/recordings
    profiles: ["full"]
    restart: always

volumes:
  pgdata:
  filedata:
  nvrdata:
  aikeys:
  nextcloud-data:
  ha-config:
