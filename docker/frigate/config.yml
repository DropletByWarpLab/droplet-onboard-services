mqtt:
  enabled: true
  host: broker
  port: 1883
  user: '{FRIGATE_MQTT_USER}'
  password: '{FRIGATE_MQTT_PASSWORD}'

# Detector:
#   type: cpu                 — works on every image variant, 10-20 FPS
#                               on the Orin. Safe default while the JP6
#                               ONNX model cache is being provisioned.
#   type: onnx (JP6)          — NVIDIA TensorRT execution provider. On
#                               first boot the image downloads + compiles
#                               yolov9-s.onnx into /config/model_cache/
#                               (set YOLO_MODELS=yolov9-s in .env). Until
#                               that compile finishes Frigate stays in
#                               safe_mode and falls back to CPU.
#
# TODO(detection-gpu): Once the JP6 model_cache is populated, flip this
# to ``type: onnx`` and add a matching ``model:`` block
# (path: /config/model_cache/yolov9-s.onnx, width/height: 320, etc.).
detectors:
  cpu:
    type: cpu

record:
  enabled: true
  # Frigate 0.17 split the old ``record.retain`` + ``record.events`` block
  # into separate ``alerts`` (user-surfaced events) and ``detections``
  # (continuous lower-confidence track). Both retain independently.
  alerts:
    retain:
      days: 14
      mode: motion
  detections:
    retain:
      days: 14
      mode: motion

snapshots:
  enabled: true
  retain:
    default: 14

detect:
  enabled: true
  width: 1280
  height: 720
  fps: 5

# ``package`` is intentionally absent — the default yolov9 model shipped
# with the JP6 image doesn't know that class and Frigate warns about
# unsupported labels on every camera load. Re-add it once the model ships
# with package support or a custom model is mounted.
objects:
  track:
    - person
    - car
    - dog
    - cat

# Cameras are added dynamically by the camera-discovery service via
# PUT /api/config/set. The config.yml mount is writable so Frigate's
# in-place migrator and auto-adoption round-trip work.
#
# No static `cameras:` block by default — entries plus a stale example IP
# pinned Frigate to a connection-timeout loop that, in turn, kept Frigate
# busy enough to drop later API-added entries.
#
# To pin a manual camera here, mirror the auto-add shape:
#
#   cameras:
#     front_door:
#       ffmpeg:
#         inputs:
#           - path: "rtsp://admin:{FRIGATE_CAMERA_FRONT_DOOR_PASSWORD}@<ip>:554/profile2/media.smp"
#             roles:
#               - detect
#               - record
#
# `{FRIGATE_CAMERA_FRONT_DOOR_PASSWORD}` substitutes verbatim from .env via
# Frigate's str.format (no URL-encoding). Store the raw password — e.g.
# `Droplet123!`, not `Droplet123%21` — because the bundled jetson ffmpeg
# does not URL-decode userinfo and the camera returns 401 + locks the
# account after ~5 retries on percent-escapes.
cameras: {}
