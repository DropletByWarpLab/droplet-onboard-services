mqtt:
  enabled: true
  host: broker
  port: 1883
  user: '{FRIGATE_MQTT_USER}'
  password: '{FRIGATE_MQTT_PASSWORD}'

# Detector:
#   type: cpu                 — works on every image variant, 10-20 FPS
#                               on the GPU host. Safe default while the JP6
#                               ONNX model cache is being provisioned.
#   type: onnx (JP6)          — NVIDIA TensorRT execution provider. On
#                               first boot the image downloads + compiles
#                               yolov9-s.onnx into /config/model_cache/
#                               (set YOLO_MODELS=yolov9-s in .env). Until
#                               that compile finishes Frigate stays in
#                               safe_mode and falls back to CPU.
#
# TODO(detection-gpu): Once the JP6 model_cache is populated, flip this
# to ``type: onnx`` and add a matching ``model:`` block
# (path: /config/model_cache/yolov9-s.onnx, width/height: 320, etc.).
detectors:
  cpu:
    type: cpu

record:
  enabled: true
  # Frigate 0.17 split the old ``record.retain`` + ``record.events`` block
  # into separate ``alerts`` (user-surfaced events) and ``detections``
  # (continuous lower-confidence track). Both retain independently.
  alerts:
    retain:
      days: 14
      mode: motion
  detections:
    retain:
      days: 14
      mode: motion

snapshots:
  enabled: true
  retain:
    default: 14

detect:
  enabled: true
  width: 1280
  height: 720
  fps: 5

# ``package`` is intentionally absent — the default yolov9 model shipped
# with the JP6 image doesn't know that class and Frigate warns about
# unsupported labels on every camera load. Re-add it once the model ships
# with package support or a custom model is mounted.
objects:
  track:
    - person
    - car
    - dog
    - cat

# Cameras are added dynamically by the camera-discovery service via
# PUT /api/config/set. Manual entries below are preserved across restarts
# (the config.yml mount is writable so Frigate's in-place migrator and
# auto-adoption round-trip work).
cameras: {}
  # No cameras configured by default — a fresh provisioning has no per-
  # camera credentials in .env yet, so the previous live `front_door:`
  # block raised a KeyError on FRIGATE_CAMERA_FRONT_DOOR_PASSWORD and
  # restart-looped frigate during factory-reset. Add cameras either via
  # the dashboard (which discovers ONVIF/RTSP cameras + writes their
  # credentials to .env + extends this file) OR by uncommenting the
  # example below and dropping the raw password into .env.
  #
  # Hanwha XNV-C8083R dome (8 MP) on switch port 6 / VLAN 100, profile2 =
  # H.264 3328x1872 @ 30fps (Frigate downsamples to 1280x720 for detection
  # per the top-level detect block).
  #
  # The password comes from FRIGATE_CAMERA_FRONT_DOOR_PASSWORD via Frigate's
  # str.format substitution (frigate/config/env.py): the env value is dropped
  # into the URL VERBATIM, with NO URL-encoding. Store the **raw** password
  # in .env — e.g. `FRIGATE_CAMERA_FRONT_DOOR_PASSWORD=Droplet123!`, not
  # `Droplet123%21`. The bundled ffmpeg does not URL-decode userinfo
  # before authenticating, so percent-escapes go on the wire literally and
  # the camera returns 401, then locks the account after ~5 retries.
  #
  # front_door:
  #   ffmpeg:
  #     inputs:
  #       - path: "rtsp://admin:{FRIGATE_CAMERA_FRONT_DOOR_PASSWORD}@192.168.100.219:554/profile2/media.smp"
  #         roles:
  #           - detect
  #           - record
