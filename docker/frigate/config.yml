mqtt:
  enabled: true
  host: broker
  port: 1883
  user: "{FRIGATE_MQTT_USER}"
  password: "{FRIGATE_MQTT_PASSWORD}"

# Frigate 0.15+ dropped the `tensorrt` detector type in favor of `onnx`
# (ONNX Runtime with TensorRT execution provider). Switching to onnx requires
# a user-supplied model at /config/model_cache/... so we default to cpu here
# to keep the stack valid out of the box. Jetson GPU acceleration should be
# restored in a follow-up that also provisions a model file.
detectors:
  cpu:
    type: cpu

record:
  enabled: true
  alerts:
    retain:
      days: 14
      mode: motion
  detections:
    retain:
      days: 14
      mode: motion

snapshots:
  enabled: true
  retain:
    default: 14

detect:
  enabled: true
  width: 1280
  height: 720
  fps: 5

objects:
  track:
    - person
    - car
    - dog
    - cat
    - package

# Cameras are added dynamically by the camera-discovery service.
# You can also add cameras manually here using the Frigate camera config format:
# cameras:
#   front_door:
#     ffmpeg:
#       inputs:
#         - path: rtsp://user:pass@camera-ip:554/stream
#           roles: ["detect", "record"]
cameras: {}
