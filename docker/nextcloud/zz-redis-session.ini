; WARP-1607 — Nextcloud PHP sessions over the TLS-only Redis listener.
;
; WHY THIS FILE EXISTS
; Nextcloud reaches Redis from two independent surfaces: config.php (the
; distributed cache + file locking) and PHP's own session handler. WARP-234
; migrated only the first one. The second is configured by
; /usr/local/etc/php/conf.d/redis-session.ini, which the nextcloud image
; ENTRYPOINT rewrites on every single boot from REDIS_HOST / REDIS_HOST_PORT /
; REDIS_HOST_USER / REDIS_HOST_PASSWORD — with the scheme hardcoded to
; plaintext and no stream-context knob at all. No combination of environment
; variables can make that generated file speak TLS or pin a CA, which is why
; the migration skipped it and left every session write pointed at the
; listener WARP-234 retired.
;
; HOW THE OVERRIDE WORKS
; PHP scans its conf.d directory with php_alphasort and later files override
; earlier ones (php-src main/php_ini.c), so a `zz-` name deterministically
; beats the entrypoint's redis-session.ini. Bind-mounted read-only, so it also
; survives the entrypoint rewriting its own file underneath us.
; A hook script cannot do this job: the image runs before-starting hooks via
; `su -p www-data`, which cannot write into root-owned conf.d.
;
; ${...} is expanded by PHP's own ini parser, which falls back to getenv()
; (Zend/zend_ini_parser.y, zend_ini_get_var) and does so inside double quotes
; too (Zend/zend_ini_scanner.l, ST_DOUBLE_QUOTES). The value MUST stay quoted:
; in an unquoted ini value `&` is a bitwise operator, not a literal.
;
; SINGLE SOURCE OF TRUTH
; Every value below comes from the compose env contract on the `nextcloud`
; service — the same contract docker/nextcloud/zz-redis-tls.config.php reads.
; Nothing about the endpoint is written twice, so the two Redis surfaces
; cannot drift apart again. scripts/test-security.sh (Test 21) pins that.

session.save_handler = redis

; The save_path shape is what phpredis 6.2.0 actually parses — that is the
; version baked into the digest-pinned nextcloud:29-apache image
; (`pecl install redis-6.2.0`), verified against the image config, not assumed:
;   - the scheme is passed straight through to php_stream_xport_create, so
;     `tls://` selects the TLS transport (redis_session.c, PS_OPEN_FUNC);
;   - auth[user]/auth[pass] reaches redis_extract_auth_info, i.e. a real ACL
;     identity instead of a bare shared password (phpredis >= 5.3);
;   - stream[...] is mapped onto the "ssl" stream context via
;     redis_sock_set_stream_context, which is the only way to pin the
;     WARP-236 internal CA for the session socket.
; verify_peer/verify_peer_name are set explicitly rather than left to PHP's
; defaults so the intent survives a php.ini change.
;
; PASSWORD CONSTRAINT — unlike the config.php surface, which passes the
; password as a plain PHP string, this one carries it inside a URL. phpredis
; splits save_path on whitespace and commas and then URL-decodes each query
; value, so a REDIS_HOST_PASSWORD containing a space, comma, `&`, `=`, `+`,
; `#` or `%` would be silently corrupted here while still working for the
; cache/locking surface. setup.sh's _gen_password emits [A-Za-z0-9] only, so
; every generated password is safe; a HAND-ROTATED one must stay in that set.
; See docs/security/redis-tls-acl.md (Rotation runbook).
session.save_path = "${REDIS_TLS_SCHEME}://${REDIS_HOST}:${REDIS_HOST_PORT}?auth[user]=${REDIS_HOST_USER}&auth[pass]=${REDIS_HOST_PASSWORD}&stream[verify_peer]=1&stream[verify_peer_name]=1&stream[cafile]=${REDIS_TLS_CAFILE}"

; Session locking, matching the values the image entrypoint would have set so
; this file is a complete replacement rather than a partial overlay:
; -1 retries = block rather than serve a torn session; wait 10ms between
; attempts instead of the 2ms default.
redis.session.locking_enabled = 1
redis.session.lock_retries = -1
redis.session.lock_wait_time = 10000
