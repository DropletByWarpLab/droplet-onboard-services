events {
    worker_connections 1024;
}

http {
    upstream orchestrator {
        server orchestrator:3000;
    }

    upstream ai_gateway {
        server ai-gateway:8000;
    }

    upstream web_dashboard {
        server web-dashboard:3001;
    }

    # NOTE: frigate upstream resolved at request time via variable (see /frigate/ block)
    # so Nginx starts even when frigate container is absent (non-"full" profile).

    # Map Upgrade header so Connection is only set to "upgrade" for WebSocket
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ── HTTP: redirect everything to HTTPS ──
    server {
        listen 80;
        return 301 https://$host$request_uri;
    }

    # ── HTTPS ──
    server {
        listen 443 ssl;

        ssl_certificate     /etc/nginx/certs/droplet.crt;
        ssl_certificate_key /etc/nginx/certs/droplet.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # HSTS — tell browsers to always use HTTPS (1 year)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Orchestrator WebSocket bridge — MUST come before the catch-all
        # /api/ block so Nginx routes the upgrade handshake here with the
        # right Upgrade/Connection headers.
        location /api/ws/ {
            proxy_pass http://orchestrator;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Orchestrator API
        location /api/ {
            client_max_body_size 100M;
            proxy_pass http://orchestrator;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE support
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection '';
            chunked_transfer_encoding off;
            add_header X-Accel-Buffering no;
            proxy_read_timeout 86400s;
        }

        # AI Gateway
        location /ai/ {
            proxy_pass http://ai_gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE support for streaming chat
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection '';
            chunked_transfer_encoding off;
            add_header X-Accel-Buffering no;

            # Longer timeout for AI inference
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # Nextcloud (headless backend)
        location /nextcloud/ {
            client_max_body_size 512M;
            proxy_pass http://nextcloud:80/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # Auth subrequest — validates session cookie / Bearer token
        # Uses /api/auth/me which returns 401 without valid auth, 200 with it.
        location = /_auth_check {
            internal;
            proxy_pass http://orchestrator/api/auth/me;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Authorization $http_authorization;
        }

        # Frigate UI — auth-gated for secure remote access
        # Uses a variable so Nginx resolves at request time (won't crash if frigate is absent).
        location /frigate/ {
            auth_request /_auth_check;
            resolver 127.0.0.11 valid=30s;
            set $frigate_upstream http://frigate:8971;
            proxy_pass $frigate_upstream/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }

        # Web Dashboard (default)
        location / {
            proxy_pass http://web_dashboard;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
