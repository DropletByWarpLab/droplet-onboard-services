events {
    worker_connections 1024;
}

http {
    # All upstreams are resolved at request time via Docker's embedded DNS
    # (127.0.0.11) so a service container restart with a fresh internal IP
    # doesn't strand the gateway pointing at a dead address — the symptom
    # otherwise is HTTP 502 with "connect() failed (111: Connection refused)
    # while connecting to upstream" in the gateway log.
    #
    # Named `upstream { server ... }` blocks resolve DNS once at config-load
    # time and cache forever, which is fine for stable VMs but not for our
    # Docker stack where a `docker compose up -d` of one service can shuffle
    # IPs across the bridge network. Variable-driven proxy_pass + a short
    # resolver TTL is the supported way to opt into per-request resolution.
    #
    # `valid=10s` keeps the lookup hot but bounded; `ipv6=off` avoids Docker
    # returning a v6 record we can't route to.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Map Upgrade header so Connection is only set to "upgrade" for WebSocket
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ── HTTP: redirect everything to HTTPS ──
    server {
        listen 80;
        return 301 https://$host$request_uri;
    }

    # ── HTTPS ──
    server {
        listen 443 ssl;

        ssl_certificate     /etc/nginx/certs/droplet.crt;
        ssl_certificate_key /etc/nginx/certs/droplet.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # HSTS — tell browsers to always use HTTPS (1 year)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Orchestrator WebSocket bridge — MUST come before the catch-all
        # /api/ block so Nginx routes the upgrade handshake here with the
        # right Upgrade/Connection headers.
        location /api/ws/ {
            set $upstream_orchestrator "orchestrator:3000";
            proxy_pass http://$upstream_orchestrator;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Orchestrator API
        location /api/ {
            client_max_body_size 100M;
            set $upstream_orchestrator "orchestrator:3000";
            proxy_pass http://$upstream_orchestrator;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE support
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection '';
            chunked_transfer_encoding off;
            add_header X-Accel-Buffering no;
            proxy_read_timeout 86400s;
        }

        # AI Gateway
        location /ai/ {
            set $upstream_ai_gateway "ai-gateway:8000";
            proxy_pass http://$upstream_ai_gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE support for streaming chat
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection '';
            chunked_transfer_encoding off;
            add_header X-Accel-Buffering no;

            # Longer timeout for AI inference
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # Nextcloud (headless backend). Trailing slash on proxy_pass strips the
        # /nextcloud/ prefix from the upstream URL, so Nextcloud sees / as root.
        location /nextcloud/ {
            client_max_body_size 512M;
            set $upstream_nextcloud "nextcloud:80";
            proxy_pass http://$upstream_nextcloud/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # Frigate's bundled UI is intentionally unreachable. Phase 1-7 of
        # the parity rollout (docs/FRIGATE_PARITY.md) made the Droplet
        # dashboard a strict superset of every Frigate UI feature, with
        # camera streams and Frigate's API surface proxied through the
        # orchestrator under /api/cameras/*. There is no /frigate/ route
        # by design — the operator never sees Frigate's auth surface, and
        # camera IPs / Frigate's :5000 / :8971 ports stay LAN-side.
        # Frigate's :8971 is exposed only on the internal Docker network
        # (`expose:` not `ports:` in compose) and reachable only by
        # sibling containers, not from the host.

        # WARP-502 / spec WARP-498 OQ2 amendment: Plane lives on its own
        # dedicated origin (the :8443 server block below), NOT under this
        # subpath. The vanilla plane-frontend image is built with Next.js
        # basePath:"" — its asset URLs (/_next/*), API calls (/api/*) and
        # every client-side route push are root-relative, so a prefix-
        # stripping proxy serves exactly one page load and then collides
        # with the dashboard (/_next) and the orchestrator (/api): the
        # /projects iframe rendered black because Plane's chunks 404'd off
        # the dashboard's Next server. Old /pm/ links redirect to the
        # dedicated origin.
        location /pm/ {
            rewrite ^/pm/(.*)$ https://$host:8443/$1 permanent;
        }

        # Web Dashboard (default)
        location / {
            set $upstream_web_dashboard "web-dashboard:3001";
            proxy_pass http://$upstream_web_dashboard;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ── HTTPS :8443 — Plane PM dedicated origin (spec WARP-498 OQ2 amendment) ──
    #
    # Per ADR-010 we ship vanilla Plane, and the vanilla web app assumes it
    # owns its origin's root (basePath:"" is baked into the build — assets,
    # /api calls, and client-side navigation are all root-relative; there is
    # no runtime override). Rather than rebuild a forked frontend, we give
    # Plane what it assumes: a second TLS origin on the same host + cert.
    # Layout mirrors Plane's official self-host proxy: / → pm-web,
    # /api/ + /auth/ → pm-api.
    #
    # The dashboard /projects page iframes this origin (now cross-origin —
    # port differs). Plane's next.config sends X-Frame-Options: SAMEORIGIN,
    # which would refuse that frame, so we drop the header at the proxy and
    # grant frame-ancestors to the dashboard origin instead ($host with no
    # port = default 443 in a CSP host-source). Header surgery at our
    # gateway, not a Plane source patch — the image stays vanilla and
    # services/pm/PATCHES.md stays empty.
    server {
        listen 8443 ssl;

        ssl_certificate     /etc/nginx/certs/droplet.crt;
        ssl_certificate_key /etc/nginx/certs/droplet.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Plane API (Django apiserver). The browser calls these
        # root-relative — /api/instances/, /api/users/me/, /api/workspaces/.
        location /api/ {
            client_max_body_size 50M;
            set $upstream_pm_api "pm-api:8000";
            proxy_pass http://$upstream_pm_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # Plane auth endpoints (sign-in + the OIDC relying-party flow per
        # spec OQ6 / WARP-505) are served by the apiserver as well.
        location /auth/ {
            set $upstream_pm_api "pm-api:8000";
            proxy_pass http://$upstream_pm_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # Plane file uploads/attachments — MinIO bucket, path-style
        # (/uploads/<key>?X-Amz-...). Mirrors the /${BUCKET_NAME} location
        # in Plane's official self-host proxy (nginx.conf.template @
        # v0.24.1), including its Host passthrough: the apiserver presigns
        # against the internal endpoint (compose AWS_S3_ENDPOINT_URL =
        # http://pm-minio:9000) exactly as upstream's compose does, and
        # the web app reaches the bucket through this same-origin path.
        # Bucket name is pinned to the compose default
        # ${DROPLET_PM_MINIO_BUCKET:-uploads}.
        location /uploads/ {
            client_max_body_size 50M;
            set $upstream_pm_minio "pm-minio:9000";
            proxy_pass http://$upstream_pm_minio;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # ── WARP-870 — appliance branding (proxy-level asset interception) ──
        # The embedded PM surface must read as part of the Droplet appliance,
        # not as third-party "Plane". Same posture as the X-Frame-Options
        # surgery below: surgery at OUR gateway, the Plane image stays vanilla
        # and services/pm/PATCHES.md stays empty. Every request for a vanilla
        # wordmark/favicon asset gets the Droplet brand mark instead — the
        # asset paths are stable public/ files in the pm-web image
        # (plane-logos/*, favicon/*), not content-hashed bundle chunks.
        # Inline `return` bodies keep this a one-file change (no extra volume).

        # Faceted-drop wordmark (geometry from the dashboard's DropletMark,
        # brand indigo #6366f1 / #818cf8 — keep in lockstep with
        # apps/web-dashboard/src/components/DropletMark.tsx + lib/brand.ts).
        # Served for BOTH the light and dark Plane logo variants: the mid
        # indigo reads on either background.
        location ^~ /plane-logos/ {
            default_type image/svg+xml;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header Cache-Control "public, max-age=86400";
            return 200 '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 232 60"><polygon points="26,0 44,28 36,48 16,48 8,28" fill="#6366f1"/><polygon points="26,0 44,28 26,36" fill="#818cf8"/><text x="56" y="41" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="30" font-weight="600" fill="#818cf8">Droplet</text></svg>';
        }

        # Icon-only mark for favicons. Browsers honour the served MIME type,
        # so an SVG body answers the .png/.ico paths Plane's <link> tags ask
        # for. The exact-match webmanifest override sits above the prefix so
        # the manifest stays valid JSON.
        location = /favicon/site.webmanifest {
            default_type application/manifest+json;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header Cache-Control "public, max-age=86400";
            return 200 '{"name":"Droplet","short_name":"Droplet","icons":[]}';
        }
        location ^~ /favicon/ {
            default_type image/svg+xml;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header Cache-Control "public, max-age=86400";
            return 200 '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 60"><polygon points="26,0 44,28 36,48 16,48 8,28" fill="#6366f1"/><polygon points="26,0 44,28 26,36" fill="#818cf8"/></svg>';
        }
        location = /favicon.ico {
            default_type image/svg+xml;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header Cache-Control "public, max-age=86400";
            return 200 '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 60"><polygon points="26,0 44,28 36,48 16,48 8,28" fill="#6366f1"/><polygon points="26,0 44,28 26,36" fill="#818cf8"/></svg>';
        }

        # Plane web app (Next.js standalone) — everything else, including
        # /_next/* assets and client-side routes. Websocket Upgrade headers
        # for Plane's realtime features.
        location / {
            client_max_body_size 50M;
            set $upstream_pm_web "pm-web:3000";
            proxy_pass http://$upstream_pm_web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Plane internal API calls + slow first-load can exceed 60s.
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            # See block comment: allow the dashboard origin to iframe Plane.
            proxy_hide_header X-Frame-Options;
            add_header Content-Security-Policy "frame-ancestors 'self' https://$host" always;
        }
    }
}
