events {
    worker_connections 1024;
}

http {
    # All upstreams are resolved at request time via Docker's embedded DNS
    # (127.0.0.11) so a service container restart with a fresh internal IP
    # doesn't strand the gateway pointing at a dead address — the symptom
    # otherwise is HTTP 502 with "connect() failed (111: Connection refused)
    # while connecting to upstream" in the gateway log.
    #
    # Named `upstream { server ... }` blocks resolve DNS once at config-load
    # time and cache forever, which is fine for stable VMs but not for our
    # Docker stack where a `docker compose up -d` of one service can shuffle
    # IPs across the bridge network. Variable-driven proxy_pass + a short
    # resolver TTL is the supported way to opt into per-request resolution.
    #
    # `valid=10s` keeps the lookup hot but bounded; `ipv6=off` avoids Docker
    # returning a v6 record we can't route to.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Map Upgrade header so Connection is only set to "upgrade" for WebSocket
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ── HTTP: redirect everything to HTTPS ──
    server {
        listen 80;
        return 301 https://$host$request_uri;
    }

    # ── HTTPS ──
    server {
        listen 443 ssl;

        ssl_certificate     /etc/nginx/certs/droplet.crt;
        ssl_certificate_key /etc/nginx/certs/droplet.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # HSTS — tell browsers to always use HTTPS (1 year)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Orchestrator WebSocket bridge — MUST come before the catch-all
        # /api/ block so Nginx routes the upgrade handshake here with the
        # right Upgrade/Connection headers.
        location /api/ws/ {
            set $upstream_orchestrator "orchestrator:3000";
            proxy_pass http://$upstream_orchestrator;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Orchestrator API
        location /api/ {
            client_max_body_size 100M;
            set $upstream_orchestrator "orchestrator:3000";
            proxy_pass http://$upstream_orchestrator;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE support
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection '';
            chunked_transfer_encoding off;
            add_header X-Accel-Buffering no;
            proxy_read_timeout 86400s;
        }

        # AI Gateway
        location /ai/ {
            set $upstream_ai_gateway "ai-gateway:8000";
            proxy_pass http://$upstream_ai_gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE support for streaming chat
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection '';
            chunked_transfer_encoding off;
            add_header X-Accel-Buffering no;

            # Longer timeout for AI inference
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # Nextcloud (headless backend). Trailing slash on proxy_pass strips the
        # /nextcloud/ prefix from the upstream URL, so Nextcloud sees / as root.
        location /nextcloud/ {
            client_max_body_size 512M;
            set $upstream_nextcloud "nextcloud:80";
            proxy_pass http://$upstream_nextcloud/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # Auth subrequest — validates session cookie / Bearer token
        # Uses /api/auth/me which returns 401 without valid auth, 200 with it.
        location = /_auth_check {
            internal;
            set $upstream_orchestrator "orchestrator:3000";
            proxy_pass http://$upstream_orchestrator/api/auth/me;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Authorization $http_authorization;
        }

        # Frigate UI — auth-gated for secure remote access. Variable-based
        # proxy_pass also means Nginx starts cleanly when the frigate
        # container isn't present (non-"full" profile).
        location /frigate/ {
            auth_request /_auth_check;
            set $upstream_frigate "frigate:8971";
            proxy_pass http://$upstream_frigate/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }

        # Web Dashboard (default)
        location / {
            set $upstream_web_dashboard "web-dashboard:3001";
            proxy_pass http://$upstream_web_dashboard;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
