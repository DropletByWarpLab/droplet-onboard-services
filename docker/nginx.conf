events {
    worker_connections 1024;
}

http {
    upstream api_server {
        server api-server:3000;
    }

    upstream ai_gateway {
        server ai-gateway:8000;
    }

    upstream web_dashboard {
        server web-dashboard:3001;
    }

    # Map Upgrade header so Connection is only set to "upgrade" for WebSocket
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;

        # API Server
        location /api/ {
            client_max_body_size 100M;
            proxy_pass http://api_server;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE support
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection '';
            chunked_transfer_encoding off;
            add_header X-Accel-Buffering no;
        }

        # AI Gateway
        location /ai/ {
            proxy_pass http://ai_gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE support for streaming chat
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection '';
            chunked_transfer_encoding off;
            add_header X-Accel-Buffering no;

            # Longer timeout for AI inference
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # Web Dashboard (default)
        location / {
            proxy_pass http://web_dashboard;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
