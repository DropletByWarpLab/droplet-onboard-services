# WARP-1021 — DEFAULT edge-TLS posture (DROPLET_FIPS_MODE unset/0).
# Modern crypto, BYTE-IDENTICAL to the old nginx:alpine gateway's inline config
# (docker/nginx/nginx.conf, pre-WARP-1021). This is what a bare/non-FIPS install
# serves. The entrypoint symlinks cipher-profile.active.conf → this file when
# FIPS is off.
ssl_protocols       TLSv1.2 TLSv1.3;
ssl_ciphers         HIGH:!aNULL:!MD5;
ssl_prefer_server_ciphers off;
