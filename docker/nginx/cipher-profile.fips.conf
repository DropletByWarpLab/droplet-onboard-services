# WARP-1021 — FIPS 140-3 edge-TLS posture (DROPLET_FIPS_MODE=1). RESTRICTS the
# offered suites to FIPS-approved ones only; it does NOT add strength. The
# validated OpenSSL FIPS provider (CMVP #4282) enforces at the OpenSSL layer via
# OPENSSL_CONF=/etc/ssl/openssl-fips.cnf; this narrows nginx's offered suites to
# match so a client can't negotiate a non-approved one. The entrypoint symlinks
# cipher-profile.active.conf → this file when FIPS is on.
# See docs/security/fips-allowed-algorithms.md (edge-TLS row).
ssl_protocols       TLSv1.2 TLSv1.3;
# TLS 1.3: only the FIPS-approved AES-GCM suites. ChaCha20-Poly1305 is NOT FIPS
# and the FIPS provider does not offer it, so restrict the TLS 1.3 suite list.
ssl_conf_command    Ciphersuites TLS_AES_256_GCM_SHA384:TLS_AES_128_GCM_SHA256;
# TLS 1.2: ECDHE key exchange + AES-GCM + SHA-2 only (no CBC, no ChaCha, no
# MD5/SHA-1).
ssl_ciphers         ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
ssl_prefer_server_ciphers on;
