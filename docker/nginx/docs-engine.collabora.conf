# WARP-1686 — /docs/ document-engine leg, Collabora CODE variant
# (DOCS_ENGINE=collabora, the default). Selected at container start by
# /docker-entrypoint.d/03-docs-engine.sh as /etc/nginx/docs-engine.active.conf.
#
# Collabora's coolwsd listens on :9980 and is configured with
# `--o:net.service_root=/docs` (docker/docker-compose.yml), so EVERY engine
# endpoint (/docs/browser/…, /docs/cool/…, /docs/hosting/discovery) already
# carries the public prefix. proxy_pass therefore has NO URI part — nginx
# forwards the ORIGINAL request URI unchanged (no prefix strip), the exact
# opposite of the OnlyOffice variant.
#
# WebSocket upgrade headers: document sessions ride a long-lived WS at
# /docs/cool/…/ws — same rationale as the WARP-882 block this replaces.
location /docs/ {
    client_max_body_size 512M;
    set $upstream_docserver "docserver:9980";
    # $upstream_docserver is the literal set one line up — no request data can
    # reach it (same justification as the annotated first-party legs in
    # nginx.conf; the variable exists only for per-request Docker-DNS re-resolution).
    # nosemgrep: generic.nginx.security.dynamic-proxy-host.dynamic-proxy-host
    proxy_pass http://$upstream_docserver;
    # WebSocket upgrade is REQUIRED on this leg (document sessions ride a
    # long-lived WS at /docs/cool/…/ws). Connection uses the
    # $connection_upgrade map — "upgrade" only when the client actually sent
    # an Upgrade header, "close" otherwise — which is exactly the
    # h2c-smuggling mitigation the rule prescribes for WS-required legs.
    # nosemgrep: generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling
    proxy_http_version 1.1;
    # The engine + Nextcloud build browser-facing URLs from the request Host;
    # Nextcloud enforces its NEXTCLOUD_TRUSTED_DOMAINS allowlist on it
    # (docker-compose.yml) — same posture as every other gateway leg.
    # nosemgrep: generic.nginx.security.request-host-used.request-host-used
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
