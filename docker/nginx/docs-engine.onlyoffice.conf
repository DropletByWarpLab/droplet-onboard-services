# WARP-1686 — /docs/ document-engine leg, OnlyOffice variant
# (DOCS_ENGINE=onlyoffice). Selected at container start by
# /docker-entrypoint.d/03-docs-engine.sh as /etc/nginx/docs-engine.active.conf.
#
# The OnlyOffice Document Server serves at its root on :80, so the /docs/
# prefix has to come off. That is done by the `rewrite` below, NOT by a
# trailing slash on proxy_pass — see WARP-1986.
#
# This comment used to claim "the trailing slash on proxy_pass STRIPS the
# /docs/ prefix", and that is the same false belief WARP-1966 corrected on the
# /nextcloud/ leg. A trailing slash strips the location prefix only when
# proxy_pass names its upstream LITERALLY. With a VARIABLE upstream — which
# this leg uses, for per-request Docker-DNS re-resolution — nginx cannot
# compute the replacement, and its documented fallback is that the URI in the
# directive "is passed to the server as is, replacing the original request
# URI". So `proxy_pass http://$upstream_docserver/` sent EVERY request under
# /docs/ to the engine as literally `/`: the editor's API bundle, the WOPI
# endpoints and the co-authoring WebSocket all landed on the docserver root,
# and the whole engine was dead over the gateway. Not a syntax error, so
# `nginx -t` could never see it.
#
# The sibling collabora variant was already correct (it carries no URI because
# coolwsd's net.service_root keeps the /docs prefix), which is why the default
# engine worked and this sat unnoticed.
#
# `break`, not `last`: keep the request in this location instead of re-entering
# the location tree.
#
# WebSocket upgrade headers because co-authoring rides a long-lived WS channel.
location /docs/ {
    client_max_body_size 512M;
    set $upstream_docserver "docserver:80";
    rewrite ^/docs/(.*)$ /$1 break;
    # $upstream_docserver is the literal set two lines up — no request data can
    # reach it (same justification as the annotated first-party legs in
    # nginx.conf; the variable exists only for per-request Docker-DNS re-resolution).
    # nosemgrep: generic.nginx.security.dynamic-proxy-host.dynamic-proxy-host
    proxy_pass http://$upstream_docserver;
    # WebSocket upgrade is REQUIRED on this leg (co-authoring rides a
    # long-lived WS channel). Connection uses the $connection_upgrade map —
    # "upgrade" only when the client actually sent an Upgrade header, "close"
    # otherwise — which is exactly the h2c-smuggling mitigation the rule
    # prescribes for WS-required legs.
    # nosemgrep: generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling
    proxy_http_version 1.1;
    # The engine + Nextcloud build browser-facing URLs from the request Host;
    # Nextcloud enforces its NEXTCLOUD_TRUSTED_DOMAINS allowlist on it
    # (docker-compose.yml) — same posture as every other gateway leg.
    # nosemgrep: generic.nginx.security.request-host-used.request-host-used
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
