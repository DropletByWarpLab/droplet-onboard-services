# WARP-1686 — /docs/ document-engine leg, OnlyOffice variant
# (DOCS_ENGINE=onlyoffice). Selected at container start by
# /docker-entrypoint.d/03-docs-engine.sh as /etc/nginx/docs-engine.active.conf.
#
# Byte-identical proxy behaviour to the original WARP-882 inline block: the
# OnlyOffice Document Server serves at its root on :80, so the trailing slash
# on proxy_pass STRIPS the /docs/ prefix from the upstream URI. WebSocket
# upgrade headers because co-authoring rides a long-lived WS channel.
location /docs/ {
    client_max_body_size 512M;
    set $upstream_docserver "docserver:80";
    # $upstream_docserver is the literal set one line up — no request data can
    # reach it (same justification as the annotated first-party legs in
    # nginx.conf; the variable exists only for per-request Docker-DNS re-resolution).
    # nosemgrep: generic.nginx.security.dynamic-proxy-host.dynamic-proxy-host
    proxy_pass http://$upstream_docserver/;
    # WebSocket upgrade is REQUIRED on this leg (co-authoring rides a
    # long-lived WS channel). Connection uses the $connection_upgrade map —
    # "upgrade" only when the client actually sent an Upgrade header, "close"
    # otherwise — which is exactly the h2c-smuggling mitigation the rule
    # prescribes for WS-required legs.
    # nosemgrep: generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling
    proxy_http_version 1.1;
    # The engine + Nextcloud build browser-facing URLs from the request Host;
    # Nextcloud enforces its NEXTCLOUD_TRUSTED_DOMAINS allowlist on it
    # (docker-compose.yml) — same posture as every other gateway leg.
    # nosemgrep: generic.nginx.security.request-host-used.request-host-used
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
