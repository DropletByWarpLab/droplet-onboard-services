# WARP-1061 — internal upstream scheme: DEFAULT (DROPLET_INTERNAL_TLS unset/0).
#
# Selected at container start by /docker-entrypoint.d/01-internal-scheme.sh
# (symlinks internal-scheme.active.conf → this file or the .mtls variant),
# exactly like the WARP-1021 cipher-profile selector. nginx.conf `include`s
# the active file inside http{} and uses $internal_scheme on the FIRST-PARTY
# proxy_pass legs only (orchestrator /api/, /api/ws/ and ai-gateway /ai/).
#
# This variant keeps those legs plain `http://` — byte-identical proxy
# behaviour to the pre-WARP-1061 gateway. The user-plane legs (web-dashboard,
# nextcloud, docserver) never consult $internal_scheme in either variant.
#
# The map source is the literal string "" (NOT a request variable): stock
# nginx has no way to declare an http{}-level variable except `map`, and a
# constant source with only a `default` arm makes $internal_scheme a true
# constant — no request data (Host header or otherwise) can influence it.
map "" $internal_scheme {
    default "http";
}
