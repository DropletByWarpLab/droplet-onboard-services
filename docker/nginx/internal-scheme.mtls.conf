# WARP-1061 — internal upstream scheme: mTLS (DROPLET_INTERNAL_TLS=1).
#
# Selected at container start by /docker-entrypoint.d/01-internal-scheme.sh.
# The first-party legs (orchestrator :3000, ai-gateway :8000) proxy over
# https:// and nginx presents the gateway's OWN internal-CA client cert —
# the upstream listeners run `requestCert` / ssl.CERT_REQUIRED and refuse
# certless peers. Trust is pinned to the internal CA, never the system store.
#
# Paths are the compose mount of data/secrets/service-tls/gateway (CN =
# "gateway", issued by scripts/lib/internal-ca.sh). The proxy_ssl_* block
# lives at http{} level: it only takes effect for https:// upstreams, and the
# user-plane legs (web-dashboard, nextcloud, docserver) stay http:// in this
# variant too, so the directives are inert for them.
#
# The map source is the literal string "" (NOT a request variable): stock
# nginx has no way to declare an http{}-level variable except `map`, and a
# constant source with only a `default` arm makes $internal_scheme a true
# constant — no request data (Host header or otherwise) can influence it.
map "" $internal_scheme {
    default "https";
}

proxy_ssl_certificate         /etc/nginx/service-tls/cert.pem;
proxy_ssl_certificate_key     /etc/nginx/service-tls/key.pem;
proxy_ssl_trusted_certificate /etc/nginx/service-tls/ca.pem;
proxy_ssl_verify              on;
# SNI + verification name default to the proxy_pass host (orchestrator /
# ai-gateway), which the internal-CA SANs carry (DNS:<service>).
proxy_ssl_server_name         on;
proxy_ssl_protocols           TLSv1.2 TLSv1.3;
