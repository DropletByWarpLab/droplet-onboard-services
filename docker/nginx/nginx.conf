events {
    worker_connections 1024;
}

http {
    # All upstreams are resolved at request time via Docker's embedded DNS
    # (127.0.0.11) so a service container restart with a fresh internal IP
    # doesn't strand the gateway pointing at a dead address — the symptom
    # otherwise is HTTP 502 with "connect() failed (111: Connection refused)
    # while connecting to upstream" in the gateway log.
    #
    # Named `upstream { server ... }` blocks resolve DNS once at config-load
    # time and cache forever, which is fine for stable VMs but not for our
    # Docker stack where a `docker compose up -d` of one service can shuffle
    # IPs across the bridge network. Variable-driven proxy_pass + a short
    # resolver TTL is the supported way to opt into per-request resolution.
    #
    # `valid=10s` keeps the lookup hot but bounded; `ipv6=off` avoids Docker
    # returning a v6 record we can't route to.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Map Upgrade header so Connection is only set to "upgrade" for WebSocket
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ── HTTP: redirect everything to HTTPS ──
    server {
        listen 80;
        return 301 https://$host$request_uri;
    }

    # ── HTTPS ──
    server {
        listen 443 ssl;

        ssl_certificate     /etc/nginx/certs/droplet.crt;
        ssl_certificate_key /etc/nginx/certs/droplet.key;
        # WARP-1021: edge-TLS cipher profile, selected at container start by
        # /docker-entrypoint.d/00-fips-profile.sh (symlinks cipher-profile.active
        # → .default or .fips) from the single DROPLET_FIPS_MODE knob. Default
        # (unset/0) → cipher-profile.default.conf (modern ciphers, verbatim from
        # the old nginx:alpine gateway: TLS 1.2/1.3, HIGH:!aNULL:!MD5). `1` →
        # cipher-profile.fips.conf (FIPS-approved suites only). Everything else
        # in this file (resolver, upstreams, locations, HSTS) is unchanged.
        include /etc/nginx/cipher-profile.active.conf;

        # HSTS — tell browsers to always use HTTPS (1 year)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Orchestrator WebSocket bridge — MUST come before the catch-all
        # /api/ block so Nginx routes the upgrade handshake here with the
        # right Upgrade/Connection headers.
        location /api/ws/ {
            set $upstream_orchestrator "orchestrator:3000";
            proxy_pass http://$upstream_orchestrator;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Orchestrator API
        location /api/ {
            client_max_body_size 100M;
            set $upstream_orchestrator "orchestrator:3000";
            proxy_pass http://$upstream_orchestrator;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE support
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection '';
            chunked_transfer_encoding off;
            add_header X-Accel-Buffering no;
            proxy_read_timeout 86400s;
        }

        # AI Gateway
        location /ai/ {
            set $upstream_ai_gateway "ai-gateway:8000";
            proxy_pass http://$upstream_ai_gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE support for streaming chat
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection '';
            chunked_transfer_encoding off;
            add_header X-Accel-Buffering no;

            # Longer timeout for AI inference
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # Nextcloud (headless backend). Trailing slash on proxy_pass strips the
        # /nextcloud/ prefix from the upstream URL, so Nextcloud sees / as root.
        location /nextcloud/ {
            client_max_body_size 512M;
            set $upstream_nextcloud "nextcloud:80";
            proxy_pass http://$upstream_nextcloud/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # WARP-882 / WS-4 — OnlyOffice Document Server (in-browser editing +
        # co-authoring). Modeled on /nextcloud/ but ADDS the WebSocket upgrade
        # headers (Upgrade + Connection $connection_upgrade): co-authoring rides
        # a long-lived WS channel the /nextcloud/ block omits. Reuses the
        # `$connection_upgrade` map + the resolver declared at the top. The
        # engine has NO `ports:` in compose, so this gateway leg is the only way
        # in. The `docserver` service is `docs`-profiled; when the profile is off
        # this upstream won't resolve — the dashboard gates the "Edit" entry on
        # /api/files/docs/status so users never hit a dead proxy.
        location /docs/ {
            client_max_body_size 512M;
            set $upstream_docserver "docserver:80";
            proxy_pass http://$upstream_docserver/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Frigate's bundled UI is intentionally unreachable. Phase 1-7 of
        # the parity rollout (docs/FRIGATE_PARITY.md) made the Droplet
        # dashboard a strict superset of every Frigate UI feature, with
        # camera streams and Frigate's API surface proxied through the
        # orchestrator under /api/cameras/*. There is no /frigate/ route
        # by design — the operator never sees Frigate's auth surface, and
        # camera IPs / Frigate's :5000 / :8971 ports stay LAN-side.
        # Frigate's :8971 is exposed only on the internal Docker network
        # (`expose:` not `ports:` in compose) and reachable only by
        # sibling containers, not from the host.

        # Web Dashboard (default)
        location / {
            set $upstream_web_dashboard "web-dashboard:3001";
            proxy_pass http://$upstream_web_dashboard;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
