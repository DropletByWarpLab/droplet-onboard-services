events {
    worker_connections 1024;
}

http {
    # All upstreams are resolved at request time via Docker's embedded DNS
    # (127.0.0.11) so a service container restart with a fresh internal IP
    # doesn't strand the gateway pointing at a dead address — the symptom
    # otherwise is HTTP 502 with "connect() failed (111: Connection refused)
    # while connecting to upstream" in the gateway log.
    #
    # Named `upstream { server ... }` blocks resolve DNS once at config-load
    # time and cache forever, which is fine for stable VMs but not for our
    # Docker stack where a `docker compose up -d` of one service can shuffle
    # IPs across the bridge network. Variable-driven proxy_pass + a short
    # resolver TTL is the supported way to opt into per-request resolution.
    #
    # `valid=10s` keeps the lookup hot but bounded; `ipv6=off` avoids Docker
    # returning a v6 record we can't route to.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # WARP-1061: first-party upstream scheme + (mTLS variant only) the
    # proxy_ssl_* client-cert block. The active file is a symlink selected at
    # container start by /docker-entrypoint.d/01-internal-scheme.sh from the
    # DROPLET_INTERNAL_TLS knob — internal-scheme.default.conf renders
    # $internal_scheme=http (byte-identical proxy behaviour to before);
    # internal-scheme.mtls.conf renders https + nginx's own internal-CA
    # client cert against the orchestrator/ai-gateway mTLS listeners. Only
    # the first-party legs below consult $internal_scheme; the user-plane
    # legs (web-dashboard, nextcloud, docserver) are pinned plain http.
    include /etc/nginx/internal-scheme.active.conf;

    # Map Upgrade header so Connection is only set to "upgrade" for WebSocket
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ── HTTP (:80) + the canonical-host map live in the RENDERED include ──
    # Warning-free droplet.local: /docker-entrypoint.d/02-canonical-host.sh
    # (container start) and scripts/lib/tls-reload.sh (every cert swap) run
    # render-canonical-host.sh, which writes this file. Redirect ON → friendly
    # names 307 to the trusted FQDN; OFF → friendly names get the plain-HTTP
    # status page (no forced HTTPS upgrade), everything else 301s to HTTPS.
    include /etc/nginx/canonical-host.active.conf;

    # ── HTTPS ──
    server {
        listen 443 ssl;

        ssl_certificate     /etc/nginx/certs/droplet.crt;
        ssl_certificate_key /etc/nginx/certs/droplet.key;
        # WARP-1021: edge-TLS cipher profile, selected at container start by
        # /docker-entrypoint.d/00-fips-profile.sh (symlinks cipher-profile.active
        # → .default or .fips) from the single DROPLET_FIPS_MODE knob. Default
        # (unset/0) → cipher-profile.default.conf (modern ciphers, verbatim from
        # the old nginx:alpine gateway: TLS 1.2/1.3, HIGH:!aNULL:!MD5). `1` →
        # cipher-profile.fips.conf (FIPS-approved suites only). Everything else
        # in this file (resolver, upstreams, locations, HSTS) is unchanged.
        include /etc/nginx/cipher-profile.active.conf;

        # HSTS — tell browsers to always use HTTPS (1 year)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Canonical-host redirect (warning-free droplet.local): a friendly
        # .local/.lan Host with the redirect ON bounces to the trusted FQDN.
        # This leg only fires AFTER a client clicked through the (unavoidable)
        # interstitial on an old explicit-https bookmark — it heals the
        # bookmark. 307 = method-preserving, non-cacheable. NOTE: browsers
        # ignore the HSTS header above on untrusted connections, so it cannot
        # wedge .local clients.
        if ($canonical_target != "") {
            return 307 $canonical_target$request_uri;
        }

        # Orchestrator WebSocket bridge — MUST come before the catch-all
        # /api/ block so Nginx routes the upgrade handshake here with the
        # right Upgrade/Connection headers.
        location /api/ws/ {
            set $upstream_orchestrator "orchestrator:3000";
            # Both variables are constants: $internal_scheme is a default-only map (literal "" source, selected at container start) and $upstream_orchestrator is the literal set one line up — no request data can reach either.
            # nosemgrep: generic.nginx.security.dynamic-proxy-host.dynamic-proxy-host, generic.nginx.security.dynamic-proxy-scheme.dynamic-proxy-scheme
            proxy_pass $internal_scheme://$upstream_orchestrator;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Orchestrator API
        location /api/ {
            client_max_body_size 100M;
            set $upstream_orchestrator "orchestrator:3000";
            # Both variables are constants: $internal_scheme is a default-only map (literal "" source, selected at container start) and $upstream_orchestrator is the literal set one line up — no request data can reach either.
            # nosemgrep: generic.nginx.security.dynamic-proxy-host.dynamic-proxy-host, generic.nginx.security.dynamic-proxy-scheme.dynamic-proxy-scheme
            proxy_pass $internal_scheme://$upstream_orchestrator;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE support
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection '';
            chunked_transfer_encoding off;
            add_header X-Accel-Buffering no;
            proxy_read_timeout 86400s;
        }

        # AI Gateway
        location /ai/ {
            set $upstream_ai_gateway "ai-gateway:8000";
            # Both variables are constants: $internal_scheme is a default-only map (literal "" source, selected at container start) and $upstream_ai_gateway is the literal set one line up — no request data can reach either.
            # nosemgrep: generic.nginx.security.dynamic-proxy-host.dynamic-proxy-host, generic.nginx.security.dynamic-proxy-scheme.dynamic-proxy-scheme
            proxy_pass $internal_scheme://$upstream_ai_gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE support for streaming chat
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection '';
            chunked_transfer_encoding off;
            add_header X-Accel-Buffering no;

            # Longer timeout for AI inference
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # Nextcloud (headless backend). Trailing slash on proxy_pass strips the
        # /nextcloud/ prefix from the upstream URL, so Nextcloud sees / as root.
        location /nextcloud/ {
            client_max_body_size 512M;
            set $upstream_nextcloud "nextcloud:80";
            proxy_pass http://$upstream_nextcloud/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # ── WARP-1688 — Nextcloud's ROOT-ABSOLUTE asset namespaces ──
        #
        # The dashboard embeds the document editor in an iframe served from the
        # DASHBOARD's origin. The richdocuments editor page inside that iframe
        # references everything it needs by ROOT-ABSOLUTE path — measured from
        # the page the box actually renders:
        #
        #   /apps/…    richdocuments + theming + firstrunwizard assets
        #   /core/…    core css / js / img
        #   /dist/…    the bundled core chunks (e.g. /dist/core-common.js)
        #   /index.php/apps/richdocuments/…   the editor's dynamic endpoints
        #   /index.php/apps/theming/…         theming (css variables, favicon)
        #
        # None of those carried the /nextcloud/ prefix, so before this block
        # they fell through to the dashboard catch-all and 404'd — the iframe
        # rendered an unstyled, script-less page.
        #
        # SCOPE IS DELIBERATELY TIGHT. The obvious fix — routing the whole
        # `/index.php/` leg — is REJECTED: Nextcloud's dynamic surface is live
        # behind it (`/index.php/login` answers 200), so a blanket leg would
        # publish Nextcloud's own login / settings / admin UI at the dashboard's
        # origin, beside a dashboard the user is already authenticated to. Only
        # the two dynamic prefixes the editor actually needs are exposed; every
        # other `/index.php/…` path stays unreachable here and remains available
        # only under the /nextcloud/ leg. See docs/THREAT_MODEL.md §3a.
        #
        # NOTE THE proxy_pass SHAPE: no trailing slash, so the ORIGINAL URI is
        # forwarded UNCHANGED. Nextcloud serves these at its OWN root — the
        # opposite of the `location /nextcloud/` leg above, whose trailing slash
        # deliberately strips its prefix. Copying that leg's form here would
        # rewrite /apps/x → /x and 404 everything.
        #
        # `^~` gives these prefix-priority: a matching request never falls
        # through to a regex location or to the dashboard catch-all.

        location ^~ /apps/ {
            set $upstream_nextcloud "nextcloud:80";
            # $upstream_nextcloud is the literal set one line up — no request data
            # can reach it. The variable indirection exists ONLY to defer the DNS
            # lookup to request time (the resolver rationale at the top of this
            # file), so a Nextcloud restart on a fresh bridge IP doesn't strand the
            # gateway. Same justification as the annotated /api/ legs above.
            # nosemgrep: generic.nginx.security.dynamic-proxy-host.dynamic-proxy-host
            proxy_pass http://$upstream_nextcloud;
            proxy_http_version 1.1;
            # The forwarded Host header is validated by Nextcloud against its OWN
            # trusted_domains allowlist — it answers HTTP 400 for anything absent
            # from that list, which IS the allowlist remediation this rule asks
            # for. (Prose here deliberately avoids spelling the nginx variable
            # name: this rule matches GENERIC text, so writing it would trip the
            # rule on the comment line itself — a line the suppression below
            # cannot cover, since the finding would land above it.)
            # Worth stating plainly: the control this suppression leans on is the
            # one WARP-1688 repairs. Before this change a renamed box's stored
            # allowlist was stale (docker/nextcloud-init.sh now reconciles it on
            # every boot), so the check was real but out of date, never absent.
            # nosemgrep: generic.nginx.security.request-host-used.request-host-used
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ^~ /core/ {
            set $upstream_nextcloud "nextcloud:80";
            # $upstream_nextcloud is the literal set one line up — no request data
            # can reach it. The variable indirection exists ONLY to defer the DNS
            # lookup to request time (the resolver rationale at the top of this
            # file), so a Nextcloud restart on a fresh bridge IP doesn't strand the
            # gateway. Same justification as the annotated /api/ legs above.
            # nosemgrep: generic.nginx.security.dynamic-proxy-host.dynamic-proxy-host
            proxy_pass http://$upstream_nextcloud;
            proxy_http_version 1.1;
            # The forwarded Host header is validated by Nextcloud against its OWN
            # trusted_domains allowlist — it answers HTTP 400 for anything absent
            # from that list, which IS the allowlist remediation this rule asks
            # for. (Prose here deliberately avoids spelling the nginx variable
            # name: this rule matches GENERIC text, so writing it would trip the
            # rule on the comment line itself — a line the suppression below
            # cannot cover, since the finding would land above it.)
            # Worth stating plainly: the control this suppression leans on is the
            # one WARP-1688 repairs. Before this change a renamed box's stored
            # allowlist was stale (docker/nextcloud-init.sh now reconciles it on
            # every boot), so the check was real but out of date, never absent.
            # nosemgrep: generic.nginx.security.request-host-used.request-host-used
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ^~ /dist/ {
            set $upstream_nextcloud "nextcloud:80";
            # $upstream_nextcloud is the literal set one line up — no request data
            # can reach it. The variable indirection exists ONLY to defer the DNS
            # lookup to request time (the resolver rationale at the top of this
            # file), so a Nextcloud restart on a fresh bridge IP doesn't strand the
            # gateway. Same justification as the annotated /api/ legs above.
            # nosemgrep: generic.nginx.security.dynamic-proxy-host.dynamic-proxy-host
            proxy_pass http://$upstream_nextcloud;
            proxy_http_version 1.1;
            # The forwarded Host header is validated by Nextcloud against its OWN
            # trusted_domains allowlist — it answers HTTP 400 for anything absent
            # from that list, which IS the allowlist remediation this rule asks
            # for. (Prose here deliberately avoids spelling the nginx variable
            # name: this rule matches GENERIC text, so writing it would trip the
            # rule on the comment line itself — a line the suppression below
            # cannot cover, since the finding would land above it.)
            # Worth stating plainly: the control this suppression leans on is the
            # one WARP-1688 repairs. Before this change a renamed box's stored
            # allowlist was stale (docker/nextcloud-init.sh now reconciles it on
            # every boot), so the check was real but out of date, never absent.
            # nosemgrep: generic.nginx.security.request-host-used.request-host-used
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ^~ /index.php/apps/richdocuments/ {
            set $upstream_nextcloud "nextcloud:80";
            # $upstream_nextcloud is the literal set one line up — no request data
            # can reach it. The variable indirection exists ONLY to defer the DNS
            # lookup to request time (the resolver rationale at the top of this
            # file), so a Nextcloud restart on a fresh bridge IP doesn't strand the
            # gateway. Same justification as the annotated /api/ legs above.
            # nosemgrep: generic.nginx.security.dynamic-proxy-host.dynamic-proxy-host
            proxy_pass http://$upstream_nextcloud;
            proxy_http_version 1.1;
            # The forwarded Host header is validated by Nextcloud against its OWN
            # trusted_domains allowlist — it answers HTTP 400 for anything absent
            # from that list, which IS the allowlist remediation this rule asks
            # for. (Prose here deliberately avoids spelling the nginx variable
            # name: this rule matches GENERIC text, so writing it would trip the
            # rule on the comment line itself — a line the suppression below
            # cannot cover, since the finding would land above it.)
            # Worth stating plainly: the control this suppression leans on is the
            # one WARP-1688 repairs. Before this change a renamed box's stored
            # allowlist was stale (docker/nextcloud-init.sh now reconciles it on
            # every boot), so the check was real but out of date, never absent.
            # nosemgrep: generic.nginx.security.request-host-used.request-host-used
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location ^~ /index.php/apps/theming/ {
            set $upstream_nextcloud "nextcloud:80";
            # $upstream_nextcloud is the literal set one line up — no request data
            # can reach it. The variable indirection exists ONLY to defer the DNS
            # lookup to request time (the resolver rationale at the top of this
            # file), so a Nextcloud restart on a fresh bridge IP doesn't strand the
            # gateway. Same justification as the annotated /api/ legs above.
            # nosemgrep: generic.nginx.security.dynamic-proxy-host.dynamic-proxy-host
            proxy_pass http://$upstream_nextcloud;
            proxy_http_version 1.1;
            # The forwarded Host header is validated by Nextcloud against its OWN
            # trusted_domains allowlist — it answers HTTP 400 for anything absent
            # from that list, which IS the allowlist remediation this rule asks
            # for. (Prose here deliberately avoids spelling the nginx variable
            # name: this rule matches GENERIC text, so writing it would trip the
            # rule on the comment line itself — a line the suppression below
            # cannot cover, since the finding would land above it.)
            # Worth stating plainly: the control this suppression leans on is the
            # one WARP-1688 repairs. Before this change a renamed box's stored
            # allowlist was stale (docker/nextcloud-init.sh now reconciles it on
            # every boot), so the check was real but out of date, never absent.
            # nosemgrep: generic.nginx.security.request-host-used.request-host-used
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WARP-882 / WARP-1686 — document engine (/docs/), ENGINE-SELECTED.
        # The active variant is a symlink chosen at container start by
        # /docker-entrypoint.d/03-docs-engine.sh from the DOCS_ENGINE knob
        # (same pattern as the cipher-profile + internal-scheme selectors):
        #   * docs-engine.collabora.conf (default) — Collabora CODE listens on
        #     docserver:9980 under net.service_root=/docs, so the variant
        #     forwards the ORIGINAL /docs/-prefixed URI (no strip).
        #   * docs-engine.onlyoffice.conf — byte-identical to the WARP-882
        #     inline block this include replaced: strips /docs/ → docserver:80.
        # Both variants carry the WebSocket upgrade headers (Upgrade +
        # Connection $connection_upgrade): document sessions ride a long-lived
        # WS channel the /nextcloud/ block omits. The `docserver` service is
        # `docs`-profiled; when the profile is off the upstream won't resolve —
        # the dashboard gates the "Edit" entry on /api/files/docs/status so
        # users never hit a dead proxy.
        include /etc/nginx/docs-engine.active.conf;

        # Frigate's bundled UI is intentionally unreachable. Phase 1-7 of
        # the parity rollout (docs/FRIGATE_PARITY.md) made the Droplet
        # dashboard a strict superset of every Frigate UI feature, with
        # camera streams and Frigate's API surface proxied through the
        # orchestrator under /api/cameras/*. There is no /frigate/ route
        # by design — the operator never sees Frigate's auth surface, and
        # camera IPs / Frigate's :5000 / :8971 ports stay LAN-side.
        # Frigate's :8971 is exposed only on the internal Docker network
        # (`expose:` not `ports:` in compose) and reachable only by
        # sibling containers, not from the host.

        # Web Dashboard (default)
        location / {
            set $upstream_web_dashboard "web-dashboard:3001";
            proxy_pass http://$upstream_web_dashboard;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
