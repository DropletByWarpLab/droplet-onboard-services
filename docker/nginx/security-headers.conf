# WARP-3193 SEC-DATA-8 — response headers for the FIRST-PARTY legs
# (dashboard, /api/, /ai/, and anything the server block answers itself).
#
# nginx inherits `add_header` from the enclosing level ONLY when a location
# declares none of its own. /api/ and /ai/ add `X-Accel-Buffering`, so before
# this file they silently dropped the server-level HSTS. Include this file in
# EVERY location that has its own add_header, alongside it.
#
# X-Frame-Options is SAMEORIGIN, not DENY: the dashboard frames its own
# origin (the document editor, PDF previews), and nothing cross-origin may
# frame it. The CSP `frame-ancestors 'self'` twin lives with the dashboard's
# CSP in nginx.conf (location /).
#
# The proxied third-party apps (Nextcloud legs, /docs/) use
# security-headers.upstream.conf instead: they send their own framing, CSP
# and referrer policies, and a second copy from here would fight them.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
