# WARP-3193 SEC-DATA-8 — response headers for the legs that proxy a
# THIRD-PARTY web app (Nextcloud under /nextcloud/ and its root-absolute asset
# namespaces, the document engine under /docs/).
#
# HSTS only. Nextcloud and the document engine send their own
# X-Frame-Options / CSP (with the nonces and frame-ancestors their editor
# embedding needs), nosniff and Referrer-Policy. A second CSP from the
# gateway would be enforced ALONGSIDE theirs (the intersection), which breaks
# their nonce-based scripts; a second Referrer-Policy would override theirs.
#
# Declaring an add_header here also stops these legs inheriting the
# first-party set from the server block — which is the point.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
