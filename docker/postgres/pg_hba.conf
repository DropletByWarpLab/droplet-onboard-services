# WARP-233 — TLS 1.3 + SCRAM only. Order matters: first match wins.
#
# Local (Unix-socket) lines keep the container-internal healthcheck
# (`psql -U droplet -d droplet`, docker-compose.yml db.healthcheck) and the
# docker-entrypoint-initdb.d init scripts working. The socket never leaves
# the container; reaching it requires docker exec (root-equivalent already).
local   all   all                 trust

# Every TCP client MUST be TLS + SCRAM. There are deliberately NO plain
# `host` lines above the reject — a non-TLS TCP connection matches only the
# reject line. `hostssl` + scram-sha-256 satisfies the WARP-233 acceptance
# check "psql without TLS is rejected".
hostssl all   all   0.0.0.0/0     scram-sha-256
hostssl all   all   ::0/0         scram-sha-256
host    all   all   all           reject
