# WARP-233 ⇄ WARP-318 — FIPS-mode variant (P1011 decision A, scoped).
# Selected by `db`'s `-c hba_file=/etc/postgresql/${PG_HBA:-pg_hba.conf}`
# ONLY when setup.sh --fips wrote PG_HBA=pg_hba.fips.conf; the default
# posture is the TLS-only sibling pg_hba.conf. Order matters: first match wins.
#
# WHY plaintext lines exist here: under the FIPS openssl config, Prisma/libpq
# clients (orchestrator, mcp-server, file-indexer, email-indexer) cannot open
# ANY TLS connection to Postgres — P1011 "library has no ciphers". The
# WARP-318 plan's decision (A): run the intra-compose orchestrator↔db hop
# plaintext on the private container bridge. The FIPS boundary auditors care
# about (edge TLS, data-at-rest, signatures) is unaffected, and the WARP-233
# app-layer PHI/PII column encryption still applies inside those connections.
#
# Local (Unix-socket) lines keep the container-internal healthcheck and the
# docker-entrypoint-initdb.d init scripts working (docker exec is
# root-equivalent already).
local   all   all                     trust

# TLS clients still land here first — anything that CAN handshake keeps TLS.
hostssl all   all   0.0.0.0/0         scram-sha-256
hostssl all   all   ::0/0             scram-sha-256

# FIPS P1011 exception: plaintext TCP is tolerated ONLY from the private
# container-bridge ranges (+ container loopback for exec-level psql), and it
# is still SCRAM-authenticated — never trust. The compose default bridge and
# user-defined networks allocate from these RFC1918 blocks; nothing here is
# ever reachable from outside the box (db has no `ports:` mapping).
host    all   all   127.0.0.1/32      scram-sha-256
host    all   all   10.0.0.0/8        scram-sha-256
host    all   all   172.16.0.0/12     scram-sha-256
host    all   all   192.168.0.0/16    scram-sha-256

# Terminal reject: anything else (notably any non-RFC1918 source) is refused.
host    all   all   all               reject
