      per transaction — so it is user-content-on-request exactly as stripe-api
      is, and only ever on a backfill the owner's connected account triggered.
      Nothing box-local is ever sent; the request carries the merchant's own
      restricted key and nothing else, and the URL is built from a whole-string
      literal in the connector rather than from the file object's own `url`
      field, so a Stripe-supplied URL can never redirect this download at a
      host the registry has not screened. GET only — there is no write surface
      on this host at any tier. NOT allocation-metered: Stripe excludes the
      Reporting API (and its files) from the account's monthly read allocation,
      which is the entire reason bulk history routes this way instead of
      paginating /v1/balance_transactions. Gated twice before a byte moves: the
      report type's subject collection must be in STRIPE_READABLE_COLLECTIONS
