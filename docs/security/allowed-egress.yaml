      self-provisions its publicly-trusted cert with zero hand-patching;
      still operator-overridable via HQ_ISSUANCE_URL. Was kind: dynamic
      before the default host became a repo literal. The default is the LIVE
      HQ Worker (droplet-fleet-hq.rjouffret.workers.dev) — the vanity name
      fleet-hq.droplet-us.com was allowlisted + baked before it was ever
      bound in DNS (NXDOMAIN), dead-ending issuance on every fresh flash; it
      stays allowlisted here so the production-cutover flip
      (droplet-fleet-hq docs/HQ-CUTOVER-RUNBOOK.md) is a default swap, not an
      egress change.
