    phase: runtime
    data_class: user-content-on-request
    purpose: >-
      Stripe Reporting API RESULT FILES (ADR-041) — downloads the CSV a
      finished report run produced, which is how the connector loads bulk
      history. A SEPARATE entry from stripe-api on purpose: Stripe serves
      report files from a different host, and WARP-2216 pins the stripe-api
