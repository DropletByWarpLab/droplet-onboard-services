    added: 2026-08-20
    review_by: 2027-08-20
    code_refs: [services/erp-connector/src/quickbooks/online-connector.ts]
    no_code_literal: >-
      Registered ahead of its caller (see purpose): the orchestrator OAuth
      wiring that dials this endpoint is not written yet, and the connector
      names the host only to record that it deliberately excludes it
      (online-connector.ts:140). Drop this line when the caller lands with
      the host as a literal. (WARP-2452)

  - id: hubspot-api
    kind: egress
    service: erp-connector
    destination:
      hosts: [api.hubapi.com]
      ports: [443]
      protocol: https
    phase: runtime
    data_class: user-content-on-request
    purpose: >-
      HubSpot CRM connector (ADR-041) — reads the customer-relationship records
      of a HubSpot portal the owner explicitly connected: contacts, companies,
      deals, tickets and the engagement objects (calls, emails, meetings, notes,
      tasks), plus owners, pipelines and properties. Carries that customer
      content in the response. Nothing box-local is ever sent and nothing is
      sent opportunistically; the connector only ever dials out, because the box
      accepts no inbound connections and HubSpot webhooks are therefore
      structurally unavailable to it. ONE entry covers this connector
      completely: api.hubapi.com serves the CRM object routes, the Search API
      used for delta polling, and the Exports API used for bulk backfill, and
      there is no separate token endpoint because there is no OAuth dance —
      HubSpot supports no PKCE, so the customer's own super admin creates a
      PRIVATE APP in their portal and its access token (pat-…) is presented
      directly as a bearer credential. If a token endpoint is ever added it gets
      its own entry with data_class: none, as m365-entra-login does. A completed
      export is served from a signed URL on a DIFFERENT host; the connector
      returns that reference rather than dialing it, because that host is not
      registered here and downloading it is a separate decision with its own
      security review. READ-MOSTLY: the only writes are notes and tasks behind
      an explicit confirmation, and no deal-stage change, contact merge or
      record deletion surface exists in the connector at any tier. Like the
      QuickBooks and Stripe tracks and unlike the M365 one, it does NOT persist
      what it reads — CRM reads are answered read-through, so no synced copy
      exists to encrypt and the connector does not become the first writer of
      the unencrypted ErpEntityCache or of ErpSyncCursor (ADR-041 §4,
      WARP-2028). Off until the owner connects a portal. Metered by HubSpot on
      the Search API at 5 requests per second per ACCOUNT — a ceiling that
      cannot be raised at any tier and returns no rate-limit headers — so the
      connector serialises Search behind an account-keyed governor and derives
      its backoff from the 429 itself.
    ticket: WARP-2317
    added: 2026-08-27
    review_by: 2027-08-27
    code_refs: [services/erp-connector/src/hubspot/connector.ts]

