  # kind: dynamic, NOT egress — and that is deliberate, not an oversight.
  # Mailchimp's base URL is https:// + <dc> + .api.mailchimp.com + /3.0/, where
  # <dc> is the datacenter suffix parsed out of the customer's own API key
  # (".…-us14") at runtime. There is no hostname to write down: each customer's
  # account lives in a different datacenter, so no static entry can cover it.
  # docs/SECURITY.md:174-184 is explicit that runtime-configured destinations
  # register as kind: dynamic with their config key, and :183-185 that "the
  # static scan cannot see hostnames assembled at runtime".
  #
  # DO NOT "FIX" THIS INTO A STATIC ENTRY. A kind: egress entry with a wildcard
  # or one sampled datacenter would be worse than useless — it would turn
  # egress-gate green over a host that nothing constrains. Since a dynamic
  # entry contributes NO host patterns to the scanner, this connector's source
  # deliberately carries no https://…mailchimp.com literal either. What it
  # DOES carry is the bare suffix constant ".api.mailchimp.com" the code-side
  # guard anchors on — visible to the gate since the WARP-2467 bare-host scan
  # reads string literals, and accounted for by ref-mailchimp-host-suffix
  # below, which registers that NAME without granting any egress.
  #
  # THE ENFORCEMENT IS IN CODE, not here. assertSafeMailchimpBaseUrl() does
  # exact-host equality against <dc>.api.mailchimp.com for the datacenter this
  # connection stores — anchored, so "us14.api.mailchimp.com.evil.test" is
  # refused — and it runs before any request object exists. Its tests assert on
  # the injected fetch having ZERO calls. Treat that guard as the control this
  # entry documents.
  - id: mailchimp-marketing-api
    kind: dynamic
    service: erp-connector
    config_key: IntegrationConnection.providerConfig.datacenter (parsed from the customer's API key suffix at intake)
    phase: runtime
    data_class: user-content-on-request
    purpose: >-
      Mailchimp Marketing API /3.0 — the audience-and-campaign cloud connector
      (WARP-2379). Read-only: audiences and members, campaigns and their
      reports, e-commerce stores and orders. Carries the customer's own
      marketing contacts, fetched on request under a key the account owner
      created and pasted; never ambient, never a background crawl. The host is
      per-connection because Mailchimp shards accounts by datacenter, so the
      code-side exact-host guard is the enforcement and this entry is the
      registration and review record.
    ticket: WARP-2379
    added: 2026-08-27
    review_by: 2027-08-27
    code_refs: [services/erp-connector/src/mailchimp/connector.ts]

  - id: ref-mailchimp-host-suffix
    kind: reference
    service: erp-connector
    destination:
      # NOT an egress destination and NOT a wildcard grant. The box never
      # dials api.mailchimp.com itself — the dialled host is
      # <dc>.api.mailchimp.com, per-connection, governed by
      # mailchimp-marketing-api above and by assertSafeMailchimpBaseUrl().
      # This entry exists because the connector carries ".api.mailchimp.com"
      # as a whole-string literal for that guard to anchor on, and the
      # WARP-2467 bare-host scan (rightly) reads a bare name out of it.
      # Exact name only, so a sampled-datacenter literal like
      # us1.api.mailchimp.com is still denied — which is the point.
      hosts: [api.mailchimp.com]
    purpose: the anchored host-suffix constant behind the Mailchimp exact-host guard, named in code as the guard's anchor — not a connection the box makes
    ticket: WARP-2379
    added: 2026-08-28
    review_by: 2027-08-28
    code_refs: [services/erp-connector/src/mailchimp/connector.ts]

