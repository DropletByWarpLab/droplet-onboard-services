# =============================================================================
# Droplet allowed-egress registry — WARP-269 (CI gate) + WARP-268 (runtime
# egress audit) single source of truth.
#
# THE CONTRACT: customer data never leaves the device. Every outbound
# destination the codebase can reach must have an entry here, with a
# data_class proving what (if anything) it carries. The egress-gate CI lane
# (scripts/check-egress-allowlist.py) fails any PR referencing a destination
# not registered below. Adding an entry REQUIRES security review on the PR
# (assign Romain) and a ticket reference.
#
# Schema (v1):
#   id            unique slug
#   kind          egress | dynamic | reference
#   service       owning app/service dir name (or "repo" / "ci")
#   destination:  hosts: [exact or *.wildcard]   (egress/reference)
#                 cidrs: []                       (optional, for WARP-268)
#                 ports: []                       (documented for WARP-268)
#                 protocol: https | quic | udp/ntp | smtp | imaps | ...
#   config_key    (dynamic only) the env/config var holding the destination
#   phase         runtime | setup | build | ci
#   data_class    none | operational-telemetry | user-content-on-request
#   purpose       one sentence, plain language
#   ticket        WARP reference that introduced/approved it
#   added         YYYY-MM-DD
#   review_by     next annual review date
#   code_refs     the files that dial this destination. LOAD-BEARING since
#                 WARP-2452: for kind: egress the gate fails unless one of
#                 the entry's hosts appears here as a NON-COMMENT literal.
#                 Keep base URLs as whole strings — a URL split across
#                 concatenated parts, or named only in a comment, no longer
#                 counts as backing.
#   no_code_literal
#                 (kind: egress only) reason this destination can have no
#                 repo literal — a third-party binary or SDK owns it.
#                 Reviewed, and deliberately never blanket: the list of
#                 exemptions is the list of things the registry cannot
#                 prove. The gate fails if a literal DOES exist, so it
#                 self-prunes.
#                 PER HOST since WARP-2487, in either of two shapes:
#                   no_code_literal: <reason>          covers every host
#                   no_code_literal: {<host>: <reason>} covers those hosts
#                 The mapping exists because a MIXED entry was previously
#                 inexpressible: with two hosts, one SDK-owned and one
#                 dialled by our own code, declaring the flag failed (a
#                 literal exists) and omitting it passed (some host is
#                 backed) while nothing accounted for the SDK-owned half.
#                 A mapping key that is not one of the entry's own hosts is
#                 a config error (exit 2), not a silent no-op.
#
#   ids must be UNIQUE. Two list items may legally carry the same `id:` as
#   far as YAML is concerned, and PR #1828 shipped two byte-identical
#   `hubspot-api` blocks under a green "OK — 41 registry entries". The gate
#   now fails on a duplicate id and prints both line numbers (WARP-2487).
# =============================================================================
version: 1
policy:
  default: deny
  review: security-review required on any PR touching this file
  runtime_enforcement: WARP-268

entries:
  # ── runtime egress ──────────────────────────────────────────────────────
  - id: ota-github-releases
    kind: egress
    service: orchestrator
    destination:
      hosts: [api.github.com, github.com, objects.githubusercontent.com, release-assets.githubusercontent.com]
      ports: [443]
      protocol: https
    phase: runtime
    data_class: none
    purpose: OTA update manifest (releases/latest) and signed release asset download
    ticket: WARP-538
    added: 2026-07-04
    review_by: 2027-07-04
    code_refs: [apps/orchestrator/src/config.ts]

  - id: fleet-telemetry-portal
    kind: egress
    service: fleet-agent
    destination:
      hosts: [analytics.warp-lab.ai]
      ports: [443]
      protocol: https
    phase: runtime
    data_class: operational-telemetry
    purpose: >-
      Fleet health/telemetry portal (ADR-028) — device metrics and update
      status only; never file contents, camera frames, chat, or credentials.
    ticket: WARP-961
    added: 2026-07-04
    review_by: 2027-07-04
    code_refs: [services/fleet-agent/config.py, apps/orchestrator/src/services/analytics/client.ts, docker/docker-compose.yml]

  - id: cloudflare-tunnel-edge
    kind: egress
    service: cloudflared
    destination:
      hosts: ["*.argotunnel.com", api.cloudflare.com]
      ports: [443, 7844]
      protocol: quic
    phase: runtime
    data_class: user-content-on-request
    purpose: >-
      Outbound-only tunnel transport for remote dashboard access (ADR-025);
      carries TLS-encrypted user sessions the user initiated. No repo
      literal — destination comes from the tunnel token consumed by the
      pinned cloudflare/cloudflared image.
    ticket: WARP-978
    added: 2026-07-04
    review_by: 2027-07-04
    code_refs: [docker/docker-compose.yml]
    no_code_literal: >-
      The pinned cloudflare/cloudflared image resolves its own edge from the
      tunnel token; no Droplet source names the host. Restates the purpose
      field's "No repo literal" so the gate can check it. (WARP-2452)

  - id: overlay-stun-mapping
    kind: egress
    service: device-bridge
    destination:
      hosts: [stun.cloudflare.com, stun.l.google.com]
      # Cloudflare answers STUN on 3478; Google's public STUN on 19302. Both are
      # documented so the WARP-268 runtime audit knows the real ports.
      ports: [3478, 19302]
      protocol: udp/stun
    phase: runtime
    data_class: none
    purpose: >-
      STUN Binding probe (RFC 5389) sent by device-bridge FROM host udp/51820 to
      learn the box's own public UDP mapping for the direct-punch remote-access
      overlay (ADR-030 / WARP-1385). One request/response per connect; carries no
      user content — only the box's reflexive ip:port, handed to HQ in the
      overlay `answer`. The orchestrator only calls device-bridge's internal
      /host/stun-probe endpoint; the STUN socket egress originates in
      device-bridge (host netns), so that is the owning service.
    ticket: WARP-1385
    added: 2026-07-18
    review_by: 2027-07-18
    code_refs: [services/oled-display/device-bridge.py]

  - id: sso-oidc-idps
    kind: egress
    service: orchestrator
    destination:
      hosts: [accounts.google.com, login.microsoftonline.com, "*.okta.com", okta.com]
      ports: [443]
      protocol: https
    phase: runtime
    data_class: none
    purpose: >-
      OIDC discovery/token/JWKS for admin-configured SSO (Google, Entra,
      Okta documented defaults; arbitrary issuer covered by
      sso-custom-issuer below).
    ticket: WARP-243
    added: 2026-07-04
    review_by: 2027-07-04
    # WARP-2468: docs/ONBOARDING_SSO_OIDC.md was listed here and is still the
    # operator guide for this entry — but a doc the denial scan never reads
    # cannot be evidence the host is dialled, so it lives in this comment now.
    code_refs: [apps/orchestrator/src/config.ts]

  - id: calendar-location-autocomplete
    kind: egress
    service: orchestrator
    destination:
      hosts: [nominatim.openstreetmap.org]
      ports: [443]
      protocol: https
    phase: runtime
    data_class: user-content-on-request
    purpose: >-
      Geocoding for the event-form location combobox (WARP-307): sends only
      the location query string the user is actively typing; rate-limited
      1 req/s; identifying User-Agent per OSM ToS.
    ticket: WARP-307
    added: 2026-07-04
    review_by: 2027-07-04
    # WARP-2452: was calendar.ts alone, where the host appears only in a
    # comment. The literal lives in places.service.ts; calendar.ts is the
    # route that proxies to it.
    code_refs: [apps/orchestrator/src/services/places.service.ts, apps/orchestrator/src/routes/calendar.ts]

  - id: voice-geolocation
    kind: egress
    service: voice-io
    destination:
      # WARP-2467: ip-api.com added. It was always a real second destination —
      # GEO_URL can be pointed at it without a code change, and geo.py branches
      # on its differently-shaped response (city/regionName/country) at :139.
      # Only the bare-host blind spot kept it out of this list: the host is
      # never written as a scheme URL literal, so nothing extracted it.
      hosts: [ipapi.co, ip-api.com]
      ports: [443]
      protocol: https
    phase: runtime
    data_class: none
    purpose: >-
      One call per process lifetime to resolve city/timezone from the
      appliance egress IP when DROPLET_LOCATION/TZ are unset; payload is
      empty (GET), response seeds the voice system prompt.
    ticket: WARP-269
    added: 2026-07-04
    review_by: 2027-07-04
    code_refs: [services/voice-io/voice/geo.py]

  # ── WARP-1745 determination: this entry STAYS (re-checked 2026-08-05) ────
  # Epic WARP-1740 stages Ollama → Docker Model Runner. Phase 1 (WARP-1745)
  # proposed DELETING the entry below. That was re-checked against the code
  # and REVERSED. Reasons, in order of weight:
  #
  #   1. The egress it documents is still LIVE. Ollama is still the runtime
  #      (docker/docker-compose.yml:2250 pins ollama/ollama:0.30.8-rocm), and
  #      apps/orchestrator/src/services/model-readiness.service.ts:358 still
  #      POSTs /api/pull for any LLM_MODEL/VISION_MODEL missing from
  #      /api/tags on first boot. The Ollama daemon resolves that to
  #      registry.ollama.ai. WARP-1745 adds an OCI *pre-seed* path; it does
  #      NOT remove that call, so a box that was never pre-seeded still makes
  #      this exact connection on first boot.
  #   2. This file is the source of truth for the WARP-268 RUNTIME egress
  #      audit as well as the WARP-269 CI scanner (see the header, the
  #      `runtime_enforcement` key above, and docs/SECURITY.md:135-136).
  #      Deleting the entry would not stop the connection — it would delete
  #      the RECORD of it, turning an audited channel into an undocumented
  #      one, and would make on-device default-deny break first boot.
  #
  # NOT a reason to keep it: "removing it would red the egress gate." It
  # would not, and that argument should not be repeated. The gate is
  # one-directional — scripts/check-egress-allowlist.py only fails on hosts
  # it FINDS that are unregistered (:199). docs/ is outside SCOPE_PREFIXES
  # (:50-51), so registry.ollama.ai is matched nowhere in scanner scope and
  # this entry ALREADY prints the non-fatal stale NOTICE (:208) — exactly as
  # the other daemon/SDK-owned entries do (cloudflare-tunnel-edge,
  # cloud-llm-providers-optin). The gate is indifferent in both directions;
  # the reason to keep this is the runtime record, nothing to do with CI.
  #
  # REMOVE THIS ENTRY once ALL of the following hold — owner: WARP-1749
  # ("flip the default runtime"), which is the ticket that makes them true:
  #   a. the default inference runtime is no longer Ollama;
  #   b. model-readiness.service.ts reaches Ollama /api/pull on no supported
  #      boot path (pre-seeded or not); and
  #   c. no shipped compose profile still starts the `ollama` service.
  # Until (a)–(c) hold, removing this is a documentation regression, not a
  # hardening win.
  - id: ollama-model-registry
    kind: egress
    service: orchestrator
    destination:
      hosts: [registry.ollama.ai]
      ports: [443]
      protocol: https
    phase: runtime
    data_class: none
    purpose: >-
      First-boot LLM weight download triggered via the local Ollama
      /api/pull (model-readiness service). No repo literal — the Ollama
      daemon owns the destination.
      SUPERSEDED-IN-WAITING by epic WARP-1740, which moves weights onto
      content-addressed, signable OCI artifacts. Still live because the
      /api/pull call still exists — see the removal preconditions above.
      Note deliberately NO replacement entry is registered yet. WARP-1745
      ships only the packaging/signing/air-gap-seed tooling; nothing in the
      running system pulls an OCI model artifact until WARP-1749 repoints
      model-readiness.service.ts. An entry added now would be matchable by
      the WARP-268 runtime audit immediately — allowlist matching is on the
      (service, host, port) tuple, not the host alone, so registering
      orchestrator->Docker Hub early would reclassify a genuine anomaly
      (the orchestrator reaching a public registry) as expected traffic
      months before any code can produce it. Default-deny exists to prevent
      exactly that. The replacement entry, and its security review, belong
      on the WARP-1749 PR where the channel actually becomes live.
      When it is written it must describe the REAL destination: the tooling
      requires an operator-supplied DROPLET_MODEL_REGISTRY with no default,
      so the channel is "whichever OCI registry the operator configures",
      not "Docker Hub".
    ticket: WARP-269
    added: 2026-07-04
    review_by: 2027-07-04
    code_refs: [apps/orchestrator/src/services/model-readiness.service.ts]
    # WARP-2487: the one occurrence of this host in the repo is
    # services/inference-manager/runtime/base.py:190, inside a DOCSTRING
    # explaining that Ollama resolves names against it. That is prose about
    # the daemon's behaviour, not a call — the file is not a code_ref of this
    # entry and does not dial the host — so the declaration below is true per
    # host, not merely true on average. Recorded here because per-host
    # checking makes the question askable and the answer should be written
    # down rather than rediscovered.
    no_code_literal: >-
      The Ollama daemon owns model-weight distribution and resolves this
      itself; our code never names it. Already stated in this entry's own
      purpose and in ADR-036 — declared so the gate can check it, and so it
      stays a known hole rather than a silent one. (WARP-2452)

  - id: cloud-llm-providers-optin
    kind: egress
    service: ai-gateway
    destination:
      hosts: [api.anthropic.com, api.openai.com]
      ports: [443]
      protocol: https
    phase: runtime
    data_class: user-content-on-request
    purpose: >-
      Opt-in cloud LLM providers via LiteLLM SDK defaults (no repo literal).
      Only reachable when the operator supplies an API key and a user
      selects a cloud model; off-LAN gating middleware applies.
    ticket: WARP-269
    added: 2026-07-04
    review_by: 2027-07-04
    code_refs: [services/ai-gateway/providers/anthropic_cloud.py, services/ai-gateway/providers/openai_cloud.py]
    # WARP-2487: api.anthropic.com also appears at
    # services/egress-audit/allowlist.py:14 — inside the module DOCSTRING, as
    # the worked example of this very schema. Prose about the registry
    # format, in a file that is not a code_ref here and dials nothing. The
    # declaration below holds for BOTH hosts: neither provider names a base
    # URL, so the string form (which covers every host of the entry) is the
    # accurate shape. The host->reason mapping form exists for entries where
    # that is not true.
    no_code_literal: >-
      The LiteLLM SDK holds the base URLs; the providers pass only a model
      id and an API key (see anthropic_cloud.py, which names no host).
      Already stated in this entry's purpose. (WARP-2452)

  - id: ambient-weather-open-meteo
    kind: egress
    service: web-fetch
    destination:
      hosts: [api.open-meteo.com, geocoding-api.open-meteo.com]
      ports: [443]
      protocol: https
    phase: runtime
    data_class: user-content-on-request
    purpose: >-
      get_weather LLM tool: keyless Open-Meteo geocoding + forecast. The
      user-supplied place name is the only content sent. Reachable only
      when the `web` compose profile AND the ambient_data off-LAN channel
      are enabled (both default off); every request audit-logged.
    ticket: WARP-1436
    added: 2026-07-20
    review_by: 2027-07-20
    code_refs: [services/web-fetch/providers.py]

  - id: ambient-rates-ecb
    kind: egress
    service: web-fetch
    destination:
      hosts: [www.ecb.europa.eu]
      ports: [443]
      protocol: https
    phase: runtime
    data_class: none
    purpose: >-
      currency_convert LLM tool: ECB daily reference rates (one fixed XML
      document, no user content in the request). Gated by the `web`
      compose profile + ambient_data off-LAN channel; served from a 24h
      cache with a staleness stamp when offline.
    ticket: WARP-1436
    added: 2026-07-20
    review_by: 2027-07-20
    code_refs: [services/web-fetch/providers.py]

  - id: ntp-openwrt-pool
    kind: egress
    service: openwrt-router
    destination:
      hosts: ["*.openwrt.pool.ntp.org"]
      ports: [123]
      protocol: udp/ntp
    phase: runtime
    data_class: none
    purpose: Router + camera-VLAN time sync (the phone-home block carves out NTP — ADR-012)
    ticket: WARP-269
    added: 2026-07-04
    review_by: 2027-07-04
    code_refs: [openwrt/files/etc/config/system]

  - id: public-dns-resolvers
    kind: egress
    service: openwrt-router
    destination:
      # IP literals go in hosts so the CI scanner (which matches extracted
      # IPv4 tokens against destination.hosts) allowlists them; cidrs is the
      # WARP-268 runtime-audit view of the same addresses.
      hosts: ["1.1.1.1", "1.0.0.1", "8.8.8.8"]
      cidrs: [1.1.1.1/32, 1.0.0.1/32, 8.8.8.8/32]
      ports: [53]
      protocol: dns
    phase: runtime
    data_class: none
    purpose: >-
      Cloudflare (1.1.1.1/1.0.0.1) and Google (8.8.8.8) public DNS resolvers
      handed to LAN clients via dnsmasq, used as the dockerd DNS pin, and as
      the watchdog/network-status connectivity-probe targets. DNS queries
      only — no customer content. Admin can override the upstream resolver
      (WARP-871). These IP literals are matched by the CI scanner, so their
      exact addresses are listed here.
    ticket: WARP-269
    added: 2026-07-04
    review_by: 2027-07-04
    code_refs: [scripts/host/etc-dnsmasq.d/droplet-ap.conf, scripts/host/droplet-watchdog.sh, apps/orchestrator/src/routes/network-status.routes.ts, apps/web-dashboard/src/components/network/DnsServersForm.tsx]

  # ── cloud connectors (ADR-041) — owner-enabled, per-connection, off by default ──
  # A cloud connector reads a customer's SaaS system of record onto the box.
  # It only ever dials OUT (no webhook, no inbound path — the box has none),
  # ships disabled, and carries nothing until the owner connects that account
  # in the dashboard. Disconnecting purges the stored tokens. See ADR-041.
  - id: m365-graph-api
    kind: egress
    service: orchestrator
    destination:
      hosts: [graph.microsoft.com]
      ports: [443]
      protocol: https
    phase: runtime
    data_class: user-content-on-request
    purpose: >-
      Microsoft 365 connector (ADR-041) — reads the mail, calendar, contacts
      and OneDrive/SharePoint files of accounts the owner explicitly connected,
      onto the box, via Graph delta queries. Carries that user content in the
      response, plus drafted replies the owner chooses to send. Delegated
      per-user authorization only: the box can never read what the signed-in
      user cannot. Nothing is sent opportunistically. Off until connected.
    ticket: WARP-2114
    added: 2026-08-19
    review_by: 2027-08-19
    # WARP-2468: was docs/ADR-041-cloud-connector-class.md, which the denial
    # scan never reads — the ADR that PROPOSED this host was keeping the entry
    # green. Repointed at the sync-engine files the Graph client will live in.
    # The ADR remains the authorising document; it is just not evidence of use.
    code_refs: [apps/orchestrator/src/services/m365/delta-cursor.service.ts, apps/orchestrator/src/services/m365/sync-policy.ts]
    no_code_literal: >-
      Registered ahead of its caller: the WARP-2118 sync engine has no HTTP
      client yet, so nothing in apps/ or services/ names this host —
      @microsoft/microsoft-graph-client is not a dependency, and the only
      occurrences in the repo are .test.ts fixtures, which are out of the
      scanner's scope. Self-pruning: the moment WARP-2118 lands a
      graph.microsoft.com literal in a code_refs file, the gate fails on
      this entry until this declaration is deleted. (WARP-2468 / WARP-2118)

  - id: m365-entra-login
    kind: egress
    service: orchestrator
    destination:
      hosts: [login.microsoftonline.com]
      ports: [443]
      protocol: https
    phase: runtime
    data_class: none
    purpose: >-
      Microsoft Entra ID token endpoint for the M365 connector (ADR-041) —
      device-code and authorization-code sign-in, plus token refresh. Carries
      OAuth protocol traffic only: no mail, files, or box-local content.
      DELIBERATE DUPLICATE HOST: login.microsoftonline.com is also registered
      under 'sso-oidc-idps' (WARP-243) for admin-configured Entra SSO. Same
      host, unrelated call path and consent model — the connector's use is
      per-owner account authorization, not box sign-in. Registered separately
      so neither can be removed on the assumption the other covers it; if one
      is ever retired, check the other before deleting the host.
    ticket: WARP-2114
    added: 2026-08-19
    review_by: 2027-08-19
    # WARP-2468: was docs/ADR-041-cloud-connector-class.md. Unlike its sibling
    # m365-graph-api this destination IS dialled today — WARP-2115 landed the
    # MSAL client, entra-client.ts builds the authority from
    # config.M365_AUTHORITY_HOST, and config.ts holds the host as a literal
    # default. So it needs no no_code_literal declaration: the code backs it.
    code_refs: [apps/orchestrator/src/config.ts, apps/orchestrator/src/services/m365/entra-client.ts]

  - id: quickbooks-online-api
    kind: egress
    service: orchestrator
    destination:
      hosts: [quickbooks.api.intuit.com]
      ports: [443]
      protocol: https
    phase: runtime
    data_class: user-content-on-request
    purpose: >-
      QuickBooks Online connector (ADR-041) — reads the invoices, bills and
      payables of a company the owner explicitly connected, via Intuit's v3
      REST query API. Carries that financial content in the response.
      READ-ONLY: the connector refuses every write, and nothing box-local is
      ever sent. Unlike the M365 connector this track does NOT persist what it
      reads — an accounting ledger is answered read-through, so no synced copy
      exists to encrypt (ADR-041 §4 requires encryption at rest for a cloud
      connector that persists; this one deliberately does not become the first
      writer of the unencrypted ErpEntityCache, per WARP-2028). Off until the
      owner connects a company. Metered by Intuit: reads are the charged half,
      so the connector enforces a per-connection call ceiling.
    ticket: WARP-2109
    added: 2026-08-20
    review_by: 2027-08-20
    code_refs: [services/erp-connector/src/quickbooks/online-connector.ts]

  - id: quickbooks-online-sandbox-api
    kind: egress
    service: orchestrator
    destination:
      hosts: [sandbox-quickbooks.api.intuit.com]
      ports: [443]
      protocol: https
    phase: runtime
    data_class: user-content-on-request
    purpose: >-
      QuickBooks Online connector (ADR-041) pointed at Intuit's SANDBOX
      environment — the operator-configurable baseUrl used for pre-production
      connection validation against a sandbox company before a live one is
      connected. Same v3 REST query API, same read-only/metered/read-through
      posture as quickbooks-online-api; carries that sandbox company's ledger
      content in the response. The connector's baseUrl guard is an EXACT host
      set mirroring this registry (this host plus the production one — never a
      *.intuit.com suffix), so registering it here is what makes it dialable
      at all.
    ticket: WARP-2109
    added: 2026-08-22
    review_by: 2027-08-22
    code_refs: [services/erp-connector/src/quickbooks/online-connector.ts]

  - id: stripe-api
    kind: egress
    service: erp-connector
    destination:
      hosts: [api.stripe.com]
      ports: [443]
      protocol: https
    phase: runtime
    data_class: user-content-on-request
    purpose: >-
      Stripe connector (ADR-041) — reads the merchant financial records of a
      Stripe account the owner explicitly connected: balance transactions
      (every inflow and outflow with its fee and its net), charges, customers,
      invoices and subscriptions. Carries that financial content in the
      response. Nothing box-local is ever sent and nothing is sent
      opportunistically; the connector only ever dials out, because the box
      accepts no inbound connections and Stripe webhooks are therefore
      structurally unavailable to it. api.stripe.com serves both the ordinary
      API and the Reporting API (used for bulk backfill, which Stripe excludes
      from the account's read allocation), and there is no separate token
      endpoint because there is no OAuth dance — the merchant creates a
      RESTRICTED key (rk_live_/rk_test_) in their own Stripe Workbench and it
      is presented directly. This entry is NOT the whole of the connector's
      egress, though: a finished report run's CONTENTS are served from
      files.stripe.com, a second host registered separately as
      stripe-report-files (WARP-2450). An earlier revision of this text claimed
      "ONE entry covers this connector completely" — that was true only while
      backfill stopped at the file reference and did not download it, and it is
      corrected here rather than left to mislead a reviewer. If a token
      endpoint is ever added it gets its own entry with data_class: none, as
      m365-entra-login does. READ-ONLY: the connector refuses every write, and
      no refund, payout or transfer surface exists in it at any tier. Like the
      QuickBooks track and unlike the M365 one, it does NOT persist what it
      reads — a payments ledger is answered read-through, so no synced copy
      exists to encrypt and the connector does not become the first writer of
      the unencrypted ErpEntityCache or of ErpSyncCursor (ADR-041 §4,
