# =============================================================================
# Droplet allowed-egress registry — WARP-269 (CI gate) + WARP-268 (runtime
# egress audit) single source of truth.
#
# THE CONTRACT: customer data never leaves the device. Every outbound
# destination the codebase can reach must have an entry here, with a
# data_class proving what (if anything) it carries. The egress-gate CI lane
# (scripts/check-egress-allowlist.py) fails any PR referencing a destination
# not registered below. Adding an entry REQUIRES security review on the PR
# (assign Romain) and a ticket reference.
#
# Schema (v1):
#   id            unique slug
#   kind          egress | dynamic | reference
#   service       owning app/service dir name (or "repo" / "ci")
#   destination:  hosts: [exact or *.wildcard]   (egress/reference)
#                 cidrs: []                       (optional, for WARP-268)
#                 ports: []                       (documented for WARP-268)
#                 protocol: https | quic | udp/ntp | smtp | imaps | ...
#   config_key    (dynamic only) the env/config var holding the destination
#   phase         runtime | setup | build | ci
#   data_class    none | operational-telemetry | user-content-on-request
#   purpose       one sentence, plain language
#   ticket        WARP reference that introduced/approved it
#   added         YYYY-MM-DD
#   review_by     next annual review date
#   code_refs     representative files (scanner prints stale-entry notices
#                 when hosts stop appearing anywhere)
# =============================================================================
version: 1
policy:
  default: deny
  review: security-review required on any PR touching this file
  runtime_enforcement: WARP-268

entries:
  # ── runtime egress ──────────────────────────────────────────────────────
