  - id: ntp-openwrt-pool
    kind: egress
    service: openwrt-router
    destination:
      hosts: ["*.openwrt.pool.ntp.org"]
      ports: [123]
      protocol: udp/ntp
    phase: runtime
    data_class: none
    purpose: Router + camera-VLAN time sync (the phone-home block carves out NTP — ADR-012)
    ticket: WARP-269
    added: 2026-07-04
    review_by: 2027-07-04
    code_refs: [openwrt/files/etc/config/system]

  - id: public-dns-resolvers
    kind: egress
    service: openwrt-router
    destination:
      # IP literals go in hosts so the CI scanner (which matches extracted
      # IPv4 tokens against destination.hosts) allowlists them; cidrs is the
      # WARP-268 runtime-audit view of the same addresses.
      hosts: ["1.1.1.1", "1.0.0.1", "8.8.8.8"]
      cidrs: [1.1.1.1/32, 1.0.0.1/32, 8.8.8.8/32]
      ports: [53]
      protocol: dns
    phase: runtime
    data_class: none
    purpose: >-
      Cloudflare (1.1.1.1/1.0.0.1) and Google (8.8.8.8) public DNS resolvers
      handed to LAN clients via dnsmasq, used as the dockerd DNS pin, and as
      the watchdog/network-status connectivity-probe targets. DNS queries
      only — no customer content. Admin can override the upstream resolver
      (WARP-871). These IP literals are matched by the CI scanner, so their
      exact addresses are listed here.
    ticket: WARP-269
    added: 2026-07-04
    review_by: 2027-07-04
    code_refs: [scripts/host/etc-dnsmasq.d/droplet-ap.conf, scripts/host/droplet-watchdog.sh, apps/orchestrator/src/routes/network-status.routes.ts, apps/web-dashboard/src/components/network/DnsServersForm.tsx]

  # ── cloud connectors (ADR-041) — owner-enabled, per-connection, off by default ──
  # A cloud connector reads a customer's SaaS system of record onto the box.
  # It only ever dials OUT (no webhook, no inbound path — the box has none),
  # ships disabled, and carries nothing until the owner connects that account
  # in the dashboard. Disconnecting purges the stored tokens. See ADR-041.
  - id: m365-graph-api
    kind: egress
    service: orchestrator
    destination:
      hosts: [graph.microsoft.com]
      ports: [443]
      protocol: https
    phase: runtime
    data_class: user-content-on-request
    purpose: >-
      Microsoft 365 connector (ADR-041) — reads the mail, calendar, contacts
      and OneDrive/SharePoint files of accounts the owner explicitly connected,
      onto the box, via Graph delta queries. Carries that user content in the
      response, plus drafted replies the owner chooses to send. Delegated
      per-user authorization only: the box can never read what the signed-in
      user cannot. Nothing is sent opportunistically. Off until connected.
    ticket: WARP-2114
    added: 2026-08-19
    review_by: 2027-08-19
    # Code lands in WARP-2115 (auth) and WARP-2118 (sync engine); this entry is
    # registered with the ADR that authorises the class, ahead of the client.
    code_refs: [docs/ADR-041-cloud-connector-class.md]

  - id: m365-entra-login
    kind: egress
    service: orchestrator
    destination:
      hosts: [login.microsoftonline.com]
      ports: [443]
      protocol: https
    phase: runtime
    data_class: none
    purpose: >-
      Microsoft Entra ID token endpoint for the M365 connector (ADR-041) —
      device-code and authorization-code sign-in, plus token refresh. Carries
      OAuth protocol traffic only: no mail, files, or box-local content.
      DELIBERATE DUPLICATE HOST: login.microsoftonline.com is also registered
      under 'sso-oidc-idps' (WARP-243) for admin-configured Entra SSO. Same
      host, unrelated call path and consent model — the connector's use is
      per-owner account authorization, not box sign-in. Registered separately
      so neither can be removed on the assumption the other covers it; if one
      is ever retired, check the other before deleting the host.
    ticket: WARP-2114
    added: 2026-08-19
    review_by: 2027-08-19
    code_refs: [docs/ADR-041-cloud-connector-class.md]

  - id: quickbooks-online-api
    kind: egress
    service: orchestrator
    destination:
      hosts: [quickbooks.api.intuit.com]
      ports: [443]
      protocol: https
    phase: runtime
    data_class: user-content-on-request
    purpose: >-
      QuickBooks Online connector (ADR-041) — reads the invoices, bills and
      payables of a company the owner explicitly connected, via Intuit's v3
      REST query API. Carries that financial content in the response.
      READ-ONLY: the connector refuses every write, and nothing box-local is
      ever sent. Unlike the M365 connector this track does NOT persist what it
      reads — an accounting ledger is answered read-through, so no synced copy
      exists to encrypt (ADR-041 §4 requires encryption at rest for a cloud
      connector that persists; this one deliberately does not become the first
      writer of the unencrypted ErpEntityCache, per WARP-2028). Off until the
      owner connects a company. Metered by Intuit: reads are the charged half,
      so the connector enforces a per-connection call ceiling.
    ticket: WARP-2109
    added: 2026-08-20
    review_by: 2027-08-20
    code_refs: [services/erp-connector/src/quickbooks/online-connector.ts]

  - id: quickbooks-online-sandbox-api
    kind: egress
    service: orchestrator
    destination:
      hosts: [sandbox-quickbooks.api.intuit.com]
      ports: [443]
      protocol: https
    phase: runtime
    data_class: user-content-on-request
    purpose: >-
      QuickBooks Online connector (ADR-041) pointed at Intuit's SANDBOX
      environment — the operator-configurable baseUrl used for pre-production
      connection validation against a sandbox company before a live one is
      connected. Same v3 REST query API, same read-only/metered/read-through
      posture as quickbooks-online-api; carries that sandbox company's ledger
      content in the response. The connector's baseUrl guard is an EXACT host
      set mirroring this registry (this host plus the production one — never a
      *.intuit.com suffix), so registering it here is what makes it dialable
      at all.
    ticket: WARP-2109
    added: 2026-08-22
    review_by: 2027-08-22
    code_refs: [services/erp-connector/src/quickbooks/online-connector.ts]

  - id: quickbooks-online-oauth
    kind: egress
    service: orchestrator
    destination:
      hosts: [oauth.platform.intuit.com]
      ports: [443]
      protocol: https
    phase: runtime
    data_class: none
    purpose: >-
      Intuit OAuth 2.0 token endpoint for the QuickBooks Online connector
      (ADR-041) — authorization-code exchange and refresh-token rotation.
      Carries OAuth protocol traffic only: no ledger content, no box-local
      content. Registered ahead of its caller: the connector in WARP-2109
      deliberately does NOT hold the client secret and blocks rather than
      refreshing, so the exchange lands with the orchestrator wiring. Intuit
      ROTATES the refresh token on every use, so this path is exercised
      routinely and not only at connect time.
    ticket: WARP-2109
    added: 2026-08-20
    review_by: 2027-08-20
    code_refs: [services/erp-connector/src/quickbooks/online-connector.ts]

  - id: ref-dentrix-ascend-spec
    kind: reference
    service: orchestrator
    destination:
      # NOT an egress destination. This host appears only inside a source
      # COMMENT recording where the Dentrix Ascend OpenAPI specification was
      # fetched from, and its sha256, so a future reader can tell whether the
      # contract the connector was written against has moved. The box never
      # opens a connection to it — the API and token endpoints are
      # prod/test.hs1api.com, registered separately above.
      hosts: [papidocs.hs1api.com]
    purpose: documentation URL for the Dentrix Ascend OpenAPI spec, cited in a source comment for provenance — not a connection the box makes
    ticket: WARP-2127
    added: 2026-08-20
    review_by: 2027-08-20
    code_refs: [services/erp-connector/src/dentrix/ascend-connector.ts]

  - id: dentrix-ascend-api
    kind: egress
    service: orchestrator
    destination:
      hosts: [prod.hs1api.com, test.hs1api.com]
      ports: [443]
      protocol: https
    phase: runtime
    data_class: user-content-on-request
    purpose: >-
      Dentrix Ascend connector (ADR-041) — reads the schedule, patients and
      aged receivables of a dental practice whose organization the owner
      explicitly connected, via Henry Schein One's documented Public API
      (OpenAPI 3.0.0, spec version 186.0.9). CARRIES PHI: patient names, dates
      of birth and appointment records, not merely financial totals. Both hosts
      also serve the OAuth client-credentials token endpoint, so this one entry
      covers auth and data for each; the token traffic alone would be
      data_class none, and the higher classification is recorded because the
      same host carries both. READ-ONLY: the connector refuses every write, and
      nothing box-local is ever sent. Read-through — nothing is persisted, so no
      synced PHI copy exists to encrypt (ADR-041 §4; the unimplemented
      ErpEntityCache encryption is WARP-2028). test.hs1api.com is the sandbox,
      required during vendor enrolment. Off until an organization is connected.
      ⚠ NOT YET ENABLED FOR ANY CUSTOMER: Henry Schein One's Developer
      Agreement is unpublished and its redistribution/sublicensing terms have
      not been reviewed against a shipped on-premise appliance holding the API
      key on customer hardware. See WARP-2127.
    ticket: WARP-2127
    added: 2026-08-20
    review_by: 2027-08-20
    code_refs: [services/erp-connector/src/dentrix/ascend-connector.ts]

  # ── dynamic (config-driven) destinations ────────────────────────────────
  - id: fleet-hq-issuance
    kind: egress
    service: orchestrator
    destination:
      hosts: [droplet-fleet-hq.rjouffret.workers.dev, fleet-hq.droplet-us.com]
      ports: [443]
      protocol: https
    phase: runtime
    data_class: none
    purpose: >-
      Fleet HQ TLS issuance API (ADR-023 public-CA-per-device via HQ DNS-01);
      CSR/cert material only. Now baked as the default HQ_ISSUANCE_URL in
      .env.example + scripts/lib/secrets.sh (WARP-978) so a reflash
      self-provisions its publicly-trusted cert with zero hand-patching;
      still operator-overridable via HQ_ISSUANCE_URL. Was kind: dynamic
      before the default host became a repo literal. The default is the LIVE
      HQ Worker (droplet-fleet-hq.rjouffret.workers.dev) — the vanity name
      fleet-hq.droplet-us.com was allowlisted + baked before it was ever
      bound in DNS (NXDOMAIN), dead-ending issuance on every fresh flash; it
      stays allowlisted here so the production-cutover flip
      (droplet-fleet-hq docs/HQ-CUTOVER-RUNBOOK.md) is a default swap, not an
      egress change.
    ticket: WARP-243
    added: 2026-07-04
    review_by: 2027-07-04
    code_refs: [apps/orchestrator/src/services/tls-issuance.adapters.ts, scripts/lib/secrets.sh, .env.example]

