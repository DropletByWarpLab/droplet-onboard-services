      ports: [443]
      protocol: https
    phase: runtime
    data_class: none
    purpose: >-
      OIDC discovery/token/JWKS for admin-configured SSO (Google, Entra,
      Okta documented defaults; arbitrary issuer covered by
      sso-custom-issuer below).
    ticket: WARP-243
    added: 2026-07-04
    review_by: 2027-07-04
    code_refs: [apps/orchestrator/src/config.ts, docs/ONBOARDING_SSO_OIDC.md]

