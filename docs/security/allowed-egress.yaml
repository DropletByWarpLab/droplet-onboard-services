  # ── reference-only (hostnames in the repo that are NOT egress) ──────────
  # WARP-2487: the gate now decides what a hostname is from the Public
  # Suffix List instead of a fifteen-entry TLD tuple, which is what makes a
  # destination on `.sh`/`.app`/`.xyz` visible at all. The cost is that ~1,440
  # delegated TLDs include ordinary English words, so a dotted identifier key
  # written as a whole string literal is indistinguishable FROM A HOSTNAME by
  # any structural rule — `wireless.channel` and `vendor.channel` are the same
  # shape. Filtering it in code would need a rule that also hides real
  # destinations, so these are registered instead, by exact name: each token
  # below is spelled out, so `evil.chat` still denies. Same idea as
  # ref-xml-namespaces, which registers namespace identifiers.
