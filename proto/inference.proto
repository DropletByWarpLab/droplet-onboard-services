syntax = "proto3";

package droplet.inference;

service InferenceService {
  // Unary chat completion
  rpc Chat(ChatRequest) returns (ChatResponse);
  // Server-side streaming chat completion
  rpc StreamChat(ChatRequest) returns (stream ChatChunk);
  // List available models
  rpc ListModels(Empty) returns (ModelList);
  // Text embedding — used by the file-indexer for semantic search (Phase 4)
  rpc EmbedText(EmbedRequest) returns (EmbedResponse);
  // Text reranker — used by the orchestrator for hybrid retrieval (WARP-286).
  // Scores each passage against the query using a cross-encoder.
  rpc Rerank(RerankRequest) returns (RerankResponse);
  // Zero-shot query classifier — used by the orchestrator's adaptive
  // retrieval router (WARP-437). Returns one of {factual, analytical,
  // conversational, navigational, unknown}.
  rpc ClassifyQuery(ClassifyQueryRequest) returns (ClassifyQueryResponse);
  // Calibrated decision model (Kev, WARP-3070). Forwards to the
  // droplet-local-LLM `decision-model` sidecar. Fails soft: an unconfigured,
  // slow or erroring sidecar is reported in DecideResponse.status, never as
  // a gRPC error. See droplet-local-LLM/docs/ADR-006-decision-model-kev.md.
  rpc Decide(DecideRequest) returns (DecideResponse);
}

message ChatRequest {
  string model = 1;
  repeated Message messages = 2;
  float temperature = 3;
  optional int32 max_tokens = 4;
  optional string provider = 5;
  // Priority: 0 = user-initiated, 5 = automation, 10 = background
  int32 priority = 6;
}

message Message {
  string role = 1;
  string content = 2;
}

message ChatResponse {
  string content = 1;
  string model = 2;
  Usage usage = 3;
  string finish_reason = 4;
}

message ChatChunk {
  string delta = 1;
  bool done = 2;
  optional Usage usage = 3;
}

message Usage {
  int32 prompt_tokens = 1;
  int32 completion_tokens = 2;
}

message Empty {}

message ModelList {
  repeated ModelInfo models = 1;
}

message ModelInfo {
  string id = 1;
  string provider = 2;
  string name = 3;
  optional int32 context_window = 4;
}

// ── Embedding (Phase 4 — file-indexer) ──

message EmbedRequest {
  // Texts to embed. Max batch size is model-dependent (typically 256).
  repeated string texts = 1;
  // Model override. Default: "bge-small-en-v1.5" (384-dim, 512-token
  // window, CPU-friendly). Empty string means the gateway default; any
  // other value must be in the gateway's EmbedText allow-list.
  optional string model = 2;
}

message EmbedResponse {
  repeated FloatArray embeddings = 1;
}

message FloatArray {
  repeated float values = 1;
}

// ── Rerank (WARP-286 — orchestrator hybrid retrieval) ──

message RerankRequest {
  // The user query.
  string query = 1;
  // Candidate passages to score, in caller-defined order.
  repeated string passages = 2;
  // Model id. Default: "bge-reranker-base".
  optional string model = 3;
}

message RerankResponse {
  // One float per input passage, same order.
  repeated float scores = 1;
}

// ── Query classification (WARP-437 — orchestrator adaptive routing) ──

message ClassifyQueryRequest {
  string query = 1;
  // Optional model override. Default: "MoritzLaurer/deberta-v3-base-zeroshot-v2.0".
  optional string model = 2;
}

message ClassifyQueryResponse {
  // One of: "factual" | "analytical" | "conversational" | "navigational" | "unknown".
  string class = 1;
  // Top-1 confidence in [0, 1]. Server-side floor is applied via
  // CLASSIFIER_CONFIDENCE_FLOOR; below the floor the class is "unknown".
  float confidence = 2;
}

// ── Decision model (WARP-3070 — Kev, ADR-006 in droplet-local-LLM) ──

message DecideRequest {
  // The text to evaluate. User content: the gateway never logs it.
  string state = 1;
  // Question id (caller-chosen, never shown to the model) -> question.
  map<string, DecideQuestion> questions = 2;
  // Per-request deadline for the sidecar call. 0 = gateway default (2000 ms).
  int32 timeout_ms = 3;
  // Model override. Empty = "kev-latest".
  string model = 4;
}

enum DecideQuestionType {
  DECIDE_QUESTION_TYPE_UNSPECIFIED = 0;
  // Yes/no. Answer: probability of yes.
  DECIDE_QUESTION_TYPE_NOUL = 1;
  // Pick one of 1-255 named options.
  DECIDE_QUESTION_TYPE_CHOICE = 2;
  // A level on an ordered scale, lowest first.
  DECIDE_QUESTION_TYPE_SCORE = 3;
}

message DecideOption {
  string name = 1;
  // Empty = no description (sent as null).
  string description = 2;
}

message DecideQuestion {
  DecideQuestionType type = 1;
  string instructions = 2;
  // NOUL only, both optional: what "true" / "false" mean.
  string true_description = 3;
  string false_description = 4;
  // CHOICE only. A repeated field, not a map, because order matters to the model.
  repeated DecideOption options = 5;
  // SCORE only. Ordered lowest to highest.
  repeated string levels = 6;
}

enum DecideStatus {
  DECIDE_STATUS_UNSPECIFIED = 0;
  DECIDE_STATUS_OK = 1;
  // Not configured, timed out, unreachable, 5xx or rejected key. Caller keeps
  // its non-Kev behaviour.
  DECIDE_STATUS_UNAVAILABLE = 2;
  // The sidecar rejected the request (422). A caller bug, not an outage.
  DECIDE_STATUS_INVALID = 3;
}

message DecideAnswer {
  DecideQuestionType type = 1;
  // NOUL: probability of yes.
  float noul = 2;
  // CHOICE: the most likely option name.
  string choice = 3;
  // SCORE: mean level index, starting at 0.
  float score = 4;
  // CHOICE and SCORE. Not a measured accuracy rate.
  float confidence = 5;
  // CHOICE: option name -> p. SCORE: level index as a string ("0", "1", ...) -> p.
  map<string, float> probabilities = 6;
  // SCORE: level index as a string -> level description.
  map<string, string> legend = 7;
}

message DecideResponse {
  DecideStatus status = 1;
  // Question id -> answer. Populated only when status is OK.
  map<string, DecideAnswer> answers = 2;
  // Sidecar-reported latency; wall-clock on the gateway when absent.
  float latency_ms = 3;
  string model = 4;
  // Short reason for UNAVAILABLE / INVALID. Never contains the state text.
  string detail = 5;
}
