syntax = "proto3";

package droplet.inference;

service InferenceService {
  // Unary chat completion
  rpc Chat(ChatRequest) returns (ChatResponse);
  // Server-side streaming chat completion
  rpc StreamChat(ChatRequest) returns (stream ChatChunk);
  // List available models
  rpc ListModels(Empty) returns (ModelList);
  // Text embedding — used by the file-indexer for semantic search (Phase 4)
  rpc EmbedText(EmbedRequest) returns (EmbedResponse);
  // Text reranker — used by the orchestrator for hybrid retrieval (WARP-286).
  // Scores each passage against the query using a cross-encoder.
  rpc Rerank(RerankRequest) returns (RerankResponse);
  // Zero-shot query classifier — used by the orchestrator's adaptive
  // retrieval router (WARP-437). Returns one of {factual, analytical,
  // conversational, navigational, unknown}.
  rpc ClassifyQuery(ClassifyQueryRequest) returns (ClassifyQueryResponse);
}

message ChatRequest {
  string model = 1;
  repeated Message messages = 2;
  float temperature = 3;
  optional int32 max_tokens = 4;
  optional string provider = 5;
  // Priority: 0 = user-initiated, 5 = automation, 10 = background
  int32 priority = 6;
}

message Message {
  string role = 1;
  string content = 2;
}

message ChatResponse {
  string content = 1;
  string model = 2;
  Usage usage = 3;
  string finish_reason = 4;
}

message ChatChunk {
  string delta = 1;
  bool done = 2;
  optional Usage usage = 3;
}

message Usage {
  int32 prompt_tokens = 1;
  int32 completion_tokens = 2;
}

message Empty {}

message ModelList {
  repeated ModelInfo models = 1;
}

message ModelInfo {
  string id = 1;
  string provider = 2;
  string name = 3;
  optional int32 context_window = 4;
}

// ── Embedding (Phase 4 — file-indexer) ──

message EmbedRequest {
  // Texts to embed. Max batch size is model-dependent (typically 256).
  repeated string texts = 1;
  // Model override. Default: "bge-small-en-v1.5" (384-dim, 512-token
  // window, CPU-friendly). Empty string means the gateway default; any
  // other value must be in the gateway's EmbedText allow-list.
  optional string model = 2;
}

message EmbedResponse {
  repeated FloatArray embeddings = 1;
}

message FloatArray {
  repeated float values = 1;
}

// ── Rerank (WARP-286 — orchestrator hybrid retrieval) ──

message RerankRequest {
  // The user query.
  string query = 1;
  // Candidate passages to score, in caller-defined order.
  repeated string passages = 2;
  // Model id. Default: "bge-reranker-base".
  optional string model = 3;
}

message RerankResponse {
  // One float per input passage, same order.
  repeated float scores = 1;
}

// ── Query classification (WARP-437 — orchestrator adaptive routing) ──

message ClassifyQueryRequest {
  string query = 1;
  // Optional model override. Default: "MoritzLaurer/deberta-v3-base-zeroshot-v2.0".
  optional string model = 2;
}

message ClassifyQueryResponse {
  // One of: "factual" | "analytical" | "conversational" | "navigational" | "unknown".
  string class = 1;
  // Top-1 confidence in [0, 1]. Server-side floor is applied via
  // CLASSIFIER_CONFIDENCE_FLOOR; below the floor the class is "unknown".
  float confidence = 2;
}
