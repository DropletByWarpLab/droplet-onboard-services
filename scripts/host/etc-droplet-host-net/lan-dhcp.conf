# Droplet single-box — DHCP server for the host's br-lan (managed-switch downstream).
#
# Runs as a DEDICATED dnsmasq instance under
# droplet-host-net.service. It does NOT use /etc/dnsmasq.conf and
# does NOT participate in the system-wide dnsmasq.service (which stays
# disabled — its default binds to every interface and collides with
# systemd-resolved on 127.0.0.53).
#
# Why a host-side DHCP server at all:
#   The OpenWrt container does run dnsmasq, but its br-lan is the
#   Wi-Fi AP segment inside the container netns — completely separate
#   from the host kernel's br-lan, where the managed switch (and
#   anything plugged into it: cameras today, computers tomorrow) lives.
#   Without something serving DHCP on the host's br-lan, devices that
#   come up through the switch never get an IP and the
#   camera-discovery service has nothing to scan.
#
# This is the SINGLE-VLAN baseline. Once the smart-port auto-VLAN work
# lands (see docs/SMART_PORT_AUTOVLAN.md), this config grows a sibling
# stanza for the CAMS VLAN (br-lan.50 → 192.168.30.0/24) and the
# per-port classification daemon moves cameras between the two.

# --- Interface binding ---------------------------------------------------
# bind-interfaces + listen-address restrict dnsmasq to ONE address on
# ONE bridge — leaves systemd-resolved (127.0.0.53) and avahi (5353)
# untouched, and stays out of br-mgmt where the upstream home router
# already owns DHCP/DNS.
bind-interfaces
interface=br-lan
listen-address=192.168.20.1
except-interface=lo

# --- DNS ----------------------------------------------------------------
# Disabled on this surface for now. LAN clients fall back to the
# gateway address (.20.1, this host), which routes their DNS queries
# through systemd-resolved upstream. Re-enable (delete port=0 + add
# `server=...`) once the smart-port work introduces split-horizon
# names for *.droplet.lan.
#
# WARP-1364: in bridged-AP mode (the single-box default) the Wi-Fi AP
# trunks into br-lan and this instance becomes the ONE DHCP/DNS
# authority for the unified segment — droplet-openwrt-attach then
# deletes the port=0 line below and appends a sentinel-managed dns
# block ("# >>> droplet-ap-bridge dns") with upstream servers and the
# local dashboard names dnsmasq-ap used to answer. Do not re-add
# port=0 by hand on a bridged box.
port=0

# --- DHCP ---------------------------------------------------------------
# Range leaves .1-.99 free for static assignments (the gateway lives at
# .1) and .201-.254 free for anything we want pinned by MAC later.
dhcp-range=192.168.20.100,192.168.20.200,12h
# Default gateway = this host.
dhcp-option=3,192.168.20.1
# DNS = this host (DNS server itself is off above; clients will retry
# upstream via the gateway once we enable it).
dhcp-option=6,192.168.20.1

# Sticky lease file — sits outside /tmp so leases survive reboot.
dhcp-leasefile=/var/lib/misc/droplet-lan.leases
dhcp-authoritative

# Log every DHCP transaction. The smart-port classification daemon
# (next session) tails this to detect new clients without polling.
log-dhcp
