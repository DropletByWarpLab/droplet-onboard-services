# WARP-2192: AMD FCH TCO hardware watchdog.
#
# systemd (PID1) pets /dev/watchdog per RuntimeWatchdogSec in
# /etc/systemd/system.conf.d/droplet-watchdog.conf, but it does NOT load
# watchdog drivers itself. Without this file the device never appears and the
# watchdog is a silent no-op — systemd logs nothing about a device it cannot
# find, so the setting looks applied while nothing is armed.
#
# Known failure mode on AMD FCH: the driver logs "Watchdog hardware is
# disabled" when firmware never programmed the MMIO base. Check dmesg on any
# new board revision rather than assuming the module loading means it works.
sp5100_tco
