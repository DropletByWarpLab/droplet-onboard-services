# WARP-2192 — hardware watchdog: reboot the box if the KERNEL wedges.
#
# Installed to /etc/systemd/system.conf.d/droplet-watchdog.conf.
#
# This is the floor beneath the other two recovery paths:
#   * droplet-power-restore (WARP-2190) handles mains loss.
#   * droplet-watchdog.service is *software* self-heal for known wedge states —
#     but it is a systemd timer, so a wedged kernel takes it down too.
# If the kernel stops scheduling, nothing in userspace can help and only the
# FCH's own timer gets us back.
#
# 120s is deliberately conservative. systemd pets at HALF this value (60s), so
# a transient stall — heavy IO, a storm of container restarts — has a full
# minute of slack before the counter even matters. A spurious reboot of a
# healthy appliance is worse than two minutes of extra downtime on a real hang.
#
# nowayout=0 on sp5100_tco, so systemd's clean close on a normal shutdown
# disarms the timer rather than leaving it to fire mid-reboot.
#
# RebootWatchdogSec is deliberately left at its 10min default — that one covers
# a hung *shutdown* sequence, which is a different failure from a hung kernel.
[Manager]
RuntimeWatchdogSec=120
