# Droplet single-box appliance — GRUB menu for the repacked autoinstall ISO
# (WARP-663 / ADR-020). Replaces the stock live-server grub.cfg so the default
# boot entry runs the unattended autoinstall, seeded by the embedded nocloud
# user-data + meta-data under /server/ on the ISO (mounted at /cdrom).
#
# `autoinstall` tells subiquity to run non-interactively; `ds=nocloud;s=...`
# points cloud-init at the seed directory on the CD. The 5s timeout still lets a
# human pick "manual install" if they need to recover a box by hand.

set timeout=5
set default=0

loadfont unicode
set menu_color_normal=white/black
set menu_color_highlight=black/light-gray

menuentry "Install Droplet single-box appliance (automated)" {
    set gfxpayload=keep
    # The ';' MUST stay backslash-escaped. GRUB treats a bare ';' as a command
    # separator, so `ds=nocloud;s=/cdrom/server/` would split — dropping
    # `s=/cdrom/server/`, leaving cloud-init with no seed location, and silently
    # falling back to an INTERACTIVE install. `\;` passes a literal ';' to the
    # kernel cmdline (the kernel then sees `ds=nocloud;s=/cdrom/server/`).
    linux   /casper/vmlinuz autoinstall ds=nocloud\;s=/cdrom/server/ ---
    initrd  /casper/initrd
}

menuentry "Install Ubuntu Server (manual recovery)" {
    set gfxpayload=keep
    linux   /casper/vmlinuz ---
    initrd  /casper/initrd
}
