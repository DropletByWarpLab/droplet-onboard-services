[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -v --tb=short
# Safety net (pytest-timeout): the suite runs in ~5s, so a per-test ceiling far
# above that turns a future hang into a single fast failure instead of a test
# that blocks the CI job until the 15-minute runner timeout cancels it.
timeout = 60
