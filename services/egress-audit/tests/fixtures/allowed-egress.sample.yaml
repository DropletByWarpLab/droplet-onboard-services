# WARP-268 test fixture. Mirrors the ACTUAL committed schema of
# docs/security/allowed-egress.yaml (owned by WARP-269): top-level
# `version: 1`, entries with nested destination.hosts[]/cidrs[]/ports[] and an
# advisory `protocol`. Covers every matching case the runtime consumer must
# preserve: exact hostname, "*.suffix" wildcard, IP + CIDR membership, port
# gate, protocol advisory, and the dynamic/reference kinds that runtime
# allow-matching must ignore. Kept small on purpose — the regression test in
# test_allowlist.py additionally loads the real repo file.
version: 1
policy:
  default: deny
entries:
  - id: cloud-llm-providers-optin
    kind: egress
    service: ai-gateway
    destination:
      hosts: [api.anthropic.com, "*.openai.com"]
      ports: [443]
      protocol: https
    phase: runtime
    data_class: user-content-on-request
    purpose: BYOK cloud LLM calls (user-initiated)
    ticket: WARP-268

  - id: public-dns-resolvers
    kind: egress
    service: host
    destination:
      hosts: ["1.1.1.1"]
      cidrs: [1.1.1.1/32]
      ports: [53]
      protocol: dns
    phase: runtime
    data_class: none
    purpose: Upstream DNS resolution
    ticket: WARP-268

  - id: ntp-any-resolver
    kind: egress
    service: host
    destination:
      cidrs: [0.0.0.0/0]
      ports: [123]
      protocol: udp/ntp
    phase: runtime
    data_class: none
    purpose: NTP time sync (any host, port 123)
    ticket: WARP-268

  - id: openwrt-downloads
    kind: egress
    service: openwrt
    destination:
      hosts: [downloads.openwrt.org]
      ports: [443]
      protocol: https
    phase: runtime
    data_class: none
    purpose: opkg install-if-missing safety net (WARP-826)
    ticket: WARP-826

  # dynamic + reference kinds MUST be ignored by runtime allow-matching.
  - id: user-mail-servers
    kind: dynamic
    service: email-indexer
    config_key: mailbox settings
    phase: runtime
    data_class: user-content-on-request
    purpose: The user's own IMAP/SMTP servers
    ticket: WARP-465

  - id: ref-xml-namespaces
    kind: reference
    service: repo
    destination:
      hosts: [www.w3.org]
    purpose: XML namespace identifiers, not egress
    ticket: WARP-269
