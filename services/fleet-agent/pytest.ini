[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -v --tb=short
# Safety net (pytest-timeout): the suite is all-mocked and runs in seconds;
# a generous per-test ceiling turns a future hang (e.g. a real long-poll
# sneaking into a test) into one fast failure instead of a wedged CI job.
timeout = 60
