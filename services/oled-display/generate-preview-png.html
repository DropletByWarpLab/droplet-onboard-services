<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Generate OLED Dashboard PNG</title>
<style>
  body { background: #111; color: #ccc; font-family: system-ui; display: flex; flex-direction: column; align-items: center; padding: 40px; }
  #status { margin: 20px 0; font-size: 18px; }
  a { display: none; }
</style>
</head>
<body>
<p id="status">Rendering 1920x1080 dashboard...</p>
<canvas id="c" width="1920" height="1080" style="display:none"></canvas>
<a id="dl">Download PNG</a>

<script>
const W = 1920, H = 1080;
const c = document.getElementById('c');
const ctx = c.getContext('2d');

// Colors
const BG = '#0d0d1a';
const PANEL_BG = '#000000';
const TEXT = '#ffffff';
const ACCENT = '#6366f1';
const ACCENT_LIGHT = '#818cf8';
const DIM = '#8c8ca0';
const BAR_BG = '#28283a';
const SUBTLE = '#1e1e2e';

function drawDropIcon(ctx, cx, cyTop, scale, opacity) {
  ctx.globalAlpha = opacity || 1;
  ctx.fillStyle = ACCENT;
  ctx.beginPath();
  ctx.moveTo(cx, cyTop);
  ctx.lineTo(cx + 18*scale, cyTop + 28*scale);
  ctx.lineTo(cx + 10*scale, cyTop + 48*scale);
  ctx.lineTo(cx - 10*scale, cyTop + 48*scale);
  ctx.lineTo(cx - 18*scale, cyTop + 28*scale);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = ACCENT_LIGHT;
  ctx.beginPath();
  ctx.moveTo(cx, cyTop);
  ctx.lineTo(cx + 18*scale, cyTop + 28*scale);
  ctx.lineTo(cx, cyTop + 36*scale);
  ctx.closePath();
  ctx.fill();
  ctx.globalAlpha = 1;
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

// Background
ctx.fillStyle = BG;
ctx.fillRect(0, 0, W, H);

// Subtle grid pattern
ctx.strokeStyle = '#1a1a2a';
ctx.lineWidth = 1;
for (let x = 0; x < W; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
for (let y = 0; y < H; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

// Background watermark drop
drawDropIcon(ctx, W/2, H/2 - 200, 8, 0.03);

// ===== HEADER =====
ctx.fillStyle = '#12122a';
roundRect(ctx, 0, 0, W, 80, 0);
ctx.fill();
ctx.strokeStyle = '#2a2a44';
ctx.lineWidth = 1;
ctx.beginPath(); ctx.moveTo(0, 80); ctx.lineTo(W, 80); ctx.stroke();

drawDropIcon(ctx, 52, 16, 0.9);
ctx.font = 'bold 28px system-ui, -apple-system, sans-serif';
ctx.fillStyle = TEXT;
ctx.fillText('Droplet', 78, 50);
ctx.font = '16px system-ui';
ctx.fillStyle = DIM;
ctx.fillText('OLED Display Service', 200, 50);

// Status pill
roundRect(ctx, W - 220, 24, 100, 32, 16);
ctx.fillStyle = '#0d3320';
ctx.fill();
ctx.fillStyle = '#22c55e';
ctx.font = 'bold 13px system-ui';
ctx.fillText('ONLINE', W - 200, 45);
ctx.beginPath();
ctx.arc(W - 210, 40, 4, 0, Math.PI * 2);
ctx.fillStyle = '#22c55e';
ctx.fill();

// Port badge
ctx.font = '13px monospace';
ctx.fillStyle = '#555';
ctx.fillText(':8082', W - 100, 45);

// ===== THREE OLED SCREENS =====
const screens = [
  { label: 'STATS SCREEN', desc: 'Auto-refreshes every 2s', badge: 'DEFAULT' },
  { label: 'LOGO SCREEN', desc: 'Full-screen brand identity', badge: 'CYCLE' },
  { label: 'MESSAGE SCREEN', desc: 'LLM tool output display', badge: 'ON DEMAND' },
];

const screenSize = 256;
const bezelPad = 20;
const totalW = screenSize + bezelPad * 2;
const gap = 60;
const totalRow = screens.length * totalW + (screens.length - 1) * gap;
const startX = (W - totalRow) / 2;
const screenY = 160;

screens.forEach((s, i) => {
  const x = startX + i * (totalW + gap);
  const by = screenY;

  // Label
  ctx.font = 'bold 14px system-ui';
  ctx.fillStyle = ACCENT_LIGHT;
  const lw = ctx.measureText(s.label).width;
  ctx.fillText(s.label, x + totalW/2 - lw/2, by - 30);

  // Badge
  ctx.font = '10px system-ui';
  const bw = ctx.measureText(s.badge).width;
  roundRect(ctx, x + totalW/2 - bw/2 - 8, by - 22, bw + 16, 16, 8);
  ctx.fillStyle = '#1e1e3a';
  ctx.fill();
  ctx.fillStyle = ACCENT;
  ctx.fillText(s.badge, x + totalW/2 - bw/2, by - 12);

  // Bezel
  roundRect(ctx, x, by, totalW, totalW, 12);
  ctx.fillStyle = '#111';
  ctx.fill();
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 2;
  ctx.stroke();

  // Inner glow
  const grd = ctx.createRadialGradient(x + totalW/2, by + totalW/2, 0, x + totalW/2, by + totalW/2, totalW/2);
  grd.addColorStop(0, 'rgba(99,102,241,0.03)');
  grd.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = grd;
  ctx.fill();

  // Screen
  const sx = x + bezelPad;
  const sy = by + bezelPad;
  ctx.fillStyle = PANEL_BG;
  ctx.fillRect(sx, sy, screenSize, screenSize);

  // Description
  ctx.font = '12px system-ui';
  ctx.fillStyle = '#555';
  const dw = ctx.measureText(s.desc).width;
  ctx.fillText(s.desc, x + totalW/2 - dw/2, by + totalW + 24);
});

// ---- Draw Stats Screen Content (scaled 2x) ----
function drawStatsContent() {
  const ox = startX + bezelPad;
  const oy = screenY + bezelPad;
  ctx.save();
  ctx.translate(ox, oy);
  ctx.scale(2, 2);

  drawDropIcon(ctx, 113, 2, 0.38);
  ctx.font = 'bold 9px monospace';
  ctx.fillStyle = ACCENT_LIGHT;
  ctx.fillText('Droplet Edge', 4, 12);

  ctx.strokeStyle = '#3c3c50';
  ctx.lineWidth = 0.5;
  ctx.beginPath(); ctx.moveTo(4, 34); ctx.lineTo(124, 34); ctx.stroke();

  let y = 46;
  // CPU
  ctx.font = '9px monospace'; ctx.fillStyle = DIM; ctx.fillText('CPU', 4, y);
  ctx.font = 'bold 10px monospace'; ctx.fillStyle = TEXT; ctx.fillText('45%', 36, y);
  ctx.fillStyle = BAR_BG; ctx.fillRect(68, y-7, 56, 7);
  ctx.fillStyle = ACCENT; ctx.fillRect(68, y-7, 25, 7);
  y += 16;

  // RAM
  ctx.font = '9px monospace'; ctx.fillStyle = DIM; ctx.fillText('RAM', 4, y);
  ctx.font = 'bold 10px monospace'; ctx.fillStyle = TEXT; ctx.fillText('2.1/8G', 36, y);
  ctx.fillStyle = BAR_BG; ctx.fillRect(90, y-7, 34, 7);
  ctx.fillStyle = ACCENT; ctx.fillRect(90, y-7, 9, 7);
  y += 16;

  // Temp
  ctx.font = '9px monospace'; ctx.fillStyle = DIM; ctx.fillText('Temp', 4, y);
  ctx.font = 'bold 10px monospace'; ctx.fillStyle = TEXT; ctx.fillText('52\u00B0C', 36, y);
  y += 16;

  // IP
  ctx.font = '9px monospace'; ctx.fillStyle = DIM; ctx.fillText('IP', 4, y);
  ctx.fillStyle = TEXT; ctx.fillText('192.168.1.100', 36, y);
  y += 16;

  // Uptime
  ctx.fillStyle = DIM; ctx.fillText('Up', 4, y);
  ctx.fillStyle = TEXT; ctx.fillText('3d 14h', 36, y);

  ctx.restore();
}

// ---- Draw Logo Screen Content (scaled 2x) ----
function drawLogoContent() {
  const ox = startX + totalW + gap + bezelPad;
  const oy = screenY + bezelPad;
  ctx.save();
  ctx.translate(ox, oy);
  ctx.scale(2, 2);

  drawDropIcon(ctx, 64, 20, 1.8);
  ctx.font = 'bold 14px system-ui, sans-serif';
  ctx.fillStyle = TEXT;
  const text = 'Droplet';
  const tw = ctx.measureText(text).width;
  ctx.fillText(text, (128 - tw) / 2, 122);

  ctx.restore();
}

// ---- Draw Message Screen Content (scaled 2x) ----
function drawMessageContent() {
  const ox = startX + 2*(totalW + gap) + bezelPad;
  const oy = screenY + bezelPad;
  ctx.save();
  ctx.translate(ox, oy);
  ctx.scale(2, 2);

  ctx.fillStyle = ACCENT;
  ctx.fillRect(0, 0, 128, 18);
  ctx.font = 'bold 11px monospace';
  ctx.fillStyle = TEXT;
  ctx.fillText('Alert', 4, 13);

  ctx.font = '10px monospace';
  ctx.fillStyle = TEXT;
  const lines = ['Camera offline:', 'front-door-cam', '', 'Last seen: 2m ago', 'Checking net...', '', 'Action: restart'];
  let y = 32;
  for (const line of lines) { ctx.fillText(line, 4, y); y += 15; }

  ctx.restore();
}

drawStatsContent();
drawLogoContent();
drawMessageContent();

// ===== CYCLE DIAGRAM =====
const cyY = screenY + totalW + 70;

// Cycle flow background
roundRect(ctx, startX - 20, cyY, totalRow + 40, 80, 12);
ctx.fillStyle = '#12122a';
ctx.fill();
ctx.strokeStyle = '#2a2a44';
ctx.lineWidth = 1;
ctx.stroke();

const phases = [
  { text: 'Logo', time: '5s', active: true },
  { text: 'Stats', time: '10s', active: true },
  { text: 'Repeat', time: '', active: false },
];

ctx.font = 'bold 13px system-ui';
const phaseW = 120;
const phaseGap = 40;
const pTotalW = phases.length * phaseW + (phases.length - 1) * phaseGap;
const pStartX = W/2 - pTotalW/2;

phases.forEach((p, i) => {
  const px = pStartX + i * (phaseW + phaseGap);
  const py = cyY + 20;

  roundRect(ctx, px, py, phaseW, 40, 8);
  ctx.fillStyle = p.active ? '#1a1a3a' : '#151520';
  ctx.fill();
  ctx.strokeStyle = p.active ? ACCENT : '#333';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  ctx.font = 'bold 14px system-ui';
  ctx.fillStyle = p.active ? ACCENT_LIGHT : '#555';
  const label = p.time ? `${p.text} ${p.time}` : p.text;
  const lw2 = ctx.measureText(label).width;
  ctx.fillText(label, px + phaseW/2 - lw2/2, py + 26);

  // Arrow
  if (i < phases.length - 1) {
    const ax = px + phaseW + 8;
    const ay = py + 20;
    ctx.fillStyle = ACCENT;
    ctx.font = '20px system-ui';
    ctx.fillText('\u2192', ax, ay + 6);
  }
});

// LLM interrupt note
ctx.font = '13px system-ui';
ctx.fillStyle = '#555';
const note = 'LLM /display/message pauses cycle for 30s then resumes';
const nw = ctx.measureText(note).width;
ctx.fillText(note, W/2 - nw/2, cyY + 74);

// ===== API TABLE =====
const tableY = cyY + 110;
const tableX = startX;
const colW = [100, 200, 440];
const tableW = colW[0] + colW[1] + colW[2];

// Table header
ctx.font = 'bold 14px system-ui';
ctx.fillStyle = ACCENT_LIGHT;
ctx.fillText('API ENDPOINTS', tableX, tableY);

ctx.font = '12px monospace';
ctx.fillStyle = '#444';
ctx.fillText('Port 8082 \u00B7 Service Auth via Bearer token', tableX + 160, tableY);

const rows = [
  ['GET', '/health', 'Health check'],
  ['GET', '/display/status', 'Current mode, brightness, cycling state'],
  ['POST', '/display/stats', 'Switch to device stats screen'],
  ['POST', '/display/logo', 'Switch to full-screen logo'],
  ['POST', '/display/message', 'Show custom LLM message {title, lines[]}'],
  ['POST', '/display/custom', 'Upload image (multipart, max 2MB)'],
  ['POST', '/display/brightness', 'Set brightness {value: 0-255}'],
  ['POST', '/display/cycle/resume', 'Resume auto-cycling'],
  ['POST', '/display/cycle/stop', 'Stop cycling, pin current screen'],
];

const rowH = 26;
const thY = tableY + 18;

// Header row
roundRect(ctx, tableX, thY, tableW, rowH, 4);
ctx.fillStyle = '#1a1a2e';
ctx.fill();
ctx.font = 'bold 11px system-ui';
ctx.fillStyle = DIM;
ctx.fillText('METHOD', tableX + 12, thY + 18);
ctx.fillText('PATH', tableX + colW[0] + 12, thY + 18);
ctx.fillText('DESCRIPTION', tableX + colW[0] + colW[1] + 12, thY + 18);

rows.forEach((row, i) => {
  const ry = thY + rowH + i * rowH;
  if (i % 2 === 0) {
    roundRect(ctx, tableX, ry, tableW, rowH, 0);
    ctx.fillStyle = 'rgba(255,255,255,0.015)';
    ctx.fill();
  }

  // Method badge
  const methodColors = { GET: '#22c55e', POST: '#3b82f6' };
  const mc = methodColors[row[0]] || DIM;
  ctx.font = 'bold 10px monospace';
  const mw = ctx.measureText(row[0]).width;
  roundRect(ctx, tableX + 8, ry + 6, mw + 12, 16, 4);
  ctx.fillStyle = mc + '22';
  ctx.fill();
  ctx.fillStyle = mc;
  ctx.fillText(row[0], tableX + 14, ry + 18);

  // Path
  ctx.font = '12px monospace';
  ctx.fillStyle = TEXT;
  ctx.fillText(row[1], tableX + colW[0] + 12, ry + 18);

  // Description
  ctx.font = '12px system-ui';
  ctx.fillStyle = '#888';
  ctx.fillText(row[2], tableX + colW[0] + colW[1] + 12, ry + 18);
});

// ===== WIRING TABLE (right side) =====
const wireX = tableX + tableW + 60;
const wireY = tableY;

ctx.font = 'bold 14px system-ui';
ctx.fillStyle = ACCENT_LIGHT;
ctx.fillText('WIRING \u2014 Jetson SPI0', wireX, wireY);

const wires = [
  ['VCC', 'Pin 1', '3.3V'],
  ['GND', 'Pin 6', 'Ground'],
  ['DIN', 'Pin 19', 'SPI0 MOSI'],
  ['CLK', 'Pin 23', 'SPI0 SCLK'],
  ['CS', 'Pin 24', 'SPI0 CS0'],
  ['DC', 'Pin 18', 'GPIO24'],
  ['RST', 'Pin 22', 'GPIO25'],
];

const wRowH = 24;
const wThY = wireY + 18;
const wColW = [60, 70, 120];
const wTableW = wColW[0] + wColW[1] + wColW[2];

roundRect(ctx, wireX, wThY, wTableW, wRowH, 4);
ctx.fillStyle = '#1a1a2e';
ctx.fill();
ctx.font = 'bold 11px system-ui';
ctx.fillStyle = DIM;
ctx.fillText('PIN', wireX + 8, wThY + 17);
ctx.fillText('JETSON', wireX + wColW[0] + 8, wThY + 17);
ctx.fillText('FUNCTION', wireX + wColW[0] + wColW[1] + 8, wThY + 17);

wires.forEach((w, i) => {
  const ry = wThY + wRowH + i * wRowH;
  if (i % 2 === 0) {
    roundRect(ctx, wireX, ry, wTableW, wRowH, 0);
    ctx.fillStyle = 'rgba(255,255,255,0.015)';
    ctx.fill();
  }
  ctx.font = 'bold 11px monospace';
  ctx.fillStyle = ACCENT;
  ctx.fillText(w[0], wireX + 8, ry + 17);
  ctx.font = '11px monospace';
  ctx.fillStyle = TEXT;
  ctx.fillText(w[1], wireX + wColW[0] + 8, ry + 17);
  ctx.fillStyle = '#888';
  ctx.fillText(w[2], wireX + wColW[0] + wColW[1] + 8, ry + 17);
});

// ===== FOOTER =====
ctx.font = '12px system-ui';
ctx.fillStyle = '#333';
ctx.fillText('Waveshare 1.5" SSD1351  \u00B7  128x128 RGB  \u00B7  SPI Interface  \u00B7  luma.oled + Pillow  \u00B7  Docker profile: full', startX, H - 30);

ctx.fillStyle = '#333';
ctx.textAlign = 'right';
ctx.fillText('Droplet Edge AI Platform', W - startX, H - 30);
ctx.textAlign = 'left';

// ===== AUTO-DOWNLOAD =====
c.toBlob(function(blob) {
  const url = URL.createObjectURL(blob);
  const a = document.getElementById('dl');
  a.href = url;
  a.download = 'droplet-oled-dashboard-1920x1080.png';
  a.style.display = 'inline-block';
  a.style.padding = '12px 24px';
  a.style.background = '#6366f1';
  a.style.color = '#fff';
  a.style.borderRadius = '8px';
  a.style.textDecoration = 'none';
  a.style.fontWeight = 'bold';
  a.style.marginTop = '24px';
  a.click();
  document.getElementById('status').textContent = 'PNG generated! If download did not start, click the button below.';
}, 'image/png');
</script>
</body>
</html>
