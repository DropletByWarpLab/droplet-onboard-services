# services/pm/docker-compose.local.yml
#
# DEV-ONLY. The full production stack (with all profiles, healthchecks,
# nginx, secrets, etc.) lives in ../../docker/docker-compose.yml — wired
# in WARP-501. This file exists so a developer can bring just Plane up
# locally for iteration without booting every Droplet service.
#
# Usage from repo root:
#   docker compose -f services/pm/docker-compose.local.yml up
#
# Plane upstream pin SHA — must match production. See ADR-007 OQ3.

services:
  postgres-pm:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${DROPLET_PM_DB_NAME:-plane}
      POSTGRES_USER: ${DROPLET_PM_DB_USER:-plane}
      POSTGRES_PASSWORD: ${DROPLET_PM_DB_PASSWORD:?DROPLET_PM_DB_PASSWORD required}
    volumes:
      - pm-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DROPLET_PM_DB_USER:-plane}"]
      interval: 10s
      timeout: 3s
      retries: 5

  redis-pm:
    image: redis:7-alpine
    volumes:
      - pm-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  pm-api:
    # Pinned upstream SHA — verify before bumping (ADR-007 OQ3).
    image: makeplane/plane-backend:v0.24.1
    depends_on:
      postgres-pm:
        condition: service_healthy
      redis-pm:
        condition: service_started
    environment:
      DATABASE_URL: postgres://${DROPLET_PM_DB_USER:-plane}:${DROPLET_PM_DB_PASSWORD}@postgres-pm:5432/${DROPLET_PM_DB_NAME:-plane}
      REDIS_URL: redis://redis-pm:6379
      SECRET_KEY: ${DROPLET_PM_SECRET_KEY:?DROPLET_PM_SECRET_KEY required}
      WEB_URL: ${DROPLET_PM_WEB_URL:-http://localhost:3000}

  pm-worker:
    image: makeplane/plane-worker:v0.24.1
    depends_on:
      pm-api:
        condition: service_started
    environment:
      DATABASE_URL: postgres://${DROPLET_PM_DB_USER:-plane}:${DROPLET_PM_DB_PASSWORD}@postgres-pm:5432/${DROPLET_PM_DB_NAME:-plane}
      REDIS_URL: redis://redis-pm:6379
      SECRET_KEY: ${DROPLET_PM_SECRET_KEY}

  pm-web:
    image: makeplane/plane-frontend:v0.24.1
    depends_on:
      pm-api:
        condition: service_started
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${DROPLET_PM_API_URL:-http://pm-api:8000}

  pm-health:
    build:
      context: ../..
      dockerfile: services/pm/Dockerfile
      args:
        PLANE_PIN_SHA: v0.24.1
    depends_on:
      pm-api:
        condition: service_started
    ports:
      - "8090:8090"
    environment:
      DROPLET_PM_API_URL: http://pm-api:8000

volumes:
  pm-pg-data:
  pm-redis-data:
