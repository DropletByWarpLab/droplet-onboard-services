  # ── WARP-437 Phase 3 — adaptive routing eval set ──
  #
  # The next 35 rows exercise the query-classification + adaptive-pipeline
  # gates added in WARP-437:
  #
  #   (a) Short factual queries (q-short-001..q-short-015) — 1-3 word
  #       queries that embed into vague vectors. These are HyDE candidates:
  #       the gate should pass them through a doc-shaped expansion before
  #       embedding to widen recall against the existing fixtures.
  #
  #   (b) Analytical queries (q-analytical-001..q-analytical-010) — span
  #       multiple fixtures. Multi-query rewriting is the candidate gate
  #       here: split the question into sub-queries, retrieve per-sub, and
  #       fuse. Each row's `relevant` lists every fixture the synthesis
  #       would have to touch.
  #
  #   (c) Conversational queries (q-conv-001..q-conv-010) — chit-chat /
  #       non-information-seeking utterances. The adaptive gate should
  #       short-circuit retrieval entirely. Modelled with `relevant: []`,
  #       which the NDCG@10 harness scores as 0 (see `ndcgAtK`'s
  #       `idealScore === 0` guard in run.integration.test.ts) — i.e.
  #       any retrieval call against these is wasted budget that we
  #       expect the adaptive layer to skip.

