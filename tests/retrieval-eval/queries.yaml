  # ── WARP-435 / ADR-003 Phase 1 disambiguation + sentence-boundary set ──
  #
  # These 10 queries exercise the sentence-aware chunker + contextual-
  # header (sectionPath) plumbing that landed in WARP-435. Two themes:
  #
  #   (a) Sentence-spanning queries (q21-q26) — phrasings whose terms
  #       span a sentence boundary the legacy word-split chunker would
  #       have cut mid-sentence, breaking the recall path. The new
  #       chunker preserves sentence boundaries, so the whole phrase
  #       lives in one chunk and lexical/vector match both win.
  #
  #   (b) Section-path disambiguation (q27-q30) — queries phrased to
  #       hinge on document/section context (e.g. "in the proposal
  #       attachment" → only the email-with-PDF fixture should match,
  #       not the bare PDF fixture). The contextual-header prefix
  #       ("Document: foo.eml / Section: warp224-email") gives the
  #       embedder + lexical engine the section signal they need to
  #       prefer the correctly-scoped chunk over a same-body twin.
  #
  # Eval gate (per ADR-003 §"Phase 1 — Ingest enrichment"):
  #   ndcg@10(hybrid + headers) ≥ ndcg@10(hybrid) × 1.05 on the
  #   extended corpus (q01..q30).

  - id: q21
    query: "budget for the fourth quarter approved by the executive team"
    class: factual
    relevant:
      - source: nextcloud
        path_contains: "sample.pdf"
        chunk_idx_any: true
    notes: "sentence-spanning phrase; legacy word-split could cut mid-clause"

