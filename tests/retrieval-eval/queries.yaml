# WARP-286 retrieval eval — manually curated.
# Each query has 1-3 relevant chunks. "Relevant" means a reasonable
# user reading the chunk text would consider it answering the query.
# Match rules:
#   - source + path + chunk_idx exact = the strictest
#   - path_contains + chunk_idx_any = looser; any chunk from that doc counts
#   - The metric is NDCG@10, so partial relevance via DCG works fine.
#
# Growth path (post-WARP-286): once Phase B (activity graph + click data)
# lands, extend with (query, clicked_chunk) pairs mined from
# ActivityEvent. Until then, manual curation.
#
# WARP-437 — Phase 3 adaptive routing. Each query carries a `class` label
# the adaptive layer uses to decide whether to apply HyDE / multi-query /
# skip retrieval entirely:
#   - factual:       single-fact lookup; baseline hybrid is fine
#   - analytical:    needs synthesis across docs; multi-query candidate
#   - conversational: chit-chat; gate should skip retrieval (no relevance)
#   - navigational:  filename-token jump (deferred; not used in this corpus)

queries:
