    expected_answer: "TODO(team): confirm whether 'Tesseract OCR' appears in warp206-image chunks or whether this query is testing path/metadata lexical match."
    reference_contexts:
      - "warp206-image OCR text or filename metadata chunk"

  - id: q13
    # [TODO] both subs and audio listed as relevant for 'q4 revenue' — verify
    # whether 'revenue' (not just 'budget') is a sentinel in those transcripts.
    expected_answer: "TODO(team): confirm whether the fixtures explicitly say 'revenue' for Q4 vs. only 'budget'; if only 'budget', rewrite this golden as a synonym-recall test."
    reference_contexts:
      - "warp224-video-subs subtitle chunk discussing Q4"
